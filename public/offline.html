<!doctype html>
<html lang="fr" dir="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050b18" />
    <title>BotolaGO — Hors ligne · غير متصل</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: #050b18;
        color: #f2f5fb;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Noto Sans Arabic",
          sans-serif;
        line-height: 1.5;
      }
      main {
        width: 100%;
        max-width: 28rem;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        margin: 0 auto 24px;
        display: block;
      }
      h1 {
        font-size: 1.375rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 8px;
        color: #b8c2d6;
      }
      [lang="ar"] {
        direction: rtl;
        margin-top: 20px;
      }
      button {
        margin-top: 24px;
        min-height: 44px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: #0151fc;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="96" height="96" alt="" />
      <h1>Vous êtes hors ligne</h1>
      <p>
        Vérifiez votre connexion, puis réessayez. Les pages déjà consultées restent disponibles.
      </p>
      <div lang="ar" dir="rtl">
        <h1>أنت غير متصل بالإنترنت</h1>
        <p>تحقق من اتصالك ثم أعد المحاولة. تبقى الصفحات التي زرتها سابقاً متاحة.</p>
      </div>
      <button type="button" onclick="location.reload()">Réessayer · إعادة المحاولة</button>
    </main>
  </body>
</html>
