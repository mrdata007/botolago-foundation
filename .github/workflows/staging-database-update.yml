name: Staging database update

# Brings BotolaGO Staging V2's database level with the repository's migrations
# and loads the Fantasy capacity seed, so the Fantasy load test measures the
# code production runs. Staging only: the script refuses any other project.
# Steps and order: docs/operations/LOAD_TEST.md.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan (read only), rehearse (rolled back), apply, seed, or check (read only)"
        required: true
        type: choice
        default: plan
        options:
          - plan
          - rehearse
          - apply
          - seed
          - check
      confirmation:
        description: "For rehearse, apply and seed: type UPDATE_STAGING_DATABASE"
        required: false
        type: string

# Shared with the other Staging V2 workflows in the staging-load-test
# environment: one writer at a time (AGENTS.md). Staging writers outside the
# group are checked by scripts/backend/staging-writer-guard.py.
concurrency:
  group: phase6-staging-load-test
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  update:
    name: Staging database ${{ inputs.action }}
    if: github.repository == 'mrdata007/botolago-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging-load-test

    steps:
      - name: Validate manual dispatch
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            plan|check) ;;
            rehearse|apply|seed) test "$CONFIRMATION" = "UPDATE_STAGING_DATABASE" ;;
            *) exit 2 ;;
          esac

      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: No other staging writer is running
        if: inputs.action == 'rehearse' || inputs.action == 'apply' || inputs.action == 'seed'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/backend/staging-writer-guard.py

      - name: Run ${{ inputs.action }}
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/staging-database-update.json"
          python scripts/backend/staging-database-update.py "$ACTION" | tee "$report"
          status=${PIPESTATUS[0]}
          {
            echo "## Staging database: $ACTION"
            echo
            echo '```json'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
