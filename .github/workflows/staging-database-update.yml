name: Staging database update

# Brings BotolaGO Staging V2's database level with the repository's migrations
# and loads the Fantasy capacity seed, so the Fantasy load test measures the
# code production runs. Staging only: the script refuses any other project.
# Steps and order: docs/operations/LOAD_TEST.md.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Plan/check, rehearse/apply/seed, deploy runtime, score5000, or workerprobe (staging only)"
        required: true
        type: choice
        default: plan
        options:
          - plan
          - rehearse
          - apply
          - seed
          - check
          - authpreflight
          - authconfigure
          - authcleanup
          - runtime
          - score5000
          - score5000edge
          - scorephoneqa
          - edge5000
          - workerprobe
          - workeralarms
      confirmation:
        description: "For every write action: type UPDATE_STAGING_DATABASE"
        required: false
        type: string
      staging_app_origin:
        description: "For Auth phone setup/cleanup only: https://PRIVATE_LAN_IP:8443"
        required: false
        type: string

# Shared with the other Staging V2 workflows in the staging-load-test
# environment: one writer at a time (AGENTS.md). Staging writers outside the
# group are checked by scripts/backend/staging-writer-guard.py.
concurrency:
  # Keep the GET-only Auth preflight in this group too: the cross-workflow
  # guard conservatively classifies every run of this workflow as a writer.
  # Readers queue rather than spuriously causing a writer's guard to fail.
  group: phase6-staging-load-test
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  update:
    name: Staging database ${{ inputs.action }}
    if: github.repository == 'mrdata007/botolago-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: staging-load-test

    steps:
      - name: Validate manual dispatch
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            plan|check|authpreflight) ;;
            rehearse|apply|seed|runtime|score5000|score5000edge|scorephoneqa|edge5000|workerprobe|workeralarms|authconfigure|authcleanup) test "$CONFIRMATION" = "UPDATE_STAGING_DATABASE" ;;
            *) exit 2 ;;
          esac

      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: No other staging writer is running
        if: inputs.action != 'plan' && inputs.action != 'check' && inputs.action != 'authpreflight'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/backend/staging-writer-guard.py

      - name: Set up Bun for the staging runtime
        if: inputs.action == 'runtime' || inputs.action == 'score5000' || inputs.action == 'score5000edge' || inputs.action == 'scorephoneqa' || inputs.action == 'edge5000'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install pinned runtime deployment tooling
        if: inputs.action == 'runtime' || inputs.action == 'score5000' || inputs.action == 'score5000edge' || inputs.action == 'scorephoneqa' || inputs.action == 'edge5000'
        run: |
          node scripts/backend/check-config-integrity.mjs
          bun install --frozen-lockfile

      - name: Deploy staging runtime
        if: inputs.action == 'runtime'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
        run: python scripts/backend/staging-release-runtime.py

      - name: Run ${{ inputs.action }}
        if: inputs.action == 'plan' || inputs.action == 'check' || inputs.action == 'rehearse' || inputs.action == 'apply' || inputs.action == 'seed'
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/staging-database-update.json"
          python scripts/backend/staging-database-update.py "$ACTION" | tee "$report"
          status=${PIPESTATUS[0]}
          {
            echo "## Staging database: $ACTION"
            echo
            echo '```json'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Score an isolated staging fixture
        if: inputs.action == 'score5000' || inputs.action == 'score5000edge' || inputs.action == 'scorephoneqa'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          STAGING_DRILL_FIXTURE: ${{ inputs.action == 'scorephoneqa' && 'phone-qa' || inputs.action == 'score5000edge' && 'edge-runtime' || 'operator' }}
        run: python scripts/backend/staging-5000-rating-drill.py

      - name: Probe the real staging Edge worker
        if: inputs.action == 'workerprobe'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
        run: python scripts/backend/staging-worker-probe.py

      - name: Measure two real Edge passes and the isolated operator fallback
        if: inputs.action == 'edge5000'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
        run: python scripts/backend/staging-edge-runtime-drill.py

      - name: Observe real 30 and 90 minute worker alarms and recovery
        if: inputs.action == 'workeralarms'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
        run: python scripts/backend/staging-worker-alarm-drill.py

      - name: Inspect or configure staging phone Auth
        if: inputs.action == 'authpreflight' || inputs.action == 'authconfigure' || inputs.action == 'authcleanup'
        env:
          ACTION: ${{ inputs.action }}
          STAGING_APP_ORIGIN: ${{ inputs.staging_app_origin }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
        run: python scripts/backend/staging-auth-preflight.py
