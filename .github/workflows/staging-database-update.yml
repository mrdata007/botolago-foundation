name: Staging database update

# Brings BotolaGO Staging V2's database level with the repository's migrations
# and loads the Fantasy capacity seed, so the Fantasy load test measures the
# code production runs. Staging only: the script refuses any other project.
# Steps and order: docs/operations/LOAD_TEST.md.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan/check (read only), rehearse, apply, seed, or deploy staging runtime"
        required: true
        type: choice
        default: plan
        options:
          - plan
          - rehearse
          - apply
          - seed
          - check
          - runtime
          - score5000
          - workerprobe
      confirmation:
        description: "For rehearse, apply, seed and runtime: type UPDATE_STAGING_DATABASE"
        required: false
        type: string

# Shared with the other Staging V2 workflows in the staging-load-test
# environment: one writer at a time (AGENTS.md). Staging writers outside the
# group are checked by scripts/backend/staging-writer-guard.py.
concurrency:
  group: phase6-staging-load-test
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  update:
    name: Staging database ${{ inputs.action }}
    if: github.repository == 'mrdata007/botolago-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging-load-test

    steps:
      - name: Validate manual dispatch
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            plan|check) ;;
            rehearse|apply|seed|runtime|score5000|workerprobe) test "$CONFIRMATION" = "UPDATE_STAGING_DATABASE" ;;
            *) exit 2 ;;
          esac

      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: No other staging writer is running
        if: inputs.action != 'plan' && inputs.action != 'check'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/backend/staging-writer-guard.py

      - name: Set up Bun for the staging runtime
        if: inputs.action == 'runtime' || inputs.action == 'score5000'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install pinned runtime deployment tooling
        if: inputs.action == 'runtime' || inputs.action == 'score5000'
        run: |
          node scripts/backend/check-config-integrity.mjs
          bun install --frozen-lockfile

      - name: Deploy staging runtime
        if: inputs.action == 'runtime'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
        run: python scripts/backend/staging-release-runtime.py

      - name: Run ${{ inputs.action }}
        if: inputs.action != 'runtime' && inputs.action != 'score5000' && inputs.action != 'workerprobe'
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/staging-database-update.json"
          python scripts/backend/staging-database-update.py "$ACTION" | tee "$report"
          status=${PIPESTATUS[0]}
          {
            echo "## Staging database: $ACTION"
            echo
            echo '```json'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Score the isolated 5000-team staging fixture
        if: inputs.action == 'score5000'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
        run: python scripts/backend/staging-5000-rating-drill.py

      - name: Probe the real staging Edge worker
        if: inputs.action == 'workerprobe'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
        run: python scripts/backend/staging-worker-probe.py
