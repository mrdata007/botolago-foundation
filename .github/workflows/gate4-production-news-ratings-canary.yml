name: Gate 4 Production News and preseason ratings canary

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit approved for Gate 4
        required: true
        type: string
      confirmation:
        description: Type RUN_GATE4_NEWS_RATINGS_CANARY
        required: true
        type: string

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  canary:
    name: Deploy GNews excerpts and completed-season ratings
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mrdata007'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-admin-activation
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_PROJECT_REF: tkewgajrljbwgwedqsxn
      EXPECTED_PROJECT_NAME: BotolaGO Production V2
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SPORTSMONKS_API_TOKEN: ${{ secrets.SPORTSMONKS_API_TOKEN }}
      GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
      NEWS_INGESTION_TRIGGER_SECRET: ${{ secrets.NEWS_INGESTION_TRIGGER_SECRET }}
      SUPABASE_PRODUCTION_PROJECT_NAME: ${{ vars.SUPABASE_PRODUCTION_PROJECT_NAME }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}

    steps:
      - name: Enforce immutable target and protected credentials
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          for value in \
            "$SUPABASE_ACCESS_TOKEN" "$SUPABASE_SECRET_KEY" \
            "$SUPABASE_DB_PASSWORD" "$SPORTSMONKS_API_TOKEN" "$GNEWS_API_KEY" \
            "$NEWS_INGESTION_TRIGGER_SECRET"; do
            if [[ -n "$value" ]]; then printf '::add-mask::%s\n' "$value"; fi
          done
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_SECRET_KEY" ||
                -z "$SUPABASE_DB_PASSWORD" || -z "$SPORTSMONKS_API_TOKEN" ||
                -z "$GNEWS_API_KEY" ||
                -z "$NEWS_INGESTION_TRIGGER_SECRET" ]]; then
            echo "Protected credential injection failed before mutation."
            exit 2
          fi
          if [[ "${GITHUB_RUN_ATTEMPT:-}" != "1" ||
                "$CONFIRMATION" != "RUN_GATE4_NEWS_RATINGS_CANARY" ||
                "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Immutable dispatch confirmation failed."
            exit 2
          fi
          if [[ "$SUPABASE_PRODUCTION_PROJECT_REF" != "$EXPECTED_PROJECT_REF" ||
                "$SUPABASE_PRODUCTION_PROJECT_NAME" != "$EXPECTED_PROJECT_NAME" ||
                "${SUPABASE_PRODUCTION_URL%/}" != "https://${EXPECTED_PROJECT_REF}.supabase.co" ]]; then
            echo "Production project guard failed."
            exit 2
          fi
          runtime_dir="$RUNNER_TEMP/botolago-gate4"
          evidence_dir="$runtime_dir/evidence"
          install -d -m 0700 "$runtime_dir" "$evidence_dir"
          {
            echo "GATE4_RUNTIME_DIR=$runtime_dir"
            echo "GATE4_EVIDENCE_DIR=$evidence_dir"
            echo "GATE4_SECRET_FILE=$runtime_dir/function-secrets.env"
            echo "GATE4_RATINGS_RESPONSE=$evidence_dir/ratings-response.json"
            echo "GATE4_CREST_RESPONSE=$evidence_dir/crest-response.json"
            echo "GATE4_NEWS_RESPONSE=$evidence_dir/news-response.json"
          } >> "$GITHUB_ENV"
          GATE4_CONTEXT_PATH="$evidence_dir/gate4-run-context.json" python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["GATE4_CONTEXT_PATH"])
          output.write_text(json.dumps({
              "schemaVersion": 1,
              "mode": "production_news_ratings_canary",
              "expectedCommit": os.environ["EXPECTED_COMMIT"],
              "projectRef": os.environ["EXPECTED_PROJECT_REF"],
              "runId": os.environ["GITHUB_RUN_ID"],
          }, indent=2) + "\n", encoding="utf-8")
          output.chmod(0o600)
          PY
          echo "evidence_dir=$evidence_dir" >> "$GITHUB_OUTPUT"

      - name: Check out exact reviewed main commit
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install and verify reviewed code
        id: quality
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test \
            scripts/backend/write-gate4-function-secrets.test.ts \
            supabase/functions/_shared/gnews.test.ts \
            supabase/functions/_shared/sportsmonks-catalog.test.ts \
            supabase/functions/_shared/sportsmonks-player-ratings.test.ts
          bun run backend:migrations:check
          bun run backend:secrets:check
          test -s src/backend/generated/database.types.ts
          grep -q 'attach_football_team_crest' src/backend/generated/database.types.ts
          grep -q 'ingest_player_season_ratings' src/backend/generated/database.types.ts
          test -x ./node_modules/.bin/supabase

      - name: Apply reviewed migrations
        id: migrations
        shell: bash
        run: |
          set -euo pipefail
          sanitize_log() {
            GATE4_LOG_PATH="$1" python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["GATE4_LOG_PATH"])
          content = path.read_text(encoding="utf-8", errors="replace") if path.is_file() else "log unavailable"
          for name in (
              "SUPABASE_ACCESS_TOKEN", "SUPABASE_SECRET_KEY", "SUPABASE_DB_PASSWORD",
              "SPORTSMONKS_API_TOKEN", "GNEWS_API_KEY", "NEWS_INGESTION_TRIGGER_SECRET",
          ):
              value = os.environ.get(name, "")
              if value:
                  content = content.replace(value, "***")
          print("\n".join(content.splitlines()[-80:]))
          PY
          }
          if ! ./node_modules/.bin/supabase link \
            --project-ref "$EXPECTED_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD" \
            > "$GATE4_RUNTIME_DIR/project-link.log" 2>&1; then
            echo "Supabase project link failed."
            sanitize_log "$GATE4_RUNTIME_DIR/project-link.log"
            exit 1
          fi
          if ! ./node_modules/.bin/supabase db push --linked \
            --password "$SUPABASE_DB_PASSWORD" --dry-run \
            > "$GATE4_RUNTIME_DIR/db-push-dry-run.log" 2>&1; then
            echo "Supabase migration dry-run failed."
            sanitize_log "$GATE4_RUNTIME_DIR/db-push-dry-run.log"
            exit 1
          fi
          if ! ./node_modules/.bin/supabase db push --linked \
            --password "$SUPABASE_DB_PASSWORD" \
            > "$GATE4_RUNTIME_DIR/db-push.log" 2>&1; then
            echo "Supabase migration apply failed."
            sanitize_log "$GATE4_RUNTIME_DIR/db-push.log"
            exit 1
          fi

      - name: Deploy reviewed Edge Functions
        id: functions
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/supabase functions deploy football-ingest \
            --project-ref "$EXPECTED_PROJECT_REF" \
            > "$GATE4_RUNTIME_DIR/football-deploy.log" 2>&1
          ./node_modules/.bin/supabase functions deploy news-ingest \
            --project-ref "$EXPECTED_PROJECT_REF" \
            > "$GATE4_RUNTIME_DIR/news-deploy.log" 2>&1

      - name: Install pinned function configuration
        id: secrets
        shell: bash
        env:
          FOOTBALL_PROVIDER: sportsmonks
          FOOTBALL_PROVIDER_BASE_URL: https://api.sportmonks.com/v3/football
          FOOTBALL_SPORTSMONKS_LEAGUE_ID: "860"
          FOOTBALL_SPORTSMONKS_SEASON_ID: "26027"
          FOOTBALL_SPORTSMONKS_COUNTRY_CODE: MA
          FOOTBALL_SPORTSMONKS_COMPETITION_TYPE: league
          FOOTBALL_SPORTSMONKS_SEASON_START: "2025-09-12"
          FOOTBALL_SPORTSMONKS_SEASON_END: "2026-07-05"
          FOOTBALL_PROVIDER_TIMEOUT_MS: "15000"
          FOOTBALL_PROVIDER_MAX_RETRIES: "2"
          GNEWS_API_ORIGIN: https://gnews.io
          GNEWS_QUERY_FR: '"Botola Pro" OR "Botola Maroc" OR "football marocain"'
          GNEWS_QUERY_AR: '"البطولة الاحترافية" OR "الدوري المغربي"'
          GNEWS_PAGE_SIZE: "10"
          GNEWS_TIMEOUT_MS: "10000"
          GNEWS_MAX_RETRIES: "2"
        run: |
          set -euo pipefail
          ratings_trigger=$(openssl rand -hex 32)
          printf '::add-mask::%s\n' "$ratings_trigger"
          echo "GATE4_RATINGS_TRIGGER=$ratings_trigger" >> "$GITHUB_ENV"
          export FOOTBALL_INGESTION_TRIGGER_SECRET="$ratings_trigger"
          bun scripts/backend/write-gate4-function-secrets.ts
          ./node_modules/.bin/supabase secrets set \
            --project-ref "$EXPECTED_PROJECT_REF" \
            --env-file "$GATE4_SECRET_FILE" \
            > "$GATE4_RUNTIME_DIR/secrets-set.log" 2>&1
          echo "installed=true" >> "$GITHUB_OUTPUT"

      - name: Run bounded ratings and GNews canaries
        id: canary
        shell: bash
        run: |
          set -euo pipefail
          base="https://${EXPECTED_PROJECT_REF}.supabase.co/functions/v1"

          run_canary_request() {
            local status_name="$1"
            local exit_name="$2"
            local output="$3"
            shift 3
            local status
            local curl_exit

            set +e
            status=$(curl --silent --show-error \
              --output "$output" --write-out '%{http_code}' "$@")
            curl_exit=$?
            set -e

            if [[ -z "$status" ]]; then status="000"; fi
            if [[ ! -s "$output" ]]; then
              printf '{"responseUnavailable":true}\n' > "$output"
            fi
            chmod 0600 "$output"
            printf -v "$status_name" '%s' "$status"
            printf -v "$exit_name" '%s' "$curl_exit"
          }

          run_canary_request ratings_status ratings_curl_exit "$GATE4_RATINGS_RESPONSE" \
            --request POST "$base/football-ingest" \
            --header 'content-type: application/json' \
            --header 'x-botolago-ingestion-job: preseason_ratings' \
            --header "apikey: $SUPABASE_SECRET_KEY" \
            --header "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            --header "x-botolago-ingestion-key: $GATE4_RATINGS_TRIGGER" \
            --data '{"job":"preseason_ratings"}'
          run_canary_request crest_status crest_curl_exit "$GATE4_CREST_RESPONSE" \
            --request POST "$base/football-ingest" \
            --header 'content-type: application/json' \
            --header 'x-botolago-ingestion-job: catalog' \
            --header "apikey: $SUPABASE_SECRET_KEY" \
            --header "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            --header "x-botolago-ingestion-key: $GATE4_RATINGS_TRIGGER" \
            --data '{"job":"teams","pageSize":50,"maxPages":1}'
          run_canary_request news_status news_curl_exit "$GATE4_NEWS_RESPONSE" \
            --request POST "$base/news-ingest" \
            --header 'content-type: application/json' \
            --header "apikey: $SUPABASE_SECRET_KEY" \
            --header "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            --header "x-botolago-ingestion-key: $NEWS_INGESTION_TRIGGER_SECRET" \
            --data '{"job":"gnews"}'

          export \
            GATE4_RATINGS_STATUS="$ratings_status" \
            GATE4_CREST_STATUS="$crest_status" \
            GATE4_NEWS_STATUS="$news_status" \
            GATE4_RATINGS_CURL_EXIT="$ratings_curl_exit" \
            GATE4_CREST_CURL_EXIT="$crest_curl_exit" \
            GATE4_NEWS_CURL_EXIT="$news_curl_exit"
          bun scripts/backend/gate4-canary-evidence.ts

      - name: Record Gate 4 step outcomes
        if: always() && steps.runtime.outcome == 'success' && steps.checkout.outcome == 'success'
        shell: bash
        env:
          GATE4_QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          GATE4_MIGRATIONS_OUTCOME: ${{ steps.migrations.outcome }}
          GATE4_FUNCTIONS_OUTCOME: ${{ steps.functions.outcome }}
          GATE4_SECRETS_OUTCOME: ${{ steps.secrets.outcome }}
          GATE4_CANARY_OUTCOME: ${{ steps.canary.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["GATE4_EVIDENCE_DIR"]) / "gate4-workflow-outcomes.json"
          output.write_text(json.dumps({
              "schemaVersion": 1,
              "quality": os.environ["GATE4_QUALITY_OUTCOME"],
              "migrations": os.environ["GATE4_MIGRATIONS_OUTCOME"],
              "functions": os.environ["GATE4_FUNCTIONS_OUTCOME"],
              "secrets": os.environ["GATE4_SECRETS_OUTCOME"],
              "canary": os.environ["GATE4_CANARY_OUTCOME"],
          }, indent=2) + "\n", encoding="utf-8")
          output.chmod(0o600)
          PY

      - name: Verify sanitized evidence
        id: evidence_scan
        if: always() && steps.runtime.outcome == 'success' && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/backend/phase7f-scan-sanitized-evidence.py "$GATE4_EVIDENCE_DIR"
          for value in \
            "$SUPABASE_ACCESS_TOKEN" "$SUPABASE_SECRET_KEY" "$SUPABASE_DB_PASSWORD" \
            "$SPORTSMONKS_API_TOKEN" "$GNEWS_API_KEY" \
            "$NEWS_INGESTION_TRIGGER_SECRET" "${GATE4_RATINGS_TRIGGER:-}"; do
            if [[ -n "$value" ]] && grep -R -F -q -- "$value" "$GATE4_EVIDENCE_DIR"; then
              echo "CREDENTIAL_FOUND_IN_GATE4_EVIDENCE"
              exit 1
            fi
          done

      - name: Upload sanitized evidence
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate4-news-ratings-canary-${{ github.run_id }}
          path: ${{ steps.runtime.outputs.evidence_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-time ratings trigger and runtime files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cleanup_failed=0
          if [[ "${{ steps.secrets.outputs.installed }}" == "true" && -x ./node_modules/.bin/supabase ]]; then
            if ! ./node_modules/.bin/supabase secrets unset \
              FOOTBALL_INGESTION_TRIGGER_SECRET \
              --project-ref "$EXPECTED_PROJECT_REF" > /dev/null 2>&1; then
              cleanup_failed=1
            fi
          fi
          if [[ -n "${GATE4_RUNTIME_DIR:-}" && -d "$GATE4_RUNTIME_DIR" ]]; then
            find "$GATE4_RUNTIME_DIR" -type f -exec chmod 0600 {} \;
            find "$GATE4_RUNTIME_DIR" -type f -delete
            rmdir "$GATE4_EVIDENCE_DIR" 2>/dev/null || true
            rmdir "$GATE4_RUNTIME_DIR" 2>/dev/null || true
          fi
          if [[ "$cleanup_failed" != "0" ]]; then
            echo "ONE_TIME_RATINGS_TRIGGER_DISABLE_FAILED"
            exit 1
          fi
