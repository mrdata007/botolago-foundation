name: Phase 6 session provisioning diagnostic reproduction

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact backend/fantasy-domain head SHA to diagnose
        required: true
        type: string
      confirmation:
        description: Type RUN_PHASE6_SESSION_DIAGNOSTIC
        required: true
        type: string

concurrency:
  group: phase6-session-diagnostic-reproduction
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  session-diagnostic:
    name: 125-user session provisioning diagnostic reproduction
    if: github.repository == 'mrdata007/botolago-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: staging-load-test
    env:
      AWS_REGION: eu-west-3
      AWS_DEFAULT_REGION: eu-west-3
      BOTOLAGO_LOAD_ENVIRONMENT: staging-v2
      BOTOLAGO_MAX_ESTIMATED_COST_USD: "50"
      BOTOLAGO_REQUIRE_AWS_SESSION_TOKEN: "1"
      BOTOLAGO_AWS_LOAD_TEST_ROLE_ARN: ${{ vars.AWS_LOAD_TEST_ROLE_ARN }}

    steps:
      - name: Initialize Phase 6 diagnostic runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/botolago-phase6-session-diagnostic"
          evidence_dir="$runtime_dir/evidence"
          install -d -m 0700 "$runtime_dir" "$evidence_dir"
          {
            echo "BOTOLAGO_PHASE6_RUNTIME_DIR=$runtime_dir"
            echo "BOTOLAGO_PHASE6_EVIDENCE_DIR=$evidence_dir"
          } >> "$GITHUB_ENV"

      - name: Validate manual dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "RUN_PHASE6_SESSION_DIAGNOSTIC"
          [[ "${{ inputs.expected_commit }}" =~ ^[0-9a-f]{40}$ ]]

      - name: Verify PR #6 and backend/fantasy-domain head
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        with:
          script: |
            const expected = process.env.EXPECTED_COMMIT;
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 6,
            });
            if (pull.data.state !== "open") {
              core.setFailed("PR #6 is not open");
              return;
            }
            if (!pull.data.draft) {
              core.setFailed("PR #6 is not Draft");
              return;
            }
            if (pull.data.head.ref !== "backend/fantasy-domain") {
              core.setFailed("PR #6 is not sourced from backend/fantasy-domain");
              return;
            }
            if (pull.data.head.sha !== expected) {
              core.setFailed("PR #6 head SHA does not equal expected_commit");
              return;
            }
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "backend/fantasy-domain",
            });
            if (branch.data.commit.sha !== expected) {
              core.setFailed("backend/fantasy-domain HEAD does not equal expected_commit");
              return;
            }
            core.info("PR #6 and backend/fantasy-domain match expected_commit");

      - name: Check out diagnostic commit under test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_commit }}"
          git merge-base --is-ancestor f6340e0eed667f730ceddc1f4dd5d89dc9085003 HEAD

      - name: Configure delegated AWS credentials
        id: aws_oidc
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_LOAD_TEST_ROLE_ARN }}
          role-session-name: phase6-session-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: eu-west-3
          role-duration-seconds: 5400
          retry-max-attempts: 1
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify delegated caller and region without disclosure
        shell: bash
        run: |
          set -euo pipefail
          test "$AWS_REGION" = "eu-west-3"
          test "$AWS_DEFAULT_REGION" = "eu-west-3"
          test -n "${AWS_SESSION_TOKEN:-}"
          aws sts get-caller-identity --output json >/dev/null

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/backend/fantasy-capacity-requirements.txt

      - name: Install pinned harness dependencies
        shell: bash
        run: python -m pip install --requirement scripts/backend/fantasy-capacity-requirements.txt

      - name: Run 125-user session provisioning diagnostic reproduction
        id: diagnostic
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        run: |
          set +e
          timeout --signal=INT --kill-after=60s 45m \
            python scripts/backend/fantasy-capacity-orchestrator.py --setup-rehearsal
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Independent cleanup and verification
        id: cleanup
        if: always()
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        run: |
          set +e
          timeout --signal=INT --kill-after=60s 20m \
            python scripts/backend/fantasy-capacity-orchestrator.py --cleanup-only
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Render sanitized diagnostic result
        id: result
        if: always()
        continue-on-error: true
        shell: bash
        env:
          DIAGNOSTIC_EXIT: ${{ steps.diagnostic.outputs.exit_code || '2' }}
          CLEANUP_EXIT: ${{ steps.cleanup.outputs.exit_code || '2' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          report_script = Path("scripts/backend/fantasy-capacity-report.py")
          spec = importlib.util.spec_from_file_location("phase6_report", report_script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          evidence = Path(os.environ["BOTOLAGO_PHASE6_EVIDENCE_DIR"])
          violations = module.scan_artifacts(evidence)
          summaries = []
          for path in sorted(evidence.glob("*/gate-summary.json")):
            summaries.append(json.loads(path.read_text()))
          cleanup_summaries = []
          for path in sorted(evidence.glob("*/recovery-cleanup-summary.json")):
            cleanup_summaries.append(json.loads(path.read_text()))
          result = {
            "artifactsSanitized": not violations,
            "cleanupExit": int(os.environ["CLEANUP_EXIT"]),
            "cleanupSummaries": cleanup_summaries,
            "diagnosticExit": int(os.environ["DIAGNOSTIC_EXIT"]),
            "diagnosticScope": "session_provisioning_only",
            "expectedRunners": 5,
            "expectedUsersPerRunner": 25,
            "expectedTotalUsers": 125,
            "noMeasuredWorkload": True,
            "runUrl": os.environ["RUN_URL"],
            "summaries": summaries,
            "violations": violations,
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "phase6-session-diagnostic-result.json"
          module.private_write(output, json.dumps(result, indent=2, sort_keys=True) + "\n")
          raise SystemExit(0 if not violations else 2)
          PY
          status=$?
          sanitized=$(python -c 'import json,os; print(str(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"phase6-session-diagnostic-result.json")))["artifactsSanitized"]).lower())' 2>/dev/null || echo false)
          echo "sanitized=$sanitized" >> "$GITHUB_OUTPUT"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload sanitized diagnostic evidence
        if: always() && steps.result.outputs.sanitized == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase6-session-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/botolago-phase6-session-diagnostic/evidence
            ${{ runner.temp }}/phase6-session-diagnostic-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce diagnostic reproduction cleanup and sanitizer verdict
        if: always()
        shell: bash
        env:
          CLEANUP_EXIT: ${{ steps.cleanup.outputs.exit_code || '2' }}
          DIAGNOSTIC_EXIT: ${{ steps.diagnostic.outputs.exit_code || '2' }}
          SANITIZED: ${{ steps.result.outputs.sanitized || 'false' }}
        run: |
          set -euo pipefail
          test "$SANITIZED" = "true"
          test "$CLEANUP_EXIT" = "0"
          test "$DIAGNOSTIC_EXIT" = "0"
