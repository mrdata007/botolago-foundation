name: Phase 7F Production V2 API and Identity activation

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact main commit approved for Production V2 activation
        required: true
        type: string
      confirmation:
        description: Type RUN_PHASE7F_PRODUCTION_API_IDENTITY
        required: true
        type: string

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  activate:
    name: Protected API exposure and Identity/Profile verification
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-admin-activation
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      EXPECTED_PROJECT_NAME: BotolaGO Production V2
      EXPECTED_PROJECT_REF: tkewgajrljbwgwedqsxn
      EXPECTED_TARGET_ENVIRONMENT: production-v2
      KNOWN_STAGING_REF: srdrflfrfpwixsllveid
      BOTOLAGO_ADMIN_ENVIRONMENT: ${{ vars.BOTOLAGO_ADMIN_ENVIRONMENT }}
      BOTOLAGO_ADMIN_EXPECTED_PROJECT_REF: ${{ vars.BOTOLAGO_ADMIN_EXPECTED_PROJECT_REF }}
      BOTOLAGO_TARGET_ENVIRONMENT: ${{ vars.BOTOLAGO_TARGET_ENVIRONMENT }}
      BOTOLAGO_AAL2_EVIDENCE_SHA256: ${{ vars.BOTOLAGO_AAL2_EVIDENCE_SHA256 }}
      BOTOLAGO_ENVIRONMENT_ADMIN_BYPASS_DISABLED: ${{ vars.BOTOLAGO_ENVIRONMENT_ADMIN_BYPASS_DISABLED }}
      BOTOLAGO_ENVIRONMENT_DEPLOYMENT_BRANCH: ${{ vars.BOTOLAGO_ENVIRONMENT_DEPLOYMENT_BRANCH }}
      BOTOLAGO_ENVIRONMENT_PREVENT_SELF_REVIEW: ${{ vars.BOTOLAGO_ENVIRONMENT_PREVENT_SELF_REVIEW }}
      BOTOLAGO_ENVIRONMENT_PROTECTION_ATTESTATION_SHA256: ${{ vars.BOTOLAGO_ENVIRONMENT_PROTECTION_ATTESTATION_SHA256 }}
      BOTOLAGO_ENVIRONMENT_REQUIRED_REVIEWER_COUNT: ${{ vars.BOTOLAGO_ENVIRONMENT_REQUIRED_REVIEWER_COUNT }}
      BOTOLAGO_PRODUCTION_SMOKE_USER_UUID: ${{ vars.BOTOLAGO_PRODUCTION_SMOKE_USER_UUID }}
      SUPABASE_PRODUCTION_PROJECT_NAME: ${{ vars.SUPABASE_PRODUCTION_PROJECT_NAME }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}

    steps:
      - name: Initialize protected runtime and enforce immutable target
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$CONFIRMATION" != "RUN_PHASE7F_PRODUCTION_API_IDENTITY" ]]; then
            echo "Invalid manual confirmation."
            exit 2
          fi
          if [[ "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "The dispatched commit is not the checked-out main commit."
            exit 2
          fi
          if [[ "$SUPABASE_PRODUCTION_PROJECT_REF" != "$EXPECTED_PROJECT_REF" ||
                "$BOTOLAGO_ADMIN_EXPECTED_PROJECT_REF" != "$EXPECTED_PROJECT_REF" ]]; then
            echo "Production project-ref guard failed."
            exit 2
          fi
          if [[ "$SUPABASE_PRODUCTION_PROJECT_REF" == "$KNOWN_STAGING_REF" ]]; then
            echo "Staging project selection is forbidden."
            exit 2
          fi
          if [[ "$SUPABASE_PRODUCTION_PROJECT_NAME" != "$EXPECTED_PROJECT_NAME" ]]; then
            echo "Production project-name guard failed."
            exit 2
          fi
          if [[ "$BOTOLAGO_TARGET_ENVIRONMENT" != "$EXPECTED_TARGET_ENVIRONMENT" ||
                "$BOTOLAGO_ADMIN_ENVIRONMENT" != "production" ]]; then
            echo "Production environment guard failed."
            exit 2
          fi

          configured_url="${SUPABASE_URL:-}"
          if [[ -z "$configured_url" ]]; then
            configured_url="${SUPABASE_PRODUCTION_URL:-}"
          elif [[ -n "${SUPABASE_PRODUCTION_URL:-}" &&
                  "${configured_url%/}" != "${SUPABASE_PRODUCTION_URL%/}" ]]; then
            echo "Production URL variables disagree."
            exit 2
          fi
          if [[ "${configured_url%/}" != "https://${EXPECTED_PROJECT_REF}.supabase.co" ]]; then
            echo "Production URL guard failed."
            exit 2
          fi

          runtime_dir="$RUNNER_TEMP/botolago-phase7f"
          evidence_dir="$runtime_dir/evidence"
          install -d -m 0700 "$runtime_dir" "$evidence_dir"
          {
            echo "PHASE7F_RUNTIME_DIR=$runtime_dir"
            echo "PHASE7F_EVIDENCE_DIR=$evidence_dir"
            echo "PHASE7F_STATE_FILE=$runtime_dir/activation-state.json"
          } >> "$GITHUB_ENV"

          echo "Target guard: PASS"

      - name: Check out the exact reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate the activation harness
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/backend/phase7e-production-migration-promoter.py \
            scripts/backend/phase7f-production-api-identity-activation.py
          python -m unittest \
            scripts/backend/tests/test_phase7e_production_migration_promoter.py \
            scripts/backend/tests/test_phase7f_production_api_identity_activation.py

      - name: Verify protected environment and conflicting production runs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/backend/phase7f-production-api-identity-activation.py \
            --verify-github-preflight \
            --evidence-dir "$PHASE7F_EVIDENCE_DIR"

      - name: Run guarded Production V2 activation
        id: activation
        shell: bash
        env:
          BOTOLAGO_AAL2_NON_STAFF_ACCESS_TOKEN: ${{ secrets.BOTOLAGO_AAL2_NON_STAFF_ACCESS_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          for secret_value in \
            "$SUPABASE_ACCESS_TOKEN" \
            "$SUPABASE_SECRET_KEY" \
            "$BOTOLAGO_AAL2_NON_STAFF_ACCESS_TOKEN"; do
            printf '::add-mask::%s\n' "$secret_value"
          done
          python scripts/backend/phase7f-production-api-identity-activation.py \
            --expected-commit "$EXPECTED_COMMIT" \
            --confirmation "$CONFIRMATION" \
            --repo-root "$GITHUB_WORKSPACE" \
            --evidence-dir "$PHASE7F_EVIDENCE_DIR" \
            --state-file "$PHASE7F_STATE_FILE"

      - name: Independently recover or verify activation state
        id: recovery
        if: always()
        shell: bash
        env:
          PRIMARY_OUTCOME: ${{ steps.activation.outcome }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$SUPABASE_ACCESS_TOKEN"
          if [[ ! -f "$PHASE7F_STATE_FILE" ]]; then
            echo "STATE_JOURNAL_MISSING"
            exit 1
          fi
          python scripts/backend/phase7f-production-api-identity-activation.py \
            --recover-from-state "$PHASE7F_STATE_FILE" \
            --evidence-dir "$PHASE7F_EVIDENCE_DIR" \
            --primary-outcome "$PRIMARY_OUTCOME"

      - name: Verify evidence contains no credential patterns
        id: evidence_scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/backend/phase7f-scan-sanitized-evidence.py \
            "$PHASE7F_EVIDENCE_DIR"

      - name: Upload sanitized activation evidence
        id: evidence_upload
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase7f-production-api-identity-${{ github.run_id }}
          path: ${{ env.PHASE7F_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Finalize evidence verdict
        id: evidence_finalize
        if: always()
        shell: bash
        env:
          EVIDENCE_SCAN_OUTCOME: ${{ steps.evidence_scan.outcome }}
          EVIDENCE_UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$SUPABASE_ACCESS_TOKEN"
          python scripts/backend/phase7f-production-api-identity-activation.py \
            --finalize-evidence \
            --state-file "$PHASE7F_STATE_FILE" \
            --evidence-dir "$PHASE7F_EVIDENCE_DIR" \
            --scan-outcome "$EVIDENCE_SCAN_OUTCOME" \
            --upload-outcome "$EVIDENCE_UPLOAD_OUTCOME"

      - name: Final independent recovery guard
        if: always() && steps.evidence_finalize.outcome != 'success'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$SUPABASE_ACCESS_TOKEN"
          if [[ ! -f "$PHASE7F_STATE_FILE" ]]; then
            echo "STATE_JOURNAL_MISSING"
            exit 1
          fi
          python scripts/backend/phase7f-production-api-identity-activation.py \
            --recover-from-state "$PHASE7F_STATE_FILE" \
            --evidence-dir "$PHASE7F_EVIDENCE_DIR"
