name: Fantasy scoring manual finalization

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit containing the canonical scoring manifest
        required: true
        type: string
      manifest_path:
        description: Repository path under docs/production/fantasy-scoring-manifests
        required: true
        type: string
      expected_manifest_digest:
        description: SHA-256 printed by the reviewed local validation run
        required: true
        type: string
      execute:
        description: Execute writes after validation; false performs a dry run only
        required: true
        default: false
        type: boolean
      confirmation:
        description: Digest-bound FINALIZE confirmation printed by validation
        required: false
        type: string

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate immutable Fantasy scoring manifest
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mrdata007'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      manifest_digest: ${{ steps.validate.outputs.manifest_digest }}
      execution_confirmation: ${{ steps.validate.outputs.execution_confirmation }}
    steps:
      - name: Guard reviewed commit and manifest path
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          EXPECTED_DIGEST: ${{ inputs.expected_manifest_digest }}
        run: |
          set -euo pipefail
          if [[ "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "REVIEWED_COMMIT_MISMATCH"
            exit 2
          fi
          if [[ ! "$MANIFEST_PATH" =~ ^docs/production/fantasy-scoring-manifests/[a-z0-9][a-z0-9._-]*\.json$ ]]; then
            echo "INVALID_MANIFEST_PATH"
            exit 2
          fi
          if [[ ! "$EXPECTED_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "INVALID_MANIFEST_DIGEST"
            exit 2
          fi

      - name: Check out exact reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Validate canonical snapshot without writes
        id: validate
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          EXPECTED_DIGEST: ${{ inputs.expected_manifest_digest }}
        run: |
          set -euo pipefail
          bun scripts/backend/fantasy-scoring-worker-runner.ts validate \
            --manifest "$MANIFEST_PATH" \
            --expected-digest "$EXPECTED_DIGEST"

  execute:
    name: Execute reviewed Fantasy scoring finalization
    needs: validate
    if: inputs.execute
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-admin-activation
    env:
      MANIFEST_PATH: ${{ inputs.manifest_path }}
      EXPECTED_DIGEST: ${{ needs.validate.outputs.manifest_digest }}
      CONFIRMATION: ${{ inputs.confirmation }}
      REQUIRED_CONFIRMATION: ${{ needs.validate.outputs.execution_confirmation }}
      FANTASY_SCORING_WORKER_KEY: ${{ secrets.FANTASY_SCORING_WORKER_KEY }}
      SUPABASE_PRODUCTION_PROJECT_NAME: ${{ vars.SUPABASE_PRODUCTION_PROJECT_NAME }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
    steps:
      - name: Enforce production target and digest-bound confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$FANTASY_SCORING_WORKER_KEY" ]]; then
            printf '::add-mask::%s\n' "$FANTASY_SCORING_WORKER_KEY"
          fi
          if [[ -z "$FANTASY_SCORING_WORKER_KEY" || "$CONFIRMATION" != "$REQUIRED_CONFIRMATION" ]]; then
            echo "PROTECTED_SCORING_CONFIRMATION_FAILED"
            exit 2
          fi
          if [[ "$SUPABASE_PRODUCTION_PROJECT_REF" != "tkewgajrljbwgwedqsxn" ||
                "$SUPABASE_PRODUCTION_PROJECT_NAME" != "BotolaGO Production V2" ||
                "${SUPABASE_PRODUCTION_URL%/}" != "https://tkewgajrljbwgwedqsxn.supabase.co" ]]; then
            echo "PRODUCTION_PROJECT_GUARD_FAILED"
            exit 2
          fi

      - name: Check out exact validated main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Execute fail-closed scoring worker
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/backend/fantasy-scoring-worker-runner.ts execute \
            --manifest "$MANIFEST_PATH" \
            --expected-digest "$EXPECTED_DIGEST" \
            --confirmation "$CONFIRMATION"

      - name: Record sanitized result
        if: always()
        shell: bash
        run: |
          {
            echo "### Fantasy scoring manual finalization"
            echo "- Commit: $GITHUB_SHA"
            echo "- Manifest digest: $EXPECTED_DIGEST"
            echo "- Recurring schedule enabled: false"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
