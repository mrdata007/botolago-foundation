name: G7 Production secret configuration diagnostic

# READ-ONLY. This workflow only ever runs the runner's `--capture-only` mode, which calls
# `supabase secrets list --project-ref ...` and nothing else: no `secrets set`/`unset`, no
# `functions deploy`, no `db push`, no call to the football-ingest endpoint. See
# `captureConfiguration`/`runHistoricalPerformanceBackfill` in
# scripts/backend/g7-historical-performance-backfill-runner.ts. Its purpose is to let the Chief
# discover the CURRENT presence/absence and digest of every MANAGED_SECRET_NAMES entry on
# production without any risk of mutating anything and without dispatching the full backfill
# workflow (whose later steps can mutate production).

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit approved for this read-only diagnostic
        required: true
        type: string
      confirmation:
        description: Type RUN_G7_SECRET_CONFIGURATION_DIAGNOSTIC
        required: true
        type: string

# Shares the SAME group as every production-mutating workflow, even though this one never
# mutates anything: it still calls the production Supabase project, so it must not race a real
# secrets set/unset/deploy elsewhere in that group.
concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnostic:
    name: Capture current production secret presence/digests (read-only)
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mrdata007'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-admin-activation
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_PROJECT_REF: tkewgajrljbwgwedqsxn
      # capture-only still requires a non-empty, in-scope G7_SEASON_IDS (parseRequestedSeasonIds
      # runs before the capture-only branch); it is recorded in the evidence as
      # `requestedSeasonIds` but does not affect what is captured — every one of the 15
      # MANAGED_SECRET_NAMES is always captured regardless of this value.
      G7_SEASON_IDS: "26027,24319"
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Initialize protected read-only runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$SUPABASE_ACCESS_TOKEN" ]]; then
            printf '::add-mask::%s\n' "$SUPABASE_ACCESS_TOKEN"
          fi
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "Protected credential injection failed before diagnostic capture."
            exit 2
          fi
          if [[ "${GITHUB_RUN_ATTEMPT:-}" != "1" ]]; then
            echo "GITHUB_WORKFLOW_RERUN_FORBIDDEN"
            exit 2
          fi
          if [[ "$CONFIRMATION" != "RUN_G7_SECRET_CONFIGURATION_DIAGNOSTIC" ||
                "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Immutable read-only diagnostic confirmation failed."
            exit 2
          fi
          runtime_dir="$RUNNER_TEMP/botolago-g7-secret-configuration-diagnostic"
          evidence_dir="$runtime_dir/evidence"
          install -d -m 0700 "$runtime_dir" "$evidence_dir"
          {
            echo "G7_BACKFILL_RUNTIME_DIR=$runtime_dir"
            echo "G7_BACKFILL_EVIDENCE_DIR=$evidence_dir"
          } >> "$GITHUB_ENV"
          echo "evidence_dir=$evidence_dir" >> "$GITHUB_OUTPUT"
          echo "Read-only diagnostic target guard: PASS"

      - name: Check out exact reviewed main commit
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install and verify reviewed runtime
        id: quality
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test scripts/backend/g7-historical-performance-backfill-runner.test.ts
          bun run typecheck
          bun run backend:secrets:check
          test -x ./node_modules/.bin/supabase

      - name: Capture current production secret configuration
        id: capture
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/backend/g7-historical-performance-backfill-runner.ts --capture-only

      - name: Preserve sanitized command evidence
        id: command_logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "${G7_BACKFILL_RUNTIME_DIR:-}" ||
                ! -d "${G7_BACKFILL_EVIDENCE_DIR:-}" ]]; then
            echo "G7_DIAGNOSTIC_RUNTIME_NOT_INITIALIZED"
            exit 1
          fi
          shopt -s nullglob
          for source in "$G7_BACKFILL_RUNTIME_DIR"/*.raw.log; do
            operation=$(basename "$source" .raw.log)
            exit_path="$G7_BACKFILL_RUNTIME_DIR/${operation}.exit"
            if [[ ! -f "$exit_path" ]]; then
              echo "G7_COMMAND_EXIT_CODE_MISSING operation=$operation"
              exit 1
            fi
            exit_code=$(tr -d '[:space:]' < "$exit_path")
            if [[ ! "$exit_code" =~ ^[0-9]+$ ]]; then
              echo "G7_COMMAND_EXIT_CODE_INVALID operation=$operation"
              exit 1
            fi
            GATE4_COMMAND_LOG_SOURCE="$source" \
              GATE4_COMMAND_LOG_DESTINATION="$G7_BACKFILL_EVIDENCE_DIR/${operation}.log" \
              GATE4_COMMAND_OPERATION="$operation" \
              GATE4_COMMAND_EXIT_CODE="$exit_code" \
              bun scripts/backend/gate4-sanitize-command-log.ts
          done
          echo "Sanitized G7 diagnostic command evidence preserved."

      - name: Verify evidence contains no credential patterns
        id: evidence_scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/backend/phase7f-scan-sanitized-evidence.py "$G7_BACKFILL_EVIDENCE_DIR"
          if [[ -n "$SUPABASE_ACCESS_TOKEN" ]] &&
             grep -R -F -q -- "$SUPABASE_ACCESS_TOKEN" "$G7_BACKFILL_EVIDENCE_DIR"; then
            echo "CREDENTIAL_FOUND_IN_G7_DIAGNOSTIC_EVIDENCE"
            exit 1
          fi
          echo "G7 secret configuration diagnostic evidence credential scan: PASS"

      - name: Upload sanitized secret configuration diagnostic evidence
        id: evidence_upload
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g7-production-secret-configuration-diagnostic-${{ github.run_id }}
          path: ${{ steps.runtime.outputs.evidence_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove protected runtime files
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${G7_BACKFILL_RUNTIME_DIR:-}" && -d "$G7_BACKFILL_RUNTIME_DIR" ]]; then
            find "$G7_BACKFILL_RUNTIME_DIR" -type f -exec chmod 0600 {} \;
            find "$G7_BACKFILL_RUNTIME_DIR" -type f -delete
            rmdir "$G7_BACKFILL_EVIDENCE_DIR" 2>/dev/null || true
            rmdir "$G7_BACKFILL_RUNTIME_DIR" 2>/dev/null || true
          fi
          echo "Protected G7 diagnostic runtime files removed."

      - name: Finalize secret configuration diagnostic verdict
        if: always()
        shell: bash
        env:
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          LOG_OUTCOME: ${{ steps.command_logs.outcome }}
          SCAN_OUTCOME: ${{ steps.evidence_scan.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          if [[ "$QUALITY_OUTCOME" != "success" ||
                "$CAPTURE_OUTCOME" != "success" ||
                "$LOG_OUTCOME" != "success" ||
                "$SCAN_OUTCOME" != "success" ||
                "$UPLOAD_OUTCOME" != "success" ||
                "$CLEANUP_OUTCOME" != "success" ]]; then
            echo "G7_PRODUCTION_SECRET_CONFIGURATION_DIAGNOSTIC_FAILED"
            exit 1
          fi
          echo "G7_PRODUCTION_SECRET_CONFIGURATION_DIAGNOSTIC_PASS"
