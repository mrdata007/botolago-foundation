name: G7 Current runtime configuration correction

# Corrects EXACTLY six football-ingest production secrets (current-season operational
# configuration) that are stuck on a stale historical value, digest-verified as season 26027. It
# never touches the other nine MANAGED_SECRET_NAMES (see
# scripts/backend/g7-historical-performance-backfill-runner.ts), never touches
# FOOTBALL_INGESTION_TRIGGER_SECRET, never calls `supabase functions deploy`, and never invokes
# the football-ingest HTTP endpoint. See scripts/backend/g7-current-runtime-configuration-correction.ts
# for the full pre-write / apply / retry / post-write comparison logic.
#
# The six target values are HARDCODED in the reviewed script
# (scripts/backend/g7-current-runtime-configuration-correction.ts's TARGET_SECRET_VALUES) rather
# than accepted as workflow_dispatch inputs or duplicated into this workflow's own YAML `env:`
# block — this workflow takes NO inputs beyond expected_commit/confirmation. This still follows
# this repo's existing "pinned production function secrets" convention
# (gate2f-production-current-season-catalog-canary.yml,
# gate3b-production-historical-content-canary.yml pin their six/twelve values as literals a human
# reviewed, never as dispatch inputs): the values here are exact, owner-approved, evidence-backed
# literals (docs/engineering/LAUNCH_LEDGER.yaml BG-0033
# `current_runtime_correction_packet_2026_09_19`) reviewed in the SAME commit as this workflow.
# They live in the script rather than this YAML because the script's own pre-write/retry/post-write
# comparison logic is unit-tested directly against TARGET_SECRET_VALUES
# (scripts/backend/g7-current-runtime-configuration-correction.test.ts) — duplicating the six
# literals into this workflow's `env:` block as well would only create a second copy that could
# silently drift from the tested one, with no independent safety benefit (unlike gate3b, which has
# no separate script for its pinned block).
#
# FOOTBALL_SPORTSMONKS_SEASON_END = "2027-06-30" is an OWNER-APPROVED OPERATIONAL BOUNDARY, NOT a
# verified official final-match date — the live SportsMonks provider itself reports a conflicting,
# internally-implausible end-date of "2026-09-24" (identical to its own season start) for this
# season, which is deliberately NOT used.
#
# FOOTBALL_SPORTSMONKS_FIXTURE_FROM/_TO are the FIRST 100-day fetch window only, computed via the
# existing reviewed `boundedFixtureWindow()` logic in
# scripts/backend/sportsmonks-production-probe.ts:254-272 evaluated for observedAt 2026-09-19 —
# NOT the whole season, and will need periodic refresh later (tracked separately, not this
# workflow's job to automate).
#
# No reviewed one-time activation ticket file (docs/production/<name>-trigger.json) is used here.
# Reasoning: unlike gate3b (which authorizes an ingestion call against production data with a
# push-triggered ticket path), this workflow is workflow_dispatch-only, fixed-scope (no operator
# input beyond expected_commit/confirmation — the six values are pinned in the reviewed script, not
# supplied at dispatch), and every value it can ever write is fully determined by the reviewed
# commit being dispatched. The GITHUB_RUN_ATTEMPT/EXPECTED_COMMIT/confirmation-string/project-ref
# guards below, combined with the mandatory `environment: production-admin-activation` manual
# approval gate, already require the same "an authorized human deliberately approved this exact
# commit and dispatch" property a ticket file would add. A ticket file would only duplicate the six
# hardcoded values a second time with no independent value, since (unlike gate3b) there is no
# separate push-triggered path here that a ticket could gate.

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit approved for this current-runtime correction
        required: true
        type: string
      confirmation:
        description: Type RUN_G7_CURRENT_RUNTIME_CONFIGURATION_CORRECTION
        required: true
        type: string

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  correction:
    name: Correct current-runtime football-ingest secrets (six keys only)
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mrdata007'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-admin-activation
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_PROJECT_REF: tkewgajrljbwgwedqsxn
      # Only SUPABASE_ACCESS_TOKEN is needed: captureConfiguration/applyCorrection call only
      # `supabase secrets list` / `supabase secrets set --env-file`, both authenticated solely via
      # the CLI's management-API access token. This workflow never calls the football-ingest HTTP
      # endpoint or the project database, so SUPABASE_SECRET_KEY, SUPABASE_DB_PASSWORD and
      # SPORTSMONKS_API_TOKEN are deliberately NOT requested here.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Initialize protected runtime and enforce immutable target
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$SUPABASE_ACCESS_TOKEN" ]]; then
            printf '::add-mask::%s\n' "$SUPABASE_ACCESS_TOKEN"
          fi
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "Protected credential injection failed before mutation."
            exit 2
          fi
          if [[ "${GITHUB_RUN_ATTEMPT:-}" != "1" ]]; then
            echo "GITHUB_WORKFLOW_RERUN_FORBIDDEN"
            exit 2
          fi
          if [[ "$CONFIRMATION" != "RUN_G7_CURRENT_RUNTIME_CONFIGURATION_CORRECTION" ||
                "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Immutable dispatch confirmation failed."
            exit 2
          fi
          if [[ "$EXPECTED_PROJECT_REF" != "tkewgajrljbwgwedqsxn" ]]; then
            echo "Production project guard failed."
            exit 2
          fi
          runtime_dir="$RUNNER_TEMP/botolago-g7-current-runtime-correction"
          evidence_dir="$runtime_dir/evidence"
          install -d -m 0700 "$runtime_dir" "$evidence_dir"
          {
            echo "G7_CORRECTION_RUNTIME_DIR=$runtime_dir"
            echo "G7_CORRECTION_EVIDENCE_DIR=$evidence_dir"
          } >> "$GITHUB_ENV"
          echo "evidence_dir=$evidence_dir" >> "$GITHUB_OUTPUT"
          echo "Immutable target guard: PASS"

      - name: Check out the exact reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install and verify reviewed runtime
        id: quality
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test scripts/backend/g7-current-runtime-configuration-correction.test.ts
          bun run backend:secrets:check
          test -x ./node_modules/.bin/supabase

      - name: Run the reviewed current-runtime correction
        id: correction
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/backend/g7-current-runtime-configuration-correction.ts

      - name: Preserve sanitized command evidence
        id: command_logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "${G7_CORRECTION_RUNTIME_DIR:-}" ||
                ! -d "${G7_CORRECTION_EVIDENCE_DIR:-}" ]]; then
            echo "G7_CORRECTION_RUNTIME_NOT_INITIALIZED"
            exit 1
          fi
          shopt -s nullglob
          for source in "$G7_CORRECTION_RUNTIME_DIR"/*.raw.log; do
            operation=$(basename "$source" .raw.log)
            exit_path="$G7_CORRECTION_RUNTIME_DIR/${operation}.exit"
            if [[ ! -f "$exit_path" ]]; then
              echo "G7_COMMAND_EXIT_CODE_MISSING operation=$operation"
              exit 1
            fi
            exit_code=$(tr -d '[:space:]' < "$exit_path")
            if [[ ! "$exit_code" =~ ^[0-9]+$ ]]; then
              echo "G7_COMMAND_EXIT_CODE_INVALID operation=$operation"
              exit 1
            fi
            GATE4_COMMAND_LOG_SOURCE="$source" \
              GATE4_COMMAND_LOG_DESTINATION="$G7_CORRECTION_EVIDENCE_DIR/${operation}.log" \
              GATE4_COMMAND_OPERATION="$operation" \
              GATE4_COMMAND_EXIT_CODE="$exit_code" \
              bun scripts/backend/gate4-sanitize-command-log.ts
          done
          echo "Sanitized G7 current-runtime correction command evidence preserved."

      - name: Verify evidence contains no credential patterns
        id: evidence_scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/backend/phase7f-scan-sanitized-evidence.py "$G7_CORRECTION_EVIDENCE_DIR"
          if [[ -n "$SUPABASE_ACCESS_TOKEN" ]] &&
             grep -R -F -q -- "$SUPABASE_ACCESS_TOKEN" "$G7_CORRECTION_EVIDENCE_DIR"; then
            echo "CREDENTIAL_FOUND_IN_G7_CORRECTION_EVIDENCE"
            exit 1
          fi
          echo "G7 current-runtime correction evidence credential scan: PASS"

      - name: Upload sanitized current-runtime correction evidence
        id: evidence_upload
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g7-current-runtime-configuration-correction-${{ github.run_id }}
          path: ${{ steps.runtime.outputs.evidence_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove protected runtime files
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${G7_CORRECTION_RUNTIME_DIR:-}" && -d "$G7_CORRECTION_RUNTIME_DIR" ]]; then
            find "$G7_CORRECTION_RUNTIME_DIR" -type f -exec chmod 0600 {} \;
            find "$G7_CORRECTION_RUNTIME_DIR" -type f -delete
            rmdir "$G7_CORRECTION_EVIDENCE_DIR" 2>/dev/null || true
            rmdir "$G7_CORRECTION_RUNTIME_DIR" 2>/dev/null || true
          fi
          echo "Protected G7 current-runtime correction runtime files removed."

      - name: Finalize current-runtime correction verdict
        if: always()
        shell: bash
        env:
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          CORRECTION_OUTCOME: ${{ steps.correction.outcome }}
          LOG_OUTCOME: ${{ steps.command_logs.outcome }}
          SCAN_OUTCOME: ${{ steps.evidence_scan.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          if [[ "$QUALITY_OUTCOME" != "success" ||
                "$CORRECTION_OUTCOME" != "success" ||
                "$LOG_OUTCOME" != "success" ||
                "$SCAN_OUTCOME" != "success" ||
                "$UPLOAD_OUTCOME" != "success" ||
                "$CLEANUP_OUTCOME" != "success" ]]; then
            echo "G7_CURRENT_RUNTIME_CONFIGURATION_CORRECTION_WORKFLOW_FAILED"
            exit 1
          fi
          echo "G7_CURRENT_RUNTIME_CONFIGURATION_CORRECTION_WORKFLOW_PASS"
