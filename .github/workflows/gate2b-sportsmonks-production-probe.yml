name: Gate 2B SportsMonks production access probe

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit approved for the read-only provider probe
        required: true
        type: string
      confirmation:
        description: Type RUN_GATE2B_SPORTSMONKS_PROBE
        required: true
        type: string

concurrency:
  group: botolago-sportsmonks-production-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: Verify paid Botola access and discover current season
    if: >-
      always() &&
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mrdata007'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-football-ingestion
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}

    steps:
      - name: Initialize protected read-only runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_RUN_ATTEMPT:-}" != "1" ]]; then
            echo "GITHUB_WORKFLOW_RERUN_FORBIDDEN"
            exit 2
          fi
          if [[ "$CONFIRMATION" != "RUN_GATE2B_SPORTSMONKS_PROBE" ]]; then
            echo "Invalid manual confirmation."
            exit 2
          fi
          if [[ "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "The dispatched commit is not the reviewed main commit."
            exit 2
          fi
          evidence_dir="$RUNNER_TEMP/botolago-gate2b/evidence"
          install -d -m 0700 "$evidence_dir"
          echo "GATE2B_EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          echo "Read-only target guard: PASS"

      - name: Check out the exact reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate the no-write probe harness
        shell: bash
        run: |
          set -euo pipefail
          bun test scripts/backend/sportsmonks-production-probe.test.ts

      - name: Run the protected SportsMonks probe
        id: provider_probe
        shell: bash
        env:
          SPORTSMONKS_API_TOKEN: ${{ secrets.SPORTSMONKS_API_TOKEN }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$SPORTSMONKS_API_TOKEN"
          bun scripts/backend/sportsmonks-production-probe.ts

      - name: Verify evidence contains no credential patterns
        id: evidence_scan
        if: always()
        shell: bash
        env:
          SPORTSMONKS_API_TOKEN: ${{ secrets.SPORTSMONKS_API_TOKEN }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$SPORTSMONKS_API_TOKEN"
          python scripts/backend/phase7f-scan-sanitized-evidence.py "$GATE2B_EVIDENCE_DIR"
          if grep -R -F -q -- "$SPORTSMONKS_API_TOKEN" "$GATE2B_EVIDENCE_DIR"; then
            echo "SPORTSMONKS_CREDENTIAL_FOUND_IN_EVIDENCE"
            exit 1
          fi
          echo "SportsMonks credential scan: PASS"

      - name: Upload sanitized provider evidence
        id: evidence_upload
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate2b-sportsmonks-probe-${{ github.run_id }}
          path: ${{ env.GATE2B_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Finalize probe verdict
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.provider_probe.outcome }}
          SCAN_OUTCOME: ${{ steps.evidence_scan.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
        run: |
          set -euo pipefail
          if [[ "$PROBE_OUTCOME" != "success" ||
                "$SCAN_OUTCOME" != "success" ||
                "$UPLOAD_OUTCOME" != "success" ]]; then
            echo "GATE2B_SPORTSMONKS_PROBE_FAILED"
            exit 1
          fi
          echo "GATE2B_SPORTSMONKS_PROBE_PASS"
