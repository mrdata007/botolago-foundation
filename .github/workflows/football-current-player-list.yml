name: Observe current Football player list

# Reads every club's squad (and the lineups of the fixtures given) from
# SportsMonks, records that observation in production and writes its plan to
# the evidence. It does not change the player list: a reviewed plan is applied
# separately, with the Fantasy tick paused
# (docs/backend/CURRENT_PLAYER_LIST_UPDATE.md).

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      confirmation:
        description: Type OBSERVE_CURRENT_PLAYER_LIST
        required: true
        type: string
      fixture_ids:
        description: SportsMonks fixture ids whose lineups to include, comma-separated (at most 20)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && github.actor == 'mrdata007'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-admin-activation
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      FIXTURE_IDS: ${{ inputs.fixture_ids }}
      SUPABASE_PRODUCTION_PROJECT_NAME: ${{ vars.SUPABASE_PRODUCTION_PROJECT_NAME }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
    steps:
      - name: Guard exact reviewed first owner dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_TRIGGERING_ACTOR" = "mrdata007"
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test "$CONFIRMATION" = "OBSERVE_CURRENT_PLAYER_LIST"
          test "$SUPABASE_PRODUCTION_PROJECT_REF" = "tkewgajrljbwgwedqsxn"
          test "$SUPABASE_PRODUCTION_PROJECT_NAME" = "BotolaGO Production V2"
          test "${SUPABASE_PRODUCTION_URL%/}" = "https://tkewgajrljbwgwedqsxn.supabase.co"
          evidence_dir="$RUNNER_TEMP/current-player-list/evidence"
          install -d -m 0700 "$evidence_dir"
          echo "CURRENT_PLAYER_LIST_EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"

      - name: Check out exact reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install and verify the player list runtime
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test scripts/backend/current-player-list.test.ts scripts/backend/sportsmonks-production-probe.test.ts
          bun run backend:secrets:check

      - name: Observe the player list and plan it
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SPORTSMONKS_API_TOKEN: ${{ secrets.SPORTSMONKS_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SECRET_KEY"
          test -n "$SPORTSMONKS_API_TOKEN"
          printf '::add-mask::%s\n' "$SUPABASE_SECRET_KEY"
          printf '::add-mask::%s\n' "$SPORTSMONKS_API_TOKEN"
          bun scripts/backend/current-player-list.ts

      - name: Scan sanitized evidence
        id: evidence_scan
        if: always()
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SPORTSMONKS_API_TOKEN: ${{ secrets.SPORTSMONKS_API_TOKEN }}
        run: |
          set -euo pipefail
          test -d "$CURRENT_PLAYER_LIST_EVIDENCE_DIR"
          python scripts/backend/phase7f-scan-sanitized-evidence.py "$CURRENT_PLAYER_LIST_EVIDENCE_DIR"
          for value in "$SUPABASE_SECRET_KEY" "$SPORTSMONKS_API_TOKEN"; do
            if [[ -n "$value" ]] && grep -R -F -q -- "$value" "$CURRENT_PLAYER_LIST_EVIDENCE_DIR"; then
              echo "CREDENTIAL_FOUND_IN_EVIDENCE"
              exit 1
            fi
          done

      - name: Upload player list evidence
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-player-list-${{ github.run_id }}
          path: ${{ env.CURRENT_PLAYER_LIST_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
