name: Phase 6.5 functional acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase65-functional-acceptance.yml"
      - "tests/e2e/**"
      - "scripts/qa/**"
      - "src/**"
      - "supabase/**"
      - "package.json"
      - "bun.lock"

concurrency:
  group: phase65-functional-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging-functional:
    if: github.head_ref == 'qa/phase6-functional-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging-load-test
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
      SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_STAGING_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
      VITE_AUTH_MODE: supabase
      VITE_FOOTBALL_DATA_MODE: supabase
      VITE_NEWS_DATA_MODE: supabase
      VITE_NOTIFICATIONS_DATA_MODE: supabase
      VITE_FANTASY_DATA_MODE: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Mask protected values
        shell: bash
        run: |
          printf '::add-mask::%s\n' "$SUPABASE_ACCESS_TOKEN"
          printf '::add-mask::%s\n' "$VITE_SUPABASE_PUBLISHABLE_KEY"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Create isolated synthetic users
        run: bun scripts/qa/phase65-staging-fixtures.mjs setup
      - name: Run staging-backed browser acceptance
        run: bun run test:e2e:staging
      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase65-browser-evidence
          path: |
            playwright-report
            test-results/playwright/**/*.png
            test-results/playwright/**/sanitized-browser-diagnostics*
          if-no-files-found: ignore
          retention-days: 7
      - name: Bounded synthetic cleanup
        if: always()
        run: bun scripts/qa/phase65-staging-fixtures.mjs cleanup
