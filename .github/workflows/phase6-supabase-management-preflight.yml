name: Phase 6 Supabase Management preflight

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_SUPABASE_MANAGEMENT_PREFLIGHT
        required: true
        type: string

permissions:
  contents: read

jobs:
  management-preflight:
    name: Verify staging Management API access
    if: github.repository == 'mrdata007/botolago-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging-load-test
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
      EXPECTED_PROJECT_REF: srdrflfrfpwixsllveid
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Run read-only Management API preflight
        shell: bash
        run: |
          if [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            printf '::add-mask::%s\n' "$SUPABASE_ACCESS_TOKEN"
          fi
          set -euo pipefail

          if [[ "$CONFIRMATION" != "RUN_SUPABASE_MANAGEMENT_PREFLIGHT" ]]; then
            echo "Invalid confirmation value."
            exit 2
          fi

          http_status="not_sent"
          classification="secret_missing"
          returned_ref="unavailable"
          matches_expected="false"
          passed="false"

          if [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            response_file="$(mktemp)"
            error_file="$(mktemp)"
            trap 'rm -f "$response_file" "$error_file"' EXIT

            curl_exit=0
            http_status="$(curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request GET \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_STAGING_PROJECT_REF" \
              2>"$error_file")" || curl_exit=$?

            if [[ "$curl_exit" -ne 0 ]]; then
              http_status="network_error"
              classification="network_error"
            else
              case "$http_status" in
                200)
                  candidate_ref="$(jq -r 'if type == "object" then (.ref // .id // empty) else empty end | select(type == "string")' "$response_file" 2>/dev/null || true)"
                  if [[ "$candidate_ref" =~ ^[a-z0-9]{20}$ ]]; then
                    returned_ref="$candidate_ref"
                  fi
                  if [[ "$returned_ref" == "$EXPECTED_PROJECT_REF" && "$SUPABASE_STAGING_PROJECT_REF" == "$EXPECTED_PROJECT_REF" ]]; then
                    classification="management_api_access_confirmed"
                    matches_expected="true"
                    passed="true"
                  else
                    classification="project_ref_mismatch"
                  fi
                  ;;
                401) classification="invalid_expired_or_revoked_token" ;;
                403) classification="token_lacks_project_access" ;;
                404) classification="project_not_visible_or_ref_incorrect" ;;
                *) classification="management_api_http_error" ;;
              esac
            fi
          fi

          {
            echo "### Phase 6 Supabase Management preflight"
            echo
            echo "- HTTP status: $http_status"
            echo "- Classification: $classification"
            echo "- Returned project ref: $returned_ref"
            echo "- Matches expected project: $matches_expected"
            echo "- Result: $([[ "$passed" == "true" ]] && echo PASS || echo FAIL)"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "HTTP status: $http_status"
          echo "Classification: $classification"
          echo "Returned project ref: $returned_ref"
          echo "Matches expected project: $matches_expected"

          [[ "$passed" == "true" ]]
