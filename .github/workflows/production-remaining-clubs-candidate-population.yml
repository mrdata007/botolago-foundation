# Candidate/observation population for the OTHER 15 clubs of the registry (every club
# except Maghreb Fès, already recorded by the MAS Fès canary). Owner-approved.
#   mode=dry-run  collects the 15 clubs' squads (30 provider requests), validates every item
#                 against the recorder contract and prints sanitized counts. Writes nothing.
#   mode=write    the same, then exactly ONE call to api.football_mapping_record_observations
#                 as the service role (never retried), then a fresh read of production.
# It writes only candidates and observations through the recorder: no proposal, no mapping,
# no audit row, no Fantasy row, no schedule. Logs carry counts only.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run (writes nothing) or write (one recorder call)
        required: true
        type: choice
        options:
          - dry-run
          - write
      expected_commit:
        description: Exact main commit approved for this canary
        required: true
        type: string
      confirmation:
        description: DRY_RUN_REMAINING_15_CLUBS for dry-run, WRITE_REMAINING_15_CLUBS for write
        required: true
        type: string
      expected_observations:
        description: Write only - the observation count the reviewed dry-run reported
        required: false
        type: string
      expected_new_candidates:
        description: Write only - the new-candidate count the reviewed dry-run reported
        required: false
        type: string
      expected_mapping_rows:
        description: Mapping rows expected in football_provider_mappings before the run
        required: false
        default: "1541"
        type: string

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canary:
    name: Other 15 clubs candidate population on Production V2
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mrdata007' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-admin-activation
    env:
      MODE: ${{ inputs.mode }}
      CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}

    steps:
      - name: Enforce dispatch guards
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_RUN_ATTEMPT:-}" == "1" ]] || { echo "GITHUB_WORKFLOW_RERUN_FORBIDDEN"; exit 2; }
          [[ "$EXPECTED_COMMIT" == "$GITHUB_SHA" ]] || { echo "The dispatched commit is not the current main commit."; exit 2; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "The population may run only from main."; exit 2; }
          if [[ "$MODE" == "dry-run" ]]; then
            [[ "$CONFIRMATION" == "DRY_RUN_REMAINING_15_CLUBS" ]] || { echo "Invalid confirmation."; exit 2; }
          elif [[ "$MODE" == "write" ]]; then
            [[ "$CONFIRMATION" == "WRITE_REMAINING_15_CLUBS" ]] || { echo "Invalid confirmation."; exit 2; }
          else
            echo "Invalid mode."; exit 2
          fi
          echo "Dispatch guards: PASS"

      - name: Check out the reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (no secrets in this step)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Collect, validate and (write mode) record once
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FLASHSCORE_RAPIDAPI_HOST: ${{ vars.FLASHSCORE_RAPIDAPI_HOST }}
          SUPABASE_SECRET_KEY: ${{ inputs.mode == 'write' && secrets.SUPABASE_SECRET_KEY || '' }}
          EXPECTED_OBSERVATIONS: ${{ inputs.expected_observations }}
          EXPECTED_NEW_CANDIDATES: ${{ inputs.expected_new_candidates }}
          EXPECTED_MAPPING_ROWS: ${{ inputs.expected_mapping_rows }}
        shell: bash
        run: |
          set -euo pipefail
          for secret_value in "${SUPABASE_ACCESS_TOKEN:-}" "${RAPIDAPI_KEY:-}" "${SUPABASE_SECRET_KEY:-}"; do
            if [[ -n "$secret_value" ]]; then
              printf '::add-mask::%s\n' "$secret_value"
            fi
          done
          bun scripts/backend/production-remaining-clubs-candidate-population.ts
