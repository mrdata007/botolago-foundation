name: Phase 6 delegated capacity gate

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed PR #6 head SHA to test
        required: true
        type: string
      confirmation:
        description: Type RUN_PHASE6_STAGING_GATE
        required: true
        type: string

concurrency:
  group: phase6-staging-load-test
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  capacity-gate:
    name: Rehearsal, capacity gate, soak, and exact-zero cleanup
    if: github.repository == 'mrdata007/botolago-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: staging-load-test
    env:
      AWS_REGION: eu-west-3
      AWS_DEFAULT_REGION: eu-west-3
      BOTOLAGO_LOAD_ENVIRONMENT: staging-v2
      BOTOLAGO_MAX_ESTIMATED_COST_USD: "50"
      BOTOLAGO_REQUIRE_AWS_SESSION_TOKEN: "1"
      BOTOLAGO_AWS_LOAD_TEST_ROLE_ARN: ${{ vars.AWS_LOAD_TEST_ROLE_ARN }}

    steps:
      - name: Initialize Phase 6 runtime environment
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/botolago-phase6"
          evidence_dir="$runtime_dir/evidence"
          install -d -m 0700 "$runtime_dir" "$evidence_dir"
          {
            echo "BOTOLAGO_PHASE6_RUNTIME_DIR=$runtime_dir"
            echo "BOTOLAGO_PHASE6_EVIDENCE_DIR=$evidence_dir"
          } >> "$GITHUB_ENV"

      - name: Validate manual dispatch
        id: dispatch_guard
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "RUN_PHASE6_STAGING_GATE"
          [[ "${{ inputs.expected_commit }}" =~ ^[0-9a-f]{40}$ ]]

      - name: Verify PR #6 reviewed head
        id: pr_guard
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        with:
          script: |
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 6,
            });
            if (pull.data.head.ref !== "backend/fantasy-domain") {
              core.setFailed("PR #6 is not sourced from backend/fantasy-domain");
              return;
            }
            if (pull.data.head.sha !== process.env.EXPECTED_COMMIT) {
              core.setFailed("The reviewed commit is not the current PR #6 head");
              return;
            }
            core.info("PR #6 head matches the manually approved commit");

      - name: Check out the reviewed Phase 6 commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify hardened harness ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_commit }}"
          git merge-base --is-ancestor f6340e0eed667f730ceddc1f4dd5d89dc9085003 HEAD

      - name: Configure delegated AWS credentials
        id: aws_oidc
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_LOAD_TEST_ROLE_ARN }}
          role-session-name: phase6-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: eu-west-3
          role-duration-seconds: 7200
          retry-max-attempts: 1
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify delegated caller and region without disclosure
        if: steps.aws_oidc.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "$AWS_REGION" = "eu-west-3"
          test "$AWS_DEFAULT_REGION" = "eu-west-3"
          test -n "${AWS_SESSION_TOKEN:-}"
          aws sts get-caller-identity --output json >/dev/null

      - name: Install pinned harness dependencies
        if: steps.aws_oidc.outcome == 'success'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/backend/fantasy-capacity-requirements.txt

      - name: Install coordinator packages
        if: steps.aws_oidc.outcome == 'success'
        shell: bash
        run: python -m pip install --requirement scripts/backend/fantasy-capacity-requirements.txt

      - name: Initialize owner-only runtime directories
        if: steps.aws_oidc.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$BOTOLAGO_PHASE6_RUNTIME_DIR"
          install -d -m 0700 "$BOTOLAGO_PHASE6_EVIDENCE_DIR"

      - name: Run setup rehearsal then unchanged full gate
        id: capacity
        if: steps.aws_oidc.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ vars.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        run: |
          set +e
          timeout --signal=INT --kill-after=120s 90m \
            python scripts/backend/fantasy-capacity-orchestrator.py --rehearsal-then-full
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record sanitized delegated-credential preflight failure
        if: always() && steps.aws_oidc.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$BOTOLAGO_PHASE6_EVIDENCE_DIR/preflight"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["BOTOLAGO_PHASE6_EVIDENCE_DIR"])/"preflight"/"credential-preflight.json"; p.write_text(json.dumps({"passed":False,"stage":"delegated_credential_preflight","provisioningStarted":False},indent=2)+"\n"); p.chmod(0o600)'

      - name: Independent recovery cleanup
        id: cleanup
        if: always() && steps.aws_oidc.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ vars.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        run: |
          set +e
          timeout --signal=INT --kill-after=60s 20m \
            python scripts/backend/fantasy-capacity-orchestrator.py --cleanup-only
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Remove local runtime material when delegation failed
        if: always() && steps.aws_oidc.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os,pathlib; root=pathlib.Path(os.environ["BOTOLAGO_PHASE6_RUNTIME_DIR"]); [(p.unlink(missing_ok=True)) for p in root.rglob("*") if p.is_file() and (p.name in {"runner.pem","runner-runtime.env","sessions.json","cloud-state.json"} or p.name.startswith("credentials-"))] if root.exists() else None'

      - name: Render and scan sanitized evidence
        id: report
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CAPACITY_EXIT: ${{ steps.capacity.outputs.exit_code || '2' }}
          CLEANUP_EXIT: ${{ steps.cleanup.outputs.exit_code || '2' }}
          OIDC_OUTCOME: ${{ steps.aws_oidc.outcome || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          report_path="$RUNNER_TEMP/phase6-pr-summary.md"
          result_path="$RUNNER_TEMP/phase6-workflow-result.json"
          python scripts/backend/fantasy-capacity-report.py \
            --evidence-root "$BOTOLAGO_PHASE6_EVIDENCE_DIR" \
            --output "$report_path" \
            --result "$result_path" \
            --run-url "$RUN_URL" \
            --run-label "run ${{ github.run_number }} attempt ${{ github.run_attempt }}" \
            --oidc-outcome "$OIDC_OUTCOME" \
            --capacity-exit "$CAPACITY_EXIT" \
            --cleanup-exit "$CLEANUP_EXIT"
          status=$?
          sanitized=$(python -c 'import json,os; print(str(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"phase6-workflow-result.json")))["artifactsSanitized"]).lower())' 2>/dev/null || echo false)
          echo "sanitized=$sanitized" >> "$GITHUB_OUTPUT"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload sanitized owner evidence
        if: always() && steps.report.outputs.sanitized == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase6-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/botolago-phase6/evidence
            ${{ runner.temp }}/phase6-pr-summary.md
            ${{ runner.temp }}/phase6-workflow-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Update PR #6 with sanitized evidence and draft state
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          REPORT_PATH: ${{ runner.temp }}/phase6-pr-summary.md
          RESULT_PATH: ${{ runner.temp }}/phase6-workflow-result.json
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        with:
          script: |
            const fs = require("fs");
            const report = fs.readFileSync(process.env.REPORT_PATH, "utf8");
            const result = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, "utf8"));
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 6,
            });
            const start = "<!-- phase6-capacity-evidence:start -->";
            const end = "<!-- phase6-capacity-evidence:end -->";
            const escapedStart = start.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const escapedEnd = end.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const pattern = new RegExp(`${escapedStart}[\\s\\S]*?${escapedEnd}`);
            const current = pull.data.body || "";
            const body = pattern.test(current)
              ? current.replace(pattern, report.trim())
              : `${current.trim()}\n\n${report.trim()}\n`;
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 6,
              body,
            });
            const headStillMatches = pull.data.head.sha === process.env.EXPECTED_COMMIT;
            if (result.gatePassed && headStillMatches && pull.data.draft) {
              await github.graphql(
                "mutation($id: ID!) { markPullRequestReadyForReview(input: {pullRequestId: $id}) { pullRequest { isDraft } } }",
                { id: pull.data.node_id },
              );
              core.info("Phase 6 passed at the current PR head; PR #6 is ready for review");
            } else if ((!result.gatePassed || !headStillMatches) && !pull.data.draft) {
              await github.graphql(
                "mutation($id: ID!) { convertPullRequestToDraft(input: {pullRequestId: $id}) { pullRequest { isDraft } } }",
                { id: pull.data.node_id },
              );
              core.info("Phase 6 did not pass at the current PR head; PR #6 remains draft");
            } else {
              core.info(result.gatePassed ? "PR #6 capacity evidence updated" : "PR #6 remains draft");
            }

      - name: Enforce final gate verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import json,os,sys; result=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"phase6-workflow-result.json"))); sys.exit(0 if result["gatePassed"] else 2)'
