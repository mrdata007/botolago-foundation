name: Production AI content setup

# Copies the Anthropic key from this GitHub environment's secrets into the
# production Supabase project's Edge Function secrets, then deploys the
# `ai-content-generate` function. It does NOT apply the migration
# (20261003150000_ai_content_generation.sql -- that goes through the reviewed
# migration path) and does NOT switch the feature on
# (app_private.ai_content_configure stays a manual owner step), so after this
# runs nothing is published until the owner enables it.
#
# Guards mirror the other production workflows: dispatch from main by the
# owner only, an approved environment, one production mutation at a time, the
# exact reviewed commit, the fixed project ref, and no re-runs. The key is
# masked in logs and written only to a 0600 temp file.
#
# GitHub secret needed in environment `production-admin-activation`:
#   ANTHROPIC_API_KEY   (plus SUPABASE_ACCESS_TOKEN, already used elsewhere)

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit approved for this setup
        required: true
        type: string
      confirmation:
        description: Type RUN_PRODUCTION_AI_CONTENT_SETUP
        required: true
        type: string

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    name: Set ANTHROPIC_API_KEY and deploy ai-content-generate
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mrdata007'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-admin-activation
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      PROJECT_REF: tkewgajrljbwgwedqsxn
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Enforce immutable target
        shell: bash
        run: |
          set -euo pipefail
          for secret in "$SUPABASE_ACCESS_TOKEN" "$ANTHROPIC_API_KEY"; do
            if [[ -n "$secret" ]]; then printf '::add-mask::%s\n' "$secret"; fi
          done
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "SUPABASE_ACCESS_TOKEN is missing from the environment."
            exit 2
          fi
          if [[ -z "$ANTHROPIC_API_KEY" ]]; then
            echo "ANTHROPIC_API_KEY is missing from the production-admin-activation environment secrets."
            exit 2
          fi
          if [[ "${GITHUB_RUN_ATTEMPT:-}" != "1" ]]; then
            echo "GITHUB_WORKFLOW_RERUN_FORBIDDEN"
            exit 2
          fi
          if [[ "$CONFIRMATION" != "RUN_PRODUCTION_AI_CONTENT_SETUP" ||
                "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Immutable dispatch confirmation failed."
            exit 2
          fi

      - name: Check out the exact reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install reviewed runtime and run the function tests
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test supabase/functions/_shared/ai-content.test.ts
          test -x ./node_modules/.bin/supabase

      - name: Set the Anthropic secret in production
        shell: bash
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          chmod 0600 "$env_file"
          trap 'rm -f "$env_file"' EXIT
          printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" > "$env_file"
          ./node_modules/.bin/supabase secrets set --env-file "$env_file" --project-ref "$PROJECT_REF"
          # Names only, never values.
          ./node_modules/.bin/supabase secrets list --project-ref "$PROJECT_REF" | grep -c ANTHROPIC_API_KEY

      - name: Deploy ai-content-generate
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/supabase functions deploy ai-content-generate --project-ref "$PROJECT_REF" --no-verify-jwt
