name: G5 Production scheduled GNews ingestion

on:
  # BG-0073 News stand-down: the schedule is removed while News is hidden for
  # launch. api.news_ingest_provider_article no longer publishes anything, so a
  # stray run is harmless - but there is no reason to spend the GNews API quota
  # collecting content nobody can read.
  #
  # To restore scheduled ingestion, re-add below and set the repository variable
  # GNEWS_SCHEDULE_ENABLED to 'true' (the job's `if` still gates on it):
  #
  #   schedule:
  #     - cron: "23 */2 * * *"
  #
  # workflow_dispatch is deliberately left intact so the owner can still run a
  # bounded collection by hand.
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit approved for scheduled GNews ingestion
        required: true
        type: string
      confirmation:
        description: Type RUN_G5_SCHEDULED_GNEWS
        required: true
        type: string

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  ingest:
    name: Ingest bounded French and Arabic GNews excerpts
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      vars.GNEWS_COMMERCIAL_LICENSE_APPROVED == 'true' &&
      ((github.event_name == 'schedule' && vars.GNEWS_SCHEDULE_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && github.actor == 'mrdata007'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-admin-activation
    env:
      EXPECTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_commit || github.sha }}
      CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'RUN_G5_SCHEDULED_GNEWS' }}
      EXPECTED_PROJECT_REF: tkewgajrljbwgwedqsxn
      EXPECTED_PROJECT_NAME: BotolaGO Production V2
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      NEWS_INGESTION_TRIGGER_SECRET: ${{ secrets.NEWS_INGESTION_TRIGGER_SECRET }}
      SUPABASE_PRODUCTION_PROJECT_NAME: ${{ vars.SUPABASE_PRODUCTION_PROJECT_NAME }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
      GNEWS_COMMERCIAL_LICENSE_APPROVED: ${{ vars.GNEWS_COMMERCIAL_LICENSE_APPROVED }}
      GNEWS_SCHEDULE_ENABLED: ${{ vars.GNEWS_SCHEDULE_ENABLED }}

    steps:
      - name: Enforce licensed immutable production target
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          for value in "$SUPABASE_SECRET_KEY" "$NEWS_INGESTION_TRIGGER_SECRET"; do
            if [[ -n "$value" ]]; then printf '::add-mask::%s\n' "$value"; fi
          done
          if [[ -z "$SUPABASE_SECRET_KEY" || -z "$NEWS_INGESTION_TRIGGER_SECRET" ]]; then
            echo "Protected credential injection failed before ingestion."
            exit 2
          fi
          if [[ "${GITHUB_RUN_ATTEMPT:-}" != "1" ]]; then
            echo "GITHUB_WORKFLOW_RERUN_FORBIDDEN"
            exit 2
          fi
          if [[ "$CONFIRMATION" != "RUN_G5_SCHEDULED_GNEWS" ||
                "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Immutable schedule confirmation failed."
            exit 2
          fi
          if [[ "$GNEWS_COMMERCIAL_LICENSE_APPROVED" != "true" ]]; then
            echo "GNEWS_COMMERCIAL_LICENSE_NOT_APPROVED"
            exit 2
          fi
          if [[ "$GITHUB_EVENT_NAME" == "schedule" &&
                "$GNEWS_SCHEDULE_ENABLED" != "true" ]]; then
            echo "GNEWS_SCHEDULE_NOT_ENABLED"
            exit 2
          fi
          if [[ "$SUPABASE_PRODUCTION_PROJECT_REF" != "$EXPECTED_PROJECT_REF" ||
                "$SUPABASE_PRODUCTION_PROJECT_NAME" != "$EXPECTED_PROJECT_NAME" ||
                "${SUPABASE_PRODUCTION_URL%/}" != "https://${EXPECTED_PROJECT_REF}.supabase.co" ]]; then
            echo "Production project guard failed."
            exit 2
          fi
          runtime_dir="$RUNNER_TEMP/botolago-g5-gnews"
          evidence_dir="$runtime_dir/evidence"
          install -d -m 0700 "$runtime_dir" "$evidence_dir"
          {
            echo "G5_GNEWS_RUNTIME_DIR=$runtime_dir"
            echo "G5_GNEWS_EVIDENCE_DIR=$evidence_dir"
            echo "G5_GNEWS_RESPONSE=$evidence_dir/gnews-response.json"
          } >> "$GITHUB_ENV"
          G5_GNEWS_CONTEXT_PATH="$evidence_dir/g5-gnews-context.json" python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["G5_GNEWS_CONTEXT_PATH"])
          output.write_text(json.dumps({
              "schemaVersion": 1,
              "mode": "production_scheduled_gnews",
              "expectedCommit": os.environ["EXPECTED_COMMIT"],
              "projectRef": os.environ["EXPECTED_PROJECT_REF"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "eventName": os.environ["GITHUB_EVENT_NAME"],
          }, indent=2) + "\n", encoding="utf-8")
          output.chmod(0o600)
          PY
          echo "evidence_dir=$evidence_dir" >> "$GITHUB_OUTPUT"

      - name: Check out exact reviewed main commit
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify the reviewed ingestion and evidence contracts
        id: quality
        shell: bash
        run: |
          set -euo pipefail
          bun test \
            scripts/backend/g5-gnews-schedule-evidence.test.ts \
            supabase/functions/_shared/gnews.test.ts
          bun run backend:secrets:check

      - name: Invoke bounded GNews ingestion
        id: invoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base="https://${EXPECTED_PROJECT_REF}.supabase.co/functions/v1"
          set +e
          status=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 45 \
            --output "$G5_GNEWS_RESPONSE" --write-out '%{http_code}' \
            --request POST "$base/news-ingest" \
            --header 'content-type: application/json' \
            --header "apikey: $SUPABASE_SECRET_KEY" \
            --header "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            --header "x-botolago-ingestion-key: $NEWS_INGESTION_TRIGGER_SECRET" \
            --data '{"job":"gnews"}')
          curl_exit=$?
          set -e
          if [[ -z "$status" ]]; then status="000"; fi
          if [[ ! -s "$G5_GNEWS_RESPONSE" ]]; then
            printf '{"responseUnavailable":true}\n' > "$G5_GNEWS_RESPONSE"
          fi
          chmod 0600 "$G5_GNEWS_RESPONSE"
          {
            echo "http_status=$status"
            echo "curl_exit=$curl_exit"
          } >> "$GITHUB_OUTPUT"
          exit "$curl_exit"

      - name: Validate exact GNews reconciliation
        id: evidence
        if: always() && steps.runtime.outcome == 'success' && steps.checkout.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          G5_GNEWS_STATUS: ${{ steps.invoke.outputs.http_status }}
          G5_GNEWS_CURL_EXIT: ${{ steps.invoke.outputs.curl_exit }}
        run: |
          set -euo pipefail
          bun scripts/backend/g5-gnews-schedule-evidence.ts

      - name: Verify evidence contains no credentials
        id: evidence_scan
        if: always() && steps.runtime.outcome == 'success' && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/backend/phase7f-scan-sanitized-evidence.py "$G5_GNEWS_EVIDENCE_DIR"
          for value in "$SUPABASE_SECRET_KEY" "$NEWS_INGESTION_TRIGGER_SECRET"; do
            if [[ -n "$value" ]] && grep -R -F -q -- "$value" "$G5_GNEWS_EVIDENCE_DIR"; then
              echo "CREDENTIAL_FOUND_IN_G5_GNEWS_EVIDENCE"
              exit 1
            fi
          done

      - name: Upload sanitized schedule evidence
        id: evidence_upload
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g5-scheduled-gnews-${{ github.run_id }}
          path: ${{ steps.runtime.outputs.evidence_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove protected runtime files
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${G5_GNEWS_RUNTIME_DIR:-}" && -d "$G5_GNEWS_RUNTIME_DIR" ]]; then
            find "$G5_GNEWS_RUNTIME_DIR" -type f -exec chmod 0600 {} \;
            find "$G5_GNEWS_RUNTIME_DIR" -type f -delete
            rmdir "$G5_GNEWS_EVIDENCE_DIR" 2>/dev/null || true
            rmdir "$G5_GNEWS_RUNTIME_DIR" 2>/dev/null || true
          fi

      - name: Finalize scheduled GNews verdict
        if: always()
        shell: bash
        env:
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          INVOKE_OUTCOME: ${{ steps.invoke.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          SCAN_OUTCOME: ${{ steps.evidence_scan.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          if [[ "$QUALITY_OUTCOME" != "success" || "$INVOKE_OUTCOME" != "success" ||
                "$EVIDENCE_OUTCOME" != "success" || "$SCAN_OUTCOME" != "success" ||
                "$UPLOAD_OUTCOME" != "success" || "$CLEANUP_OUTCOME" != "success" ]]; then
            echo "G5_SCHEDULED_GNEWS_FAILED"
            exit 1
          fi
          echo "G5_SCHEDULED_GNEWS_PASS"

      - name: Publish sanitized schedule status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          INVOKE_OUTCOME: ${{ steps.invoke.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          SCAN_OUTCOME: ${{ steps.evidence_scan.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$GITHUB_TOKEN"
          state="failure"
          description="Scheduled GNews ingestion failed"
          if [[ "$QUALITY_OUTCOME" == "success" && "$INVOKE_OUTCOME" == "success" &&
                "$EVIDENCE_OUTCOME" == "success" &&
                "$SCAN_OUTCOME" == "success" && "$UPLOAD_OUTCOME" == "success" &&
                "$CLEANUP_OUTCOME" == "success" ]]; then
            state="success"
            description="Scheduled GNews ingestion passed"
          fi
          payload=$(printf \
            '{"state":"%s","target_url":"https://github.com/%s/actions/runs/%s","description":"%s","context":"botolago/g5-scheduled-gnews"}' \
            "$state" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$description")
          curl --silent --show-error --fail --output /dev/null \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload"
