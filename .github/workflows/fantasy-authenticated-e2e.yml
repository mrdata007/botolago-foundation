name: Fantasy authenticated E2E

# Runs the credentialed Fantasy journey suite (tests/e2e/fantasy.journey.e2e.ts)
# against a real Supabase-backed environment, using a synthetic manager account
# held in the `fantasy-e2e` GitHub Environment.
#
# The suite is write-heavy (saves a squad, sets a captain, confirms a transfer
# and creates a league on every run), so it is never triggered by pull_request
# or push:
#   * the nightly schedule targets staging only, and only while the repository
#     variable FANTASY_E2E_ENABLED is 'true';
#   * production is reachable exclusively through an owner dispatch carrying the
#     typed confirmation.
# Without the credentials the suite self-skips, so the presence guard below
# fails the run rather than letting it report a green no-op.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to exercise
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      confirmation:
        description: Type RUN_FANTASY_E2E
        required: true
        type: string
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: fantasy-authenticated-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fantasy-authenticated-e2e:
    # The nightly arm needs the repository variable; an owner dispatch with the
    # typed confirmation is its own authorization.
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      ((github.event_name == 'schedule' && vars.FANTASY_E2E_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RUN_FANTASY_E2E'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: fantasy-e2e
    env:
      FANTASY_E2E_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
      E2E_FANTASY_EMAIL: ${{ secrets.E2E_FANTASY_EMAIL }}
      E2E_FANTASY_PASSWORD: ${{ secrets.E2E_FANTASY_PASSWORD }}
      VITE_AUTH_MODE: supabase
      VITE_FANTASY_DATA_MODE: supabase
      VITE_FOOTBALL_DATA_MODE: supabase
      VITE_NEWS_DATA_MODE: supabase
      VITE_NOTIFICATIONS_DATA_MODE: supabase
      VITE_SUPABASE_URL: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'production') && vars.SUPABASE_PRODUCTION_URL || vars.SUPABASE_STAGING_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'production') && secrets.SUPABASE_PRODUCTION_PUBLISHABLE_KEY || secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Mask protected values
        shell: bash
        run: |
          printf '::add-mask::%s\n' "$E2E_FANTASY_PASSWORD"
          printf '::add-mask::%s\n' "$VITE_SUPABASE_PUBLISHABLE_KEY"
      - name: Guard target resolution
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            test "$FANTASY_E2E_TARGET" = "staging"
          else
            test "$FANTASY_E2E_TARGET" = "staging" || test "$FANTASY_E2E_TARGET" = "production"
          fi
          echo "Resolved Fantasy E2E target: $FANTASY_E2E_TARGET"
      - name: Guard credential presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$E2E_FANTASY_EMAIL"
          test -n "$E2E_FANTASY_PASSWORD"
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
      - run: bun install --frozen-lockfile
      - name: Config integrity guard
        run: bun scripts/backend/check-config-integrity.mjs
      - run: bunx playwright install --with-deps chromium
      - name: Run authenticated Fantasy journeys
        run: bun run test:e2e:fantasy
      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fantasy-authenticated-e2e-${{ github.run_id }}
          path: |
            playwright-report
            test-results/playwright/**/*.png
            test-results/playwright/**/sanitized-browser-diagnostics*
          if-no-files-found: ignore
          retention-days: 7
