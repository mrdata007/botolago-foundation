name: Gate 2E SportsMonks current-season readiness probe

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - "docs/production/gate2e-current-season-readiness-trigger.json"
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit approved for the read-only provider probe
        required: true
        type: string
      confirmation:
        description: Type RUN_GATE2E_CURRENT_SEASON_READINESS
        required: true
        type: string

concurrency:
  group: botolago-gate2e-current-season-readiness
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    name: Verify current Botola season provider readiness
    if: >-
      always() &&
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mrdata007' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      current_season_ready: ${{ steps.readiness.outputs.ready }}
    environment: production-football-ingestion
    env:
      CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'RUN_GATE2E_CURRENT_SEASON_READINESS' }}
      EXPECTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_commit || github.sha }}

    steps:
      - name: Initialize protected read-only runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_RUN_ATTEMPT:-}" != "1" ]]; then
            echo "GITHUB_WORKFLOW_RERUN_FORBIDDEN"
            exit 2
          fi
          if [[ "$CONFIRMATION" != "RUN_GATE2E_CURRENT_SEASON_READINESS" ]]; then
            echo "Invalid manual confirmation."
            exit 2
          fi
          if [[ "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "The dispatched commit is not the reviewed main commit."
            exit 2
          fi
          evidence_dir="$RUNNER_TEMP/botolago-gate2e/evidence"
          install -d -m 0700 "$evidence_dir"
          echo "GATE2E_EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          echo "GATE2B_EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          echo "Read-only target guard: PASS"

      - name: Check out the exact reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify the reviewed one-time activation ticket
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "schemaVersion": 1,
              "requestId": "gate2e-current-season-readiness-2026-08-02-01",
              "mode": "read_only_current_season_readiness_probe",
              "leagueId": 860,
              "confirmation": "RUN_GATE2E_CURRENT_SEASON_READINESS",
          }
          path = Path("docs/production/gate2e-current-season-readiness-trigger.json")
          if json.loads(path.read_text(encoding="utf-8")) != expected:
              raise SystemExit("INVALID_GATE2B_ACTIVATION_TICKET")
          print("Reviewed activation ticket: PASS")
          PY

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate the no-write probe harness
        shell: bash
        run: |
          set -euo pipefail
          bun test \
            scripts/backend/sportsmonks-production-probe.test.ts \
            scripts/backend/gate2e-current-season-readiness.test.ts

      - name: Run the protected SportsMonks probe
        id: provider_probe
        shell: bash
        env:
          SPORTSMONKS_API_TOKEN: ${{ secrets.SPORTSMONKS_API_TOKEN }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$SPORTSMONKS_API_TOKEN"
          bun scripts/backend/sportsmonks-production-probe.ts

      - name: Classify current-season readiness
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/backend/gate2e-current-season-readiness.ts

      - name: Verify evidence contains no credential patterns
        id: evidence_scan
        if: always()
        shell: bash
        env:
          SPORTSMONKS_API_TOKEN: ${{ secrets.SPORTSMONKS_API_TOKEN }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$SPORTSMONKS_API_TOKEN"
          python scripts/backend/phase7f-scan-sanitized-evidence.py "$GATE2E_EVIDENCE_DIR"
          if grep -R -F -q -- "$SPORTSMONKS_API_TOKEN" "$GATE2E_EVIDENCE_DIR"; then
            echo "SPORTSMONKS_CREDENTIAL_FOUND_IN_EVIDENCE"
            exit 1
          fi
          echo "SportsMonks credential scan: PASS"

      - name: Upload sanitized provider evidence
        id: evidence_upload
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate2e-current-season-readiness-${{ github.run_id }}
          path: ${{ env.GATE2E_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Finalize probe verdict
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.provider_probe.outcome }}
          SCAN_OUTCOME: ${{ steps.evidence_scan.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
          READINESS_OUTCOME: ${{ steps.readiness.outcome }}
        run: |
          set -euo pipefail
          if [[ "$PROBE_OUTCOME" != "success" ||
                "$SCAN_OUTCOME" != "success" ||
                "$UPLOAD_OUTCOME" != "success" ||
                "$READINESS_OUTCOME" != "success" ]]; then
            echo "GATE2E_CURRENT_SEASON_READINESS_FAILED"
            exit 1
          fi
          echo "GATE2E_CURRENT_SEASON_READINESS_PASS"

      - name: Publish sanitized probe status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROBE_OUTCOME: ${{ steps.provider_probe.outcome }}
          SCAN_OUTCOME: ${{ steps.evidence_scan.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
          READINESS_OUTCOME: ${{ steps.readiness.outcome }}
          CURRENT_SEASON_READY: ${{ steps.readiness.outputs.ready }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$GITHUB_TOKEN"
          state="failure"
          description="Protected current-season SportsMonks probe failed"
          if [[ "$PROBE_OUTCOME" == "success" &&
                "$SCAN_OUTCOME" == "success" &&
                "$UPLOAD_OUTCOME" == "success" &&
                "$READINESS_OUTCOME" == "success" ]]; then
            state="success"
            if [[ "$CURRENT_SEASON_READY" == "true" ]]; then
              description="Probe healthy; current Botola season is published"
            else
              description="Probe healthy; current Botola season is not published"
            fi
          fi
          payload=$(printf \
            '{"state":"%s","target_url":"https://github.com/%s/actions/runs/%s","description":"%s","context":"botolago/gate2e-current-season-readiness"}' \
            "$state" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$description")
          curl --silent --show-error --fail --output /dev/null \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload"

  launch-readiness:
    name: Publish current-season launch readiness
    needs: probe
    if: >-
      always() &&
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Publish launch-readiness status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROBE_RESULT: ${{ needs.probe.result }}
          CURRENT_SEASON_READY: ${{ needs.probe.outputs.current_season_ready }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$GITHUB_TOKEN"

          state="failure"
          description="Current-season provider probe failed"
          if [[ "$PROBE_RESULT" == "success" ]]; then
            if [[ "$CURRENT_SEASON_READY" == "true" ]]; then
              state="success"
              description="Current Botola season is launch-ready"
            else
              description="Current Botola season is not launch-ready"
            fi
          fi

          payload=$(printf \
            '{"state":"%s","target_url":"https://github.com/%s/actions/runs/%s","description":"%s","context":"botolago/launch-current-season-ready"}' \
            "$state" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$description")

          curl --silent --show-error --fail --output /dev/null \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload"

      - name: Require a healthy provider probe
        if: always()
        shell: bash
        env:
          PROBE_RESULT: ${{ needs.probe.result }}
        run: |
          set -euo pipefail
          if [[ "$PROBE_RESULT" != "success" ]]; then
            echo "CURRENT_SEASON_PROBE_FAILED"
            exit 1
          fi
          echo "CURRENT_SEASON_PROBE_HEALTHY"
