name: BotolaGO guarded production resume

on:
  push:
    branches: [fix/release-readiness-2026-09-11]
    paths: [.github/workflows/release-production-resume.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: botolago-production-resume
  cancel-in-progress: false

jobs:
  resume:
    if: github.repository == 'mrdata007/botolago-foundation' && github.ref == 'refs/heads/fix/release-readiness-2026-09-11'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-admin-activation
    steps:
      - name: Verify exact project and resume only when inactive
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          REF = "tkewgajrljbwgwedqsxn"
          ORG = "bfhahpanhnoueripxshw"
          API = "https://api.supabase.com"
          token = os.environ.get("SUPABASE_ACCESS_TOKEN", "").strip()
          if not token or any(c in token for c in "\r\n"):
              sys.exit("BLOCKED: protected management credential is missing or invalid.")
          print("::add-mask::" + token)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def request(path, method="GET"):
              if not path.startswith("/v1/projects/" + REF):
                  raise RuntimeError("Target path guard failed")
              req = urllib.request.Request(
                  API + path,
                  data=b"{}" if method == "POST" else None,
                  method=method,
                  headers={"Authorization": "Bearer " + token,
                           "Content-Type": "application/json"},
              )
              try:
                  with opener.open(req, timeout=20) as response:
                      raw = response.read(131073)
                      if len(raw) > 131072:
                          raise RuntimeError("Unexpected response size")
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  raise RuntimeError("Management request rejected: HTTP " + str(exc.code)) from None
              except urllib.error.URLError:
                  raise RuntimeError("Management network request failed") from None

          def project_status():
              project = request("/v1/projects/" + REF)
              if not isinstance(project, dict):
                  raise RuntimeError("Unexpected project response")
              if (project.get("ref", project.get("id")) != REF
                  or project.get("organization_id") != ORG
                  or project.get("name") != "BotolaGO Production V2"
                  or project.get("region") != "eu-west-3"):
                  raise RuntimeError("Project identity guard failed; no change made")
              status = project.get("status")
              if status not in {"ACTIVE_HEALTHY", "INACTIVE", "COMING_UP", "RESTORING", "ACTIVE_UNHEALTHY", "INIT_FAILED", "RESTORE_FAILED"}:
                  raise RuntimeError("Unexpected project state; no change made")
              print(json.dumps({"checked_at": datetime.now(timezone.utc).isoformat(),
                                "project_ref": REF, "status": status}))
              return status

          try:
              status = project_status()
              if status == "ACTIVE_HEALTHY":
                  print("PASS: production is already healthy; no resume requested.")
                  sys.exit(0)
              if status != "INACTIVE":
                  sys.exit("BLOCKED: project is not inactive; no resume requested.")
              request("/v1/projects/" + REF + "/restore", method="POST")
              print("Resume accepted for the verified project. No backup rollback, schema changes, or data writes requested.")
              for _ in range(18):
                  time.sleep(5)
                  status = project_status()
                  if status == "ACTIVE_HEALTHY":
                      print("PASS: production project reports ACTIVE_HEALTHY; application acceptance remains required.")
                      sys.exit(0)
                  if status in {"INIT_FAILED", "RESTORE_FAILED"}:
                      sys.exit("BLOCKED: project restoration reported a failure.")
              sys.exit("NOT VERIFIED: resume requested, but healthy status was not observed within this bounded check.")
          except RuntimeError as exc:
              sys.exit("BLOCKED: " + str(exc))
          PY
