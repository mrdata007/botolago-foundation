name: Backend quality

on:
  # Branch protection requires both quality jobs for every pull request.
  pull_request:
  push:
    branches:
      - backend/greenfield-foundation
      - backend/identity-domain
      - backend/football-domain
      - backend/news-domain
      - backend/notifications-domain

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run backend:migrations:check
      - run: bun run backend:secrets:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - run: bun run build
      - name: Build isolated mock-data demo artifact
        run: bun run build:demo
      - run: bunx playwright install --with-deps chromium
      - name: Run anonymous and Atlas browser acceptance
        env:
          E2E_USE_BUILT_PREVIEW: "1"
          VITE_APP_MODE: demo
          VITE_AUTH_MODE: mock
          VITE_FOOTBALL_DATA_MODE: mock
          VITE_NEWS_DATA_MODE: mock
          VITE_NOTIFICATIONS_DATA_MODE: mock
          VITE_FANTASY_DATA_MODE: mock
          VITE_SUPABASE_PROJECT_ID: demo
          VITE_SUPABASE_URL: https://demo.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: demo-public-placeholder
        run: |
          bunx playwright test \
            tests/e2e/anonymous.acceptance.e2e.ts \
            tests/e2e/atlas-matchday.e2e.ts \
            tests/e2e/demo-mode.e2e.ts
      - name: Upload sanitized browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: application-browser-evidence-${{ github.run_id }}
          path: |
            playwright-report
            test-results/playwright
          if-no-files-found: ignore
          retention-days: 3

  database-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run backend:db:start
      - run: bun run backend:db:reset
      - run: bun run backend:db:test
      - run: bun run backend:db:lint
      - name: Verify generated database types
        id: generated_types
        continue-on-error: true
        run: bun run backend:types:check
      - name: Regenerate stale database types for recovery
        if: steps.generated_types.outcome == 'failure'
        run: bun run backend:types:generate
      - name: Upload authoritative generated database types
        if: steps.generated_types.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-database-types-${{ github.run_id }}
          path: src/backend/generated/database.types.ts
          if-no-files-found: error
          retention-days: 1
      - name: Fail on generated database type drift
        if: steps.generated_types.outcome == 'failure'
        run: exit 1
      - name: Stop local Supabase
        if: always()
        run: ./node_modules/.bin/supabase stop --no-backup
