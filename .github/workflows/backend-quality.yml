name: Backend quality

on:
  pull_request:
    paths:
      - ".github/workflows/backend-quality.yml"
      - ".github/workflows/gate2b-sportsmonks-production-probe.yml"
      - ".github/workflows/gate2c-production-historical-catalog-canary.yml"
      - ".github/workflows/gate2d-production-historical-fixture-canary.yml"
      - ".github/workflows/gate2e-sportsmonks-current-season-readiness.yml"
      - ".github/workflows/gate3a-sportsmonks-historical-content-coverage.yml"
      - ".github/workflows/gate3b-production-historical-content-canary.yml"
      - ".github/workflows/gate4-production-news-ratings-canary.yml"
      - ".github/workflows/g5-sportsmonks-historical-backfill-discovery.yml"
      - "docs/production/gate2b-sportsmonks-production-probe-trigger.json"
      - "docs/production/gate2c-historical-catalog-canary-trigger.json"
      - "docs/production/gate2d-historical-fixture-canary-trigger.json"
      - "docs/production/gate2e-current-season-readiness-trigger.json"
      - "docs/production/gate3a-historical-content-coverage-trigger.json"
      - "docs/production/gate3b-historical-content-canary-trigger.json"
      - "docs/production/activation-gate-02-sportsmonks.md"
      - "docs/backend/**"
      - "scripts/backend/**"
      - "src/backend/**"
      - "supabase/**"
      - ".env.example"
      - "package.json"
      - "bun.lock"
  push:
    branches:
      - backend/greenfield-foundation
      - backend/identity-domain
      - backend/football-domain
      - backend/news-domain
      - backend/notifications-domain

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run backend:migrations:check
      - run: bun run backend:secrets:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - run: bun run build

  database-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run backend:db:start
      - run: bun run backend:db:reset
      - run: bun run backend:db:test
      - run: bun run backend:db:lint
      - name: Verify generated database types
        id: generated_types
        continue-on-error: true
        run: bun run backend:types:check
      - name: Regenerate stale database types for recovery
        if: steps.generated_types.outcome == 'failure'
        run: bun run backend:types:generate
      - name: Upload authoritative generated database types
        if: steps.generated_types.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-database-types-${{ github.run_id }}
          path: src/backend/generated/database.types.ts
          if-no-files-found: error
          retention-days: 1
      - name: Fail on generated database type drift
        if: steps.generated_types.outcome == 'failure'
        run: exit 1
      - name: Stop local Supabase
        if: always()
        run: ./node_modules/.bin/supabase stop --no-backup
