name: Backend quality

on:
  # Branch protection requires both quality jobs for every pull request.
  pull_request:
  push:
    branches:
      - backend/greenfield-foundation
      - backend/identity-domain
      - backend/football-domain
      - backend/news-domain
      - backend/notifications-domain

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Runs before `bun install` so an injected configuration payload cannot be
      # evaluated by the install hooks, the test run, ESLint or the build.
      - name: Config integrity guard
        run: node scripts/backend/check-config-integrity.mjs
      - run: bun install --frozen-lockfile
      - run: bun run backend:migrations:check
      - run: bun run backend:secrets:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      # The operational scripts' own tests (capacity harness, production
      # promoter and activation guards). Pure unit tests: no secret, no
      # network, nothing written; the same pinned requirements and Python the
      # workflows that run those scripts use.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Python operational tests
        run: |
          python -m pip install --requirement scripts/backend/fantasy-capacity-requirements.txt
          python -m unittest discover -s scripts/backend/tests
      # The production bundle is built here as a smoke test, not published, so
      # the legal placeholder guard is exempted by name. A real publish does not
      # set this and will refuse while any bracketed blank remains.
      - run: bun run build
        env:
          LEGAL_GATE_ALLOW_PLACEHOLDERS: "1"
      - run: bunx playwright install --with-deps chromium
      # Against the development server and the mock data it serves without a
      # `.env`: no secret, no shared backend. Each passed three runs in a row
      # before joining this gate; the signed-in staging suites stay on their
      # own protected workflows.
      - name: Browser suites on the development server
        run: >-
          bunx playwright test
          tests/e2e/anonymous.acceptance.e2e.ts
          tests/e2e/dark-mode-flag.e2e.ts
          tests/e2e/legal-brackets.e2e.ts
          tests/e2e/news-hero-fallback.e2e.ts
          tests/e2e/pronostics.e2e.ts
      # The same pages from the production bundle: the Worker module in
      # `.output` with the ASSETS binding Cloudflare gives it, run under Bun
      # rather than workerd (tests/e2e/built-output-serve.ts says what that
      # leaves out). Built in its own mode against a local stub backend
      # (tests/e2e/built-output-env.ts), so it never reads `.env.production`
      # and cannot reach the production project; the server refuses a bundle
      # that names it.
      - name: Build the production bundle against the stub backend
        run: bun tests/e2e/built-output-build.ts
      - name: Production bundle smoke test
        run: bunx playwright test tests/e2e/built-output.smoke.e2e.ts
        env:
          E2E_BUILT_OUTPUT: "1"
      - name: Upload sanitized browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence-${{ github.run_id }}
          path: |
            playwright-report
            test-results/playwright
          if-no-files-found: ignore
          retention-days: 3

  database-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Runs before `bun install` so an injected configuration payload cannot be
      # evaluated by the install hooks or any later database step.
      - name: Config integrity guard
        run: node scripts/backend/check-config-integrity.mjs
      - run: bun install --frozen-lockfile
      - run: bun run backend:db:start
      - run: bun run backend:db:reset
      - name: Historical performance TS-to-SQL wire-format check
        run: bun test scripts/backend/historical-performance-e2e-wire-format.test.ts
      - run: bun run backend:db:test
      - run: bun run backend:db:lint
      - name: Verify generated database types
        id: generated_types
        continue-on-error: true
        run: bun run backend:types:check
      - name: Regenerate stale database types for recovery
        if: steps.generated_types.outcome == 'failure'
        run: bun run backend:types:generate
      - name: Upload authoritative generated database types
        if: steps.generated_types.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-database-types-${{ github.run_id }}
          path: src/backend/generated/database.types.ts
          if-no-files-found: error
          retention-days: 1
      - name: Fail on generated database type drift
        if: steps.generated_types.outcome == 'failure'
        run: exit 1
      - name: Stop local Supabase
        if: always()
        run: ./node_modules/.bin/supabase stop --no-backup
