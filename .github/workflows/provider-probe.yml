name: Provider probe (Sofascore / Flashscore, read-only)

# Manual only. Phase 0 of docs/backend/FANTASY_SOFASCORE_FLASHSCORE_PLAN.md.
# No database access. Prints the SHAPE of each response (field names and
# types, never values): logs and artifacts of a public repository are public
# and the provider payloads are third-party data. Every path is one RapidAPI
# request against a monthly quota, so the list is capped.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to call
        type: choice
        options: [sofascore, flashscore]
        required: true
      paths:
        description: One path-and-query per line (max 10), e.g. matches/detail?matchId=16958239
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: provider-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging-load-test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Probe
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FLASHSCORE_RAPIDAPI_HOST: ${{ vars.FLASHSCORE_RAPIDAPI_HOST }}
          PROVIDER: ${{ inputs.provider }}
          PATHS: ${{ inputs.paths }}
        run: |
          set -eu
          count=$(printf '%s\n' "$PATHS" | grep -c . || true)
          if [ "$count" -gt 10 ]; then echo "Max 10 paths per run"; exit 1; fi
          # shellcheck disable=SC2086
          printf '%s\n' "$PATHS" | grep . | tr '\n' '\0' | xargs -0 bun scripts/backend/provider-probe.ts "$PROVIDER" --shape
