name: SofaScore recovery diagnostic (four read-only requests)

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit approved for this read-only diagnostic
        required: true
        type: string

concurrency:
  group: sofascore-recovery-diagnostic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mrdata007' && github.triggering_actor == 'mrdata007' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-admin-activation
    steps:
      - name: Guard exact owner-dispatched commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ && "$EXPECTED_COMMIT" == "$GITHUB_SHA" ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Capture public football payloads without database access
        shell: bash
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${RAPIDAPI_KEY:-}" ]]
          printf '::add-mask::%s\n' "$RAPIDAPI_KEY"
          bun scripts/backend/sofascore-recovery-diagnostic.ts --out "$RUNNER_TEMP/sofascore-recovery-diagnostic.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sofascore-recovery-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/sofascore-recovery-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
