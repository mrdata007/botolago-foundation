name: ElBotola news recovery and refresh

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      confirmation:
        description: Type RUN_ELBOTOLA_RECOVERY
        required: true
        type: string
      mode:
        description: Verify a manual canary, or refresh the approved integration
        required: true
        default: canary
        type: choice
        options:
          - canary
          - refresh
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  recover:
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && github.actor == 'mrdata007') ||
       (github.event_name == 'schedule' && vars.ELBOTOLA_SCHEDULE_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-admin-activation
    env:
      EXPECTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_commit || github.sha }}
      CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'RUN_ELBOTOLA_RECOVERY' }}
      ELBOTOLA_RECOVERY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'refresh' }}
      ELBOTOLA_SCHEDULE_ENABLED: ${{ vars.ELBOTOLA_SCHEDULE_ENABLED }}
      ELBOTOLA_CANARY_VERIFIED_RUN_ID: ${{ vars.ELBOTOLA_CANARY_VERIFIED_RUN_ID }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_PRODUCTION_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PRODUCTION_PUBLISHABLE_KEY }}
      SUPABASE_PRODUCTION_PROJECT_NAME: ${{ vars.SUPABASE_PRODUCTION_PROJECT_NAME }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Initialize temporary runtime path
        shell: bash
        run: |
          set -euo pipefail
          echo "ELBOTOLA_RECOVERY_DIR=$RUNNER_TEMP/botolago-elbotola-recovery" >> "$GITHUB_ENV"

      - name: Check out reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify ingestion and recovery guards
        id: quality
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test scripts/backend/elbotola-recovery.test.ts supabase/functions/_shared/elbotola.test.ts
          bun run backend:secrets:check

      - name: Run bounded ElBotola ingestion and verify Arabic feed
        id: ingest
        run: bun scripts/backend/elbotola-recovery.ts

      - name: Confirm manual ElBotola canary completed
        if: env.ELBOTOLA_RECOVERY_MODE == 'canary'
        run: echo "ELBOTOLA_MANUAL_CANARY_PASS"

      - name: Scan sanitized evidence
        if: always() && steps.quality.outcome == 'success'
        id: scan
        run: python scripts/backend/phase7f-scan-sanitized-evidence.py "$ELBOTOLA_RECOVERY_DIR/evidence"

      - name: Upload sanitized recovery evidence
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elbotola-recovery-${{ github.run_id }}
          path: ${{ env.ELBOTOLA_RECOVERY_DIR }}/evidence
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary runtime files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$ELBOTOLA_RECOVERY_DIR" ]]; then
            rm -rf -- "$ELBOTOLA_RECOVERY_DIR"
          fi
