name: ElBotola news recovery and refresh (RETIRED)

# RETIRED — superseded by `.github/workflows/news-engine.yml`.
#
# This workflow ran the link-metadata adapter: it collected ElBotola headlines
# and published them as link stubs under ElBotola's own byline. The news engine
# replaces that entirely — it extracts facts and composes original BotolaGO
# articles, and it owns the ElBotola source from now on.
#
# Its schedule has been removed, so it no longer runs on a timer. BG-0073 took
# it off the timer first, for the News stand-down; this retires it for good, so
# the restore note that removal left behind is gone rather than stale. The
# manual trigger is kept only as a break-glass path while the engine proves
# itself in production, and `vars.ELBOTOLA_SCHEDULE_ENABLED` no longer has any
# effect: the job's `if` no longer reads it, and the one runtime guard that
# still names it sits behind `GITHUB_EVENT_NAME == "schedule"`, which this
# workflow can no longer produce.
#
# Deleting this file is the last step of
# `docs/production/NEWS_ENGINE_GO_LIVE.md`, after the engine has completed a
# clean production pass.
#
# Do not run this and the news engine against ElBotola at the same time. Both
# write `app_private.news_source_articles` rows keyed on the same publisher and
# external id, and the stub path would overwrite an engine article's mapping.

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      confirmation:
        description: Type RUN_ELBOTOLA_RECOVERY
        required: true
        type: string
      mode:
        description: Verify a manual canary, or refresh the approved integration
        required: true
        default: canary
        type: choice
        options:
          - canary
          - refresh

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  recover:
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'mrdata007'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-admin-activation
    env:
      EXPECTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_commit || github.sha }}
      CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'RUN_ELBOTOLA_RECOVERY' }}
      ELBOTOLA_RECOVERY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'refresh' }}
      ELBOTOLA_SCHEDULE_ENABLED: ${{ vars.ELBOTOLA_SCHEDULE_ENABLED }}
      ELBOTOLA_CANARY_VERIFIED_RUN_ID: ${{ vars.ELBOTOLA_CANARY_VERIFIED_RUN_ID }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_PRODUCTION_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PRODUCTION_PUBLISHABLE_KEY }}
      SUPABASE_PRODUCTION_PROJECT_NAME: ${{ vars.SUPABASE_PRODUCTION_PROJECT_NAME }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Initialize temporary runtime path
        shell: bash
        run: |
          set -euo pipefail
          echo "ELBOTOLA_RECOVERY_DIR=$RUNNER_TEMP/botolago-elbotola-recovery" >> "$GITHUB_ENV"

      - name: Check out reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify ingestion and recovery guards
        id: quality
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test scripts/backend/elbotola-recovery.test.ts supabase/functions/_shared/elbotola.test.ts
          bun run backend:secrets:check

      - name: Run bounded ElBotola ingestion and verify Arabic feed
        id: ingest
        run: bun scripts/backend/elbotola-recovery.ts

      - name: Confirm manual ElBotola canary completed
        if: env.ELBOTOLA_RECOVERY_MODE == 'canary'
        run: echo "ELBOTOLA_MANUAL_CANARY_PASS"

      - name: Scan sanitized evidence
        if: always() && steps.quality.outcome == 'success'
        id: scan
        run: python scripts/backend/phase7f-scan-sanitized-evidence.py "$ELBOTOLA_RECOVERY_DIR/evidence"

      - name: Upload sanitized recovery evidence
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elbotola-recovery-${{ github.run_id }}
          path: ${{ env.ELBOTOLA_RECOVERY_DIR }}/evidence
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary runtime files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$ELBOTOLA_RECOVERY_DIR" ]]; then
            rm -rf -- "$ELBOTOLA_RECOVERY_DIR"
          fi
