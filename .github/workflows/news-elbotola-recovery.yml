name: ElBotola news recovery and refresh

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      confirmation:
        description: Type RUN_ELBOTOLA_RECOVERY
        required: true
        type: string
      mode:
        description: Deploy and verify a canary, or refresh the existing integration
        required: true
        default: canary
        type: choice
        options:
          - canary
          - refresh
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  recover:
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && github.actor == 'mrdata007') ||
       (github.event_name == 'schedule' && vars.ELBOTOLA_SCHEDULE_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-admin-activation
    env:
      EXPECTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_commit || github.sha }}
      CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'RUN_ELBOTOLA_RECOVERY' }}
      ELBOTOLA_RECOVERY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'refresh' }}
      ELBOTOLA_SCHEDULE_ENABLED: ${{ vars.ELBOTOLA_SCHEDULE_ENABLED }}
      ELBOTOLA_CANARY_VERIFIED_RUN_ID: ${{ vars.ELBOTOLA_CANARY_VERIFIED_RUN_ID }}
      ELBOTOLA_CANARY_VERIFIED_FUNCTION_VERSION: ${{ vars.ELBOTOLA_CANARY_VERIFIED_FUNCTION_VERSION }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_PRODUCTION_PROJECT_NAME: ${{ vars.SUPABASE_PRODUCTION_PROJECT_NAME }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Initialize temporary runtime path
        shell: bash
        run: |
          set -euo pipefail
          echo "ELBOTOLA_RECOVERY_DIR=$RUNNER_TEMP/botolago-elbotola-recovery" >> "$GITHUB_ENV"

      - name: Check out reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify ingestion and recovery guards
        id: quality
        shell: bash
        run: |
          set -euo pipefail
          python scripts/backend/elbotola-recovery.test.py
          bun test supabase/functions/_shared/elbotola.test.ts
          bun run backend:secrets:check

      - name: Check target, permission scope and database prerequisites
        id: preflight
        run: python scripts/backend/elbotola-recovery.py preflight

      - name: Configure isolated ElBotola runtime
        if: env.ELBOTOLA_RECOVERY_MODE == 'canary'
        id: configure
        run: python scripts/backend/elbotola-recovery.py configure

      - name: Deploy only reviewed ElBotola function
        if: env.ELBOTOLA_RECOVERY_MODE == 'canary'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          bunx supabase@2.109.1 functions deploy --help > /dev/null
          if ! bunx supabase@2.109.1 functions deploy news-ingest-elbotola \
            --project-ref tkewgajrljbwgwedqsxn --use-api \
            > "$ELBOTOLA_RECOVERY_DIR/deploy.private.log" 2>&1; then
            echo "ELBOTOLA_DEPLOY_FAILED"
            exit 1
          fi

      - name: Activate publisher and verify bounded ingestion
        id: ingest
        run: python scripts/backend/elbotola-recovery.py ingest

      - name: Restore inactive publisher after a failed first canary
        if: failure() && steps.preflight.outcome == 'success' && env.ELBOTOLA_RECOVERY_MODE == 'canary'
        run: python scripts/backend/elbotola-recovery.py rollback

      - name: Scan sanitized evidence
        if: always() && steps.preflight.outcome == 'success'
        id: scan
        run: python scripts/backend/elbotola-recovery.py scan

      - name: Upload sanitized recovery evidence
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elbotola-recovery-${{ github.run_id }}
          path: ${{ env.ELBOTOLA_RECOVERY_DIR }}/evidence
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary runtime files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$ELBOTOLA_RECOVERY_DIR" ]]; then
            rm -rf -- "$ELBOTOLA_RECOVERY_DIR"
          fi
