name: Phase 6 session provisioning rehearsal

on:
  pull_request:
    branches:
      - backend/fantasy-domain
    paths:
      - .github/workflows/phase6-session-provisioning-rehearsal.yml
      - scripts/backend/fantasy-capacity-orchestrator.py
      - scripts/backend/fantasy-session-provisioner.py
      - scripts/backend/tests/test_fantasy_session_provisioner.py
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed diagnostics commit to rehearse
        required: true
        type: string
      confirmation:
        description: Type RUN_PHASE6_SESSION_REHEARSAL
        required: true
        type: string

concurrency:
  group: phase6-session-provisioning-${{ github.event_name == 'workflow_dispatch' && 'staging' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnostics-tests:
    name: Validate sanitized session diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out diagnostics source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_commit || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/backend/fantasy-capacity-requirements.txt

      - name: Install pinned harness dependencies
        run: python -m pip install --requirement scripts/backend/fantasy-capacity-requirements.txt

      - name: Run deterministic diagnostics tests
        run: |
          python -m py_compile \
            scripts/backend/fantasy-session-provisioner.py \
            scripts/backend/fantasy-capacity-orchestrator.py
          python -m unittest discover \
            -s scripts/backend/tests \
            -p 'test_*.py' \
            -v

  session-rehearsal:
    name: Five-user protected staging rehearsal
    if: github.event_name == 'workflow_dispatch'
    needs: diagnostics-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging-load-test
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    env:
      AWS_REGION: eu-west-3
      AWS_DEFAULT_REGION: eu-west-3
      BOTOLAGO_LOAD_ENVIRONMENT: staging-v2
      BOTOLAGO_MAX_ESTIMATED_COST_USD: "50"
      BOTOLAGO_REQUIRE_AWS_SESSION_TOKEN: "1"
      BOTOLAGO_AWS_LOAD_TEST_ROLE_ARN: ${{ vars.AWS_LOAD_TEST_ROLE_ARN }}

    steps:
      - name: Initialize owner-only rehearsal runtime
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/botolago-phase6"
          install -d -m 0700 "$RUNNER_TEMP/botolago-phase6/evidence"
          echo "BOTOLAGO_PHASE6_RUNTIME_DIR=$RUNNER_TEMP/botolago-phase6" >> "$GITHUB_ENV"
          echo "BOTOLAGO_PHASE6_EVIDENCE_DIR=$RUNNER_TEMP/botolago-phase6/evidence" >> "$GITHUB_ENV"

      - name: Validate protected manual dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "RUN_PHASE6_SESSION_REHEARSAL"
          [[ "${{ inputs.expected_commit }}" =~ ^[0-9a-f]{40}$ ]]

      - name: Verify diagnostics branch head
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        with:
          script: |
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              head: "mrdata007:codex/phase6-session-provisioning-diagnostics",
              base: "backend/fantasy-domain",
            });
            if (pulls.data.length !== 1) {
              core.setFailed("The diagnostics rehearsal requires one open stacked PR");
              return;
            }
            const pull = pulls.data[0];
            if (pull.head.sha !== process.env.EXPECTED_COMMIT) {
              core.setFailed("The reviewed commit is not the current diagnostics PR head");
              return;
            }
            core.info("Diagnostics PR head matches the manually approved commit");

      - name: Check out reviewed diagnostics commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify hardened Phase 6 ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_commit }}"
          git merge-base --is-ancestor f4bfb3d927849ef5eec1a9a729090e7093890e4f HEAD

      - name: Configure delegated AWS credentials
        id: aws_oidc
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_LOAD_TEST_ROLE_ARN }}
          role-session-name: phase6-session-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: eu-west-3
          role-duration-seconds: 3600
          retry-max-attempts: 1
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify delegated caller and region
        shell: bash
        run: |
          set -euo pipefail
          test "$AWS_REGION" = "eu-west-3"
          test "$AWS_DEFAULT_REGION" = "eu-west-3"
          test -n "${AWS_SESSION_TOKEN:-}"
          aws sts get-caller-identity --output json >/dev/null

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/backend/fantasy-capacity-requirements.txt

      - name: Install pinned harness dependencies
        run: python -m pip install --requirement scripts/backend/fantasy-capacity-requirements.txt

      - name: Run five-user session provisioning rehearsal
        id: rehearsal
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ vars.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set +e
          timeout --signal=INT --kill-after=60s 30m \
            python scripts/backend/fantasy-capacity-orchestrator.py \
              --session-provisioning-rehearsal
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Independently clean temporary staging resources
        id: cleanup
        if: always()
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ vars.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set +e
          timeout --signal=INT --kill-after=60s 15m \
            python scripts/backend/fantasy-capacity-orchestrator.py --cleanup-only
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Scan sanitized rehearsal evidence
        id: sanitize
        if: always()
        shell: bash
        env:
          REHEARSAL_EXIT: ${{ steps.rehearsal.outputs.exit_code || '2' }}
          CLEANUP_EXIT: ${{ steps.cleanup.outputs.exit_code || '2' }}
        run: |
          set +e
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          script = Path("scripts/backend/fantasy-capacity-report.py")
          spec = importlib.util.spec_from_file_location("capacity_report", script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          evidence = Path(os.environ["BOTOLAGO_PHASE6_EVIDENCE_DIR"])
          violations = module.scan_artifacts(evidence)
          result = {
              "artifactsSanitized": not violations,
              "cleanupExit": int(os.environ["CLEANUP_EXIT"]),
              "rehearsalExit": int(os.environ["REHEARSAL_EXIT"]),
              "violations": violations,
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "session-rehearsal-result.json"
          module.private_write(output, json.dumps(result, indent=2, sort_keys=True) + "\n")
          raise SystemExit(0 if not violations else 2)
          PY
          status=$?
          sanitized=$(python -c 'import json,os; print(str(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"session-rehearsal-result.json")))["artifactsSanitized"]).lower())' 2>/dev/null || echo false)
          echo "sanitized=$sanitized" >> "$GITHUB_OUTPUT"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload sanitized session diagnostics
        if: always() && steps.sanitize.outputs.sanitized == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase6-session-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/botolago-phase6/evidence
            ${{ runner.temp }}/session-rehearsal-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce rehearsal and cleanup verdict
        if: always()
        env:
          REHEARSAL_EXIT: ${{ steps.rehearsal.outputs.exit_code || '2' }}
          CLEANUP_EXIT: ${{ steps.cleanup.outputs.exit_code || '2' }}
          SANITIZED: ${{ steps.sanitize.outputs.sanitized || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REHEARSAL_EXIT" = "0"
          test "$CLEANUP_EXIT" = "0"
          test "$SANITIZED" = "true"
