name: Gate 2F Production current-season catalog canary

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit approved for the current-season catalog canary
        required: true
        type: string
      confirmation:
        description: Type RUN_GATE2F_CURRENT_SEASON_CATALOG_CANARY
        required: true
        type: string

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  canary:
    name: Verify provider readiness, then ingest the current Botola catalog
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mrdata007' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-admin-activation
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      EXPECTED_PROJECT_REF: tkewgajrljbwgwedqsxn
      EXPECTED_PROJECT_NAME: BotolaGO Production V2
      EXPECTED_LEAGUE_ID: "860"
      EXPECTED_SEASON_ID: "28647"
      EXPECTED_SEASON_NAME: 2026/2027
      EXPECTED_SEASON_START: 2026-09-12
      EXPECTED_SEASON_END: 2027-07-05
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_PRODUCTION_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PRODUCTION_PUBLISHABLE_KEY }}
      BOTOLAGO_AAL2_NON_STAFF_ACCESS_TOKEN: ${{ secrets.BOTOLAGO_AAL2_NON_STAFF_ACCESS_TOKEN }}
      SPORTSMONKS_API_TOKEN: ${{ secrets.SPORTSMONKS_API_TOKEN }}
      SUPABASE_PRODUCTION_PROJECT_NAME: ${{ vars.SUPABASE_PRODUCTION_PROJECT_NAME }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}

    steps:
      - name: Initialize protected runtime and enforce immutable target
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          for secret_value in \
            "$SUPABASE_ACCESS_TOKEN" \
            "$SUPABASE_SECRET_KEY" \
            "$SUPABASE_PRODUCTION_PUBLISHABLE_KEY" \
            "$BOTOLAGO_AAL2_NON_STAFF_ACCESS_TOKEN" \
            "$SPORTSMONKS_API_TOKEN"; do
            if [[ -n "$secret_value" ]]; then printf '::add-mask::%s\n' "$secret_value"; fi
          done
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ||
                -z "$SUPABASE_SECRET_KEY" ||
                -z "$SUPABASE_PRODUCTION_PUBLISHABLE_KEY" ||
                -z "$BOTOLAGO_AAL2_NON_STAFF_ACCESS_TOKEN" ||
                -z "$SPORTSMONKS_API_TOKEN" ]]; then
            echo "Protected credential injection failed before the readiness probe."
            exit 2
          fi
          if [[ "${GITHUB_RUN_ATTEMPT:-}" != "1" ]]; then
            echo "GITHUB_WORKFLOW_RERUN_FORBIDDEN"
            exit 2
          fi
          if [[ "$CONFIRMATION" != "RUN_GATE2F_CURRENT_SEASON_CATALOG_CANARY" ||
                "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Immutable dispatch confirmation failed."
            exit 2
          fi
          if [[ "$SUPABASE_PRODUCTION_PROJECT_REF" != "$EXPECTED_PROJECT_REF" ||
                "$SUPABASE_PRODUCTION_PROJECT_NAME" != "$EXPECTED_PROJECT_NAME" ||
                "${SUPABASE_PRODUCTION_URL%/}" != "https://${EXPECTED_PROJECT_REF}.supabase.co" ]]; then
            echo "Production project guard failed."
            exit 2
          fi
          runtime_dir="$RUNNER_TEMP/botolago-gate2f"
          evidence_dir="$runtime_dir/evidence"
          install -d -m 0700 "$runtime_dir" "$evidence_dir"
          {
            echo "GATE2F_RUNTIME_DIR=$runtime_dir"
            echo "GATE2F_EVIDENCE_DIR=$evidence_dir"
            echo "GATE2B_EVIDENCE_DIR=$evidence_dir"
            echo "GATE2F_READINESS_FILE=$evidence_dir/sportsmonks-production-probe.json"
            echo "GATE2F_SECRET_FILE=$runtime_dir/function-secrets.env"
            echo "GATE2F_ROLLBACK_FILE=$runtime_dir/rollback-function-secrets.env"
            echo "GATE2F_RESPONSE_FILE=$runtime_dir/canary-response.json"
          } >> "$GITHUB_ENV"
          echo "evidence_dir=$evidence_dir" >> "$GITHUB_OUTPUT"
          echo "Immutable target guard: PASS"

      - name: Check out the exact reviewed main commit
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install the reviewed toolchain
        shell: bash
        run: bun install --frozen-lockfile

      - name: Validate the exact probe and catalog runtimes
        shell: bash
        run: |
          set -euo pipefail
          bun test \
            scripts/backend/sportsmonks-production-probe.test.ts \
            scripts/backend/gate2f-current-season-catalog-canary.test.ts \
            supabase/functions/_shared/sportsmonks-catalog.test.ts
          bun run backend:secrets:check
          test -x ./node_modules/.bin/supabase
          ./node_modules/.bin/supabase --version

      - name: Re-probe current-season provider readiness before mutation
        id: provider_probe
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/backend/sportsmonks-production-probe.ts

      - name: Require exact current-season readiness
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(Path(os.environ["GATE2F_READINESS_FILE"]).read_text(encoding="utf-8"))
          season = evidence.get("season")
          league = evidence.get("league")
          resources = evidence.get("verifiedResources")
          fixture = evidence.get("fixtureSample")
          if (
              evidence.get("schemaVersion") != 1
              or evidence.get("provider") != "sportsmonks"
              or evidence.get("mode") != "read_only"
              or evidence.get("expectedCommit") != os.environ["EXPECTED_COMMIT"]
              or evidence.get("verdict") != "pass"
              or not isinstance(league, dict)
              or league.get("id") != int(os.environ["EXPECTED_LEAGUE_ID"])
              or league.get("active") is not True
              or not isinstance(season, dict)
              or season.get("id") != int(os.environ["EXPECTED_SEASON_ID"])
              or season.get("leagueId") != int(os.environ["EXPECTED_LEAGUE_ID"])
              or season.get("name") != os.environ["EXPECTED_SEASON_NAME"]
              or season.get("current") is not True
              or season.get("startingAt") != os.environ["EXPECTED_SEASON_START"]
              or season.get("endingAt") != os.environ["EXPECTED_SEASON_END"]
              or not isinstance(resources, dict)
              or not isinstance(fixture, dict)
              or fixture.get("available") is not True
              or fixture.get("leagueMatches") is not True
              or fixture.get("seasonMatches") is not True
              or fixture.get("participants") != 2
          ):
              raise SystemExit("CURRENT_SEASON_READINESS_SCOPE_MISMATCH")
          rounds = resources.get("rounds")
          teams = resources.get("teams")
          if type(rounds) is not int or rounds < 1 or rounds > 100:
              raise SystemExit("CURRENT_SEASON_ROUNDS_NOT_READY")
          if type(teams) is not int or teams < 2 or teams > 50:
              raise SystemExit("CURRENT_SEASON_TEAMS_NOT_READY")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"rounds={rounds}\n")
              output.write(f"teams={teams}\n")
          print(f"Current-season prerequisite: PASS rounds={rounds} teams={teams}")
          PY

      - name: Deploy the exact reviewed ingestion runtime
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          if ! ./node_modules/.bin/supabase functions deploy football-ingest \
            --project-ref "$EXPECTED_PROJECT_REF" \
            > "$GATE2F_RUNTIME_DIR/function-deploy.log" 2>&1; then
            echo "Reviewed ingestion runtime deployment failed."
            exit 1
          fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "Reviewed ingestion runtime deployed with JWT verification."

      - name: Install pinned current-season function configuration
        id: secrets
        shell: bash
        env:
          FOOTBALL_PROVIDER: sportsmonks
          FOOTBALL_PROVIDER_BASE_URL: https://api.sportmonks.com/v3/football
          FOOTBALL_SPORTSMONKS_LEAGUE_ID: "860"
          FOOTBALL_SPORTSMONKS_SEASON_ID: "28647"
          FOOTBALL_SPORTSMONKS_COUNTRY_CODE: MA
          FOOTBALL_SPORTSMONKS_COMPETITION_TYPE: league
          FOOTBALL_SPORTSMONKS_SEASON_START: 2026-09-12
          FOOTBALL_SPORTSMONKS_SEASON_END: 2027-07-05
          FOOTBALL_PROVIDER_TIMEOUT_MS: "15000"
          FOOTBALL_PROVIDER_MAX_RETRIES: "2"
        run: |
          set -euo pipefail
          trigger_secret=$(openssl rand -hex 32)
          printf '::add-mask::%s\n' "$trigger_secret"
          echo "GATE2F_TRIGGER_SECRET=$trigger_secret" >> "$GITHUB_ENV"
          export FOOTBALL_INGESTION_TRIGGER_SECRET="$trigger_secret"
          python - <<'PY'
          import os
          from pathlib import Path

          current_names = (
              "SPORTSMONKS_API_TOKEN",
              "FOOTBALL_INGESTION_TRIGGER_SECRET",
              "FOOTBALL_PROVIDER",
              "FOOTBALL_PROVIDER_BASE_URL",
              "FOOTBALL_SPORTSMONKS_LEAGUE_ID",
              "FOOTBALL_SPORTSMONKS_SEASON_ID",
              "FOOTBALL_SPORTSMONKS_COUNTRY_CODE",
              "FOOTBALL_SPORTSMONKS_COMPETITION_TYPE",
              "FOOTBALL_SPORTSMONKS_SEASON_START",
              "FOOTBALL_SPORTSMONKS_SEASON_END",
              "FOOTBALL_PROVIDER_TIMEOUT_MS",
              "FOOTBALL_PROVIDER_MAX_RETRIES",
          )
          current = Path(os.environ["GATE2F_SECRET_FILE"])
          current.write_text(
              "".join(f"{name}={os.environ[name]}\n" for name in current_names),
              encoding="utf-8",
          )
          current.chmod(0o600)

          rollback_values = {
              "SPORTSMONKS_API_TOKEN": os.environ["SPORTSMONKS_API_TOKEN"],
              "FOOTBALL_PROVIDER": "sportsmonks",
              "FOOTBALL_PROVIDER_BASE_URL": "https://api.sportmonks.com/v3/football",
              "FOOTBALL_SPORTSMONKS_LEAGUE_ID": "860",
              "FOOTBALL_SPORTSMONKS_SEASON_ID": "26027",
              "FOOTBALL_SPORTSMONKS_COUNTRY_CODE": "MA",
              "FOOTBALL_SPORTSMONKS_COMPETITION_TYPE": "league",
              "FOOTBALL_SPORTSMONKS_SEASON_START": "2025-09-12",
              "FOOTBALL_SPORTSMONKS_SEASON_END": "2026-07-05",
              "FOOTBALL_PROVIDER_TIMEOUT_MS": "15000",
              "FOOTBALL_PROVIDER_MAX_RETRIES": "2",
          }
          rollback = Path(os.environ["GATE2F_ROLLBACK_FILE"])
          rollback.write_text(
              "".join(f"{name}={value}\n" for name, value in rollback_values.items()),
              encoding="utf-8",
          )
          rollback.chmod(0o600)
          PY
          if ! ./node_modules/.bin/supabase secrets set \
            --project-ref "$EXPECTED_PROJECT_REF" \
            --env-file "$GATE2F_SECRET_FILE" \
            > "$GATE2F_RUNTIME_DIR/secrets-set.log" 2>&1; then
            echo "Supabase rejected the protected current-season configuration."
            exit 1
          fi
          echo "installed=true" >> "$GITHUB_OUTPUT"
          echo "Pinned current-season configuration installed."

      - name: Run the bounded current-season catalog canary
        id: canary
        shell: bash
        env:
          EXPECTED_ROUNDS: ${{ steps.readiness.outputs.rounds }}
          EXPECTED_TEAMS: ${{ steps.readiness.outputs.teams }}
        run: |
          set -euo pipefail
          endpoint="https://${EXPECTED_PROJECT_REF}.supabase.co/functions/v1/football-ingest"
          payload='{"job":"catalog","pageSize":50,"maxPages":1}'
          invoke_with_user_token() {
            curl --silent --show-error \
              --connect-timeout 10 --max-time 120 \
              --output "$GATE2F_RESPONSE_FILE" \
              --write-out '%{http_code}' \
              --request POST "$endpoint" \
              --header 'content-type: application/json' \
              --header 'x-botolago-ingestion-job: catalog' \
              --header "apikey: $SUPABASE_PRODUCTION_PUBLISHABLE_KEY" \
              --header "Authorization: Bearer $BOTOLAGO_AAL2_NON_STAFF_ACCESS_TOKEN" \
              --header "x-botolago-ingestion-key: $GATE2F_TRIGGER_SECRET" \
              --data "$payload"
          }
          invoke_with_service_key() {
            curl --silent --show-error \
              --connect-timeout 10 --max-time 120 \
              --output "$GATE2F_RESPONSE_FILE" \
              --write-out '%{http_code}' \
              --request POST "$endpoint" \
              --header 'content-type: application/json' \
              --header 'x-botolago-ingestion-job: catalog' \
              --header "apikey: $SUPABASE_SECRET_KEY" \
              --header "Authorization: Bearer $SUPABASE_SECRET_KEY" \
              --header "x-botolago-ingestion-key: $GATE2F_TRIGGER_SECRET" \
              --data "$payload"
          }
          http_status=$(invoke_with_user_token)
          auth_path="aal2_user_jwt"
          if [[ "$http_status" == "401" || "$http_status" == "403" ]]; then
            http_status=$(invoke_with_service_key)
            auth_path="service_key_fallback"
          fi
          export GATE2F_HTTP_STATUS="$http_status"
          export GATE2F_AUTH_PATH="$auth_path"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if os.environ["GATE2F_HTTP_STATUS"] != "200":
              raise SystemExit(f"CANARY_HTTP_{os.environ['GATE2F_HTTP_STATUS']}")
          response = json.loads(Path(os.environ["GATE2F_RESPONSE_FILE"]).read_text(encoding="utf-8"))
          if response.get("provider") != "sportsmonks" or not isinstance(response.get("jobs"), dict):
              raise SystemExit("INVALID_CANARY_RESPONSE")
          expected = {
              "competitions": 1,
              "seasons": 1,
              "rounds": int(os.environ["EXPECTED_ROUNDS"]),
              "teams": int(os.environ["EXPECTED_TEAMS"]),
          }
          sanitized_jobs = {}
          for job, expected_count in expected.items():
              counts = response["jobs"].get(job)
              required = ("fetched", "validated", "inserted", "updated", "skipped", "rejected")
              if not isinstance(counts, dict) or any(type(counts.get(name)) is not int for name in required):
                  raise SystemExit(f"INVALID_CANARY_COUNTS_{job.upper()}")
              if (
                  counts["fetched"] != expected_count
                  or counts["validated"] != expected_count
                  or counts["rejected"] != 0
                  or counts["inserted"] + counts["updated"] + counts["skipped"] != expected_count
              ):
                  raise SystemExit(f"CANARY_COUNT_MISMATCH_{job.upper()}")
              sanitized_jobs[job] = {name: counts[name] for name in required}
          evidence = {
              "schemaVersion": 1,
              "mode": "production_current_season_catalog_canary",
              "expectedCommit": os.environ["EXPECTED_COMMIT"],
              "projectRef": os.environ["EXPECTED_PROJECT_REF"],
              "leagueId": int(os.environ["EXPECTED_LEAGUE_ID"]),
              "seasonId": int(os.environ["EXPECTED_SEASON_ID"]),
              "authPath": os.environ["GATE2F_AUTH_PATH"],
              "readinessObserved": {"rounds": expected["rounds"], "teams": expected["teams"]},
              "jobs": sanitized_jobs,
              "verdict": "pass",
          }
          output = Path(os.environ["GATE2F_EVIDENCE_DIR"]) / "gate2f-current-season-catalog-canary.json"
          output.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          output.chmod(0o600)
          PY
          echo "Current-season catalog canary: PASS"

      - name: Verify evidence contains no credential patterns
        id: evidence_scan
        if: always() && steps.runtime.outcome == 'success' && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/backend/phase7f-scan-sanitized-evidence.py "$GATE2F_EVIDENCE_DIR"
          for secret_value in \
            "$SUPABASE_ACCESS_TOKEN" \
            "$SUPABASE_SECRET_KEY" \
            "$SUPABASE_PRODUCTION_PUBLISHABLE_KEY" \
            "$BOTOLAGO_AAL2_NON_STAFF_ACCESS_TOKEN" \
            "$SPORTSMONKS_API_TOKEN" \
            "${GATE2F_TRIGGER_SECRET:-}"; do
            if [[ -n "$secret_value" ]] && grep -R -F -q -- "$secret_value" "$GATE2F_EVIDENCE_DIR"; then
              echo "CREDENTIAL_FOUND_IN_GATE2F_EVIDENCE"
              exit 1
            fi
          done
          echo "Gate 2F evidence credential scan: PASS"

      - name: Upload sanitized canary evidence
        id: evidence_upload
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate2f-current-season-catalog-canary-${{ github.run_id }}
          path: ${{ steps.runtime.outputs.evidence_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Disable the trigger, roll back failed configuration, and remove runtime files
        id: cleanup
        if: always()
        shell: bash
        env:
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
          SCAN_OUTCOME: ${{ steps.evidence_scan.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
        run: |
          set -euo pipefail
          cleanup_failed=0
          if [[ "${{ steps.secrets.outputs.installed }}" == "true" && -x ./node_modules/.bin/supabase ]]; then
            if [[ "$CANARY_OUTCOME" != "success" ||
                  "$SCAN_OUTCOME" != "success" ||
                  "$UPLOAD_OUTCOME" != "success" ]]; then
              if ! ./node_modules/.bin/supabase secrets set \
                --project-ref "$EXPECTED_PROJECT_REF" \
                --env-file "$GATE2F_ROLLBACK_FILE" \
                > "$GATE2F_RUNTIME_DIR/rollback-secrets.log" 2>&1; then
                cleanup_failed=1
              fi
            fi
            if ! ./node_modules/.bin/supabase secrets unset \
              FOOTBALL_INGESTION_TRIGGER_SECRET \
              --project-ref "$EXPECTED_PROJECT_REF" \
              > /dev/null 2>&1; then
              cleanup_failed=1
            fi
          fi
          if [[ -n "${GATE2F_RUNTIME_DIR:-}" && -d "$GATE2F_RUNTIME_DIR" ]]; then
            find "$GATE2F_RUNTIME_DIR" -type f -exec chmod 0600 {} \;
            find "$GATE2F_RUNTIME_DIR" -type f -delete
            rmdir "$GATE2F_EVIDENCE_DIR" 2>/dev/null || true
            rmdir "$GATE2F_RUNTIME_DIR" 2>/dev/null || true
          fi
          if [[ "$cleanup_failed" != "0" ]]; then
            echo "GATE2F_CLEANUP_OR_ROLLBACK_FAILED"
            exit 1
          fi
          echo "One-time trigger disabled; failed configuration, if any, rolled back."

      - name: Finalize canary verdict
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.provider_probe.outcome }}
          READINESS_OUTCOME: ${{ steps.readiness.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
          SCAN_OUTCOME: ${{ steps.evidence_scan.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          if [[ "$PROBE_OUTCOME" != "success" ||
                "$READINESS_OUTCOME" != "success" ||
                "$DEPLOY_OUTCOME" != "success" ||
                "$CANARY_OUTCOME" != "success" ||
                "$SCAN_OUTCOME" != "success" ||
                "$UPLOAD_OUTCOME" != "success" ||
                "$CLEANUP_OUTCOME" != "success" ]]; then
            echo "GATE2F_CURRENT_SEASON_CATALOG_CANARY_FAILED"
            exit 1
          fi
          echo "GATE2F_CURRENT_SEASON_CATALOG_CANARY_PASS"

      - name: Publish sanitized canary status
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          READINESS_OUTCOME: ${{ steps.readiness.outcome }}
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
          SCAN_OUTCOME: ${{ steps.evidence_scan.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$GITHUB_TOKEN"
          state="failure"
          description="Gate 2F current-season catalog canary failed"
          if [[ "$RUNTIME_OUTCOME" == "success" &&
                "$READINESS_OUTCOME" == "success" &&
                "$CANARY_OUTCOME" == "success" &&
                "$SCAN_OUTCOME" == "success" &&
                "$UPLOAD_OUTCOME" == "success" &&
                "$CLEANUP_OUTCOME" == "success" ]]; then
            state="success"
            description="Gate 2F current-season catalog canary passed"
          fi
          payload=$(printf \
            '{"state":"%s","target_url":"https://github.com/%s/actions/runs/%s","description":"%s","context":"botolago/gate2f-current-season-catalog-canary"}' \
            "$state" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$description")
          curl --silent --show-error --fail --output /dev/null \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload"
