name: Production V2 SofaScore Fantasy simple rehearsal (rolled back, never commits)

# Builds the plan from fresh reads, then sends ONE DO block to Production V2 that
# calls api.service_record_sofascore_fantasy_observation for every ready fixture
# and ends in a deliberate `raise exception` carrying the computed state out,
# which rolls everything back. It then re-reads production and proves nothing
# changed. There is no commit mode here. It prints the sha256 of the plan; the
# owner approves that exact hash for the apply.
# Design and steps: docs/backend/SOFASCORE_FANTASY_SIMPLE.md.

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit approved for this run
        required: true
        type: string
      confirmation:
        description: Type REHEARSE_SOFASCORE_FANTASY_PRODUCTION
        required: true
        type: string
      round:
        description: Round number to write (for example 3)
        required: true
        type: string
      fixture_ids:
        description: Optional. Only these fixtures (comma-separated app fixture uuids), inside the round
        required: false
        type: string
      include_observed:
        description: Also redo fixtures that already have an observation (a correction with fresh SofaScore data)
        required: false
        type: boolean
        default: false
      plan_sha256:
        description: Optional. If given, must equal the computed plan hash
        required: false
        type: string

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  rehearse:
    name: Rehearse SofaScore Fantasy simple observations on Production V2 and verify
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mrdata007' &&
      github.triggering_actor == 'mrdata007' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-admin-activation
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      PLAN_SHA256: ${{ inputs.plan_sha256 }}
      ROUND: ${{ inputs.round }}
      FIXTURE_IDS: ${{ inputs.fixture_ids }}
      INCLUDE_OBSERVED: ${{ inputs.include_observed }}

    steps:
      - name: Enforce dispatch guards
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" && "${GITHUB_REPOSITORY:-}" == "mrdata007/botolago-foundation" ]] || { echo "Owner workflow dispatch required."; exit 2; }
          [[ "${GITHUB_REF:-}" == "refs/heads/main" ]] || { echo "Production runs may start only from main."; exit 2; }
          [[ "${GITHUB_ACTOR:-}" == "mrdata007" && "${GITHUB_TRIGGERING_ACTOR:-}" == "mrdata007" ]] || { echo "Only the owner may dispatch this workflow."; exit 2; }
          [[ "${GITHUB_RUN_ATTEMPT:-}" == "1" ]] || { echo "GITHUB_WORKFLOW_RERUN_FORBIDDEN"; exit 2; }
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ && "$EXPECTED_COMMIT" == "$GITHUB_SHA" ]] || { echo "The dispatched commit is not the reviewed main commit."; exit 2; }
          [[ "$CONFIRMATION" == "REHEARSE_SOFASCORE_FANTASY_PRODUCTION" ]] || { echo "Invalid confirmation."; exit 2; }
          if [[ -n "${PLAN_SHA256:-}" ]]; then
            [[ "$PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "plan_sha256 must be 64 hex characters."; exit 2; }
          fi
          [[ "${ROUND:-}" =~ ^[0-9]{1,2}$ ]] || { echo "round must be a number."; exit 2; }
          uuid='[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
          [[ -z "${FIXTURE_IDS:-}" || "${FIXTURE_IDS}" =~ ^${uuid}(,${uuid}){0,11}$ ]] || { echo "fixture_ids must be up to 12 comma-separated uuids."; exit 2; }
          echo "Dispatch guards: PASS"

      - name: Refuse if another workflow run is active (one writer at a time)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Scheduled and manually dispatched runs are the ones that can write to
          # the database (AGENTS.md, "Check the scheduled jobs too"). Any other
          # such run that is active, queued or waiting stops this one; dispatch
          # again when the list is empty.
          found=""
          for status in in_progress queued waiting pending; do
            for event in workflow_dispatch schedule; do
              rows=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$status&event=$event&per_page=100" \
                --jq ".workflow_runs[] | select(.id != ($THIS_RUN|tonumber)) | \"\(.id) \(.name) [\(.status)]\"")
              if [[ -n "$rows" ]]; then found+="$rows"$'\n'; fi
            done
          done
          if [[ -n "$found" ]]; then
            echo "Another run is active; refusing to start:"
            printf '%s' "$found"
            exit 2
          fi
          echo "No other dispatched or scheduled run is active."

      - name: Check out the reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (no secrets in this step)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Rehearse (rolled back) and verify production is unchanged
        shell: bash
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          SOFASCORE_FANTASY_CONFIRMATION: ${{ inputs.confirmation }}
          EVIDENCE_DIR: ${{ runner.temp }}/sofascore-fantasy-rehearse-evidence
        run: |
          set -euo pipefail
          for secret_value in "${RAPIDAPI_KEY:-}" "${SUPABASE_ACCESS_TOKEN:-}"; do
            if [[ -n "$secret_value" ]]; then
              printf '::add-mask::%s\n' "$secret_value"
            fi
          done
          [[ "${SUPABASE_PRODUCTION_PROJECT_REF:-}" == "tkewgajrljbwgwedqsxn" ]] || { echo "Production project-ref guard failed."; exit 2; }
          install -d -m 0700 "$EVIDENCE_DIR"
          args=(--mode rehearse --round "$ROUND")
          if [[ -n "${FIXTURE_IDS:-}" ]]; then args+=(--fixtures "$FIXTURE_IDS"); fi
          if [[ "${INCLUDE_OBSERVED:-}" == "true" ]]; then args+=(--include-observed); fi
          if [[ -n "${PLAN_SHA256:-}" ]]; then args+=(--plan-sha256 "$PLAN_SHA256"); fi
          set +e
          bun scripts/backend/sofascore-fantasy-simple-ingest.ts "${args[@]}" | tee "$RUNNER_TEMP/run.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          status=${pipeline_status[0]}
          if [[ "${pipeline_status[1]}" != "0" ]]; then exit "${pipeline_status[1]}"; fi
          {
            echo "## SofaScore Fantasy simple on Production V2: rehearse"
            echo
            echo '```'
            cat "$RUNNER_TEMP/run.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sofascore-fantasy-rehearse-${{ github.run_id }}
          path: ${{ runner.temp }}/sofascore-fantasy-rehearse-evidence
          if-no-files-found: warn
          retention-days: 14
