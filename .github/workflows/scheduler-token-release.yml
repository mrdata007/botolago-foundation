name: Scheduler token release (PR 379)

# Runs steps 1 and 3 of .readiness-audit/release-runbook.md for the owner, so
# the release needs no terminal, no psql and no Supabase CLI on a laptop.
#
#   1. Copies the Vault secret `botolago_scheduler_token` into the Edge
#      Function secret BOTOLAGO_SCHEDULER_TOKEN. The value goes from the
#      Management API's response straight into a 0600 file on the runner and
#      from there into `supabase secrets set`; it is masked, never printed,
#      never written to evidence, and the file is removed at once. Setting the
#      secret first is the runbook's ordering rule: the functions this run
#      deploys refuse every wake-up (503) until the secret exists.
#   2. Deploys the scheduled functions one at a time, most-used first. After
#      each one a refusal probe (an all-zero token) must answer 401; a 503 means
#      the secret is missing and the run stops before deploying anything else.
#      After football-live-refresh it waits for real pg_cron wake-ups and
#      requires them to be accepted (no 401/503 in pg_net's responses).
#   3. Deploys the two staff functions.
#
# home-story-generate is deployed only if it is already deployed: this run
# never creates a function that production does not have yet.
#
# Rollback is the runbook's: R1 (fix the secret, no redeploy) or R2 (redeploy
# the previous version). The secret can stay set; older code ignores it.
#
# Owner only, from main, typed confirmation, exact commit, first attempt, and
# the production-admin-activation environment's manual approval.

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact main commit (the merge of PR 379 or later)
        required: true
        type: string
      confirmation:
        description: Type RUN_SCHEDULER_TOKEN_RELEASE
        required: true
        type: string

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Set the scheduler secret, then deploy the functions one by one
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mrdata007'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-admin-activation
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_PROJECT_REF: tkewgajrljbwgwedqsxn
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Guards
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "SUPABASE_ACCESS_TOKEN is not available to this environment."
            exit 2
          fi
          printf '::add-mask::%s\n' "$SUPABASE_ACCESS_TOKEN"
          if [[ "${GITHUB_RUN_ATTEMPT:-}" != "1" ]]; then
            echo "GITHUB_WORKFLOW_RERUN_FORBIDDEN: dispatch a new run instead."
            exit 2
          fi
          if [[ "$CONFIRMATION" != "RUN_SCHEDULER_TOKEN_RELEASE" ]]; then
            echo "Invalid confirmation."
            exit 2
          fi
          if [[ "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "The dispatched commit is not the expected main commit."
            exit 2
          fi
          if [[ "$EXPECTED_PROJECT_REF" != "tkewgajrljbwgwedqsxn" ]]; then
            echo "Production project guard failed."
            exit 2
          fi
          runtime_dir="$RUNNER_TEMP/scheduler-token-release"
          install -d -m 0700 "$runtime_dir"
          echo "RELEASE_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "Guards: PASS"

      - name: Check out the exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install and test the code being deployed
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          test -x ./node_modules/.bin/supabase
          ./node_modules/.bin/supabase --version
          # The in-process check must be what this commit carries.
          grep -q 'schedulerTokenRefusal' supabase/functions/_shared/scheduler-token.ts
          bun test supabase/functions/_shared/scheduler-token.test.ts \
            supabase/functions/_shared/football-live-refresh.test.ts \
            supabase/functions/_shared/notification-push-dispatch.test.ts \
            supabase/functions/_shared/ops-alert-email.test.ts \
            supabase/functions/_shared/account-deletion-worker.test.ts \
            supabase/functions/_shared/notification-email-dispatch.test.ts \
            supabase/functions/_shared/ai-content.test.ts \
            supabase/functions/_shared/home-story-generate.test.ts

      - name: "Step 1: copy the Vault token into the Edge Function secret"
        shell: bash
        run: |
          set -euo pipefail
          query_file="$RELEASE_RUNTIME_DIR/vault-query.json"
          response_file="$RELEASE_RUNTIME_DIR/vault-response.json"
          env_file="$RELEASE_RUNTIME_DIR/secret.env"
          cleanup() { rm -f "$response_file" "$env_file"; }
          trap cleanup EXIT
          jq -n --arg query \
            "select decrypted_secret as v from vault.decrypted_secrets where name = 'botolago_scheduler_token'" \
            '{query: $query}' > "$query_file"
          umask 077
          status="$(
            curl --silent --show-error --proto '=https' --tlsv1.2 \
              --connect-timeout 10 --max-time 60 --request POST \
              --output "$response_file" --write-out '%{http_code}' \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$query_file" \
              "https://api.supabase.com/v1/projects/$EXPECTED_PROJECT_REF/database/query"
          )"
          if [[ "$status" != "200" && "$status" != "201" ]]; then
            echo "Reading the Vault token failed with HTTP $status (response not shown)."
            exit 3
          fi
          rows="$(jq 'if type == "array" then length else (.result // .data // []) | length end' "$response_file")"
          if [[ "$rows" != "1" ]]; then
            echo "Expected exactly one Vault row named botolago_scheduler_token, found $rows."
            exit 3
          fi
          token="$(jq -r 'if type == "array" then .[0].v else (.result // .data)[0].v end' "$response_file" | tr -d '[:space:]')"
          rm -f "$response_file"
          if [[ ! "$token" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The Vault token is not 64 lowercase hex characters; nothing was set."
            exit 3
          fi
          printf '::add-mask::%s\n' "$token"
          printf 'BOTOLAGO_SCHEDULER_TOKEN=%s\n' "$token" > "$env_file"
          unset token
          if ! ./node_modules/.bin/supabase secrets set \
               --project-ref "$EXPECTED_PROJECT_REF" --env-file "$env_file" \
               > "$RELEASE_RUNTIME_DIR/secrets-set.log" 2>&1; then
            rm -f "$env_file"
            echo "Supabase refused the secret (log not shown, it may echo input)."
            exit 3
          fi
          rm -f "$env_file"
          ./node_modules/.bin/supabase secrets list --project-ref "$EXPECTED_PROJECT_REF" -o json \
            > "$RELEASE_RUNTIME_DIR/secrets-list.json" 2>/dev/null
          if ! jq -e 'map(.name) | index("BOTOLAGO_SCHEDULER_TOKEN") != null' \
               "$RELEASE_RUNTIME_DIR/secrets-list.json" > /dev/null; then
            echo "BOTOLAGO_SCHEDULER_TOKEN is not listed after setting it."
            exit 3
          fi
          rm -f "$RELEASE_RUNTIME_DIR/secrets-list.json"
          echo "Step 1: BOTOLAGO_SCHEDULER_TOKEN set from Vault (value not shown)."

      - name: "Step 3: deploy the functions one at a time"
        shell: bash
        run: |
          set -euo pipefail
          base="https://$EXPECTED_PROJECT_REF.supabase.co/functions/v1"
          zero_token="$(printf '0%.0s' {1..64})"

          probe() {
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 30 --request POST \
              --header 'content-type: application/json' \
              --header "x-botolago-scheduler-token: $zero_token" \
              --data '{}' "$base/$1"
          }

          deploy() {
            if ! ./node_modules/.bin/supabase functions deploy "$1" \
                 --project-ref "$EXPECTED_PROJECT_REF" \
                 > "$RELEASE_RUNTIME_DIR/deploy-$1.log" 2>&1; then
              echo "::error::Deploying $1 failed. Functions deployed before it stay deployed; see the runbook's rollback R2."
              tail -n 20 "$RELEASE_RUNTIME_DIR/deploy-$1.log" | grep -v -i 'token\|secret\|key' || true
              exit 4
            fi
            echo "Deployed $1."
          }

          check_scheduled() {
            local code=""
            for attempt in 1 2 3 4 5 6; do
              code="$(probe "$1")"
              [[ "$code" == "401" || "$code" == "503" ]] && break
              sleep 10
            done
            case "$code" in
              401) echo "Refusal probe $1: 401 (expected)." ;;
              503) echo "::error::$1 answers 503: the secret is missing or malformed. Stopping; runbook rollback R1."; exit 5 ;;
              *) echo "::error::$1 answered $code to the refusal probe, expected 401. Stopping."; exit 5 ;;
            esac
          }

          sql() {
            local payload="$RELEASE_RUNTIME_DIR/q.json" out="$RELEASE_RUNTIME_DIR/q-out.json"
            jq -n --arg query "$1" '{query: $query}' > "$payload"
            local status
            status="$(curl --silent --show-error --proto '=https' --tlsv1.2 \
              --connect-timeout 10 --max-time 60 --request POST \
              --output "$out" --write-out '%{http_code}' \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header 'Content-Type: application/json' --data-binary "@$payload" \
              "https://api.supabase.com/v1/projects/$EXPECTED_PROJECT_REF/database/query")"
            [[ "$status" == "200" || "$status" == "201" ]] || { echo "Read-only query failed: HTTP $status"; return 1; }
            jq -c 'if type == "array" then . else (.result // .data) end' "$out"
          }

          deployed="$(./node_modules/.bin/supabase functions list --project-ref "$EXPECTED_PROJECT_REF" -o json 2>/dev/null \
                      | jq -r '.[].slug' || true)"
          if [[ -z "$deployed" ]]; then
            echo "Could not list deployed functions; stopping before any deploy."
            exit 4
          fi

          # Most-used first, so a problem shows at once.
          deploy football-live-refresh
          check_scheduled football-live-refresh
          deploy_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Waiting 150 s for real wake-ups from pg_cron..."
          sleep 150
          counts="$(sql "select coalesce(jsonb_object_agg(status_code::text, n), '{}'::jsonb) as c from (select status_code, count(*) n from net._http_response where created > '$deploy_time'::timestamptz group by 1) s")"
          echo "pg_net responses since the deploy: $counts"
          if jq -e '.[0].c | (has("401") or has("503"))' <<<"$counts" > /dev/null; then
            echo "::error::Real wake-ups are being refused (401 = secret differs from Vault, 503 = missing). Stopping; runbook rollback R1, or R2 for football-live-refresh."
            exit 5
          fi
          if ! jq -e '.[0].c | has("200")' <<<"$counts" > /dev/null; then
            echo "::warning::No accepted wake-up seen yet (live refresh may be idle with no match). Continuing; check 3.2 of the runbook later."
          fi

          for fn in notification-push-dispatch ops-alert-email account-deletion-worker \
                    notification-email-dispatch ai-content-generate; do
            deploy "$fn"
            check_scheduled "$fn"
          done

          if grep -qx 'home-story-generate' <<<"$deployed"; then
            deploy home-story-generate
            check_scheduled home-story-generate
          else
            echo "home-story-generate is not deployed in production; left alone."
          fi

          # Staff functions: refused without a signed-in staff session.
          for fn in news-editorial-write player-photo-upload; do
            deploy "$fn"
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 \
                      --request POST --data '{}' "$base/$fn")"
            if [[ "$code" != "401" && "$code" != "403" ]]; then
              echo "::error::$fn answered $code without a session, expected 401 or 403."
              exit 5
            fi
            echo "Anonymous probe $fn: $code (expected)."
          done
          echo "Release complete. Remaining owner checks: runbook 3.3 (ops alert test e-mail) and 3.4 (staff saves), then publish the website."
