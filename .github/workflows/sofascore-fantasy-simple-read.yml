name: SofaScore Fantasy simple ingestion (production, read only report)

# Read-only dry run of the SofaScore-only Fantasy ingestion. It reads Production V2
# with single SELECT statements (sent read-only), fetches SofaScore lineups,
# incidents and statistics (3 requests per fixture) and prints, for the chosen
# round: how many fixtures and players would be scored, in which mode (full or
# simple), which fixtures are held back and why, and the list of appearing
# players with no reviewed SofaScore mapping (SofaScore ids and shirt numbers, no
# names). It never calls the database function, not even as a dry run, and has no
# write mode. Design and decision log: docs/backend/SOFASCORE_FANTASY_SIMPLE.md.

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit approved for this read-only run
        required: true
        type: string
      round:
        description: Round number to report on (for example 3). Leave empty for every finished fixture
        required: false
        type: string
      include_observed:
        description: Also report fixtures that already have an observation
        required: false
        type: boolean
        default: false

# Shares the production lock group so a snapshot is never taken in the middle
# of a production write.
concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    name: SofaScore Fantasy simple report (production, read only)
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mrdata007' &&
      github.triggering_actor == 'mrdata007' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-admin-activation

    steps:
      - name: Validate manual dispatch
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          ROUND: ${{ inputs.round }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" && "${GITHUB_REPOSITORY:-}" == "mrdata007/botolago-foundation" ]] || { echo "Owner workflow dispatch required."; exit 2; }
          [[ "${GITHUB_REF:-}" == "refs/heads/main" ]] || { echo "Production reads may run only from main."; exit 2; }
          [[ "${GITHUB_ACTOR:-}" == "mrdata007" && "${GITHUB_TRIGGERING_ACTOR:-}" == "mrdata007" ]] || { echo "Only the owner may dispatch this workflow."; exit 2; }
          [[ "${GITHUB_RUN_ATTEMPT:-}" == "1" ]] || { echo "Workflow reruns are forbidden; dispatch a reviewed commit again."; exit 2; }
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ && "$EXPECTED_COMMIT" == "$GITHUB_SHA" ]] || { echo "The dispatched commit is not the reviewed main commit."; exit 2; }
          [[ -z "${ROUND:-}" || "$ROUND" =~ ^[0-9]{1,2}$ ]] || { echo "round must be a number."; exit 2; }

      - name: Check out the reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (no secrets in this step)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Report (read only)
        shell: bash
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          ROUND: ${{ inputs.round }}
          INCLUDE_OBSERVED: ${{ inputs.include_observed }}
        run: |
          set -euo pipefail
          for secret_value in "${RAPIDAPI_KEY:-}" "${SUPABASE_ACCESS_TOKEN:-}"; do
            if [[ -n "$secret_value" ]]; then
              printf '::add-mask::%s\n' "$secret_value"
            fi
          done
          [[ "${SUPABASE_PRODUCTION_PROJECT_REF:-}" == "tkewgajrljbwgwedqsxn" ]] || { echo "Production project-ref guard failed."; exit 2; }
          args=(--mode report --out "$RUNNER_TEMP/sofascore-fantasy-report.json")
          if [[ -n "${ROUND:-}" ]]; then args+=(--round "$ROUND"); fi
          if [[ "${INCLUDE_OBSERVED:-}" == "true" ]]; then args+=(--include-observed); fi
          set +e
          bun scripts/backend/sofascore-fantasy-simple-ingest.ts "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/run.log"
          report_status=("${PIPESTATUS[@]}")
          set -e
          if [[ "${report_status[0]}" -ne 0 || "${report_status[1]}" -ne 0 ]]; then
            {
              echo "## SofaScore report failed (read only; no writes)"
              echo
              echo "Runner exit: ${report_status[0]}; log capture exit: ${report_status[1]}."
              echo
              echo '```text'
              # The runner redacts credentials before emitting this single line.
              # Never copy arbitrary provider payloads or stderr into the summary.
              sed -n '/^SOFASCORE_FANTASY_REFUSED_BEFORE_WRITE:/p' "$RUNNER_TEMP/run.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [[ "${report_status[0]}" -ne 0 ]]; then exit "${report_status[0]}"; fi
            exit "${report_status[1]}"
          fi
          {
            echo "## SofaScore Fantasy simple report (production, read only)"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/sofascore-fantasy-report.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sofascore-fantasy-report-${{ github.run_id }}
          path: ${{ runner.temp }}/sofascore-fantasy-report.json
          if-no-files-found: warn
          retention-days: 14
