name: Send queued phone-push notifications

# Two modes, chosen by the typed confirmation:
#   CHECK_PUSH_CONFIGURATION -- no database access. Checks that the VAPID key
#     pair is set and matches, and that the contact is valid. Prints one line.
#   SEND_QUEUED_PUSH_NOTIFICATIONS -- claims up to WEB_PUSH_BATCH_LIMIT queued
#     push deliveries, sends each through the browser's push service and
#     records the outcome. It WRITES to Production V2 (delivery records), so
#     it shares the one-writer lock below and is never scheduled: a person
#     starts each run.
# Counts are the only output. No destination, key or message text is printed.
# docs/engineering/PHASE5_ENGAGEMENT_PLAN.md (step 3) has the setup.

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      confirmation:
        description: Type CHECK_PUSH_CONFIGURATION (no database) or SEND_QUEUED_PUSH_NOTIFICATIONS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && github.actor == 'mrdata007'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-admin-activation
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      SUPABASE_PRODUCTION_PROJECT_NAME: ${{ vars.SUPABASE_PRODUCTION_PROJECT_NAME }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
    steps:
      - name: Guard exact reviewed first owner dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_TRIGGERING_ACTOR" = "mrdata007"
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          case "$CONFIRMATION" in
            CHECK_PUSH_CONFIGURATION | SEND_QUEUED_PUSH_NOTIFICATIONS) ;;
            *) exit 1 ;;
          esac
          test "$SUPABASE_PRODUCTION_PROJECT_REF" = "tkewgajrljbwgwedqsxn"
          test "$SUPABASE_PRODUCTION_PROJECT_NAME" = "BotolaGO Production V2"
          test "${SUPABASE_PRODUCTION_URL%/}" = "https://tkewgajrljbwgwedqsxn.supabase.co"

      - name: Check out exact reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install and verify the push sender
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test src/backend/notifications scripts/backend/notification-push-dispatch.test.ts
          bun run backend:secrets:check

      - name: Check the push configuration (no database)
        if: inputs.confirmation == 'CHECK_PUSH_CONFIGURATION'
        env:
          WEB_PUSH_VAPID_PUBLIC_KEY: ${{ vars.WEB_PUSH_VAPID_PUBLIC_KEY }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
          WEB_PUSH_SUBJECT: ${{ vars.WEB_PUSH_SUBJECT }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$WEB_PUSH_VAPID_PRIVATE_KEY"
          bun scripts/backend/notification-push-dispatch.ts --check-config

      - name: Send one batch of queued push notifications
        if: inputs.confirmation == 'SEND_QUEUED_PUSH_NOTIFICATIONS'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          WEB_PUSH_VAPID_PUBLIC_KEY: ${{ vars.WEB_PUSH_VAPID_PUBLIC_KEY }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
          WEB_PUSH_SUBJECT: ${{ vars.WEB_PUSH_SUBJECT }}
          WEB_PUSH_BATCH_LIMIT: ${{ vars.WEB_PUSH_BATCH_LIMIT }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$WEB_PUSH_VAPID_PRIVATE_KEY"
          printf '::add-mask::%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
          printf '::add-mask::%s\n' "$WEB_PUSH_VAPID_PRIVATE_KEY"
          bun scripts/backend/notification-push-dispatch.ts
