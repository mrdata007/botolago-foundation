name: Fantasy scoring worker deploy

# Deploys only the existing leased scorer. Does not enable its schedule,
# change a secret, migrate the database or finalize a gameweek.
# Exact reviewed main commit, owner actor, approved environment and shared
# production mutation concurrency are required.

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit approved for this deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_FANTASY_SCORING_WORKER
        required: true
        type: string

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy fantasy-lifecycle-worker
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mrdata007'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-admin-activation
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      PROJECT_REF: tkewgajrljbwgwedqsxn
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Enforce immutable target
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "SUPABASE_ACCESS_TOKEN is missing from the environment."
            exit 2
          fi
          printf '::add-mask::%s\n' "$SUPABASE_ACCESS_TOKEN"
          if [[ "${GITHUB_RUN_ATTEMPT:-}" != "1" ]]; then
            echo "GITHUB_WORKFLOW_RERUN_FORBIDDEN"
            exit 2
          fi
          if [[ "$CONFIRMATION" != "DEPLOY_FANTASY_SCORING_WORKER" ||
                "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Immutable dispatch confirmation failed."
            exit 2
          fi

      - name: Check out the exact reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install reviewed runtime and run the function tests
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          test -x ./node_modules/.bin/supabase
          ./node_modules/.bin/supabase --version
          bun test supabase/functions/_shared/fantasy-lifecycle-handler.test.ts \
            scripts/backend/fantasy-lifecycle-runner.test.ts

      - name: Require the worker and native rating migrations (read-only)
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$(mktemp -d)"
          trap 'rm -rf "$runtime_dir"' EXIT
          query="select count(*)::int as n from supabase_migrations.schema_migrations where version in ('20261013170000', '20261018153305', '20261018173321', '20261018215311')"
          jq -n --arg query "$query" '{query: $query}' > "$runtime_dir/query.json"
          status="$(
            curl --silent --show-error --proto '=https' --tlsv1.2 \
              --connect-timeout 10 --max-time 60 --request POST \
              --output "$runtime_dir/response.json" --write-out '%{http_code}' \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$runtime_dir/query.json" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          )"
          if [[ "$status" != "200" && "$status" != "201" ]]; then
            echo "Reading schema_migrations failed with HTTP $status (response not shown). Nothing deployed."
            exit 3
          fi
          n="$(jq -r 'if type == "array" then .[0].n else (.result // .data)[0].n end' "$runtime_dir/response.json")"
          if [[ "$n" != "4" ]]; then
            echo "::error::Production lacks the reviewed worker/rating migrations. Nothing deployed."
            exit 3
          fi
          echo "All four worker/rating migrations are recorded in production."

      - name: Deploy fantasy-lifecycle-worker
        shell: bash
        run: |
          set -euo pipefail
          # --use-api bundles on Supabase's side: the runner pulls no edge-runtime
          # image, which public.ecr.aws refused on 2026-10-14 ("Data limit exceeded").
          ./node_modules/.bin/supabase functions deploy fantasy-lifecycle-worker --project-ref "$PROJECT_REF" --use-api
