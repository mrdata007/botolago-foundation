name: Ingest current finished Football performances

# Two modes, chosen by the typed confirmation:
#   DIAGNOSE_CURRENT_FINISHED_PERFORMANCES -- read-only. Lists the finished
#     fixtures, reads and validates each provider payload exactly as ingestion
#     would, and writes nothing: the evidence names every fixture that cannot
#     be certified, with the field path and value type or the unidentified
#     lineup rows. The first step of every recovery.
#   INGEST_CURRENT_FINISHED_PERFORMANCES -- publishes each fixture that
#     validates, one database transaction per fixture, and reports the rest.
# Either mode reads a page of up to five fixtures, or only the one named in
# only_fixture_external_id (the canary of a recovery; leave the cursor empty).
# docs/backend/CURRENT_FINISHED_FIXTURE_PERFORMANCES.md has the procedure.

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit
        required: true
        type: string
      confirmation:
        description: Type DIAGNOSE_CURRENT_FINISHED_PERFORMANCES (read-only) or INGEST_CURRENT_FINISHED_PERFORMANCES
        required: true
        type: string
      after_fixture_external_id:
        description: Prior verified batch cursor, empty for the first batch
        required: false
        type: string
      only_fixture_external_id:
        description: One SportsMonks fixture id to read (and ingest) alone, the canary; empty for a page
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

jobs:
  ingest:
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && github.actor == 'mrdata007'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-admin-activation
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      AFTER_FIXTURE_EXTERNAL_ID: ${{ inputs.after_fixture_external_id }}
      ONLY_FIXTURE_EXTERNAL_ID: ${{ inputs.only_fixture_external_id }}
      SUPABASE_PRODUCTION_PROJECT_NAME: ${{ vars.SUPABASE_PRODUCTION_PROJECT_NAME }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
    steps:
      - name: Guard exact reviewed first owner dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_TRIGGERING_ACTOR" = "mrdata007"
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          case "$CONFIRMATION" in
            INGEST_CURRENT_FINISHED_PERFORMANCES | DIAGNOSE_CURRENT_FINISHED_PERFORMANCES) ;;
            *) exit 1 ;;
          esac
          test "$SUPABASE_PRODUCTION_PROJECT_REF" = "tkewgajrljbwgwedqsxn"
          test "$SUPABASE_PRODUCTION_PROJECT_NAME" = "BotolaGO Production V2"
          test "${SUPABASE_PRODUCTION_URL%/}" = "https://tkewgajrljbwgwedqsxn.supabase.co"
          evidence_dir="$RUNNER_TEMP/current-finished-performances/evidence"
          install -d -m 0700 "$evidence_dir"
          echo "CURRENT_PERFORMANCE_EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"

      - name: Check out exact reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install and verify current performance runtime
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test scripts/backend/current-season-performances.test.ts scripts/backend/sportsmonks-production-probe.test.ts supabase/functions/_shared/sportsmonks-historical-player-performance.test.ts
          bun run backend:secrets:check

      - name: Diagnose or ingest at most five finished current fixtures, or the one canary
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SPORTSMONKS_API_TOKEN: ${{ secrets.SPORTSMONKS_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SECRET_KEY"
          test -n "$SPORTSMONKS_API_TOKEN"
          printf '::add-mask::%s\n' "$SUPABASE_SECRET_KEY"
          printf '::add-mask::%s\n' "$SPORTSMONKS_API_TOKEN"
          bun scripts/backend/current-season-performances.ts

      - name: Scan sanitized evidence
        id: evidence_scan
        if: always()
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SPORTSMONKS_API_TOKEN: ${{ secrets.SPORTSMONKS_API_TOKEN }}
        run: |
          set -euo pipefail
          test -d "$CURRENT_PERFORMANCE_EVIDENCE_DIR"
          python scripts/backend/phase7f-scan-sanitized-evidence.py "$CURRENT_PERFORMANCE_EVIDENCE_DIR"
          for value in "$SUPABASE_SECRET_KEY" "$SPORTSMONKS_API_TOKEN"; do
            if [[ -n "$value" ]] && grep -R -F -q -- "$value" "$CURRENT_PERFORMANCE_EVIDENCE_DIR"; then
              echo "CREDENTIAL_FOUND_IN_EVIDENCE"
              exit 1
            fi
          done

      - name: Upload current performance evidence
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-finished-performances-${{ github.run_id }}
          path: ${{ env.CURRENT_PERFORMANCE_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
