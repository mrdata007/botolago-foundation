name: AI news pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry run reads permitted sources and calls the selected model without CMS writes
        required: true
        default: dry-run
        type: choice
        options: [dry-run, run]
      expected_commit:
        description: Exact reviewed main commit SHA
        required: true
        type: string
      confirmation:
        description: Type RUN_AI_NEWS
        required: true
        type: string
  schedule:
    - cron: "43 */6 * * *"

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && github.actor == 'mrdata007' &&
        inputs.expected_commit == github.sha && inputs.confirmation == 'RUN_AI_NEWS') ||
       (github.event_name == 'schedule' && vars.AI_NEWS_SCHEDULE_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-admin-activation
    env:
      AI_NEWS_KILL_SWITCH: ${{ vars.AI_NEWS_KILL_SWITCH }}
      AI_NEWS_SOURCE_RIGHTS_APPROVED: ${{ vars.AI_NEWS_SOURCE_RIGHTS_APPROVED }}
      AI_NEWS_PROVIDER: ${{ vars.AI_NEWS_PROVIDER }}
      AI_NEWS_MODEL: ${{ vars.AI_NEWS_MODEL }}
      AI_NEWS_LANGUAGE: ${{ vars.AI_NEWS_LANGUAGE }}
      AI_NEWS_DAILY_LIMIT: ${{ vars.AI_NEWS_DAILY_LIMIT }}
      AI_NEWS_AUTO_PUBLISH: ${{ vars.AI_NEWS_AUTO_PUBLISH }}
      SUPABASE_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test scripts/backend/ai-news/pipeline.test.ts
      - name: Gather, validate and draft
        run: bun scripts/backend/ai-news/run.ts ${{ github.event_name == 'schedule' && '--run' || format('--{0}', inputs.mode) }}
