name: Staging reminder and response-loss drill

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [run, reminderrecover, reminderretire]
        default: run
        required: true
        description: "Run, recover an interrupted run, or retire its fixture after owner UI review"
      staging_app_origin:
        type: string
        required: true
        description: "Owner Mac URL: https://PRIVATE_LAN_IP:8443"
      confirmation:
        type: string
        required: true
        description: "Type RUN_STAGING_REMINDER_DRILL"

concurrency:
  group: phase6-staging-load-test
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  drill:
    if: github.repository == 'mrdata007/botolago-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: staging-load-test
    steps:
      - name: Validate manual staging dispatch
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "RUN_STAGING_REMINDER_DRILL"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Refuse another staging writer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/backend/staging-writer-guard.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify configuration and install pinned runtime
        run: |
          node scripts/backend/check-config-integrity.mjs
          bun install --frozen-lockfile
      - name: Own the complete staging rehearsal and restoration
        env:
          ACTION: ${{ inputs.action }}
          STAGING_APP_ORIGIN: ${{ inputs.staging_app_origin }}
          STAGING_QA_OWNER_IDS: ${{ secrets.STAGING_QA_OWNER_IDS }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
        run: python scripts/backend/staging-reminder-drill.py
