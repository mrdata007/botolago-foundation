name: Production watchdog

# Read-only production health check every 30 minutes (docs/operations/ALERTS.md):
# the database's own checks (api.service_ops_health), the public pages and
# one public API call as a visitor meets them (the sitemap must list URLs),
# whether the Fantasy season orchestrator has actually run and whether its
# last run was red, and every Fantasy gameweek whose window has ended without
# final points, read from the database (fantasy_points; the allowance is the
# orchestrator's FANTASY_COVERAGE_ESCALATE_HOURS). A failing check opens (or
# updates) one GitHub issue labelled `ops-alert` that mentions the owner; the
# next healthy run closes it. Dispatch it by hand with "simulate_failure" to
# test the alert path end to end.
#
# Why it also runs after the orchestrator: GitHub's schedule is best effort.
# This workflow reached main at 05:24 UTC on 2026-09-25 and GitHub had not
# started it once by 07:47, while it started the hourly orchestrator only
# every three to six hours. Nothing in this file gates the schedule (no
# repository variable, no ref other than main), so there was nothing to
# switch on; running after every orchestrator run means the watchdog runs
# whenever the season job does, and its `watchdog_schedule` row shows when
# GitHub last honoured its own schedule. The channel that does not depend on
# GitHub at all is the database webhook (docs/operations/ALERTS.md).

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_run:
    workflows: ["Fantasy season orchestrator"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Add a failing check to test the alert path
        type: boolean
        default: false

concurrency:
  group: botolago-ops-watchdog
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  watch:
    # A workflow_run event carries the default branch as its ref, and runs this
    # file as it is on main, never code from the run that triggered it.
    if: github.repository == 'mrdata007/botolago-foundation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-admin-activation
    env:
      SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      WATCHDOG_SIMULATE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure && 'true' || 'false' }}
      WATCHDOG_EVIDENCE: ${{ github.workspace }}/watchdog.json
      FANTASY_COVERAGE_ESCALATE_HOURS: ${{ vars.FANTASY_COVERAGE_ESCALATE_HOURS }}
    steps:
      - name: Guard the production target
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_PRODUCTION_PROJECT_REF" = "tkewgajrljbwgwedqsxn"
          test "${SUPABASE_PRODUCTION_URL%/}" = "https://tkewgajrljbwgwedqsxn.supabase.co"

      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: scripts/ops

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Check production health
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PRODUCTION_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PRODUCTION_PUBLISHABLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$SUPABASE_SECRET_KEY"
          bun scripts/ops/watchdog.ts

      - name: Alert on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/ops/github-alert.ts failure "Production health" "$WATCHDOG_EVIDENCE"

      - name: Clear the alert when healthy
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/ops/github-alert.ts success "Production health"
