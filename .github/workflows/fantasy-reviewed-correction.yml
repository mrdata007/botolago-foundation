name: Fantasy reviewed correction (Sofascore)

# Fills in finished matches whose SportsMonks statistics never arrived, from
# Sofascore's lineups and match events, after the owner reviews them.
# scripts/backend/reviewed-correction.ts has the rules.
#
#   PREPARE_REVIEWED_CORRECTION  read-only: reads Sofascore (3 requests per
#     match) and production, then posts one issue comment per fixture with the
#     table to check and the proposal file. Writes nothing to the database.
#   DRY_RUN_REVIEWED_CORRECTION  runs every database guard on the proposals
#     committed under proposal_dir and rolls back. Writes nothing.
#   RECORD_REVIEWED_CORRECTION   dry-runs them all first; records only if every
#     one passes, then reads each back.
#
# The proposals are approved by merging them to main; RECORD reads them from
# the exact dispatched commit.

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact main commit
        required: true
        type: string
      confirmation:
        description: PREPARE_REVIEWED_CORRECTION, DRY_RUN_REVIEWED_CORRECTION or RECORD_REVIEWED_CORRECTION
        required: true
        type: string
      fixture_external_ids:
        description: Our fixtures (SportsMonks ids), comma-separated
        required: false
        type: string
        default: "19893370,19893371,19893372,19893373"
      sofascore_match_ids:
        description: Sofascore match ids to read (PREPARE only)
        required: false
        type: string
        default: "17256977,17256980,17256968,17256969,17256974"
      proposal_dir:
        description: Committed proposals (DRY_RUN and RECORD)
        required: false
        type: string
        default: docs/production/reviewed-corrections/gw3

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mrdata007'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - id: mode
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_RUN_ATTEMPT:-}" != "1" ]]; then echo "Dispatch a new run instead of re-running."; exit 2; fi
          if [[ "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then echo "Not the expected main commit."; exit 2; fi
          case "$CONFIRMATION" in
            PREPARE_REVIEWED_CORRECTION) echo "mode=prepare" >> "$GITHUB_OUTPUT" ;;
            DRY_RUN_REVIEWED_CORRECTION) echo "mode=dry-run" >> "$GITHUB_OUTPUT" ;;
            RECORD_REVIEWED_CORRECTION) echo "mode=record" >> "$GITHUB_OUTPUT" ;;
            *) echo "Invalid confirmation."; exit 2 ;;
          esac

  fetch:
    needs: guard
    if: needs.guard.outputs.mode == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging-load-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Read the Sofascore matches (read-only)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          MATCH_IDS: ${{ inputs.sofascore_match_ids }}
          OUT_DIR: ${{ runner.temp }}/sofascore
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$RAPIDAPI_KEY"
          bun scripts/backend/reviewed-correction-fetch.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sofascore-matches
          path: ${{ runner.temp }}/sofascore/sofascore-matches.json
          retention-days: 3

  prepare:
    needs: [guard, fetch]
    if: needs.guard.outputs.mode == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-admin-activation
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sofascore-matches
          path: ${{ runner.temp }}/sofascore
      - name: Build the proposals (read-only on production)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FIXTURE_EXTERNAL_IDS: ${{ inputs.fixture_external_ids }}
          IN_FILE: ${{ runner.temp }}/sofascore/sofascore-matches.json
          OUT_DIR: ${{ runner.temp }}/review
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$SUPABASE_ACCESS_TOKEN"
          bun scripts/backend/reviewed-correction-prepare.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewed-correction-proposals
          path: ${{ runner.temp }}/review
          retention-days: 14
      - name: Post the review on an issue
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_DIR: ${{ runner.temp }}/review
        run: |
          set -euo pipefail
          issue_url="$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Fantasy reviewed correction: please check (run $GITHUB_RUN_ID)" \
            --body "Proposals from Sofascore for fixtures ${{ inputs.fixture_external_ids }}. One comment per fixture: the table to check, then the file to commit under ${{ inputs.proposal_dir }}. Nothing has been written to the database.")"
          number="${issue_url##*/}"
          head -c 60000 "$REVIEW_DIR/REVIEW.md" > "$RUNNER_TEMP/review-head.md"
          gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/review-head.md"
          shopt -s nullglob
          for file in "$REVIEW_DIR"/proposals/*.json; do
            {
              echo "Proposal file \`$(basename "$file")\`:"
              echo
              echo '```json'
              cat "$file"
              echo '```'
            } > "$RUNNER_TEMP/comment.md"
            if [[ $(wc -c < "$RUNNER_TEMP/comment.md") -gt 64000 ]]; then
              echo "Proposal $(basename "$file") is too long for a comment; it is in the run's artifact." > "$RUNNER_TEMP/comment.md"
            fi
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          done
          echo "::notice::Review posted: $issue_url"

  record:
    needs: guard
    if: needs.guard.outputs.mode == 'dry-run' || needs.guard.outputs.mode == 'record'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-admin-activation
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test scripts/backend/reviewed-correction.test.ts scripts/backend/reviewed-correction-db.test.ts
      - name: Dry run, or record after a passing dry run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROPOSAL_DIR: ${{ inputs.proposal_dir }}
          MODE: ${{ needs.guard.outputs.mode }}
          REVIEWER: mrdata007
          REASON: "SportsMonks sent no player data for these finished matches; filled in from Sofascore lineups and match events, reviewed by the owner."
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$SUPABASE_ACCESS_TOKEN"
          bun scripts/backend/reviewed-correction-record.ts
