name: SofaScore scheduled integration (isolated, synthetic provider)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sofascore-automation-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scheduled-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Config integrity guard
        run: node scripts/backend/check-config-integrity.mjs
      - run: bun install --frozen-lockfile
      # Same disposable database command as Backend quality. No remote project,
      # provider key, environment secret, deployment or production activation.
      - run: bun run backend:db:start
      - name: Actual cron, handlers, recorder and scorer; synthetic provider
        run: bun scripts/backend/sofascore-automation-e2e.ts
      - name: Upload sanitized scheduled evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sofascore-automation-e2e-${{ github.run_id }}
          path: /tmp/sofascore-automation-e2e.json
          if-no-files-found: warn
          retention-days: 14
      - name: Stop isolated database
        if: always()
        run: bun run backend:db:stop
