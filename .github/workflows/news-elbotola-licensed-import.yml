name: ElBotola licensed import

# Imports ElBotola's Botola Pro articles (Arabic, plus French where ElBotola
# published one, since 2021-09-23) into production as PRIVATE DRAFTS, under
# the ElBotola licence recorded on app.publishers (2026-09-24). Nothing is
# published by this workflow. See scripts/backend/elbotola-licensed-import.ts.
#
# Run "dry-run" first: every batch is executed and rolled back. Then "import".
# An interrupted import can be started again; stories already present are
# skipped.

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit (full SHA)
        required: true
        type: string
      confirmation:
        description: Type RUN_ELBOTOLA_LICENSED_IMPORT
        required: true
        type: string
      mode:
        description: dry-run (nothing kept) or import (drafts written)
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - import
      limit:
        description: Optional number of stories (newest first); empty = all
        required: false
        type: string

# The same lock as every other production writer: never two at once.
concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'mrdata007'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment: production-admin-activation
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      IMPORT_MODE: ${{ inputs.mode }}
      IMPORT_LIMIT: ${{ inputs.limit }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}

    steps:
      - name: Check out reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify the import's own guards
        run: |
          set -euo pipefail
          test "$SUPABASE_PRODUCTION_PROJECT_REF" = "tkewgajrljbwgwedqsxn"
          test -n "$SUPABASE_ACCESS_TOKEN"
          bun install --frozen-lockfile
          bun test scripts/backend/elbotola-licensed-import.test.ts

      - name: Run licensed import (${{ inputs.mode }})
        run: bun scripts/backend/elbotola-licensed-import.ts
