name: G7 Production historical player performance backfill

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit approved for the historical-only backfill
        required: true
        type: string
      confirmation:
        description: Type RUN_G7_TWO_SEASON_HISTORICAL_PERFORMANCE_BACKFILL
        required: true
        type: string
      season_ids:
        description: Comma-separated seasons to backfill (non-empty, duplicate-free subset of 26027, 24319)
        required: true
        type: string
      current_season_id:
        description: The live current-season provider id function secrets must be restored to (expected 28647)
        required: true
        type: string
      current_season_start:
        description: Live FOOTBALL_SPORTSMONKS_SEASON_START to restore
        required: true
        type: string
      current_season_end:
        description: Live FOOTBALL_SPORTSMONKS_SEASON_END to restore
        required: true
        type: string
      current_fixture_from:
        description: Live FOOTBALL_SPORTSMONKS_FIXTURE_FROM to restore
        required: true
        type: string
      current_fixture_to:
        description: Live FOOTBALL_SPORTSMONKS_FIXTURE_TO to restore
        required: true
        type: string
      current_team_ids:
        description: Comma-separated live FOOTBALL_SPORTSMONKS_TEAM_IDS to restore
        required: true
        type: string
      current_trigger_secret:
        description: Only if FOOTBALL_INGESTION_TRIGGER_SECRET is currently set in production (a capture-only dispatch tells you); leave blank otherwise
        required: false
        type: string
      restore_only:
        description: Recovery path only — skip preflight/migrations/deploy/mutation and just re-assert + verify the reviewed current-runtime configuration
        required: false
        type: boolean
        default: false
      skip_deploy:
        description: Skip redeploying football-ingest (only when the live function's identity already matches expected_function_version/expected_function_ezbr_sha256)
        required: false
        type: boolean
        default: false
      expected_function_version:
        description: Required when skip_deploy is true — the live football-ingest version this reviewed commit expects
        required: false
        type: string
      expected_function_ezbr_sha256:
        description: Required when skip_deploy is true — the live football-ingest ezbr_sha256 this reviewed commit expects
        required: false
        type: string

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    name: Backfill completed-season player facts and derive v2 ratings
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mrdata007'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: production-admin-activation
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_PROJECT_REF: tkewgajrljbwgwedqsxn
      EXPECTED_PROJECT_NAME: BotolaGO Production V2
      G7_SEASON_IDS: ${{ inputs.season_ids }}
      G7_CURRENT_SEASON_ID: ${{ inputs.current_season_id }}
      G7_CURRENT_SEASON_START: ${{ inputs.current_season_start }}
      G7_CURRENT_SEASON_END: ${{ inputs.current_season_end }}
      G7_CURRENT_FIXTURE_FROM: ${{ inputs.current_fixture_from }}
      G7_CURRENT_FIXTURE_TO: ${{ inputs.current_fixture_to }}
      G7_CURRENT_TEAM_IDS: ${{ inputs.current_team_ids }}
      G7_CURRENT_TRIGGER_SECRET: ${{ inputs.current_trigger_secret }}
      G7_RESTORE_ONLY: ${{ inputs.restore_only }}
      G7_SKIP_DEPLOY: ${{ inputs.skip_deploy }}
      G7_EXPECTED_FUNCTION_VERSION: ${{ inputs.expected_function_version }}
      G7_EXPECTED_FUNCTION_EZBR_SHA256: ${{ inputs.expected_function_ezbr_sha256 }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SPORTSMONKS_API_TOKEN: ${{ secrets.SPORTSMONKS_API_TOKEN }}
      SUPABASE_PRODUCTION_PROJECT_NAME: ${{ vars.SUPABASE_PRODUCTION_PROJECT_NAME }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}

    steps:
      - name: Enforce immutable historical-only production target
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          for value in \
            "$SUPABASE_ACCESS_TOKEN" "$SUPABASE_SECRET_KEY" \
            "$SUPABASE_DB_PASSWORD" "$SPORTSMONKS_API_TOKEN" \
            "${G7_CURRENT_TRIGGER_SECRET:-}"; do
            if [[ -n "$value" ]]; then printf '::add-mask::%s\n' "$value"; fi
          done
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_SECRET_KEY" ||
                -z "$SUPABASE_DB_PASSWORD" || -z "$SPORTSMONKS_API_TOKEN" ]]; then
            echo "Protected credential injection failed before mutation."
            exit 2
          fi
          if [[ "${GITHUB_RUN_ATTEMPT:-}" != "1" ]]; then
            echo "GITHUB_WORKFLOW_RERUN_FORBIDDEN"
            exit 2
          fi
          if [[ "$CONFIRMATION" != "RUN_G7_TWO_SEASON_HISTORICAL_PERFORMANCE_BACKFILL" ||
                "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Immutable dispatch confirmation failed."
            exit 2
          fi
          if [[ "$SUPABASE_PRODUCTION_PROJECT_REF" != "$EXPECTED_PROJECT_REF" ||
                "$SUPABASE_PRODUCTION_PROJECT_NAME" != "$EXPECTED_PROJECT_NAME" ||
                "${SUPABASE_PRODUCTION_URL%/}" != "https://${EXPECTED_PROJECT_REF}.supabase.co" ]]; then
            echo "Production project guard failed."
            exit 2
          fi
          if [[ "$G7_SKIP_DEPLOY" == "true" &&
                ( -z "${G7_EXPECTED_FUNCTION_VERSION:-}" || -z "${G7_EXPECTED_FUNCTION_EZBR_SHA256:-}" ) ]]; then
            echo "skip_deploy requires expected_function_version and expected_function_ezbr_sha256."
            exit 2
          fi
          runtime_dir="$RUNNER_TEMP/botolago-g7-historical-performance-backfill"
          evidence_dir="$runtime_dir/evidence"
          install -d -m 0700 "$runtime_dir" "$evidence_dir"
          {
            echo "G7_BACKFILL_RUNTIME_DIR=$runtime_dir"
            echo "G7_BACKFILL_EVIDENCE_DIR=$evidence_dir"
          } >> "$GITHUB_ENV"
          echo "evidence_dir=$evidence_dir" >> "$GITHUB_OUTPUT"
          echo "Historical-only production target guard: PASS"

      - name: Check out exact reviewed main commit
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify reviewed historical-only ticket
        id: ticket
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "schemaVersion": 1,
              "requestId": "g7-historical-performance-backfill-2026-09-18-01",
              "mode": "production_two_season_historical_player_performance_backfill",
              "requestedSeasonIds": [26027],
              "expectedFixturesPerSeason": 240,
              "batchSize": 5,
              "algorithmVersion": "botolago-preseason-rating-v2-fixture-performance",
              "repairOf": {
                  "runId": 30764205550,
                  "headSha": "f5793ef88a3ae7aeb397f64a995eff71220e79c0",
                  "artifactId": 8838423340,
                  "artifactSha256": "88521ccd76e96f3d740c6bd8b380564871ad274bb6c93cbc30fbe3135ec7e4fc",
                  "failureCode": "season-26027-performance-batch-01_mapping_not_found",
              },
              "diagnosticOf": {
                  "runId": 30767229746,
                  "headSha": "b235bda5e51207ebc4f9c14552a51783ed1f8fa4",
                  "artifactId": 8839345194,
                  "artifactSha256": "10fa610f2e606c42f7b40bbf13a1b1c33927f168c78f2e3a08c9565a84cddd44",
                  "failureCode": "season-26027-performance-batch-02_historical_fixture_coverage_incomplete",
              },
              "coverageDiagnostics": {
                  "providerPayloadIncluded": False,
                  "fixtureIdIncluded": True,
                  "boundedCountsIncluded": True,
                  "failedInvariantsIncluded": True,
              },
              "mappingQuarantine": {
                  "unmappedPlayerRows": "exclude",
                  "requiredMappedStartersPerFixture": 22,
                  "requiredMappedTeamsPerFixture": 2,
                  "maxTotalExcludedRowsPerFixture": 20,
              },
              "historicalOnly": True,
              "currentSeasonActivated": False,
              "currentSeasonId": 28647,
              "restorePolicy": {
                  "source": "captured_pre_run_fingerprints",
                  "triggerSecret": "unset_if_absent_else_restore_or_refuse",
                  "verifyAfterRestore": True,
              },
              "skipDeployRequiresFunctionIdentity": True,
              "confirmation": "RUN_G7_TWO_SEASON_HISTORICAL_PERFORMANCE_BACKFILL",
          }
          actual = json.loads(Path(
              "docs/production/g7-historical-performance-backfill-trigger.json"
          ).read_text(encoding="utf-8"))
          if actual != expected:
              raise SystemExit("INVALID_G7_HISTORICAL_PERFORMANCE_BACKFILL_TICKET")
          PY
          echo "Reviewed historical-only ticket: PASS"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install and verify reviewed runtime
        id: quality
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test \
            scripts/backend/g7-historical-performance-backfill-runner.test.ts \
            scripts/backend/g7-historical-performance-backfill-preflight.test.ts \
            scripts/backend/sportsmonks-two-season-backfill-preflight.test.ts \
            scripts/backend/gate4-sanitize-command-log.test.ts \
            supabase/functions/_shared/sportsmonks-historical-player-performance.test.ts \
            supabase/functions/_shared/sportsmonks-player-ratings.test.ts
          bun run typecheck
          bun run backend:migrations:check
          bun run backend:secrets:check
          grep -q 'football_historical_player_rating_inputs' \
            src/backend/generated/database.types.ts
          test -x ./node_modules/.bin/supabase

      - name: Capture pre-run function configuration
        id: capture
        if: env.G7_RESTORE_ONLY != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/backend/g7-historical-performance-backfill-runner.ts --capture-only

      - name: Re-prove the exact two-season provider scope without writes
        id: preflight
        if: env.G7_RESTORE_ONLY != 'true' && steps.capture.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/backend/g7-historical-performance-backfill-preflight.ts

      - name: Check football-ingest identity before skipping deploy
        id: function_identity
        if: env.G7_RESTORE_ONLY != 'true' && env.G7_SKIP_DEPLOY == 'true' && steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          ref = os.environ["EXPECTED_PROJECT_REF"]
          request = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{ref}/functions",
              headers={"Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              functions = json.loads(response.read().decode("utf-8"))
          function = next((f for f in functions if f.get("slug") == "football-ingest"), None)
          if function is None:
              raise SystemExit("FOOTBALL_INGEST_FUNCTION_NOT_FOUND")
          if (
              str(function.get("version")) != os.environ["G7_EXPECTED_FUNCTION_VERSION"]
              or function.get("ezbr_sha256") != os.environ["G7_EXPECTED_FUNCTION_EZBR_SHA256"]
          ):
              raise SystemExit("FOOTBALL_INGEST_FUNCTION_IDENTITY_MISMATCH")
          PY
          echo "football-ingest identity: PASS"

      - name: Apply reviewed forward-only migrations
        id: migrations
        if: >-
          env.G7_RESTORE_ONLY != 'true' &&
          steps.preflight.outcome == 'success' &&
          (env.G7_SKIP_DEPLOY != 'true' || steps.function_identity.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          run_raw() {
            local operation="$1"
            shift
            local raw_path="$G7_BACKFILL_RUNTIME_DIR/${operation}.raw.log"
            local exit_path="$G7_BACKFILL_RUNTIME_DIR/${operation}.exit"
            local exit_code
            set +e
            "$@" > "$raw_path" 2>&1
            exit_code=$?
            set -e
            printf '%s\n' "$exit_code" > "$exit_path"
            chmod 0600 "$raw_path" "$exit_path"
            return "$exit_code"
          }
          run_raw project-link \
            ./node_modules/.bin/supabase link \
            --project-ref "$EXPECTED_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          run_raw db-push-dry-run \
            ./node_modules/.bin/supabase db push --linked \
            --password "$SUPABASE_DB_PASSWORD" --dry-run
          run_raw db-push \
            ./node_modules/.bin/supabase db push --linked \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy reviewed football ingestion runtime
        id: deploy
        if: >-
          env.G7_RESTORE_ONLY != 'true' &&
          env.G7_SKIP_DEPLOY != 'true' &&
          steps.preflight.outcome == 'success' &&
          steps.migrations.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          operation="functions-deploy-football-ingest"
          raw_path="$G7_BACKFILL_RUNTIME_DIR/${operation}.raw.log"
          exit_path="$G7_BACKFILL_RUNTIME_DIR/${operation}.exit"
          set +e
          ./node_modules/.bin/supabase functions deploy football-ingest \
            --project-ref "$EXPECTED_PROJECT_REF" > "$raw_path" 2>&1
          exit_code=$?
          set -e
          printf '%s\n' "$exit_code" > "$exit_path"
          chmod 0600 "$raw_path" "$exit_path"
          exit "$exit_code"

      - name: Backfill requested completed-season fixtures and derive v2 ratings
        id: mutation
        if: >-
          env.G7_RESTORE_ONLY != 'true' &&
          steps.preflight.outcome == 'success' &&
          steps.migrations.outcome == 'success' &&
          (env.G7_SKIP_DEPLOY == 'true' || steps.deploy.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          operation="historical-performance-backfill-runner"
          raw_path="$G7_BACKFILL_RUNTIME_DIR/${operation}.raw.log"
          exit_path="$G7_BACKFILL_RUNTIME_DIR/${operation}.exit"
          set +e
          bun scripts/backend/g7-historical-performance-backfill-runner.ts \
            > "$raw_path" 2>&1
          exit_code=$?
          set -e
          printf '%s\n' "$exit_code" > "$exit_path"
          chmod 0600 "$raw_path" "$exit_path"
          exit "$exit_code"

      - name: Restore production function configuration
        id: restore
        if: always() && (env.G7_RESTORE_ONLY == 'true' || steps.capture.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          operation="restore-production-function-configuration"
          raw_path="$G7_BACKFILL_RUNTIME_DIR/${operation}.raw.log"
          exit_path="$G7_BACKFILL_RUNTIME_DIR/${operation}.exit"
          set +e
          if [[ "$G7_RESTORE_ONLY" == "true" ]]; then
            bun scripts/backend/g7-historical-performance-backfill-runner.ts --restore-only \
              > "$raw_path" 2>&1
          else
            bun scripts/backend/g7-historical-performance-backfill-runner.ts --restore \
              > "$raw_path" 2>&1
          fi
          exit_code=$?
          set -e
          printf '%s\n' "$exit_code" > "$exit_path"
          chmod 0600 "$raw_path" "$exit_path"
          exit "$exit_code"

      - name: Preserve sanitized command evidence
        id: command_logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export FOOTBALL_INGESTION_TRIGGER_SECRET="${G7_BACKFILL_TRIGGER:-}"
          if [[ ! -d "${G7_BACKFILL_RUNTIME_DIR:-}" ||
                ! -d "${G7_BACKFILL_EVIDENCE_DIR:-}" ]]; then
            echo "G7_BACKFILL_RUNTIME_NOT_INITIALIZED"
            exit 1
          fi
          shopt -s nullglob
          for source in "$G7_BACKFILL_RUNTIME_DIR"/*.raw.log; do
            operation=$(basename "$source" .raw.log)
            exit_path="$G7_BACKFILL_RUNTIME_DIR/${operation}.exit"
            if [[ ! -f "$exit_path" ]]; then
              echo "G7_COMMAND_EXIT_CODE_MISSING operation=$operation"
              exit 1
            fi
            exit_code=$(tr -d '[:space:]' < "$exit_path")
            if [[ ! "$exit_code" =~ ^[0-9]+$ ]]; then
              echo "G7_COMMAND_EXIT_CODE_INVALID operation=$operation"
              exit 1
            fi
            GATE4_COMMAND_LOG_SOURCE="$source" \
              GATE4_COMMAND_LOG_DESTINATION="$G7_BACKFILL_EVIDENCE_DIR/${operation}.log" \
              GATE4_COMMAND_OPERATION="$operation" \
              GATE4_COMMAND_EXIT_CODE="$exit_code" \
              bun scripts/backend/gate4-sanitize-command-log.ts
          done
          echo "Sanitized G7 command evidence preserved."

      - name: Verify evidence contains no credentials
        id: evidence_scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export FOOTBALL_INGESTION_TRIGGER_SECRET="${G7_BACKFILL_TRIGGER:-}"
          python scripts/backend/phase7f-scan-sanitized-evidence.py \
            "$G7_BACKFILL_EVIDENCE_DIR"
          for secret_value in \
            "$SUPABASE_ACCESS_TOKEN" \
            "$SUPABASE_SECRET_KEY" \
            "$SUPABASE_DB_PASSWORD" \
            "$SPORTSMONKS_API_TOKEN" \
            "${G7_CURRENT_TRIGGER_SECRET:-}" \
            "${FOOTBALL_INGESTION_TRIGGER_SECRET:-}"; do
            if [[ -n "$secret_value" ]] && \
              grep -R -F -q -- "$secret_value" "$G7_BACKFILL_EVIDENCE_DIR"; then
              echo "CREDENTIAL_FOUND_IN_G7_BACKFILL_EVIDENCE"
              exit 1
            fi
          done
          echo "G7 historical backfill evidence credential scan: PASS"

      - name: Upload sanitized historical backfill evidence
        id: evidence_upload
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g7-production-historical-performance-backfill-${{ github.run_id }}
          path: ${{ steps.runtime.outputs.evidence_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove protected runtime files
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${G7_BACKFILL_RUNTIME_DIR:-}" && -d "$G7_BACKFILL_RUNTIME_DIR" ]]; then
            find "$G7_BACKFILL_RUNTIME_DIR" -type f -exec chmod 0600 {} \;
            find "$G7_BACKFILL_RUNTIME_DIR" -type f -delete
            rmdir "$G7_BACKFILL_EVIDENCE_DIR" 2>/dev/null || true
            rmdir "$G7_BACKFILL_RUNTIME_DIR" 2>/dev/null || true
          fi
          echo "Protected G7 runtime files removed."

      - name: Finalize historical-only backfill verdict
        if: always()
        shell: bash
        env:
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          FUNCTION_IDENTITY_OUTCOME: ${{ steps.function_identity.outcome }}
          MIGRATIONS_OUTCOME: ${{ steps.migrations.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          MUTATION_OUTCOME: ${{ steps.mutation.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          LOG_OUTCOME: ${{ steps.command_logs.outcome }}
          SCAN_OUTCOME: ${{ steps.evidence_scan.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          if [[ "$RESTORE_OUTCOME" != "success" ]]; then
            echo "G7_PRODUCTION_HISTORICAL_PERFORMANCE_BACKFILL_FAILED reason=restore_not_verified"
            exit 1
          fi
          if [[ "$G7_RESTORE_ONLY" == "true" ]]; then
            if [[ "$QUALITY_OUTCOME" != "success" || "$LOG_OUTCOME" != "success" ||
                  "$SCAN_OUTCOME" != "success" || "$UPLOAD_OUTCOME" != "success" ||
                  "$CLEANUP_OUTCOME" != "success" ]]; then
              echo "G7_PRODUCTION_HISTORICAL_PERFORMANCE_BACKFILL_FAILED reason=restore_only_step_failed"
              exit 1
            fi
            echo "G7_PRODUCTION_HISTORICAL_PERFORMANCE_RESTORE_ONLY_PASS"
            exit 0
          fi
          if [[ "$QUALITY_OUTCOME" != "success" ||
                "$CAPTURE_OUTCOME" != "success" ||
                "$PREFLIGHT_OUTCOME" != "success" ||
                "$MIGRATIONS_OUTCOME" != "success" ||
                "$MUTATION_OUTCOME" != "success" ||
                "$LOG_OUTCOME" != "success" ||
                "$SCAN_OUTCOME" != "success" ||
                "$UPLOAD_OUTCOME" != "success" ||
                "$CLEANUP_OUTCOME" != "success" ]]; then
            echo "G7_PRODUCTION_HISTORICAL_PERFORMANCE_BACKFILL_FAILED"
            exit 1
          fi
          if [[ "$G7_SKIP_DEPLOY" != "true" && "$DEPLOY_OUTCOME" != "success" ]]; then
            echo "G7_PRODUCTION_HISTORICAL_PERFORMANCE_BACKFILL_FAILED reason=deploy_not_successful"
            exit 1
          fi
          if [[ "$G7_SKIP_DEPLOY" == "true" && "$FUNCTION_IDENTITY_OUTCOME" != "success" ]]; then
            echo "G7_PRODUCTION_HISTORICAL_PERFORMANCE_BACKFILL_FAILED reason=function_identity_not_verified"
            exit 1
          fi
          echo "G7_PRODUCTION_HISTORICAL_PERFORMANCE_BACKFILL_PASS"
