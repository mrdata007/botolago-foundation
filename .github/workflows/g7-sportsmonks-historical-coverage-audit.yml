name: G7 SportsMonks historical fixture coverage audit

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit approved for the provider-only audit
        required: true
        type: string
      confirmation:
        description: Type RUN_G7_SPORTSMONKS_COVERAGE_AUDIT
        required: true
        type: string

concurrency:
  group: botolago-sportsmonks-read-only-coverage-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Audit 480 SportsMonks fixture payloads without Supabase access
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mrdata007'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production-admin-activation
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      SPORTSMONKS_API_TOKEN: ${{ secrets.SPORTSMONKS_API_TOKEN }}

    steps:
      - name: Enforce immutable provider-only audit scope
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$SPORTSMONKS_API_TOKEN" ]]; then
            printf '::add-mask::%s\n' "$SPORTSMONKS_API_TOKEN"
          fi
          if [[ -z "$SPORTSMONKS_API_TOKEN" ]]; then
            echo "SportsMonks credential injection failed."
            exit 2
          fi
          if [[ "${GITHUB_RUN_ATTEMPT:-}" != "1" ]]; then
            echo "GITHUB_WORKFLOW_RERUN_FORBIDDEN"
            exit 2
          fi
          if [[ "$CONFIRMATION" != "RUN_G7_SPORTSMONKS_COVERAGE_AUDIT" ||
                "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Immutable provider audit confirmation failed."
            exit 2
          fi
          runtime_dir="$RUNNER_TEMP/botolago-g7-sportsmonks-coverage-audit"
          evidence_dir="$runtime_dir/evidence"
          install -d -m 0700 "$runtime_dir" "$evidence_dir"
          {
            echo "G7_COVERAGE_AUDIT_RUNTIME_DIR=$runtime_dir"
            echo "G7_COVERAGE_AUDIT_EVIDENCE_DIR=$evidence_dir"
          } >> "$GITHUB_ENV"
          echo "runtime_dir=$runtime_dir" >> "$GITHUB_OUTPUT"
          echo "evidence_dir=$evidence_dir" >> "$GITHUB_OUTPUT"

      - name: Check out exact reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false

      - name: Verify reviewed provider-only audit ticket
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "schemaVersion": 1,
              "requestId": "g7-sportsmonks-two-season-coverage-audit-2026-08-02-01",
              "mode": "read_only_two_season_historical_fixture_coverage_audit",
              "requestedSeasonIds": [26027, 24319],
              "expectedFixturesPerSeason": 240,
              "providerPayloadIncluded": False,
              "supabaseAccess": False,
              "databaseWrites": False,
              "diagnosticOf": {
                  "runId": 30767752509,
                  "headSha": "5577bdb987e0212ed8c63a84c53e025d40a275be",
                  "artifactId": 8839509446,
                  "artifactSha256": "97b3db1a6542a0316958841a4ce2238ba03c313d3997706b498ec627e04387b0",
                  "failureCode": "season-26027-performance-batch-02_historical_fixture_coverage_incomplete",
                  "fixtureId": 19489216,
                  "lineupRowsSeen": 40,
                  "validPlayerRows": 38,
                  "excludedIncompleteRows": 2,
                  "starterRows": 21,
                  "teamCount": 2,
                  "failedInvariant": "starter_rows_mismatch",
              },
              "confirmation": "RUN_G7_SPORTSMONKS_COVERAGE_AUDIT",
          }
          actual = json.loads(Path(
              "docs/production/g7-sportsmonks-coverage-audit-trigger.json"
          ).read_text(encoding="utf-8"))
          if actual != expected:
              raise SystemExit("INVALID_G7_SPORTSMONKS_COVERAGE_AUDIT_TICKET")
          PY
          echo "Reviewed provider-only audit ticket: PASS"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install and verify reviewed audit runtime
        id: quality
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test \
            scripts/backend/sportsmonks-two-season-coverage-audit.test.ts \
            scripts/backend/sportsmonks-two-season-backfill-preflight.test.ts \
            scripts/backend/gate4-sanitize-command-log.test.ts \
            supabase/functions/_shared/sportsmonks-historical-player-performance.test.ts
          bun run typecheck
          bun run backend:secrets:check

      - name: Audit all 480 provider fixture payloads without Supabase
        id: provider_audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          operation="sportsmonks-two-season-coverage-audit"
          raw_path="$G7_COVERAGE_AUDIT_RUNTIME_DIR/${operation}.raw.log"
          exit_path="$G7_COVERAGE_AUDIT_RUNTIME_DIR/${operation}.exit"
          set +e
          bun scripts/backend/sportsmonks-two-season-coverage-audit.ts \
            > "$raw_path" 2>&1
          exit_code=$?
          set -e
          printf '%s\n' "$exit_code" > "$exit_path"
          chmod 0600 "$raw_path" "$exit_path"
          exit "$exit_code"

      - name: Preserve sanitized provider audit command evidence
        id: command_logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source="$G7_COVERAGE_AUDIT_RUNTIME_DIR/sportsmonks-two-season-coverage-audit.raw.log"
          exit_path="$G7_COVERAGE_AUDIT_RUNTIME_DIR/sportsmonks-two-season-coverage-audit.exit"
          if [[ ! -f "$source" || ! -f "$exit_path" ]]; then
            echo "G7_PROVIDER_AUDIT_COMMAND_EVIDENCE_MISSING"
            exit 1
          fi
          exit_code=$(tr -d '[:space:]' < "$exit_path")
          if [[ ! "$exit_code" =~ ^[0-9]+$ ]]; then
            echo "G7_PROVIDER_AUDIT_EXIT_CODE_INVALID"
            exit 1
          fi
          GATE4_COMMAND_LOG_SOURCE="$source" \
            GATE4_COMMAND_LOG_DESTINATION="$G7_COVERAGE_AUDIT_EVIDENCE_DIR/sportsmonks-two-season-coverage-audit.log" \
            GATE4_COMMAND_OPERATION="sportsmonks-two-season-coverage-audit" \
            GATE4_COMMAND_EXIT_CODE="$exit_code" \
            bun scripts/backend/gate4-sanitize-command-log.ts

      - name: Verify provider audit evidence contains no credentials
        id: evidence_scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/backend/phase7f-scan-sanitized-evidence.py \
            "$G7_COVERAGE_AUDIT_EVIDENCE_DIR"
          if grep -R -F -q -- "$SPORTSMONKS_API_TOKEN" "$G7_COVERAGE_AUDIT_EVIDENCE_DIR"; then
            echo "CREDENTIAL_FOUND_IN_G7_PROVIDER_AUDIT_EVIDENCE"
            exit 1
          fi
          echo "G7 provider coverage audit evidence credential scan: PASS"

      - name: Upload sanitized provider coverage audit evidence
        id: evidence_upload
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g7-sportsmonks-historical-coverage-audit-${{ github.run_id }}
          path: ${{ steps.runtime.outputs.evidence_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove protected provider audit files
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${G7_COVERAGE_AUDIT_RUNTIME_DIR:-}" &&
                -d "$G7_COVERAGE_AUDIT_RUNTIME_DIR" ]]; then
            find "$G7_COVERAGE_AUDIT_RUNTIME_DIR" -type f -exec chmod 0600 {} \;
            find "$G7_COVERAGE_AUDIT_RUNTIME_DIR" -type f -delete
            rmdir "$G7_COVERAGE_AUDIT_EVIDENCE_DIR" 2>/dev/null || true
            rmdir "$G7_COVERAGE_AUDIT_RUNTIME_DIR" 2>/dev/null || true
          fi
          echo "Protected G7 provider audit files removed."

      - name: Finalize provider-only coverage audit verdict
        if: always()
        shell: bash
        env:
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          AUDIT_OUTCOME: ${{ steps.provider_audit.outcome }}
          LOG_OUTCOME: ${{ steps.command_logs.outcome }}
          SCAN_OUTCOME: ${{ steps.evidence_scan.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          if [[ "$QUALITY_OUTCOME" != "success" ||
                "$AUDIT_OUTCOME" != "success" ||
                "$LOG_OUTCOME" != "success" ||
                "$SCAN_OUTCOME" != "success" ||
                "$UPLOAD_OUTCOME" != "success" ||
                "$CLEANUP_OUTCOME" != "success" ]]; then
            echo "G7_SPORTSMONKS_HISTORICAL_COVERAGE_AUDIT_FAILED"
            exit 1
          fi
          echo "G7_SPORTSMONKS_HISTORICAL_COVERAGE_AUDIT_PASS"
