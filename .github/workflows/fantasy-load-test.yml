name: Fantasy load test

# The Phase 6 Fantasy capacity gate on BotolaGO Staging V2: 2,500 temporary
# managers on five temporary AWS machines rehearse the minute before a Fantasy
# deadline (docs/backend/FANTASY_CAPACITY_REPORT.md). Rebuilt from the retired
# PR #6 workflow (phase6-capacity-gate.yml, removed in #26) to run from main.
# Order of operations for the owner: docs/operations/LOAD_TEST.md.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "rehearsal (25 users per machine, no traffic) or full (rehearsal, then the 2,500-user test and soak)"
        required: true
        type: choice
        default: full
        options:
          - rehearsal
          - full
      staging_compute:
        description: "Staging's compute size; must equal production's (e.g. Large)"
        required: true
        type: string
        default: Large
      confirmation:
        description: Type RUN_FANTASY_LOAD_TEST
        required: true
        type: string

# Shared with the other Staging V2 workflows in the staging-load-test
# environment: one writer at a time (AGENTS.md). Staging writers outside the
# group are checked by scripts/backend/staging-writer-guard.py.
concurrency:
  group: phase6-staging-load-test
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  load-test:
    name: Rehearsal, load test, soak, and exact-zero cleanup
    if: github.repository == 'mrdata007/botolago-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: staging-load-test
    env:
      AWS_REGION: eu-west-3
      AWS_DEFAULT_REGION: eu-west-3
      BOTOLAGO_LOAD_ENVIRONMENT: staging-v2
      BOTOLAGO_MAX_ESTIMATED_COST_USD: "50"
      BOTOLAGO_REQUIRE_AWS_SESSION_TOKEN: "1"
      BOTOLAGO_AWS_LOAD_TEST_ROLE_ARN: ${{ vars.AWS_LOAD_TEST_ROLE_ARN }}

    steps:
      - name: Initialize Phase 6 runtime environment
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/botolago-phase6"
          evidence_dir="$runtime_dir/evidence"
          install -d -m 0700 "$runtime_dir" "$evidence_dir"
          {
            echo "BOTOLAGO_PHASE6_RUNTIME_DIR=$runtime_dir"
            echo "BOTOLAGO_PHASE6_EVIDENCE_DIR=$evidence_dir"
          } >> "$GITHUB_ENV"

      - name: Validate manual dispatch
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RUN_FANTASY_LOAD_TEST"
          case "$SCOPE" in rehearsal|full) ;; *) exit 2 ;; esac

      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify hardened harness ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f6340e0eed667f730ceddc1f4dd5d89dc9085003 HEAD

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/backend/fantasy-capacity-requirements.txt

      - name: No other staging writer is running
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/backend/staging-writer-guard.py

      # Before any AWS resource exists: staging must carry production's
      # migrations, the capacity seed, and production's compute size, or the
      # measurement would say nothing about production.
      - name: Verify staging is ready
        id: staging_ready
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          BOTOLAGO_EXPECTED_STAGING_COMPUTE: ${{ inputs.staging_compute }}
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/staging-ready.json"
          python scripts/backend/staging-database-update.py check | tee "$report"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## Fantasy load test: staging is not ready"
              echo
              echo '```json'
              cat "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Configure delegated AWS credentials
        id: aws_oidc
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_LOAD_TEST_ROLE_ARN }}
          role-session-name: phase6-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: eu-west-3
          role-duration-seconds: 7200
          retry-max-attempts: 1
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify delegated caller and region without disclosure
        if: steps.aws_oidc.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "$AWS_REGION" = "eu-west-3"
          test "$AWS_DEFAULT_REGION" = "eu-west-3"
          test -n "${AWS_SESSION_TOKEN:-}"
          aws sts get-caller-identity --output json >/dev/null

      - name: Install coordinator packages
        if: steps.aws_oidc.outcome == 'success'
        shell: bash
        run: python -m pip install --requirement scripts/backend/fantasy-capacity-requirements.txt

      - name: Run setup rehearsal, then the unchanged full gate
        id: capacity
        if: steps.aws_oidc.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          SCOPE: ${{ inputs.scope }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        run: |
          set +e
          if [ "$SCOPE" = "rehearsal" ]; then mode="--setup-rehearsal"; else mode="--rehearsal-then-full"; fi
          timeout --signal=INT --kill-after=120s 90m \
            python scripts/backend/fantasy-capacity-orchestrator.py "$mode"
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record sanitized delegated-credential preflight failure
        if: always() && steps.aws_oidc.outcome != 'success' && steps.staging_ready.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$BOTOLAGO_PHASE6_EVIDENCE_DIR/preflight"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["BOTOLAGO_PHASE6_EVIDENCE_DIR"])/"preflight"/"credential-preflight.json"; p.write_text(json.dumps({"passed":False,"stage":"delegated_credential_preflight","provisioningStarted":False},indent=2)+"\n"); p.chmod(0o600)'

      - name: Independent recovery cleanup
        id: cleanup
        if: always() && steps.aws_oidc.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        run: |
          set +e
          timeout --signal=INT --kill-after=60s 20m \
            python scripts/backend/fantasy-capacity-orchestrator.py --cleanup-only
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Remove local runtime material when delegation failed
        if: always() && steps.aws_oidc.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os,pathlib; root=pathlib.Path(os.environ["BOTOLAGO_PHASE6_RUNTIME_DIR"]); [(p.unlink(missing_ok=True)) for p in root.rglob("*") if p.is_file() and (p.name in {"runner.pem","runner-runtime.env","sessions.json","cloud-state.json"} or p.name.startswith("credentials-"))] if root.exists() else None'

      - name: Render and scan sanitized evidence
        id: report
        if: always() && steps.staging_ready.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          CAPACITY_EXIT: ${{ steps.capacity.outputs.exit_code || '2' }}
          CLEANUP_EXIT: ${{ steps.cleanup.outputs.exit_code || '2' }}
          OIDC_OUTCOME: ${{ steps.aws_oidc.outcome || 'failure' }}
          SCOPE: ${{ inputs.scope }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          report_path="$RUNNER_TEMP/phase6-summary.md"
          result_path="$RUNNER_TEMP/phase6-workflow-result.json"
          python scripts/backend/fantasy-capacity-report.py \
            --evidence-root "$BOTOLAGO_PHASE6_EVIDENCE_DIR" \
            --output "$report_path" \
            --result "$result_path" \
            --run-url "$RUN_URL" \
            --run-label "run ${{ github.run_number }} attempt ${{ github.run_attempt }}" \
            --oidc-outcome "$OIDC_OUTCOME" \
            --capacity-exit "$CAPACITY_EXIT" \
            --cleanup-exit "$CLEANUP_EXIT" \
            --scope "$SCOPE"
          status=$?
          sanitized=$(python -c 'import json,os; print(str(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"phase6-workflow-result.json")))["artifactsSanitized"]).lower())' 2>/dev/null || echo false)
          echo "sanitized=$sanitized" >> "$GITHUB_OUTPUT"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload sanitized owner evidence
        if: always() && steps.report.outputs.sanitized == 'true' && steps.staging_ready.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fantasy-load-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/botolago-phase6/evidence
            ${{ runner.temp }}/phase6-summary.md
            ${{ runner.temp }}/phase6-workflow-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish the verdict on the run page
        if: always() && steps.report.outputs.sanitized == 'true' && steps.staging_ready.outcome == 'success'
        shell: bash
        run: cat "$RUNNER_TEMP/phase6-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce final verdict
        if: always() && steps.staging_ready.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import json,os,sys; result=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"phase6-workflow-result.json"))); sys.exit(0 if result["gatePassed"] else 2)'
