name: Football live refresh deploy

# Deploys ONLY the Edge Function `football-live-refresh` to production, so it can
# read SofaScore when app_private.football_data_source() says so
# (docs/backend/SOFASCORE_LIVE_EDGE.md, PR 422). It deploys nothing else, sets no
# secret, applies no migration and does not flip the switch.
#
# Before it deploys it reads production's supabase_migrations.schema_migrations
# (one SELECT through the Management API, nothing written) and refuses unless
# 20261011090000 and 20261011100000 are both recorded: the new code calls
# api.football_data_source() and api.football_sofascore_live_snapshot(), which
# those migrations create. Apply them first with
# scripts/backend/apply-sofascore-live-switch.sql
# (docs/production/SOFASCORE_LIVE_RELEASE_RUNBOOK.md).
#
# Guards mirror the other production workflows: dispatch from main by the owner
# only, an approved environment, one production mutation at a time, the exact
# reviewed commit, the fixed project ref, and no re-runs.
#
# Rollback: redeploy the previous main commit with this workflow, or set the
# switch back with app_private.football_data_source_configure (runbook).

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit approved for this deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_FOOTBALL_LIVE_REFRESH
        required: true
        type: string

concurrency:
  group: botolago-production-v2-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy football-live-refresh
    if: >-
      github.repository == 'mrdata007/botolago-foundation' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mrdata007'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-admin-activation
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      PROJECT_REF: tkewgajrljbwgwedqsxn
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Enforce immutable target
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "SUPABASE_ACCESS_TOKEN is missing from the environment."
            exit 2
          fi
          printf '::add-mask::%s\n' "$SUPABASE_ACCESS_TOKEN"
          if [[ "${GITHUB_RUN_ATTEMPT:-}" != "1" ]]; then
            echo "GITHUB_WORKFLOW_RERUN_FORBIDDEN"
            exit 2
          fi
          if [[ "$CONFIRMATION" != "DEPLOY_FOOTBALL_LIVE_REFRESH" ||
                "$EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Immutable dispatch confirmation failed."
            exit 2
          fi

      - name: Check out the exact reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install reviewed runtime and run the function tests
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          test -x ./node_modules/.bin/supabase
          ./node_modules/.bin/supabase --version
          bun test supabase/functions/_shared/football-live-refresh.test.ts \
            supabase/functions/_shared/sofascore-live-refresh.test.ts

      - name: Require both migrations in production (read-only)
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$(mktemp -d)"
          trap 'rm -rf "$runtime_dir"' EXIT
          query="select count(*)::int as n from supabase_migrations.schema_migrations where version in ('20261011090000', '20261011100000')"
          jq -n --arg query "$query" '{query: $query}' > "$runtime_dir/query.json"
          status="$(
            curl --silent --show-error --proto '=https' --tlsv1.2 \
              --connect-timeout 10 --max-time 60 --request POST \
              --output "$runtime_dir/response.json" --write-out '%{http_code}' \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$runtime_dir/query.json" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          )"
          if [[ "$status" != "200" && "$status" != "201" ]]; then
            echo "Reading schema_migrations failed with HTTP $status (response not shown). Nothing deployed."
            exit 3
          fi
          n="$(jq -r 'if type == "array" then .[0].n else (.result // .data)[0].n end' "$runtime_dir/response.json")"
          if [[ "$n" != "2" ]]; then
            echo "::error::Production has $n of the 2 required migrations (20261011090000, 20261011100000). Run scripts/backend/apply-sofascore-live-switch.sql first. Nothing deployed."
            exit 3
          fi
          echo "Both migrations are recorded in production."

      - name: Deploy football-live-refresh
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/supabase functions deploy football-live-refresh --project-ref "$PROJECT_REF"
