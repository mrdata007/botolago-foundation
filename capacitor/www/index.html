<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BotolaGO</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0c3164;
        color: #f2f5f3;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        opacity: 0.8;
        line-height: 1.5;
      }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 1.5rem;
        min-height: 44px;
        background: #f2f5f3;
        color: #0c3164;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pas de connexion</h1>
      <p>BotolaGO a besoin d'internet.<br />Vérifiez votre connexion puis réessayez.</p>
      <p dir="rtl" lang="ar">لا يوجد اتصال بالإنترنت. تحقق من الاتصال ثم أعد المحاولة.</p>
      <button type="button" onclick="location.href = 'https://botolago.com'">Réessayer</button>
    </main>
  </body>
</html>
