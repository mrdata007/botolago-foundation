residual_risk:
  - id: crest-never-seen-in-production
    severity: low
    detail: >
      Until app.story_teams is populated, every live plate is wordmark-only.
      The crest code path ships unexercised by live data. Verified under
      injection; no code change will be needed when the data arrives.
  - id: one-plate-per-category-colour
    severity: low
    detail: >
      A feed dominated by one category shows one plate colour repeatedly. That
      is a deliberate consequence of "category colour" and is the correct
      read while the French feed has no photos; it is also an argument for
      BG-0065 rather than for more colours here.
  - id: dark-theme-not-reachable-in-product
    severity: informational
    detail: >
      Nothing in src/ currently adds the `.dark` class, so dark mode is not
      user-reachable today. The dark cells above were measured by adding the
      class in the browser, which is what any future theme switch will do.
      The plate's dark values are declared and verified either way.
