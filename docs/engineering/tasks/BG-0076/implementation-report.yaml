    detail: >
      app.story_teams is empty in production, so no live edition names a club
      and the crest branch does not fire today. It was verified by injecting a
      single teamId into the news RPC responses at the network layer, and it
      will begin rendering on its own once story_teams is populated. No code
      change will be needed then.
  - id: fantasy-hub-rail
    detail: >
      src/routes/fantasy.index.tsx renders its news thumbnails only when
      heroUrl is present, so it shows no empty block. Left unchanged, and it
      still compiles against the widened MediaImage props.
