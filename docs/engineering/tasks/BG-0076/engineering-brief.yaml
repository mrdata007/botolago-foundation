base: origin/chief/launch-fixes-3
area: news / ui-kit
scope: frontend-only
severity: P1
launch_window: >
  Above the fold on Home and /news for every French visitor, so it gates the
  French launch surface. It does not gate any backend or data work.

objective: >
  A published article edition with no hero asset rendered an empty dark block
  where the photo belongs. Replace that block with a branded plate — category
  colour, BotolaGO wordmark, and the club crest when the edition names exactly
  one club — rendered both when the hero is null and when a hero URL fails to
  load. This does not replace editorial images; the content decision (what the
  French feed should contain) is BG-0065 and stays open. The goal is that the
  absence reads as deliberate rather than broken.

confirmed_finding:
  source: production Supabase project tkewgajrljbwgwedqsxn, read-only execute_sql
  query: >
    select language,
           count(*) filter (where hero_asset_id is null) as no_hero,
           count(*) as total
    from app.article_editions where status = 'published' group by 1;
  result:
    - language: fr
      no_hero: 10
      total: 10
    - language: ar
      no_hero: 37
      total: 98
  note: >
    Matches the brief exactly: every published French edition is hero-less, and
    37 of 98 Arabic ones are.

additional_data_finding:
  classification: VERIFIED
  statement: >
    app.story_teams is EMPTY in production (select count(*) => 0). No published
    edition names any club today, so the crest branch of the fallback cannot
    fire against live data yet. The branch is implemented and was verified by
    injecting a single teamId into the news RPC responses at the network layer
    (see verification-report.yaml); it will start rendering on its own the day
    story_teams is populated.
  implication_for_owner: >
    The crest is the strongest identity signal the plate can carry. Populating
    story_teams — plausibly part of the same editorial pass as BG-0065 — turns
    every single-club hero-less card from a generic wordmark plate into a
    club-branded one at no further engineering cost.

