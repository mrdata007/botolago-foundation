not_verified:
  - >
    Fantasy screens with live data (squad, pitch, transfers, rankings). Supabase
    is unreachable from this sandbox, so those rendered in their empty /
    signed-out state. The pitch itself is painted from `--fpl-pitch-*`, which has
    no dark counterpart, so it will look the same in both themes — consistent
    with the Fantasy finding above, but its populated state was not measured.
  - >
    Signed-in Profile. The authenticated preferences group (notifications rows +
    Langue + Apparence) could not be exercised without auth; the same
    `LanguageRow`/`ThemeRow` components render there, and the guest and
    signed-out groups were measured directly.
  - >
    Real operating-system theme switching. `page.emulateMedia` drives the same
    `prefers-color-scheme` media query the browser drives, but no physical OS
    toggle was performed.
  - >
    Safari/Firefox. Chromium only, per the task.
