first_paint_no_flash:
  method: >
    An init script registered at document-start (before any page script) pushes
    { timestamp, <html> className, computed <html> and <body> background-color,
    computed color-scheme } on EVERY animation frame, starting with the frame
    before the first paint. A flash of the wrong theme would appear as a frame
    whose body background-color is the other theme's page colour.
  matrix: 4 theme modes x 2 languages (fr, ar) x 2 widths (390, 1440) x 3 routes (Home, Fantasy, Profile) = 48 page loads
  theme_modes: [stored "light", stored "dark", stored "system" with OS dark, stored "system" with OS light]
  result:
    loads_measured: 48
    frames_sampled_per_load: 60-71
    frames_with_the_wrong_class: 0
    distinct_body_background_colours_observed_per_load: 1
    dark_loads_body_background: oklch(0.15 0.03 260)   # .dark --ui-page
    light_loads_body_background: oklch(0.985 0.005 250)
    class_on_html_at_the_very_first_sampled_frame: '"dark" on all 24 dark loads, "" on all 24 light loads'
    color_scheme_at_first_frame: 'dark on dark loads, light on light loads'
  conclusion: >
    Exactly one background colour is observed across the whole load on every one
    of the 48 runs. There is no frame in which the wrong theme is painted.
  ssr_check: >
    curl of http://127.0.0.1:4173/profile returns the script body verbatim
    inside <head>:
    (function(){try{var e=document.documentElement,s=null;try{s=window.localStorage.getItem("botolago.theme")}catch(x){}var d;if(s==="dark"){d=true}else if(s==="light"){d=false}else{d=false;try{d=window.matchMedia("(prefers-color-scheme: dark)").matches}catch(x){}}e.classList.toggle("dark",d);e.style.colorScheme=d?"dark":"light"}catch(x){}})();
  evidence: evidence/first-paint-hydration-system-persistence.json  # key: flash

hydration:
  method: >
    console + pageerror captured on every load. Matched against
    /Minified React error #(418|419|421|422|423|425)|hydrat|did not match|Text
    content does not match/i.
  loads_checked: 49   # the 48 above + /auth/login in dark
  hydration_warnings_or_errors: 0
  other_console_output: >
    One repeated message only — "Failed to load resource:
    net::ERR_CERT_AUTHORITY_INVALID" (Supabase, blocked by the sandbox proxy CA),
    on 49/49 loads. Unrelated to this change.
  evidence: evidence/first-paint-hydration-system-persistence.json  # key: hydration

system_mode_is_live:
  method: >
    Load /profile with `botolago.theme = "system"` and the emulated OS set to
    light, then page.emulateMedia({ colorScheme: "dark" }) and back, with no
    reload. Navigation-entry count sampled each time to prove no reload occurred.
  results:
    - lang: fr
      before:      { html_class: '',     body_bg: 'oklch(0.985 0.005 250)', navigation_entries: 1 }
      after_dark:  { html_class: 'dark', body_bg: 'oklch(0.15 0.03 260)',   navigation_entries: 1 }
      after_light: { html_class: '',     body_bg: 'oklch(0.985 0.005 250)', navigation_entries: 1 }
    - lang: ar
      before:      { html_class: '',     body_bg: 'oklch(0.985 0.005 250)', navigation_entries: 1 }
      after_dark:  { html_class: 'dark', body_bg: 'oklch(0.15 0.03 260)',   navigation_entries: 1 }
      after_light: { html_class: '',     body_bg: 'oklch(0.985 0.005 250)', navigation_entries: 1 }
  conclusion: 'Follows the OS in both directions, in both languages, with navigation_entries fixed at 1 — no reload.'

persistence:
  method: >
    Start with NOTHING stored, open /profile, click the "Sombre" segment, then
    reload, then navigate to /fantasy.
  results:
    - lang: fr
      control_visible_signed_out: true
      after_click:  { html_class: 'dark', stored: 'dark', body_bg: 'oklch(0.15 0.03 260)', aria_checked: 'true' }
      after_reload: { html_class: 'dark', stored: 'dark', body_bg: 'oklch(0.15 0.03 260)', class_at_first_frame: 'dark', aria_checked: 'true' }
      after_navigation_to_fantasy: { html_class: 'dark', body_bg: 'oklch(0.15 0.03 260)' }
      hydration_messages: 0
    - lang: ar
      control_visible_signed_out: true
      after_click:  { html_class: 'dark', stored: 'dark', body_bg: 'oklch(0.15 0.03 260)', aria_checked: 'true' }
      after_reload: { html_class: 'dark', stored: 'dark', body_bg: 'oklch(0.15 0.03 260)', class_at_first_frame: 'dark', aria_checked: 'true' }
      after_navigation_to_fantasy: { html_class: 'dark', body_bg: 'oklch(0.15 0.03 260)' }
      hydration_messages: 0
  note: >
    `class_at_first_frame: "dark"` after the reload is the same no-flash
    measurement applied to a user-made choice: the reloaded document is dark
    from its first sampled frame.

horizontal_overflow:
  method: >
    document.documentElement.scrollWidth vs clientWidth, PLUS a per-element box
    check (every element in body whose rect extends past the viewport), skipping
    elements that are themselves overflow-x auto/scroll/hidden/clip or that have
    any such ancestor — `html, body { overflow-x: clip }` means the page-level
    number alone cannot see a protruding box, and decorative mesh/blur art is
    legitimately clipped by an ancestor.
  matrix: 2 themes x 2 languages x 2 widths x 4 pages (Home, Fantasy, Profile, /auth/login) = 32 checks
  result:
    scrollWidth_not_equal_clientWidth: 0 of 32
    unclipped_elements_past_the_viewport: 0 of 32
  evidence: evidence/contrast-and-overflow.json  # key: overflow

contrast:
  method: >
    Colours are RASTERISED, not parsed: every computed colour (oklch, oklab,
    rgb) is drawn to a 1x1 canvas — the foreground composited over its resolved
    opaque backdrop — and the resulting sRGB bytes are used for the WCAG
    relative-luminance formula. Elements whose nearest painted ancestor is a
    background-IMAGE (gradients, the auth mesh, the Fantasy hero) are recorded
    as unmeasurable rather than scored against a wrong backdrop.
    AA thresholds: 4.5:1, or 3:1 for >=24px, or >=18.66px at weight >=700.
  the_new_control:
    light:
      'Apparence (row label)': 19.44
      'Clair (selected)': 9.29
      'Sombre (unselected)': 15.82
      'Système (unselected)': 15.82
    dark:
      'Apparence (row label)': 15.89
      'Clair (unselected)': 14.33
      'Sombre (selected)': 10.01
      'Système (unselected)': 14.33
    arabic: 'identical ratios for المظهر / فاتح / داكن / النظام at both widths'
    verdict: 'every state clears AA in both themes and both languages'
  contrast_problems_found_not_mine:
    preamble: >
      All of the following are pre-existing and none is introduced by this
      change. They were invisible before only because dark mode was unreachable.
    - id: ui-ink-used-as-a-text-colour
      severity: high
      statement: >
        `--ui-ink` is a dark navy in BOTH themes — it is a fill/border token, not
        a text colour. Several existing surfaces use it for text, and on a dark
        surface it computes to 1.25-1.42:1.
      measured:
        - { where: 'Profile h1 "Profil" (ui.tone.ink)', ratio: 1.42, fg: 'oklch(0.3 0.08 260)', bg: 'oklch(0.15 0.03 260)', size: '34px/900' }
        - { where: 'BottomNav active label (nav span)', ratio: 1.25, fg: 'oklch(0.3 0.08 260)', bg: 'oklch(0.22 0.03 260)', size: '11px/800' }
        - { where: 'UiButton variant="outline" / "ghost" labels, e.g. "Continuer avec Google" on /auth/login', ratio: 1.25, fg: 'oklch(0.3 0.08 260)', bg: 'oklch(0.22 0.03 260)', size: '15px/800' }
        - { where: 'UiSegmented active label (text-[color:var(--ui-ink)] on var(--ui-surface))', ratio: 1.25, note: 'why the new control does not reuse UiSegmented' }
      not_fixed_because: >
        Repairing it means changing `ui.tone.ink`, the UiButton outline/ghost
        variants and UiSegmented — i.e. restyling every screen in the product.
        That is a kit decision, not a side effect of adding a theme switch.
    - id: fantasy-does-not-honour-dark-mode
      severity: high
      statement: >
        The Fantasy section is still a light screen under dark mode. It is built
        on the `--fpl-*` tokens, which styles.css itself documents as "a
        light-only reconstruction": `--fpl-bg` / `--fpl-grey` have no `.dark`
        counterpart and several Fantasy surfaces spell `bg-white` / `text-white`
        literally.
      measured_on_/fantasy_in_dark:
        - { text: 'Notifications push', ratio: 1.01, fg: 'oklch(0.97 0.01 250)  # dark --ui-on-surface', bg: 'oklch(0.975 0.004 250)  # light --fpl-bg' }
        - { text: 'Recevez les bilans hebdomadaires…', ratio: 1.01, fg: 'oklch(0.97 0.01 250)', bg: 'oklch(0.975 0.004 250)' }
        - { text: 'E-mails / Bientôt disponible', ratio: 1.01, fg: 'oklch(0.97 0.01 250)', bg: 'oklch(0.975 0.004 250)' }
        - { text: 'Général / Journée 14 (tabs)', ratio: 1.09, fg: 'oklch(0.97 0.01 250)', bg: 'rgb(255,255,255)  # literal white' }
      mechanism: >
        These are themed `--ui-*` foregrounds sitting on un-themed `--fpl-*` /
        literal-white surfaces. The text is effectively invisible.
      not_fixed_because: >
        Fixing it means giving `--fpl-*` a dark counterpart and removing the
        literal `bg-white`/`text-white` from the Fantasy screens — the Fantasy
        redesign this branch is explicitly not allowed to do. Screenshot:
        evidence/dark-fantasy-390.png.
      recommendation: 'Own follow-up ticket, sized as a Fantasy-section pass.'
    - id: pre-existing-light-mode-failures-seen-in-passing
      severity: medium
      statement: >
        Two Fantasy labels fail AA in LIGHT as well, so they are not dark-mode
        regressions: `--fpl-cyan` on white.
      measured:
        - { text: 'Ligues générales / Ligues privées', ratio: 1.38, fg: 'oklch(0.88 0.11 205)', bg: 'rgb(255,255,255)', both_themes: true }
    - id: mode-demo-badge-in-dark
      severity: low
      statement: 'The "MODE DÉMO" AuthModeBadge renders black text (rgb(0,0,0)) directly on the dark page: 1.07:1.'
      note: 'Development-only badge; recorded for completeness.'
  false_positives_excluded:
    - >
      UiButton variant="gradient" ("Créer un compte", "Se connecter") sets its
      background via an inline `backgroundImage: var(--ui-grad-action)`. The
      element's OWN background image is not walked by the backdrop resolver, so
      it first scored 1.01:1. The gradient is identical in both themes and the
      `--ui-ink-deep` label on it is legible; excluded.
    - >
      The Home / Welcome screen is a dark mesh in BOTH themes, so its white copy
      scored against the page colour rather than the mesh. Visually confirmed
      legible in both themes (evidence screenshots).
  evidence:
    data: evidence/contrast-and-overflow.json   # key: contrast
    screenshots: [evidence/dark-profile-390.png, evidence/light-profile-390.png, evidence/dark-fantasy-390.png]

