meter:
  command: bun scripts/qa/design-divergence.ts
  before: { files_with_divergences: 91, total: 1534 }
  after: { files_with_divergences: 79, total: 1392 }
  this_lane: { before: 154, after: 12 }
  remaining_12: >
    All in `JerseyVisual.tsx`, and left there on purpose: they are the
    lighting layers on the shirt artwork (a highlight, a side shade, a cuff,
    an outline) composited over club colours, not a palette. Rewriting them as
    named SVG paint would have scored 0 without changing a pixel, which is
    moving the number rather than the product.
  raw: evidence/design-divergence-before.json, evidence/design-divergence-after.json

must_not_regress:
  gw1_seven_fixtures: >
    Not at risk and not touched. This lane changed no fixture list, difficulty
    grid, gameweek query or player-fixture lookup; `useNextFixtures` and every
    fantasy service are unmodified. The deferred FAR Rabat v Raja cannot
    reappear through anything here.
  match_time_zone: >
    The one date formatter this lane owns — the deadline line in
    `fantasy.team.tsx` — passes `timeZone: MATCH_TIME_ZONE` imported from
    `src/lib/match-kickoff.ts`, rather than repeating the literal zone as the
    component it replaced did. Rendered output checked in both languages
    ("Journée 14 Deadline: 23 sept. 2026, 09:50" / "الجولة 14 الموعد النهائي:
    23 شتنبر 2026، 09:50" against the same instant).
  proven_logic: >
    Formation validity, captain and vice logic, bench order,
    auto-substitution, chips, scoring and persistence were wrapped, not
    reimplemented. No RPC was replaced. The full suite, including
    `fantasy-engine`, `reslot`, `team-validation`, `points-service` and the
    owned-repository tests, passes unchanged.

