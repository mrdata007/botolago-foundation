      result: "pass — no horizontal scroll, 0 offscreen boxes, 0 console errors"
      note: >
        Renders the shared pitch and the reworked stat bar. The stat bar's
        captions now wrap inside their columns instead of running out of them.
        The two 176x40 segmented buttons are `FplSegmented` in the
        sibling-owned `fpl/primitives.tsx` — pre-existing, not this lane's.
      evidence: evidence/after-transfers-390-ar-light.png
    - route: /fantasy/create
      result: "pass — no horizontal scroll, 0 offscreen boxes, 0 sub-44px controls, 0 console errors"
    - route: /fantasy/players
      result: "pass for this lane's part"
      note: >
        156–159 sub-44px controls, all pre-existing in the sibling-owned route
        (filter and sort chips). `PlayerStatusBadge` renders correctly at its
        new 12px label size with no overflow.
    - route: /fantasy/top-players
      result: "pass for this lane's part"
      note: >
        `GameweekSelector` fits with room to spare and no longer repeats the
