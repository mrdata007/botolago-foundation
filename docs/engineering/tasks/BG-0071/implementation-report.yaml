# --------------------------------------------------------------------------
deviations_from_the_brief:
  - id: D1
    what: "form was widened in src/types/domain.ts, not src/types/fantasy.ts."
    why: >
      The brief and the prompt both name src/types/fantasy.ts. The only `form`
      in that file is TopPlayerOfWeek.form (which was also widened). A fantasy
      player's form lives on `Player` in src/types/domain.ts, and FantasyPlayer
      extends Player. There is no way to make a player's form nullable without
      touching domain.ts.
  - id: D2
    what: "Seven files outside allowed_paths were edited."
    why: >
      D1's widening is a breaking type change for every site that formats a
      form. Leaving them would fail `bun run typecheck`; silencing them with
      `?? 0` or a cast would print 0.0 for an unknown form — the defect. Each
      edit is the same one-line branch, nothing else in those files moved.
  - id: D3
    what: "Repository methods went on FantasyRepository + SupabaseFantasyRepository, not on src/services/fantasy-v2.ts."
    why: >
      Explicitly directed by the prompt and confirmed in the tree:
      fantasy-v2.ts is a data-mode selector/factory with no per-read methods,
      and getOverallStandings (BG-0073, on this branch) set the precedent.
  - id: D4
    what: "fantasyPlayerSchema.selectedByCount became optional."
    why: "The brief's own risks §2 sequencing: make it optional, ship, then drop the column."

# --------------------------------------------------------------------------
generated_types:
  file: src/backend/generated/database.types.ts
  status: NOT TOUCHED
  reason: >
    The file carries a "do not edit by hand" header and CI compares it
    byte-for-byte against `supabase gen types` run over a live local database.
    `bun run backend:types:generate` and `bun run backend:types:check` both
    require Docker; `docker info` fails in this environment. The file therefore
    does not yet know about api.fantasy_player_season_stats or
    api.fantasy_player_gameweek_history, and a typed
    `getFantasyApi().rpc("fantasy_player_season_stats", …)` would not compile.
  workaround: >
    src/backend/fantasy/supabase-repository.ts defines one local helper,
    `rpcAwaitingGeneratedTypes(name, args)`, holding a single structural view of
    `rpc`. It is used by exactly the two new methods. Both payloads are still
    parsed by zod through the same `parse()` used by every other read, so
    nothing untyped escapes the helper.
  follow_up: >
    Delete `rpcAwaitingGeneratedTypes` and call `getFantasyApi().rpc(…)`
    directly in the commit that lands CI's regenerated database.types.ts. The
    argument names and return shapes are already correct; only the typing
    changes.

# --------------------------------------------------------------------------
follow_up_unblocked:
  question: "Does this change make `DROP COLUMN app.fantasy_players.selected_by_count` possible?"
  answer: YES
  detail: >
    Nothing in the frontend reads selectedByCount any more: the runtime mapper
    took it (as a hardcoded 0) and now takes ownershipPercent from
    api.fantasy_player_season_stats, and fantasyPlayerSchema.selectedByCount is
    `.optional()`, so a fantasy_player_pool payload that no longer carries the
    key still parses. A follow-up migration may now both drop the column and
    remove it from the fantasy_player_pool payload — note that removing a key
    from that payload is the one thing that changes its shape, so it needs its
    own review against the 22 Playwright journeys.
    THE DROP IS NOT WRITTEN HERE, as instructed.

