objective: >
  Stop the Fantasy picking screens from showing 0 points / 0.0 form / 0.0%
  selected for all 539 players. The backend half of BG-0071 already landed on
  the integration branch (supabase/migrations/20260921160000_fantasy_player_statistics.sql,
  two read RPCs). This lane consumes it: contracts, repository, runtime mapper,
  the four picking surfaces, and a dash — not "0.0" — wherever form is unknown.

# --------------------------------------------------------------------------
what_was_wrong:
  - "src/services/fantasy-runtime.ts playerDto() set totalPoints: 0, form: 0, ownership: 0 unconditionally. Every list, picker and detail page in cloud mode consumed it."
  - "getTopPlayersOfWeek() set price: 0, ownershipPercent: 0, form: 0 for the same reason."
  - "The player-detail History tab did not read history at all: it restated the (zeroed) Overview numbers in one sentence."
  - "Nothing in the UI could tell 'no gameweek has scored yet' from 'this player scored 0'. Both printed 0.0."

# --------------------------------------------------------------------------
changes:
  - file: src/backend/fantasy/contracts.ts
    change: >
      Added fantasyPlayerSeasonStatSchema / fantasyPlayerSeasonStatsSchema (the
      RPC returns an OBJECT with activeTeamCount, formWindow,
      scoredGameweeksInWindow, throughGameweekSequence and items[]) and
      fantasyPlayerGameweekHistoryEntrySchema /
      fantasyPlayerGameweekHistorySchema (a bare array, oldest first). Added
      getPlayerSeasonStats() and getPlayerGameweekHistory() to the
      FantasyRepository interface.
    notes: >
      `form` is `z.coerce.number().nullable()`, with .nullable() OUTSIDE the
      coercion on purpose: `z.coerce.number()` parses null as 0, which would
      reintroduce the exact confusion the field exists to prevent. Every other
      numeric field uses z.coerce because the values arrive from
      jsonb_build_object over bigint/numeric and PostgREST may serialize either
      as a JSON number or a string — the same reason price and rank already do.
  - file: src/backend/fantasy/contracts.ts
    change: >
      fantasyPlayerSchema.selectedByCount is now `.optional()` and documented as
      deprecated.
    notes: >
      This is the brief's staged plan (risks §2) and it is what unblocks the
      follow-up DROP — see `follow_up_unblocked` below. No runtime code reads
      the field any more; making it optional means the drop needs no second
      frontend change, while api.fantasy_player_pool's payload stays
      byte-for-byte what it is today.
  - file: src/backend/fantasy/supabase-repository.ts
