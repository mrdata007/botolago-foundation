risks_for_the_reviewer:
  - id: R1
    risk: >
      allPlayers() now issues one extra RPC per player-list load. The RPC is
      `stable` and the routes already hold the result in React Query
      (queryKey ["fantasy-players"]), so paging the pool does not re-read it,
      but the brief's explicit staleTime >= 60s is NOT set here — the runtime
      service is not a React layer and the existing queries in
      fantasy.players.tsx / fantasy.create.tsx / fantasy.team.tsx use the
      project's default staleTime. If the Chief wants the 60s floor it belongs
      on those useQuery call sites, not in the service.
  - id: R2
    risk: >
      A comparator subtlety worth a reviewer's eye: form sorting uses explicit
      branches, not a `-Infinity` sentinel subtraction. Today EVERY player's
      form is null, and `-Infinity - -Infinity` is NaN — a comparator returning
      NaN for every pair leaves the list in an unspecified order. The same
      three-line comparator is duplicated in fantasy.players.tsx,
      AddPlayerScreen.tsx and PlayerPickerDrawer.tsx rather than extracted to a
      new shared module outside the brief's allowed_paths.
  - id: R3
    risk: >
      src/backend/generated/database.types.ts is stale with respect to the two
      new RPCs and CI owns the regenerated artifact. Until it lands, the two
      repository methods route through `rpcAwaitingGeneratedTypes`. If CI's
      regeneration is not taken in the same PR, backend:types:check will fail
      for a reason unrelated to this code.
  - id: R4
    risk: >
      No pgTAP ran here. The RPC semantics this frontend depends on — form null
      at zero scored gameweeks, ownership over active teams only, PT404 on an
      unknown season — are asserted by the backend lane's database tests, which
      only CI has executed.
