i18n_baselines:
  - code: W1
    from: 6
    to: 7
    why: >
      fantasy.stat.none has identical fr and ar values ("–"). It is punctuation
      standing in for an absent number, not copy. Annotated in
      IDENTICAL_ALLOWED — and an allow-list entry annotates a count, it never
      removes it, which is why the baseline moves with it.
  - code: W2
    from: 6
    to: 7
    why: "Same key: an en dash contains no Arabic script. Annotated in NO_ARABIC_SCRIPT_ALLOWED."
  - code: W3
    from: 248
    to: 247
    why: >
      The rebuilt History tab renders a provisional/final state, giving
      fantasy.points.status.provisional its first literal call site in src/.
      Nothing was orphaned in exchange: fpl.gameweek, dropped from the sentence
      the tab used to render, is still used on five other screens.
  - code: W4
    from: 97
    to: 97
    why: >
      Unchanged on purpose. Every new conditional is written
      `cond ? t("a") : t("b")` (two literal call sites), never
      `t(cond ? "a" : "b")`, which would have tripped this baseline.

