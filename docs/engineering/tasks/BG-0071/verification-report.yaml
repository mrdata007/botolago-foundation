browser_evidence:
  location: docs/engineering/tasks/BG-0071/evidence/
  how: >
    The app was served by `bun run dev` with VITE_FANTASY_DATA_MODE=supabase, so
    the REAL cloud path runs end to end (SupabaseFantasyRepository -> zod ->
    playerDto -> route). The PostgREST RPC endpoints were intercepted in
    Playwright (page.route on **/rest/v1/rpc/*) and answered from fixtures.
    Chromium came from PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers;
    `playwright install` was never run.
  why_a_fixture: >
    Production today has ZERO scored gameweeks, so the only thing production can
    honestly show is a dash. That is variant `empty` and it is the real live
    answer. The populated numbers are a FIXTURE, deliberately labelled as such —
    no screenshot here claims production shows numbers.
  matrix: "2 variants x {fr, ar} x {390x844, 1440x900} x {player list, player detail Overview, player detail History} = 24 screenshots + observations.json."
  observed:
    empty_variant:
      - "Player list, fr and ar, 390 and 1440: every row reads `Forme –` / `الحالة –`. Three players, three dashes, no `0.0` anywhere in the page text."
      - "Player detail Overview: the Forme tile reads `–`; Total points reads 0 (a real zero — nothing has been scored) and Sélection reads 0%."
      - "Player detail History: EmptyState. No fabricated rows."
    populated_variant:
      - "Player list: `Forme 7,4 · 50%`, `Forme 3,2 · 25%`, and — the case that matters — `Forme 0 · 0%` for the player whose real form in the window is 0. A genuine 0 and an unknown value now look different."
      - "Player detail History, fr: `Journée 4 / WAC (Domicile) / 90 min / 9 pts` and `Journée 5 / FAR (Extérieur) / Provisoire / 61 min / 2 pts`."
      - "Player detail History, ar: the same rows mirrored RTL, with `(أرضه)` / `(خارج أرضه)` and the `مبدئية` badge. Layout holds at 390 and 1440 in both directions."
  note: >
    Gameweek names in the History tab ("Journée 4") come from the database row
    (gameweekName) and are not translated client-side, in both languages. That
    matches how gameweek names are treated everywhere else in the product and is
    the server's data, not a rendering defect.

