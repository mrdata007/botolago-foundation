changes:
  - file: scripts/backend/football-team-identity-seed.sql
    description: >
      NEW data-only production runbook in the shape of scripts/backend/fantasy-realign-gameweek-calendar.sql
      (header with per-row sources, begin, service-role set_config, one DO block, review SELECT, `-- commit;`).
      Writes ONLY app.teams.code for the nine VERIFIED official self-designations decided by the owner on
      2026-09-18: Raja Casablanca RCA, FAR Rabat ASFAR, FUS Rabat FUS, Maghreb Fès MAS, Ittihad Tanger IRT,
      UTS Rabat UTS, CR Khemis Zemamra RCAZ, Moghreb Tétouan MAT, Widad Témara WST. INFERRED codes
      (WAC, RSB, HUSA, DHJ, KACM, CODM, USAT) are not written. Wydad keeps the provider value WCA (header
      records that WCA is provider-supplied, not independently verified branding). Colours are deferred:
      primary_color / secondary_color are never written. The UPDATE is
      `set code = v.code ... where t.id = v.matched_id and t.code is null and t.code is distinct from v.code`,
      so a pre-existing non-null code is never replaced and a re-run touches 0 rows without bumping
      updated_at. Guards (raise → rollback): exactly 9 unique names/codes; every code ~ '^[A-Z0-9]{2,8}$'
      before the table constraint; every name matches exactly one ACTIVE app.teams row (scalar subquery
      errors on >1, guard errors on 0), 9 matched in total. `get diagnostics` row_count is reported by
      `raise notice`. The VALUES list lives in a session temp table created with CREATE TEMP TABLE ... AS
      (no INSERT/DELETE anywhere in the file); DML touches app.teams only. Header records the durability
      caveat (see database_changes).
  - file: docs/engineering/tasks/BG-0018/rehearsal-team-identity.json
    description: >
      Rolled-back production rehearsal artefact (project tkewgajrljbwgwedqsxn, 2026-09-18T12:17Z):
      protocol, owner decisions, before snapshot of the 16 current clubs (id, name, short_name, code,
      primary_color, secondary_color, updated_at), first-run row_count 9, second-run row_count 0 with
      no updated_at bump, api.football_team_catalog('fr',100) excerpt showing the 9 codes (+ WCA),
      collateral 0, format violations 0, read-only residue check after rollback (codes NULL again except
      WCA, max(updated_at) unchanged, no temp residue), durability note (AT-8), and the baseline
      deviation from the brief (21 active rows, not 16).
  - file: docs/engineering/tasks/BG-0018/implementation-report.yaml
    description: This report.
database_changes:
  - >
    NONE committed. The production database was touched only by read-only SELECTs and by one
    rolled-back rehearsal transaction (begin → service-role set_config → DO block ×2 → checks →
    raise exception 'REHEARSAL_BG0018 …' → rollback). No apply_migration, no role switch, no commit.
    The committed production run of scripts/backend/football-team-identity-seed.sql is NOT part of
    this task; it is executed by the Shipper/owner only after Verifier and Reviewer PASS.
  - >
    DURABILITY (recorded here and in the script header): api.ingest_football_catalog_entity overwrites
    app.teams.code from the provider payload on every fresh team payload
    (supabase/migrations/20260731180229_gate2b_football_catalog_ingestion.sql:277-302, `code = v_code`
    unconditionally, v_code = provider short_code = NULL for these nine clubs). The seeded codes are
    therefore NOT durable until BG-0036 lands: the next dispatch of football-current-season-recovery
    or the fantasy orchestrator recovery step that sees a fresh provider timestamp resets them to NULL.
    Colours are unaffected (never written by ingestion nor by this script). The script is idempotent
    and can be re-run after any ingest.
