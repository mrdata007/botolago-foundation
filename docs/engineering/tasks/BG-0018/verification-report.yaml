security_observations:
  - "Blast radius of the committed run is bounded to app.teams.code on rows whose name matches exactly one ACTIVE row among the nine listed names and whose code IS NULL; the UPDATE joins on matched_id (uuid) so no other row can be touched. Verified in the rehearsal: 12 of 21 rows byte-identical including updated_at."
  - "The scalar subquery `(select t.id from app.teams t where t.name = v.team_name and t.active)` raises 'more than one row' if a homonym active row ever appears, and Guard 3 raises on zero matches — either aborts the whole transaction before the UPDATE. Both paths depend on exact NFC name equality with production; today all nine match."
  - "The script runs with request.jwt.claims role=service_role via set_config inside the transaction and must be executed as the database owner / service role; RLS on app.teams is forced. The MCP session ran as postgres (role_setting none) and the UPDATE succeeded, so the rehearsal is representative of a SQL-editor run."
  - "Production holds 5 stale active rows (Chabab Mohammédia, JS Soualem, Olympic Safi, Olympique Dcheïra, Yacoub El Mansour) exposed by api.football_team_catalog. The seed does not touch them, but they are a data-quality exposure to triage separately (not a BG-0018 defect)."
  - "Non-durability is a correctness rather than security concern: any recovery dispatch between the committed run and BG-0036 silently reverts the nine codes; nothing alerts on it."
  - "No credentials, keys or model identifiers appear in the three changed files."

