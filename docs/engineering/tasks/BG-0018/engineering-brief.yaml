    select set_config('request.jwt.claims','{"role":"service_role"}',true);
    create temp table pre as
      select id, name, short_name, slug, code, primary_color, secondary_color, crest_asset_id, active, updated_at
      from app.teams;
    select count(*) filter (where active) as active_teams, count(*) as all_teams,
           count(*) filter (where code is null) as code_null,
           count(*) filter (where primary_color is null) as primary_null from pre;
    -- expect: active_teams 16, code_null 15, primary_null 16 (baseline per extractor)
    \i scripts/backend/football-team-identity-seed.sql   -- DO block only (strip its own begin/commit lines when embedding)
    -- expect NOTICE: 'team identity applied: 16 rows' (or N = number of decided rows; must equal the VALUES count)
    select count(*) as changed from app.teams t join pre p using (id)
      where (t.code, t.primary_color, t.secondary_color) is distinct from (p.code, p.primary_color, p.secondary_color);
    -- expect: changed = N (16 under policy (a))
    select count(*) as collateral from app.teams t join pre p using (id)
      where t.name <> p.name or t.short_name <> p.short_name or t.slug <> p.slug
         or t.crest_asset_id is distinct from p.crest_asset_id or t.active <> p.active;
