constraints:
  - Never invent a code or colour; UNKNOWN cells remain NULL in production. Wikipedia and site-CSS values are pointers, not sources.
  - Codes must satisfy '^[A-Z0-9]{2,8}$'; colours '^#[0-9A-Fa-f]{6}$' (validate in the DO block before the UPDATE).
  - Key rows by app.teams.name (VERIFIED list) or by uuids captured in the read-only rehearsal step; never by slug guesses (slugs are generated by app_private.football_catalog_slug and were not extracted).
  - The UPDATE must be conditional (`is distinct from`) so re-runs are no-ops and updated_at is untouched.
  - The script may touch only code, primary_color, secondary_color. No inserts, no deletes, no other tables.
  - Production execution requires explicit owner approval and must be preceded by a rolled-back rehearsal on the same database; the Builder never commits.
  - Wydad: production currently holds the provider's "WCA"; changing it to the club's "WAC" is a deliberate decision to be recorded (and will be reverted by the next fresh re-ingest until the follow-up lands).
  - Do not touch src/lib/kits.ts even though its palette contradicts pointers for CODM/DHJ (recorded, out of scope).

# ---------------------------------------------------------------------------
# 4. RISKS
# ---------------------------------------------------------------------------
risks:
  - "VERIFIED — Clobber: api.ingest_football_catalog_entity rewrites code = provider code (NULL for 15 clubs) on every fresh team payload; the next operator-triggered current-season recovery run can silently undo the curated codes. Mitigation: the script is idempotent and re-runnable after any ingest; durable fix is the follow-up above. Colours are not at risk."
  - "INFERRED — Length/legibility: official self-designations are 4–5 characters for ASFAR, HUSA, KACM, CODM, RCAZ, USAT; the placeholder was designed for 2–3 letters (ClubCrest sm at 10 px, FDR cell 13 px bold). Either accept longer codes (visual check required) or use 3-letter forms only where the club itself uses one; truncating is invention."
  - "VERIFIED — RLS is forced on app.teams. If the executing role lacks BYPASSRLS/an UPDATE policy the DO block updates 0 rows silently; the rehearsal's first-run row_count = 16 assertion catches this (0 ⇒ stop, do not switch roles ad hoc)."
  - "INFERRED — Unicode: names contain â/è/é (Difaâ, Meknès, Fès, Tétouan, Témara); an NFD/NFC mismatch between the script file and stored rows would fail the 'exactly one match' guard (safe failure, but blocks the run). Capture uuids in the read-only rehearsal step if it occurs."
  - "INFERRED — Encoding decisions: any hex chosen for 'rouge', 'blanc', 'noir', 'vert' is editorial; if the owner declines to approve an encoding, colours stay NULL and only ClubCrest keeps its '#0a2540' fallback — codes still deliver the visible win."
  - "VERIFIED — Wydad 'WCA' (provider) vs 'WAC' (club); leaving WCA is inconsistent with the club's identity, changing it is exposed to the clobber risk."
  - "VERIFIED — Homonym clusters (Abdallah Boukhanfer ×2 at Hassania Agadir; Abdoulaye Coulibaly ×3 at Wydad Casablanca) are player-level rows with distinct provider identities; they do not involve team codes or colours and are unaffected by this operation (extractor:35-37; docs/qa/FANTASY_LAUNCH_HARDENING_2026_09_18.md:143,245)."

# ---------------------------------------------------------------------------
# 5. CONTRADICTIONS
# ---------------------------------------------------------------------------
contradictions:
  - "Task wording 'short_code' vs schema: the column is app.teams.code; 'shortName'/short_name is a different, NOT NULL column that currently holds the full name for 15 clubs (VERIFIED)."
  - "Task wording 'official 3-letter code' vs official identities: six clubs designate themselves with 4–5 letters (ASFAR, HUSA, KACM, CODM, RCAZ, USAT); no official 3-letter form exists for them (VERIFIED absence on reachable official pages)."
  - "Production 'WCA' (provider) vs the club's own 'WAC' (INFERRED via Wikipedia; official site unreachable)."
  - "src/lib/kits.ts hard-codes green for 'codm' and green/red for 'difa' while the (non-official) Wikipedia pointers say red/white and green/white; the Scout note 'app.teams colours not used' is confirmed for jerseys (VERIFIED) — populating the DB will not fix jersey colours."
  - "Extractor lists 'kits_overrides_in_repo' keyed war/rca/asfar…: these OVERRIDES cannot match production uuids (VERIFIED), so they are dead in production; only BOTOLA_KITS applies."
  - "Production club name 'CR Khemis Zemamra' vs the club's official 'Renaissance Club Athletic Zemamra' (RCAZ); 'FAR Rabat' vs 'AS FAR' — provider naming, out of scope."

