hex_policy:
  classification: VERIFIED (absence)
  statement: >
    No official source found publishes a hex value for any club's colours; the two official
    colour statements (AS FAR, Widad Témara) give colour NAMES only. The database requires
    '#RRGGBB'. Any mapping from a name to a specific hex (e.g. "rouge" → a particular red) is an
    editorial encoding, not a fact, and must be an owner-approved decision recorded as INFERRED.
    Site CSS/theme-color values were collected as pointers but are website chrome, not declared
    kit colours, and must not be written as if official.

# ---------------------------------------------------------------------------
# 2. ROOT CAUSE
# ---------------------------------------------------------------------------
root_cause:
  classification: VERIFIED
  description: >
    app.teams is populated exclusively by SportsMonks catalog ingestion, which maps the provider's
    short_code to code and never touches colours. The provider supplies a short_code for one of
    the 16 clubs ("WCA" for Wydad), so 15 clubs carry code NULL and short_name = full name, and all
    16 carry NULL colours. No RPC, admin operation, seed or runbook exists to curate these three
    columns, and the ingestion UPDATE would overwrite any curated code with the provider's NULL on
    the next fresh team payload. The UI already reads code/primaryColor/secondaryColor and falls
    back (first three letters of short_name; "#0a2540") only because the columns are empty.

# ---------------------------------------------------------------------------
# 3. REQUIRED CHANGES
# ---------------------------------------------------------------------------
required_changes:
  - component: scripts/backend/football-team-identity-seed.sql (NEW; data-only SQL runbook, Builder-Data)
    change: >
      Idempotent, guarded, single-transaction script in the exact shape of
      scripts/backend/fantasy-realign-gameweek-calendar.sql: header comment (purpose, sources,
      rehearsal reference), `begin;`, `select set_config('request.jwt.claims','{"role":"service_role"}',true);`,
      one DO block, a review SELECT, `-- commit;`. The DO block holds a VALUES list of exactly
      16 rows (team_name, code, primary_color, secondary_color) using app.teams.name as the key
      (the 16 names in findings), each value carrying an inline `-- source:` comment with the
      citation from club_identity. Guards that raise (and therefore roll back): every listed name
      must match exactly one active app.teams row and the total must be 16 (compare with
      normalised names if the accent forms differ: use `lower(unaccent(...))` only if the extension
      exists, else exact match and stop); every code must match '^[A-Z0-9]{2,8}$' and every
      non-null colour '^#[0-9A-Fa-f]{6}$' before the UPDATE (so the constraint is never the first
      line of defence); the UPDATE must be
      `set code = v.code, primary_color = v.primary_color, secondary_color = v.secondary_color
       where t.id = matched_id and (t.code, t.primary_color, t.secondary_color)
       is distinct from (v.code, v.primary_color, v.secondary_color)` so a second run touches 0 rows
      and does not bump updated_at. `get diagnostics` the row count and `raise notice` it. The
      script must never write name, short_name, slug, active, country_id, venue_id, crest_asset_id.
      Values: codes and colours ONLY as decided by the owner (see unknowns → decisions);
      UNKNOWN cells stay NULL. Preserve WCA vs WAC decision explicitly.
    reason: >
      Only direct SQL can set these columns (no RPC exists); the repository's convention for a
      production data operation is a rehearsed SQL runbook, not a migration (migrations carry
      schema/functions, must pass validate-migrations.mjs and be added to the promoter manifest,
      and would execute against every environment including the empty test database).
