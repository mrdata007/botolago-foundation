task_id: BG-0018
role: Researcher
attempt: 1
researched_at: "2026-09-18"
workspace: /home/user/research-main @ origin/main 1603c1c (read-only)
objective: >
  Specify the smallest additive data operation that gives the 16 Botola Pro 2026/27 clubs in
  production a short code (app.teams.code) and primary/secondary colours (app.teams.primary_color,
  app.teams.secondary_color), using only official club/federation identities (no invention), and
  state exactly how the existing UI renders once those columns are populated. Scope is limited to
  codes and colours; player photos, homonyms, rounds and kickoffs are out of scope (tracked
  elsewhere).

# ---------------------------------------------------------------------------
# 1. FINDINGS
# ---------------------------------------------------------------------------
findings:
  # ---- schema -------------------------------------------------------------
  - classification: VERIFIED
    statement: >
      The short code lives in app.teams.code (text, nullable). There is no short_code column.
      Constraint teams_code_check: code is null or code ~ '^[A-Z0-9]{2,8}$' (upper-case
      alphanumerics, 2 to 8 characters). Colours live in app.teams.primary_color and
      app.teams.secondary_color (text, nullable) with constraints teams_primary_color_check /
      teams_secondary_color_check: null or ~ '^#[0-9A-Fa-f]{6}$' (six-digit hex with '#').
      short_name is a separate NOT NULL text (1..40) column.
    evidence: supabase/migrations/20260720095330_football_catalog.sql:213-246
  - classification: VERIFIED
    statement: >
      app.teams has RLS enabled AND forced (alter table app.teams enable/force row level security)
      and a before-update trigger teams_set_updated_at.
    evidence: supabase/migrations/20260720095330_football_catalog.sql:379-380, 404
  - classification: VERIFIED
    statement: >
      A database test asserts the colour format constraint ('red' is rejected with SQLSTATE 23514).
    evidence: supabase/tests/database/football_domain.test.sql:125-131
  # ---- how the columns are written today -----------------------------------
  - classification: VERIFIED
    statement: >
      The only writer of app.teams.code is provider ingestion:
      api.ingest_football_catalog_entity (service_role only). For entity 'team' it sets
      v_code := nullif(upper(p_entity->>'code'),'') and on UPDATE rewrites
      name, short_name, code, country_id, active unconditionally (code = v_code). It never
      writes primary_color or secondary_color.
    evidence: supabase/migrations/20260731180229_gate2b_football_catalog_ingestion.sql:277-302
  - classification: VERIFIED
    statement: >
      The update branch is skipped only when the provider freshness timestamp equals the mapping's
      last_seen_at AND source_version is unchanged; a newer provider timestamp always re-runs the
      UPDATE (an older one raises STALE_UPDATE).
    evidence: supabase/migrations/20260731180229_gate2b_football_catalog_ingestion.sql:148-161
  - classification: VERIFIED
    statement: >
      The provider payload's code comes from SportsMonks short_code normalised by teamCode()
      (upper-case, strip non [A-Z0-9], accept only ^[A-Z0-9]{2,8}$ else null). shortName is
      short_code when present, otherwise name.slice(0,40). Freshness updatedAt is
      last_processed_at ?? updated_at ?? last_played_at ?? observedAt.
    evidence: supabase/functions/_shared/sportsmonks-catalog.ts:330-342, 366-370, 551-559
  - classification: VERIFIED
    statement: >
      Consequence visible in production evidence: Wydad's short_name is the provider code "WCA"
      while the other 15 clubs' short_name equals their full name (e.g. "Difaâ El Jadida",
      "UTS Rabat"). This is why the UI "falls back to full names".
    evidence: >
      docs/engineering/tasks/BG-0003/rehearsal-deadline-guard.json:66-160 (fixtures[].homeTeam /
      awayTeam are app.teams.short_name per docs/engineering/tasks/BG-0003/engineering-brief.yaml:93);
      docs/engineering/tasks/BG-0011-0018/extractor-production-data.yaml:24-26
  - classification: VERIFIED
    statement: >
      Crests were NOT seeded by a migration. They were fetched from the provider by the football
      ingestion edge function and linked through api.attach_football_team_crest (service_role
      only; updates crest_asset_id only) under a reviewed production canary that requires
      16 fetched / 16 validated / 0 rejected.
    evidence: >
      supabase/migrations/20260801010200_sportsmonks_team_crests.sql:17-147;
      supabase/functions/_shared/sportsmonks-catalog.ts:401-445;
      scripts/backend/gate4-canary-evidence.ts:148-152
  - classification: VERIFIED
    statement: >
      No admin RPC touches app.teams (grep of the five *admin* migrations for "team": no match),
      and no migration anywhere writes primary_color / secondary_color (only the CREATE TABLE and
      the read projections reference them). There is therefore no service RPC or admin operation
      that can set codes or colours today; the only path is direct SQL in the trusted database
      context.
    evidence: >
      grep 'primary_color|secondary_color' supabase/migrations → 20260720095330 (DDL),
      20260720095354:45-46 and 20260720110107:489-490 (read-only JSON projections);
      grep -i team supabase/migrations/*admin* → no matches
  - classification: VERIFIED
    statement: >
      Repository precedent for a data-only production operation is a guarded SQL runbook under
      scripts/backend/ (begin; set_config('request.jwt.claims','{"role":"service_role"}',true);
      DO block with raise-exception guards; review SELECT; '-- commit;'), rehearsed inside a
      rolled-back transaction on the production project and documented with a JSON rehearsal
      artefact in the task folder. Migrations are reserved for schema/functions and must be added
      to the hard-coded promoter batch manifest to reach production.
    evidence: >
      scripts/backend/fantasy-realign-gameweek-calendar.sql:1-83;
      docs/engineering/tasks/BG-0003/rehearsal-deadline-guard.json:5-25;
      docs/qa/FANTASY_LAUNCH_HARDENING_2026_09_18.md:77-80;
      scripts/backend/phase7e-production-migration-promoter.py:60-130 (BATCHES manifest);
      scripts/backend/validate-migrations.mjs
  - classification: VERIFIED
    statement: >
      Team re-ingestion in production is operator-triggered only (workflow_dispatch), through
      football-current-season-recovery.yml → scripts/backend/current-season-recovery.ts, which
      calls handleSportsMonksCatalogRequest (job "catalog") and therefore
      api.ingest_football_catalog_entity for the 16 teams.
    evidence: >
      .github/workflows/football-current-season-recovery.yml:3-9;
      scripts/backend/current-season-recovery.ts:578-636
  # ---- API projection ------------------------------------------------------
  - classification: VERIFIED
    statement: >
      app_private.football_team_json emits 'code', 'shortName', 'primaryColor', 'secondaryColor'
      straight from app.teams; api.football_team_catalog (anon/authenticated) returns that JSON
      for all active teams. The news team JSON emits primaryColor/secondaryColor too. No code
