# ---------------------------------------------------------------------------
# 7. ACCEPTANCE TESTS
# ---------------------------------------------------------------------------
acceptance_tests:
  - |
    AT-1 (production, rolled back — Verifier runs as the trusted database context, e.g. Supabase SQL editor on project tkewgajrljbwgwedqsxn):
