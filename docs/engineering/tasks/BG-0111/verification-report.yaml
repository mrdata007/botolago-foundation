how_this_was_measured:
  server: >
    Own Vite dev server on 127.0.0.1:4293, started from this worktree, with
    E2E_BASE_URL pointing at it. Port 4173 (playwright.config's default outside CI)
    was never bound by this lane — a run against a sibling lane's tree on the shared
    port has already produced one false result in this project.
  browser: Chromium from PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers. `playwright install`
    was never run.
  data_mode: mock (VITE_*_DATA_MODE defaults), signed in as the demo user
    demo@botolago.ma through the real login form.
  viewports: 390x900 and 1440x900, deviceScaleFactor 2, reducedMotion reduce, in fr and
    ar. Screenshots are full-page.
  assertions_not_eyeballing: >
    Three independent checks per capture, because `html, body { overflow-x: clip }`
    makes any single one unreliable:
      1. document.documentElement.scrollWidth against the viewport;
      2. every laid-out box's left/right against the viewport, skipping content inside
         a deliberate horizontal scroller and counting decorative text-free
         aria-hidden nodes (the auth mesh) separately;
      3. per-element text clipping: a Range measurement of the real text width against
         the element's content box, plus line-clamp overflow and overflow:hidden.
    Every scroller on the page is listed with its scrollWidth and clientWidth, so "it
    scrolls with no affordance" is a measurement rather than an impression.
  raw:
    - docs/engineering/tasks/BG-0111/evidence/assertions-before.json
    - docs/engineering/tasks/BG-0111/evidence/assertions-after.json
  before_evidence_integrity: >
    The "before" pass was captured against the base tree itself, not from memory: the
    work was committed, `git checkout <base> -- src` restored the base sources, the
    pass ran, and the work was restored from the commit. The before and after passes
    therefore use the identical assertion code.

gates:
  typecheck:
    command: bun run typecheck
    result: pass, no output
  test:
    command: bun run test
    result: 1453 pass / 0 fail / 15270 expect() calls across 158 files
    baseline_was: 1438 pass / 0 fail
    why_it_moved: >
      DELIBERATE, and flagged here because the brief gave 1438 as a tripwire. 15 tests
      were added, none changed, none removed: 9 in the new
      src/lib/club-identity.test.ts (the item-7 letter derivation, including the exact
      production shapes — blank code, short_name that IS the code, particle names) and
      6 in src/lib/feature-flags.test.ts (that OAUTH_PROVIDERS_ENABLED is one constant
      carrying its probe evidence, that both auth routes gate on it with the divider
      inside the gate, that the glyphs and strings stay in the tree, and that Profile's
      Appearance row is gated label-and-all). Running `bun run test` at the base commit
      still gives 1438; the delta is exactly these 15. None of them asserts a flag is
      `false`, so they keep passing when a flag is flipped on.
  lint:
    command: bun run lint
    result: 0 errors, 17 warnings — all pre-existing react-refresh/only-export-components
      warnings in files this branch does not touch
  format_check:
    command: bun run format:check
    result: 40 warn + 11 parse-error files, all pre-existing
    checked: >
      Every file this branch touches passes. The 11 parse errors are malformed YAML in
      other tasks' docs (BG-0003, BG-0011, BG-0012, BG-0014, BG-0020, BG-0032, BG-0081
      and LAUNCH_LEDGER.yaml). Both deliverable YAMLs in this directory parse and are
      Prettier-clean.
  i18n_gate:
    command: bun scripts/qa/i18n-gate.ts
    result: RESULT pass
    warnings: W1 7 (baseline 7), W2 7 (baseline 7), W3 262 (baseline 262), W4 88
      (baseline 88) — every one at baseline, before and after
    baseline_moves: none. No key was added, renamed or removed and no new string was
      introduced, so no counter could move.
  build:
    command: bun run build
    result: pass — legal-placeholder gate ok, client and server bundles built, nitro
      output generated
  design_divergence:
    command: bun scripts/qa/design-divergence.ts
    before: 1534 across 91 files
    after: 1533 across 91 files
    delta: >
      -1, in src/components/fpl/FplChipsRow.tsx (12 -> 11): the un-prefixed
      `tracking-wide` became `ltr:tracking-wide`. No rule went up. physicalDir is 34
      before and after, and all 34 are in the untouched legacy shadcn layer
      (src/components/ui/**, 33) plus src/components/splash/SplashScreen.tsx (1) — the
      converted product surface is at zero and this branch keeps it there.

