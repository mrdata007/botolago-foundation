      "(D)" / "(E)".
    what_is_actually_rendered_now:
      fr: >
        "FUS (D)", "RCA (D)", "FAR (E)", "MAT (D)", "RSB (E)" — a real opponent code on
        every plate, from the derivation, for all 15 players including the bench.
      ar: '"FUS (م)", "RCA (م)" — same codes, the home/away marker localised.'
      geometry: >
        Plate 76x18px, content box 68px. Text-only "RCA (D)" measures 41px in French
        and 37-38px in Arabic. Nothing clipped in either language.
      crest_branch: >
        The crest renders at 14px inside the 18px band, inline before the letters with
        a 4px gap. Measured by inserting a 14px box into a live plate: the composed
        content is 58px (fr) / 55px (ar) against the 68px content box — it fits with
        10-13px to spare and does not clip.
      legibility_answer: >
        Asked directly: at 14px a Botola club crest reads as a colour-and-shape
        signature, not as a legible badge — enough to tell RCA's green from FAR's navy
        at a glance, not enough to identify a club you do not already know. The LETTERS
        are the legible identity at plate size, and the crest is a supporting cue. That
        is why this ships as crest AND code rather than crest alone: dropping the
        letters for the crest would have traded one unreadable plate for another. If
        the owner wants the crest to carry identity on its own it needs ~20px, which
        means a taller plate band and is a pitch-layout change, not a plate change.
    not_reproducible_in_this_environment:
      crest_images: >
        The mock football repository returns crestUrl: null and crestPath: null for
        every club, so no screenshot in this evidence set shows an actual crest — the
        after screenshots show the letters-and-marker branch. The crest branch is
        verified by geometry (above) and by construction, not by a rendered crest. On
        production crest_asset_id is populated for all 21 clubs, so that branch is the
        one that will run there.
      club_kits: >
        Every shirt on the mock pitch renders the default navy, before and after. The
        cause in mock is the id-space mismatch described in the implementation report;
        on production the owner measured a different cause (primary_color null for all
        21). Neither is fixed here: `clubOf` lives in src/routes/fantasy.team.tsx,
        which this lane does not own, and the colours are backend data. Reported, not
        touched.

found_and_deliberately_not_fixed:
  - id: player-surname-ellipsis
    where: /fantasy/team pitch name plates
    measured: '"Salah-Eddine" 71px of text in a 68px content box, ellipsised to
      "Salah-Eddi…" at 390px fr. Present before and after, unchanged by this branch.'
    why_not: >
      Not one of the seven, and it is a different class of problem: a player surname is
      unbounded provider data, not fixed product vocabulary, so the plate cannot be
      sized to the longest one and truncation with a full accessible name on the button
      is a defensible answer. Raising it rather than widening a plate on my own
      initiative.
  - id: match-tabs-below-370px
    where: /matches/$matchId section tabs
    see: per_item item 2b, residual_not_fixed
  - id: fantasy-football-id-space-mismatch-in-mock
    where: src/backend/football/mock-repository.ts mints synthetic UUIDs while the
      Fantasy mocks key on source slugs
    impact: >
      Any screen that joins Fantasy data to a football Club by id resolves nothing in
      mock — club kits, crests and club names on the pitch. Item 7 works around it in
      its own presenter by matching on slug as well as id, which is correct in both
      modes, but the underlying mismatch is still there and src/backend/ is out of this
      lane's ownership.

conclusion: >
  Seven reported items fixed, one additional truncation found and fixed inside a named
  file, three residuals reported with numbers. All gates green with one deliberate,
  explained movement (1438 -> 1453 tests). No flag value changed, no RPC touched, no
  business logic changed, no physical-direction utility or un-prefixed tracking added.
  The base branch moved 15 commits during the run and three files overlap — merge, do
  not fast-forward.
