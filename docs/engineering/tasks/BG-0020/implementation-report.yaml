changes:
  - file: scripts/backend/check-config-integrity.mjs
    description: >
      New dependency-free ESM guard (node builtins only, runnable before
      `bun install`). Exports RULES, scanText(filePath, text) and
      resolveTargets(root); CLI guarded by
      `import.meta.url === pathToFileURL(process.argv[1]).href`. Closed scanned
      set: eslint.config.js, vite.config.ts, playwright.config.ts, bunfig.toml,
      package.json and every .github/workflows/*.yml|*.yaml (readdirSync).
      Rules per line, all reported then failed: R1 long-line (>500 chars),
      R2 padding-run (/\S[ \t]{40,}/), R3 hex-identifier (/_0x[0-9a-fA-F]{4,}/),
      R4 require-shim (/createRequire/ or /\brequire\s*\(/), R5 dynamic-eval
      (identifier `eval`, `new Function(`, `Function(`), R6 base64-blob
      (/[A-Za-z0-9+/]{120,}={0,2}/ excluding all-hex runs). No allowlist and no
      suppression comments. Flags: none (scan the set) and `--file <path>`.
      Exit 0 clean (one stdout line), 1 violations (stderr `- file:line rule`,
      offending text collapsed and truncated to 80 chars), 2 usage error,
      unreadable file or empty target set.
  - file: scripts/backend/check-config-integrity.test.ts
    description: >
      New bun:test unit test with inline fixtures. Positive cases for every
      rule (including `f(eval, x)`, a 600-character line and the historical
      one-line payload shape) and negative cases (376-character YAML line,
      64-character SHA-256 digests, deeply indented YAML, `.eval` / `.Function(`
      member expressions). Asserts resolveTargets is non-empty and contains the
      five configuration files plus backend-quality.yml and
      fantasy-authenticated-e2e.yml, never scripts/ or docs/; asserts scanText
      over all resolved targets returns []; asserts that in backend-quality.yml
      the "Config integrity guard" step index is lower than both
      `bun install --frozen-lockfile` (both jobs) and `bun run lint`; covers the
      CLI exit codes 0, 1, 2 (unknown flag, unreadable path, empty target root).
  - file: .github/workflows/fantasy-authenticated-e2e.yml
    description: >
      New workflow with exactly two triggers — workflow_dispatch (inputs
      `target`: staging|production, default staging; `confirmation`) and
      schedule "0 3 * * *". No pull_request or push trigger. Job gate:
      repository == mrdata007/botolago-foundation && ((schedule &&
      vars.FANTASY_E2E_ENABLED == 'true') || (workflow_dispatch &&
      inputs.confirmation == 'RUN_FANTASY_E2E')). runs-on ubuntu-latest,
      timeout-minutes 40, environment fantasy-e2e, permissions contents: read,
      concurrency group fantasy-authenticated-e2e with cancel-in-progress false.
      Steps: checkout → setup-bun 1.3.14 → ::add-mask:: (password, publishable
      key) → target-resolution guard (schedule resolves to staging or exits 1)
      → credential-presence guard (exit 1 on any empty value) →
      bun install --frozen-lockfile → config integrity guard →
      bunx playwright install --with-deps chromium → bun run test:e2e:fantasy →
      upload playwright-report, test-results/playwright/**/*.png and
      test-results/playwright/**/sanitized-browser-diagnostics* (retention 7).
      Credential names only; no values.
  - file: .github/workflows/backend-quality.yml
    description: >
      One step inserted per job, immediately after setup-bun and before
      `bun install --frozen-lockfile`: `- name: Config integrity guard` running
      `bun run config:integrity:check`, in both application-quality and
      database-quality. Every pre-existing step left untouched and in order.
  - file: playwright.config.ts
    description: >
      Line 18 trace expression only: traces are now also disabled when
      E2E_FANTASY_EMAIL is set, so a failing credentialed run cannot upload a
      trace carrying the synthetic manager's session tokens (prettier wrapped
      the expression across four lines).
  - file: package.json
    description: >
      "scripts" block only, two entries added:
      "test:e2e:fantasy": "playwright test tests/e2e/fantasy.journey.e2e.ts" and
      "config:integrity:check": "bun scripts/backend/check-config-integrity.mjs".
  - file: docs/qa/SECURITY_INCIDENT_2026_09_18_ESLINT_LOADER.md
    description: >
      One sentence appended to owner action 4 referencing the new guard, its npm
      script and its placement before `bun install` in both backend-quality
      jobs. No other part of the incident record touched.
