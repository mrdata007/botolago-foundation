observations_non_blocking:
  - requirement: "Objective (b) phrasing 'positioned before bun install'"
    note: >
      In .github/workflows/fantasy-authenticated-e2e.yml the "Config integrity guard" step runs AFTER
      `bun install --frozen-lockfile`, not before it. This is exactly the step order the brief's RC-1
      prescribes for that workflow, and the objective's before-install requirement is satisfied where it
      is load-bearing (backend-quality.yml, both jobs). Flagged only because the ordering there is
      defence-in-depth that the new workflow does not get.
  - requirement: "Guard invocation path"
    note: >
      backend-quality.yml invokes the guard as `bun run config:integrity:check`, which resolves the script
      through package.json and starts bun (which reads bunfig.toml) â both files being members of the very
      set the guard scans. A payload planted in the package.json script entry, or a `preload` entry in
      bunfig.toml, would therefore execute one step before it is scanned. Invoking the script by path with
      node would remove that residual. The brief specifies the npm-script form, so this is a hardening
      follow-up, not a deviation.
  - requirement: "Production dispatch var fallback"
    note: >
      VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY use `(dispatch && target=='production') && prodVar
      || stagingVar`. If a production var is unset, the expression silently falls back to the staging
      value while FANTASY_E2E_TARGET still reads "production". This fails safe (production is never hit)
      but is silently mislabelled; a presence assertion per resolved target would make it loud.
  - requirement: "Guard blast radius on the workflow directory"
    note: >
      resolveTargets globs .github/workflows/*.yml|*.yaml, so any future workflow line exceeding 500
      characters reds every CI job. The brief records this as an accepted MEDIUM risk (current maximum is
      376 chars); no allowlist and no suppression comment exists by design.
  - requirement: "Detection model"
    note: >
      The guard is a lexical shape scan, not an integrity or signature check. It fires on all five shape
      rules of the real 2026-09-18 artifact, but an injected payload written in idiomatic, short-line,
      unobfuscated JavaScript would pass. This is the documented design of incident owner-action #4 as
      scoped, not a defect.
  - requirement: "Test fixture precision"
    note: >
      The R1 negative fixture in check-config-integrity.test.ts builds its 376-char line from repeated "a",
      which is inside the hex alphabet and so is excluded from R6 by HEX_ONLY rather than by length. The
      test passes and asserts the right thing, but it does not isolate R1 from R6 the way the reviewer's
      hyphenated filler does. Cosmetic.
