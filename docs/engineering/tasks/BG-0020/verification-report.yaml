  - criterion: "AC2 / RC-1-A2: workflow trigger surface, gating tokens, schedule-forces-staging, credential guard, playwright.config env names, tests/e2e untouched"
    result: VERIFIED
    evidence: |
      (a) $ grep -nE '^\s*(pull_request|push):' .github/workflows/fantasy-authenticated-e2e.yml -> no match
          ("NO pull_request/push trigger"). The `on:` block contains exactly workflow_dispatch and schedule.
      (b) token counts in that file: workflow_dispatch 5, schedule 4, vars.FANTASY_E2E_ENABLED 1,
          secrets.E2E_FANTASY_PASSWORD 1.
      (c) schedule arm forces staging by two independent mechanisms:
          1. job-level env `FANTASY_E2E_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}`
             — on a schedule event the left conjunct is false, so the `||` yields the literal 'staging';
             the same expression guards VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY, which resolve to the
             production vars/secrets only when `github.event_name == 'workflow_dispatch' && inputs.target == 'production'`.
          2. step "Guard target resolution" runs `set -euo pipefail` then, for GITHUB_EVENT_NAME=schedule,
             `test "$FANTASY_E2E_TARGET" = "staging"`. Under `set -e` a failing `test` in that position aborts the step.
             Reproduced: bash -c 'set -euo pipefail; GITHUB_EVENT_NAME=schedule; FANTASY_E2E_TARGET=production;
             if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then test "$FANTASY_E2E_TARGET" = "staging"; fi; echo reached'
             -> no "reached", exit 1.
          Additionally the job `if:` requires (schedule && vars.FANTASY_E2E_ENABLED == 'true') ||
          (workflow_dispatch && inputs.confirmation == 'RUN_FANTASY_E2E'), plus repository == mrdata007/botolago-foundation.
      (d) credential-presence guard: step "Guard credential presence" is `set -euo pipefail` followed by
          `test -n "$E2E_FANTASY_EMAIL"`, `test -n "$E2E_FANTASY_PASSWORD"`, `test -n "$VITE_SUPABASE_URL"`,
          `test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"`. An empty secret makes `test -n` return 1 and `set -e` fails the step.
          Reproduced: bash -c 'set -euo pipefail; E2E_FANTASY_EMAIL=""; test -n "$E2E_FANTASY_EMAIL"; echo reached'
          -> no "reached", exit 1. This converts the suite's self-skip into a red run, as required.
      (e) $ grep -n 'E2E_FANTASY' playwright.config.ts -> line 19: `process.env.E2E_STAGING_FIRST_EMAIL || process.env.E2E_FANTASY_EMAIL`
