untested:
  - "RC-1-A3 (owner-gated): a real dispatch with target=staging producing 6 passed / 0 skipped. Not testable here — requires the GitHub Environment `fantasy-e2e`, the synthetic manager account and the Supabase staging vars, none of which exist in this sandbox. The brief itself records this as HALTED_FOR_INPUT."
  - "Behaviour of the workflow as executed by GitHub Actions (expression evaluation, environment protection, artifact upload). Verified by reading the YAML and by reproducing the two guard steps' shell semantics locally, not by an actual Actions run."
  - "`bun run lint` (full-repo ESLint) was not run end to end; only the two new files were linted, per AC9."
security_observations:
  - "No credential material is introduced by the diff; only secret/variable names. backend:secrets:check passes on the branch tree."
  - "The trace leak vector identified in the brief is closed: traces are `off` whenever E2E_FANTASY_EMAIL is present, video is off, and no trace path is in the artifact upload list."
  - "Residual, accepted by the brief: `playwright-report` is uploaded as a whole directory. With trace and video off, its attachments reduce to failure screenshots, which are already an explicitly sanctioned path — but a screenshot of an authenticated session can still show the synthetic manager's email in the UI. Artifact retention is 7 days and the account is synthetic, so this is low severity; worth noting if the account is ever a real one."
  - "E2E_FANTASY_EMAIL is deliberately not masked (only the password and the publishable key are). Consistent with treating the address as an identifier rather than a secret, and it keeps log output diagnosable."
  - "The guard is a lexical scan over a closed file set, not a signature or integrity check: it detects the 2026-09-18 payload's shape (R1/R2/R3/R4/R5 all fire on the real artifact) but a payload written in idiomatic, short-line, non-obfuscated JavaScript would pass. This is the documented design, not a defect, and it does close incident owner-action #4 as scoped."
  - "The scanned set is not widened to scripts/** or docs/**, as the constraint requires; resolveTargets has a unit test asserting this."
  - "Procedural note (not an acceptance failure): the branch is behind origin/main (merge-base 8921e7d, main now b6aa53f). The paths main added since are disjoint from the branch's, so no conflict is expected, but CI on the branch as-is has not seen main's current tree. After merge, the guard would scan main's files too; main's additions since the branch point are docs-only, so the clean result is expected to hold."
