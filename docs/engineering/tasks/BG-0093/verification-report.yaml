lane: B — squad building, the player picker, transfers
role: Verifier
branch: bg-0093-squad-picker
verdict: >
  PASS for the surfaces this lane owns. Every picker checklist item is verified
  item by item below against real Botola player data in French and Arabic. Three
  things are NOT verified and are listed under `not_verified` rather than
  quietly omitted: the club column against the production backend, the Supabase
  (cloud) transfer path, and the appearance of four sibling-owned components
  that this lane's screens render but does not own.

# ---------------------------------------------------------------------------
# HOW IT WAS MEASURED
# ---------------------------------------------------------------------------

method:
  server: >
    A dedicated Vite dev server on 127.0.0.1:4433 — NOT playwright.config's
    reused 4173, which sibling lanes hold. Every measurement below was taken
    against 4433 by a Playwright script driving the bundled Chromium from
    /opt/pw-browsers. `playwright install` was never run.
  data: >
    `VITE_*_DATA_MODE=mock` with the real Botola mock pool: 47 players across 8
    clubs with their real French and Arabic names — "Ahmed Reda Tagnaouti" /
    "أحمد رضا تكناوتي", "Zouhair El Moutaraji", "زهير العروبي", "Cassius Mailula".
    No placeholders. The long real names are the whole point: they are what
    truncated in the old 4-column picker.
  auth: "mock auth, demo@botolago.ma."
  viewports: [390, 430, 768, 1440]
  languages: [fr, ar]
  themes: >
    light, and dark by adding `.dark` to <html> by hand. DARK_MODE_ENABLED is
    still false and was not changed.
  overflow_assertions:
    - "`document.documentElement.scrollWidth <= innerWidth` — necessary but not sufficient."
    - >
      every element box against the viewport (`left < -1 || right > vw + 1`),
      because `overflow-x: clip` hides overflow from `scrollWidth`.
    - >
      every leaf text node against ITS OWN box (`scrollWidth > clientWidth`
      without `text-overflow: ellipsis`), which is what actually caught the one
      clipping defect found — a column head sliced by its own grid track while
      the viewport test stayed green. `sr-only` nodes are excluded.
  tap_targets: "every enabled button / select / a / input / [role=tab]: height >= 44px."
  contrast: >
    rasterised sRGB, not computed styles. The element is screenshotted, the PNG
    is decoded back inside Chromium, the pixels are histogrammed, and the ratio
    is taken between the dominant colour and the furthest-luminance colour
    covering >= 0.5% of the box. This sees opacity compositing and gradients,
    which a `getComputedStyle` read does not — and it is what caught the
    3.13:1 blocked row.

