not_verified:
  - id: the club column against the production backend
    detail: >
      In `VITE_FOOTBALL_DATA_MODE=mock`, `MockFootballRepository.getTeams` maps
      each club to a generated UUID while the Fantasy mock pool keys players by
      the slug ("war", "rca"), so `clubs.find(c => c.id === player.clubId)`
      misses and the club segment of the picker's meta line renders empty. It is
      a mock-only id mismatch in `src/backend/football/mock-repository.ts` — a
      file this lane must not touch — and it does not exist in Supabase mode,
      where both sides come from the same backend.
    what_was_done: >
      That one line was patched locally to return the slug, the picker was
      measured with real club names and real club kits present (screenshots in
      the report's evidence set show "FAR · GB", "WAC · GB", "RCA · GB",
      "الوداد · حم"), and the patch was reverted before commit. `git status`
      is clean of it and the meter/gates were all re-run afterwards.
    residual_risk: >
      low — the club segment is one truncating span in a `·`-joined line. The
      worst case is a longer production short name, and the line truncates
      rather than overflowing (verified with the Arabic club names, which are
      the longer set).
    suggested_owner: "whoever owns `src/backend/football/mock-repository.ts` — aligning the mock ids would make every Fantasy screen verifiable locally."
  - id: the cloud (Supabase) transfer path
    detail: >
      `previewTransfers` / `confirmTransfers` / `activateChip` run only when
      `owned.source === "cloud"`. The local harness is mock-mode, so the local
      branch was exercised end to end and the cloud branch was not.
    mitigation: >
      Neither branch was modified — the diff touches no service, no repository
      and no `owned.repo.*` call. The confirmation screen reads the same
      `preview` object it read before, plus one new `deadlineIso` prop.
  - id: four sibling-owned components rendered inside these screens
    detail: >
      `FplStatBar`, `FplPlayerCard`/`FplEmptySlot`, `FplPitch` and
