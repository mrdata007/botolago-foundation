    verified: PASS
    how: >
      Always visible in the header band instead of behind a toggle, as a kit
      `UiInput` (44px) with `aria-label` and placeholder `fpl.search_player`. A
      clear button appears only when the field has content. Matches both
      `name.fr` (case-insensitive) and `name.ar`, unchanged from before.
    at: "390/430/768/1440, fr + ar, light + dark"

  - item: club filter
    verified: PASS
    how: >
      Third select, labelled `fantasy.picker.filter_club` — "Club" / "النادي".
      It was labelled "Vue" ("View") before. Options observed in fr:
      [Tous, WAC, RCA, FAR, FUS, RSB, MAT, HUSA, MCO]; in ar:
      [الكل, الوداد, الرجاء, الجيش, الفتح, بركان, التطواني, الحسنية, المولودية].
      Selecting WAC narrows 47 rows to 8.
    note: >
      Its empty option is `fpl.all` ("Tous"), not `fpl.all_clubs`
      ("Tous les clubs"), which does not fit a three-abreast column at 390px.
      The field's own label already says Club.

  - item: position filter
    verified: PASS
    how: >
      Three observed states, all consistent with the list by construction —
      one expression feeds both.
        * slot imposes it: no select at all; a locked pill "GB" (fr) / "حم" (ar)
          plus "Poste imposé par l’emplacement choisi." List: 8 goalkeepers.
        * only one position still open: same locked pill. Proven by filling 13
          of 15 slots and pressing "Ajouter un joueur" — 2 selects, pill "GB",
          lock line present, 8 GK rows.
        * manager chooses: select offering exactly the open positions.
          On an empty draft: [Tous, GB, DEF, MIL, ATT] / [الكل, حم, مد, وس, هج].
    see_also: "position_filter_investigation below"

  - item: price
    verified: PASS
    how: >
      One figure per row, `ui.stat.sm` (tabular, `ltr:`-only tightening) on the
      inline-end edge, localized ("5,2" in fr-FR). It is now the only numeric
      column, which is what gives the name ~230px instead of ~160px. The max
      price filter is `fantasy.picker.filter_price` ("Prix max" /
      "السعر الأقصى") listing every distinct price in the pool.
    contrast: "19.11:1 light, 16.1:1 dark (enabled); 7.46:1 / 8.11:1 muted on a blocked row."

  - item: availability
    verified: PASS
    how: >
      A `UiBadge` beside the name whenever `status !== "available"`, on the
      localized `player.status.*` copy. Observed on Mohamed Nahiri (WAC, DEF):
      "INCERTAIN" in fr. Neutral tone for doubtful, negative for injured and
      suspended.
    note: "the previous picker showed availability nowhere at all — this is new, not restored."

  - item: add
    verified: PASS
    how: >
      The whole row is the control (a 48px `--ui-row-min` button, well over the
