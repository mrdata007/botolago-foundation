position_filter_investigation:
  claim_in_brief: >
    "opening a GK slot shows the Poste select reading 'Tous' while the list is
    filtered to goalkeepers."
  measured_on_base_tree:
    method: "read `select.value` and the selected option's text directly from the DOM on both routes and both entry points."
    results:
      - {
          route: /fantasy/transfers,
          entry: "card → action sheet → Transférer ce joueur",
          select_value: "GK",
          select_label: "GB",
          disabled: true,
          rows: 8,
        }
      - {
          route: /fantasy/transfers,
          entry: "Ajouter un joueur with a pending out",
          select_value: "GK",
          select_label: "GB",
          disabled: true,
          rows: 8,
        }
      - {
          route: /fantasy/transfers,
          entry: "Ajouter un joueur, nothing pending",
          select_value: "",
          select_label: "Tous",
          disabled: false,
          rows: 47,
        }
      - {
          route: /fantasy/create,
          entry: "empty GK slot",
          select_value: "GK",
          select_label: "GB",
          disabled: true,
          rows: 8,
        }
      - {
          route: /fantasy/create,
          entry: "Ajouter un joueur",
          select_value: "",
          select_label: "Tous",
          disabled: false,
          rows: 47,
        }
  finding: >
    The literal symptom does not reproduce: where the list is filtered to
    goalkeepers, the select reads "GB". Reported honestly rather than
    silently "fixed".
  what_does_reproduce:
    - >
      The locked select is only `opacity-70` and still enumerates "Tous" plus
      all four positions. It opens as a live control offering choices the screen
      will ignore — the same contradiction, one tap later.
    - >
      "Ajouter un joueur" always said "Tous" and always listed all 47 players,
      including every player whose position has no empty slot. With only the two
      GK slots left, the control says "Tous", the list shows 47, and 39 of them
      answer a tap with "Aucun emplacement libre pour ce poste" — the same
      trial-and-error defect as the club limit, wearing the position filter's
      clothes.
    - >
      The third filter was labelled "Vue" over a control that filters by club.
  fixed_by: >
    making one expression decide both, and not drawing a control where there is
    no choice. Verified after: with only GK slots open, "Ajouter un joueur"
    renders 2 selects (not 3), a locked pill "GB", the lock line, and 8 GK rows.

