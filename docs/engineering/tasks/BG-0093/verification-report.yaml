      sheet and fills the slot: verified on both routes —
      `dialogAfterPick: 0` with the player on the pitch.

  - item: remove
    verified: PASS
    how: >
      New. When the picker is opened on a slot that already holds a player
      (create's action sheet → "Remplacer"), the sheet's pinned footer reads
      "Retirer · Zouhir Laâroubi" / "إزالة · زهير العروبي". Tapping it clears
