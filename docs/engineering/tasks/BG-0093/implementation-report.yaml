transfers:
  header: '`UiHeader tone="gradient"`, identical to the squad builder it came from.'
  gameweek_context: >
    The confirmation screen gained the gameweek + deadline line the pitch screen
    has always had, so a manager confirming a transfer can still see what they
    are confirming it for. `deadlineIso` is a new prop on
    `TransferConfirmScreen`, passed from the route's `gameweek.deadline`.
  budget_and_count: "`UiBanner` for the bank, `FplStatBar` for free transfers / wildcard / cost / bank (sibling-owned, untouched)."
  pitch: "`FplPitch` + `FplPlayerCard` (sibling-owned, untouched)."
  picker: "the same `AddPlayerScreen` as squad selection, with transfers' own club-limit predicates."
  confirmation:
    - >
      Out and in were two columns; at 390px that cut a real name in half. They
      are stacked now, each line carrying a coloured inline-start rule and a
      worded caption, so the pair reads as a sentence and the full names fit.
    - >
      The `ArrowLeft` / `ArrowRight` pair is gone. An arrow is a physical
      direction: it pointed the wrong way under `dir="rtl"`. Direction is now
      carried by `--ui-negative` / `--ui-positive` rules plus the words
      "Sortant" / "Entrant", so it survives mirroring and does not rely on
      colour alone.
    - "`text-[oklch(0.72_0.19_150)]` (a hardcoded green) became `ui.tone.positive`."
    - '`${hitPoints}pts` — an untranslated literal — became `${hitPoints} ${t("fantasy.points.abbr")}` ("pts" / "ن").'
  errors_and_success: "unchanged — the toasts and `fantasy.error.*` branches are proven logic and were not touched."

