headline: >
  Every file this lane owns is at zero divergence from the UI kit, and the
  picker — the surface the owner singled out — was rebuilt around one idea: a
  manager must never learn a squad rule from a toast. Both named defects are
  fixed, and the position filter can no longer contradict its list because the
  contradictory control no longer exists when a position is imposed.
  `PlayerPickerDrawer` is deleted; the reasoning is in `player_picker_drawer`
  below.

