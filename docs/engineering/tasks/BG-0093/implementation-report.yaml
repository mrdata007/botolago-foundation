# ---------------------------------------------------------------------------
# KIT REQUESTS (foundation lane, BG-0091)
# ---------------------------------------------------------------------------

kit_requests:
  - id: badge-tones-fail-AA-on-their-own-fill
    severity: "blocks a documented primitive from being used for its documented purpose"
    measured: >
      `UiBadge tone="negative"` renders `--ui-negative` text on a fill of
      `color-mix(--ui-negative 18%, transparent)`. Rasterised on the card
      surface in light: 4.07:1. `tone="positive"` (20% mix): 3.96:1. Both are
      below AA for text this size.
    worked_around_by: >
      TransferConfirmScreen no longer uses those two tones. Out/in are a coloured
      inline-start rule plus `ui.tone.negative` / `ui.tone.positive` text on the
      card surface, which measure 5.42:1 and 5.18:1.
    suggested_fix: >
      Darken the foreground for the tinted variants, or raise the mix so the
      pairing is computed rather than assumed. `ui.tone.negative` /
      `.positive` on a plain surface are fine; it is only the self-tinted badge
      that fails.
  - id: no-label-step-fits-a-56px-column-at-390px
    severity: minor
    measured: >
      `ui.text.label` is 12px, uppercase, `ltr:tracking-wide`. "SÉLECTIONNÉ"
      renders 66px wide and "SÉLECTION" 78px; the squad list's numeric columns
      are 56px at 390px, so the head was sliced off at the viewport edge.
    worked_around_by: >
      `SquadListTable`'s numeric heads use `ui.text.micro` at heavy weight, and
      the numeric tracks became `minmax(56px,auto)` so a long head widens its
      track instead of being clipped.
    suggested_fix: "a `ui.text.labelCompact` (micro size, heavy, no uppercase/tracking), or document micro as the column-head step at phone widths."
  - id: UiSelect-does-not-fit-three-abreast-at-390px
    severity: minor
    measured: >
      `FIELD_BOX` is `px-3` and `UiSelect` adds `pe-9` for the chevron, at
      `ui.text.body` (15px). In a 116px column that leaves ~68px of text.
    worked_around_by: "a local `FILTER_FIELD` constant — `px-2 pe-7` at `ui.text.meta`. Both are ramp steps, not new numbers."
    suggested_fix: 'a `density="compact"` prop on `UiSelect`, so three filters abreast is a kit-supported arrangement rather than six characters of override in a screen.'
  - id: UiSheet-height-is-fixed-at-88dvh
    severity: cosmetic
    note: >
      A picker wants to be nearly full height; a four-item action list wants to
      hug its content. `AddPlayerScreen` passes
      `className="h-[94dvh] max-h-[94dvh]"` to get there. A `size` prop
      (`content` | `tall`) would express the intent instead of overriding a
      utility.

