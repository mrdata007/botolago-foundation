# ---------------------------------------------------------------------------
# THE TWO NAMED DEFECTS
# ---------------------------------------------------------------------------

named_defects:
  - id: already-at-limit players are not pre-disabled
    was: >
      The picker knew only `bank` and `disabledIds` (players already in the
      squad). The three-per-club rule lived solely inside the routes' `placeInto`
      / `onPick` / `onPickIncoming`, so it could only answer AFTER a tap: the
      manager got toast "Maximum 3 joueurs du même club", the sheet stayed open,
      and nothing on screen said which of the other rows would do the same.
    now: >
      The rule is answered before the tap, by the same code that answers it
      after. Each route exposes the count `placeInto`/`onPick` already runs as a
      `clubLimitReached(player)` predicate and hands it to the picker; the
      picker renders the answer as a disabled row carrying its reason. The
      routes keep their toasts as the backstop — the rule was not moved, only
      read a second time.
    reasons_a_row_can_carry:
      precedence: taken > no_slot > club_limit > budget
      keys:
        - fpl.pick.blocked.taken — "Déjà dans l’effectif" / "موجود في التشكيلة"
        - fpl.pick.blocked.club_limit — "Limite du club atteinte" / "بلغت حدّ النادي"
        - fpl.pick.blocked.budget — "Au-dessus du budget" / "يفوق الميزانية"
        - fpl.pick.blocked.no_slot — "Aucun emplacement libre" / "لا توجد خانة شاغرة"
    proof: >
      Driven on /fantasy/create with real mock data: after three Wydad picks,
      reopening the picker filtered to WAC shows 8 rows, 8 of them disabled —
      3 "Déjà dans l’effectif" and 5 "Limite du club atteinte". Zero taps
      produce a toast. See verification-report.yaml, `club_limit_proof`.
    where:
      - src/components/fpl/AddPlayerScreen.tsx (`PickBlock`, `blockOf`)
      - src/routes/fantasy.create.tsx (`clubLimitFor`)
      - src/routes/fantasy.transfers.tsx (`clubLimitForReplacement`, `clubLimitForIncoming`)

  - id: the position filter contradicts its content
    investigation: >
      Worth stating plainly, because the fix is not the one the brief's wording
      implies. On `chief/launch-fixes-3` the `Poste` select does NOT read "Tous"
      over a goalkeeper list: opened on a GK slot it reads "GB" and is disabled.
      Measured in the browser on both entry points, both routes (probe output in
      verification-report.yaml, `position_filter_investigation`). What DOES
      reproduce is the same contradiction one step out:
        1. the locked select is merely `opacity-70` and still enumerates "Tous"
           plus all four positions, so it opens as a live control offering
           choices the list will ignore — a filter the screen is overruling;
        2. "Ajouter un joueur" (the bottom bar, no slot chosen) always read
           "Tous" and always listed all 47 players, including every player whose
           position has no empty slot left. Late in a build — say only the two
           GK slots open — the control says "Tous", the list shows everyone, and
           39 of those rows answer a tap with
           "Aucun emplacement libre pour ce poste". Same defect, same cause: the
           control was not the source of truth for the list;
        3. the third filter was labelled `fpl.view` — "Vue" — over a control
           that has always filtered by club.
    now: >
      One expression decides both what the list contains and what the control
      shows, so they cannot disagree. When a position is imposed — by the slot,
      or because only one position still has a free slot — the picker does not
      render a select at all: it renders a locked pill naming that position plus
      the line "Poste imposé par l’emplacement choisi.". A control that cannot
      be changed is not drawn as a control. When the manager does choose, the
      select offers exactly the positions that still have somewhere to go, and
      any stale value outside that set is clamped to "Tous". The club filter is
      labelled `fantasy.picker.filter_club` ("Club" / "النادي").
    proof: >
      /fantasy/create with 13 of 15 slots filled and only the GK slots open:
      "Ajouter un joueur" renders two selects (Prix max, Club), a locked pill
      "GB", the lock line, and 8 goalkeeper rows. The Poste select is absent
      because there is no choice to offer.

# ---------------------------------------------------------------------------
# THE PICKER
# ---------------------------------------------------------------------------

player_picker:
  file: src/components/fpl/AddPlayerScreen.tsx
  shape_change: >
    It was a hand-rolled `role="dialog"` div with no focus trap, no Escape and
    a page that scrolled as one block, carrying a 4-column numeric table whose
    172px of figures left about 160px for a name — every Botola name past 14
    characters truncated ("Ahmed Reda …", "Munir Moha…", "Zouhir Laâro…"). It is
    now a kit `UiSheet`: a real focus-trapped dialog, Escape closes, the scrim
    dims the pitch behind it, and its close control is labelled `t("fpl.close")`
    and nothing else.
  scroll_behaviour: >
    The sheet is a flex column at 94dvh. Header, bank banner, filters and the
    sort control are fixed; only the list scrolls. The filters stay reachable
    after a manager has scrolled 40 rows, which they were not before.
  one_row_answers_six_questions:
    who: full name, `ui.text.body` at heavy weight, truncating only past the row
    club: club short name, first segment of the meta line
    position: second segment of the meta line
    price: the one figure on the row, `ui.stat.sm` (tabular) on the inline-end edge
    availability: >
      `UiBadge` beside the name whenever `status !== "available"` —
      `player.status.*`, neutral for "Incertain", negative for blessé/suspendu.
      The old picker showed availability nowhere at all.
    can_i_add_him: >
      `+` when yes, `✓` when this is the player already in the slot, a padlock
      plus the worded reason when no.
  cut_to_make_room:
    - >
      The three numeric columns became one (price). Form and ownership move onto
      the meta line and appear only when the list is sorted by them, so every
      sort stays legible and the name gets ~230px instead of ~160px.
    - >
      The dead info glyph. It was a 24px button (below the 44px floor) wired to
      an `onInfo` prop that neither route ever passed — it did nothing. The row
      itself is now the control, which is also the bigger tap target.
  added:
    - "Search is always visible instead of hidden behind a toggle."
    - >
      A `Retirer · <name>` footer when the picker is opened on a slot that
      already holds a player (create's "Remplacer" path). Before this, a slot
      could be replaced from the picker but never cleared from it.
    - "Sort is a `UiSegmented` (Prix / Forme / Sélection) — 44px targets, not 12px header chevrons."
  blocked_rows_are_readable: >
    The first attempt dimmed a blocked row to `opacity-45`, which measured
    3.13:1 on white — the reason a row is blocked is the one thing a manager has
    to be able to read, and it was the least readable thing on the screen. Only
    the shirt is dimmed now; the name drops to `ui.tone.muted` (7.46:1) and the
    reason is `ui.tone.negative` at heavy weight (5.42:1).

# ---------------------------------------------------------------------------
# PlayerPickerDrawer — THE DECISION
# ---------------------------------------------------------------------------

player_picker_drawer:
  decision: DELETED
  file: src/components/fantasy/PlayerPickerDrawer.tsx
  also_removed_from: >
    the `SURFACES` list in src/services/fantasy-runtime.test.ts, which was its
    only remaining reference anywhere in the repository. A comment there records
    why, so the next reader does not restore the path.
  reasoning: >
    It is not a candidate implementation, it is a worse one. Judged on the six
    things the owner says a picker row must answer, it answers four and cannot
    answer the two that matter most:
      * it has no concept of the bank. `maxPrice` is an optional manual cap the
        caller may pass; nothing on any row says a player is unaffordable, and
        nothing disables him;
      * it has no concept of the three-per-club limit, so it reproduces exactly
        the defect this task exists to fix;
      * it is a side drawer, `side={dir === "rtl" ? "left" : "right"}` — it asks
        the caller to compute a physical side from the text direction, which is
        the pattern this codebase has driven to zero, and a side drawer is the
        wrong shape for a thumb on a phone;
      * it is built on the legacy shadcn `Sheet`, the one that ships the
        untranslated English "Close" this task was asked to remove;
      * it carried 19 divergences — `glass-surface`, `rounded-xl`, `bg-white/60`,
        `ring-black/5`, `tracking-wide` with no `ltr:` prefix (BG-0069).
    Set against that, the one thing it had that `AddPlayerScreen` lacked was the
    availability marker, and that is now in `AddPlayerScreen` as a `UiBadge` on
    the localized `player.status.*` copy.
    Keeping a second, unreachable picker is the precise drift this migration
    exists to remove: the next lane would have found two pickers, and no way to
    tell which one is real without reading both. Deleting it is the cheaper
    answer than converting 19 divergences in a component nothing renders.
  what_the_deletion_costs:
    - "One test: 1438 -> 1437. It is the `SURFACES` loop iteration for the deleted file, nothing else."
    - "`fantasy.picker.title` becomes unreferenced copy (W3 +1); the key is left in the dictionaries."

