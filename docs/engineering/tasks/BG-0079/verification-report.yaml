limits_of_this_verification:
  - >
    The cluster is a local stand-in, not a Supabase stack: auth, storage, PostgREST and Realtime
    are represented by minimal local objects, so anything depending on their real behaviour is out
    of reach here. What IS covered is the migration set, the pgTAP suite and the privilege graph,
    which is what all four failures live in.
  - >
    The harness reproduced run 468's four failures exactly before any fix was written, which is
    the strongest available evidence that these results transfer to CI — but it is evidence, not
    a guarantee, and CI remains the authority.
  - >
    Nothing was executed against production. The production privilege facts were taken from the
    task assignment and independently re-derived locally; they agree.

conclusion: >
  All four failures from Backend quality run 468 are fixed at their observed root causes. Two were
  broken fixtures that had never been executed, one was a plan count defeated by pgTAP's counter
  being rolled back with the savepoints, and one was an assertion whose shape was wrong — a name
  check standing in for a privilege check. No assertion was deleted, skipped or loosened, no grant
  was widened, and no migration was touched. The whole suite passes locally: 50 files, 1132
  assertions, 0 failures.
