  what_was_actually_executed: >
    A real PostgreSQL 16.13 cluster was initdb'd locally (postgresql-16-pgtap 1.3.2 already
    present), and all 72 files under supabase/migrations were applied IN ORDER to a fresh
    database, exactly as documented by the BG-0043 lane in
    docs/engineering/tasks/BG-0043/verification-report.yaml. This is NOT `supabase db reset`; it
    is the same migration set on the same major version, and it is stated here as such.
  cluster:
    data_dir: /var/lib/postgresql/bg0079/data
    port: 55479 (unix socket only, listen_addresses='')
    encoding: UTF8
    locale: C.utf8
    wal_level: logical
  migrations_applied: 72
  stand_ins: >
    Minimal local substitutes for the Supabase-managed objects a bare cluster lacks: the anon /
    authenticated / service_role / authenticator roles, auth.users, auth.sessions,
    auth.mfa_factors, storage.buckets, storage.objects, auth.uid(), auth.role(), auth.jwt(), and
