bg0063_trap_reproduced:
  method: >
    A throwaway `api.bg0079_probe(p app.language_code)` security-definer function was created
    inside a transaction, granted to all three roles, called under each role, and rolled back.
  results:
    - "anon,          select api.bg0079_probe('fr'::app.language_code)  ->  ERROR: permission denied for schema app"
    - "authenticated, select api.bg0079_probe('fr'::app.language_code)  ->  ok"
    - "service_role,  select api.bg0079_probe('fr'::app.language_code)  ->  ERROR: permission denied for schema app"
    - "anon,          select api.bg0079_probe('fr')  ->  ok  (a bare literal coerces; the EXPLICIT cast PostgREST emits is what fails)"
  conclusion: >
    The trap bites exactly the roles that lack USAGE on app. 'authenticated' is genuinely exempt.
    A name-based assertion is therefore the wrong shape for this invariant.

mutation_test_of_the_rewritten_assertion:
  why: >
    A rewritten assertion is only worth keeping if it still fails on the defect it guards. This was
    proven, not assumed, inside a rolled-back transaction.
  results:
    - "clean tree                                                      -> 0 violations (assertion passes)"
    - "inject an ANON-executable api fn with an app-typed argument     -> 1 violation  (assertion FAILS, as required)"
    - "also inject an AUTHENTICATED-only api fn with an app-typed arg  -> still 1 violation (correctly exempt)"
  conclusion: >
    The assertion is strictly stronger than before in the dimension that matters (it now covers
    ANY app-schema type, not just app.language_code) and correctly exempts the role that holds
    USAGE on app. It is not vacuous.

