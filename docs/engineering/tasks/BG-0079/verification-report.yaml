harness_fidelity:
  why_this_matters: >
    A harness that is wrong in the same direction as the bug proves nothing. Four independent
    defects in the stand-ins were found and fixed BEFORE any repository file was touched, each
    identified by a test failing for a reason that had nothing to do with this task:
  defects_found_and_fixed_in_the_harness:
    - auth.users lacked instance_id / aud / role, which every fixture in the suite inserts.
    - auth.sessions lacked `aal`, and the auth schema was not granted USAGE to the PostgREST
      roles, so auth.uid() was unresolvable under `set role authenticated`.
    - auth.uid() / auth.role() read only the legacy request.jwt.claim.* GUCs; the suite sets the
      request.jwt.claims JSON object, which is what real Supabase reads.
    - the cluster was first initdb'd as SQL_ASCII, which silently mangled Arabic text and made
      news_domain's Arabic full-text assertion fail. Re-initdb'd as UTF8.
    - storage.objects lacked owner_id, and storage tables were not granted to the browser roles.
  convergence_evidence: >
    Once those five were corrected, the local suite reported EXACTLY the CI result: 46 files
    passing and precisely the four files run 468 reported failing, each with the same symptom
    string — two "No plan found in TAP output" with exit 3, one "Bad plan. You planned 10 tests
    but ran 20" with Tests: 20 Failed: 0, and one "Failed test 5" in team_translations. That
    byte-for-byte agreement, reached before any fix was written, is the basis for trusting every
    result below.
  independent_sanity_check: >
    The 46 files that CI passes also passed locally, unmodified, at every stage.

per_failure_results:
  - file: supabase/tests/database/fantasy_overall_standings.test.sql
    before: "exit 3, Tests: 0 — No plan found in TAP output"
    root_cause_observed: >
      Three stacked fatal fixture errors, each read off the server, not inferred:
      (1) invalid input value for enum app.season_status: "scheduled";
      (2) invalid input value for enum app.fantasy_season_status: "draft";
      (3) violates check constraint "fantasy_gameweeks_finalized_check".
    after: "Tests=39, 39 ok, 0 not ok, Result: PASS"
    note: >
      Every one of the 39 assertions passed on the first run after the fixture loaded. The
      function under test was never changed and was never wrong.

  - file: supabase/tests/database/fantasy_player_season_stats.test.sql
    before: "exit 3, Tests: 0 — No plan found in TAP output"
    root_cause_observed: >
      Two stacked fatal fixture errors:
      (1) invalid input value for enum app.season_status: "scheduled" — the exact statement CI's
          log pointed at;
      (2) duplicate key value violates unique constraint "fantasy_gameweeks_one_current_idx",
          because sequence 6 ('provisional') and sequence 7 ('open') both fall inside that
          partial index's status set for one season.
    after: "Tests=38, 38 ok, 0 not ok, Result: PASS"
    scored_status_set_verified: >
      pg_get_functiondef(api.fantasy_player_season_stats) on the local cluster shows the reader
      treats a gameweek as scored only when
      `gameweek.status in ('provisional','finalizing','finalized','corrected')`. 'open' and
      'scheduled' are both outside that set, so moving sequence 7 from 'open' to 'scheduled'
      exercises the same path and guards the same invariant.

  - file: supabase/tests/database/football_deactivate_non_current_teams.test.sql
    before: '"Bad plan. You planned 10 tests but ran 20" (Tests: 20 Failed: 0)'
    root_cause_observed: >
      Read directly off the raw TAP stream: twenty `ok` lines followed by the literal plan line
      `1..10`. no_plan() defers the plan to finish(); pgTAP's counter lives in a temp table; the
      file's five `rollback to savepoint` statements revert that counter. Numbering survives
      because it comes from a sequence, which rollback does not rewind.
    after: "Tests=20, 20 ok, 0 not ok, Result: PASS"
    assertions_deleted: 0

  - file: supabase/tests/database/team_translations.test.sql
    before: '"Failed test 5", plus "No plan found in TAP output"'
    root_cause_observed: >
      Two independent defects. The assertion was a name check where the real rule is a privilege
      check; and the file called no_plan() but never finish(), so it emitted no plan line at all —
      a failure that remained even after all 31 assertions passed.
    after: "Tests=31, 31 ok, 0 not ok, Result: PASS"

