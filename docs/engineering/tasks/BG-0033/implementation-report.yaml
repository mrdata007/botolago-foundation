unexpected_observations:
  - "The original runner's `runCommand` spawned the Supabase CLI using only the injected-env
    filtered from process.env, silently dropping PATH — harmless in the original single-path design
    (Bun always ran with the real process.env) but it broke the fake-CLI harness the moment a
    dependency-injected `env` object (deliberately not spread from the real process.env, for test
    purity) was passed in, because `#!/usr/bin/env bun` could not resolve `bun` without PATH. Fixed
    by always inheriting the real process.env for the spawned CLI's environment and layering
    deps.env on top of it, so injected values still override what the CLI sees, but PATH/HOME/etc.
    are never lost. This does not affect the guard checks, which still read exclusively from
    deps.env."
