scope_deviations:
  - "The engineering brief's restore-plan cross-check (component 'runner — restore plan proven
    BEFORE mutation') asks for three booleans (catalog isCurrent, catalog label vs provider name,
    provider isCurrent+league) to be recorded in evidence. Implemented as
    verifyCurrentSeasonIdentity: two best-effort network calls (api.football_season_catalog via
    PostgREST RPC, and the SportsMonks provider's season lookup), each wrapped so a failure/absence
    degrades the corresponding boolean to false rather than blocking the run. This is deliberately
    non-blocking — only the fingerprint proof gates mutation, per the brief's own emphasis that
    fingerprint-proof is 'the only way to know the supplied restore value equals the live one'; the
    three booleans are diagnostic. None of the required acceptance_tests exercise this cross-check
    directly, so it is not covered by a dedicated fake-network unit test beyond the paths already
    exercised (it is invoked, wrapped in try/catch, in every default/dry-run/restore/restore-only
    test and never throws or breaks them). Flagged for the Reviewer/Verifier to confirm this
    interpretation is acceptable, since the live provider/catalog behavior cannot be exercised
    without BG-0002."
  - "Added a fourth CLI mode, --restore-only, and a workflow restore_only input, beyond the three
    modes (default/--capture-only/--restore) the brief's 'runner — structure' required_change names
    explicitly. This was necessary to satisfy the brief's own runbook required_change, which
    describes exactly this recovery procedure for the double-failure case ('a dedicated
    restore_only: true input that captures nothing and applies the reviewed current-runtime inputs,
    then verifies by fingerprint') — restore_only does capture the live configuration (it has
    nothing else to prove the supplied values against), which is a narrow deviation from that
    sentence's literal 'captures nothing', but is otherwise exactly the described operation ('applies
    the reviewed current-runtime inputs, then verifies by fingerprint') and is required because the
    ordinary --restore mode depends on a pre-run-config.json that a fresh dispatch does not have."
