changes:
  - file: scripts/backend/g7-historical-performance-backfill-runner.ts
    description: >
      Full refactor. Deleted the RESTORE_SEASON constant entirely. Added: MANAGED_SECRET_NAMES (the
      15 function secrets), sha256Hex/fingerprintMatches (a captured digest can only ever be proven
      against a supplied value — the Management API/CLI never return plaintext, only a DIGEST
      column that IS the API's `value` field per the brief), parseSecretsListTable (parses the
      CLI's NAME/DIGEST text table; the code never passes --output/--output-format to `secrets
      list`), parseRequestedSeasonIds (G7_SEASON_IDS: non-empty, duplicate-free subset of
      {26027, 24319}), captureConfiguration (runs `secrets list` before any mutation, writes raw
      digests only to runtime/pre-run-config.json (0600, deleted by cleanup), and to evidence only
      { name, present, fingerprintSha256: sha256(fingerprint) } — never the fingerprint itself),
      buildRestorePlan (builds the restore values from reviewed G7_CURRENT_* workflow inputs plus
      constants, requires sha256hex(suppliedValue) == capturedFingerprint (or exact match) for
      every present managed name before any mutation, throws production_config_restore_unprovable
      on any mismatch, special-cases FOOTBALL_INGESTION_TRIGGER_SECRET per the brief: unset if
      absent pre-run, refuse unless a matching G7_CURRENT_TRIGGER_SECRET is supplied if present
      pre-run; also runs a best-effort, non-blocking verifyCurrentSeasonIdentity cross-check against
      api.football_season_catalog and the SportsMonks provider, recording three booleans in
      evidence.currentSeasonCrossCheck), performRestore (one `secrets set --env-file`, one
      `secrets unset <explicit names>` only when non-empty, one `secrets list` to re-verify every
      managed name's expected presence/fingerprint, producing the `restoration` block and the
      runtime/restore-verified marker on success). runHistoricalPerformanceBackfill(deps, mode)
      is now the exported, dependency-injected entry point ({ env, cliPath, fetch, now, writeFile })
      with four modes: default (capture -> prove -> mutate requested season(s) only -> restore ->
      verify; verdict forced to fail unless restoration.verified === true even when the backfill
      itself passed), --capture-only, --restore (idempotent: reads pre-run-config.json + reviewed
      inputs, no-ops if runtime/restore-verified already exists — the workflow's own post-step),
      and --restore-only (the double-failure recovery path: captures the LIVE configuration fresh
      and proves/restores/verifies against it, with no dependency on any prior runtime state, for a
      brand-new dispatch). G7_DRY_RUN=1 captures and proves the restore plan but issues no
      `secrets set`/`unset` and no HTTP POST. The thin `if (import.meta.main)` CLI entry parses
      --capture-only/--restore/--restore-only via parseMode() and otherwise defaults.
  - file: scripts/backend/g7-historical-performance-backfill-runner.test.ts
    description: >
      Kept the existing pure-validator tests (validateHistoricalPerformanceBatch/
      validateHistoricalRatingDerivation) and the ticket/workflow parity test, updated for the new
      ticket fields and asserting the restore step's position (after mutation, before command_logs/
      evidence_scan/upload/cleanup). Added a fake-CLI harness: a Bun script written to a temp dir
      per test (deps.cliPath), backed by a JSON "live secret state" file it updates on `set`/`unset`
      and reads on `list`, plus a call-log file tests inspect for ordering/arguments. New tests
      cover every acceptance_tests item: capture parses the table and never leaks raw digests to
      evidence (only sha256(fingerprint)); fails closed on non-zero exit or zero rows; refuses
      before any mutation on a fingerprint mismatch (asserted: exactly the capture's `secrets list`
      call, zero others); refuses when the trigger is present pre-run with no matching input, and
      succeeds with one; the success path's exact command order (list, set(season), POSTs, set
      (restore), unset(explicit names), list) with zero `--output` flags anywhere and no `unset`
      call with fewer than one name, `restoration.verified === true`, and no "26027" literal in the
      written restore env file; a mid-run HTTP 503 still restores and verifies but the run's verdict
      is fail with the batch failure code; a simulated-kill scenario (capture-only run stands in for
      "killed right after capture, before restore" per the brief's own reproduction) followed by a
      fresh `--restore` invocation that restores, verifies, writes restore-after-cancel.json, and is
      a true no-op (zero additional CLI calls) on a second `--restore`; G7_DRY_RUN=1 performs only
      the capture `secrets list` call and zero HTTP POSTs; and G7_SEASON_IDS validation
      (empty/duplicate/out-of-scope all rejected before any command runs).
