attempt_2:
  reviewer_verdict_being_fixed: FAIL # docs/engineering/tasks/BG-0033/review-report.yaml, defect 1
  scope: >
    ONLY the one Reviewer-identified defect and its regression test, per the Chief's explicit
    instruction. Did not revisit the two deviations (--restore-only mode; the non-blocking
    season-identity cross-check) — both were independently reviewed and accepted by the Verifier
    and the Reviewer in attempt 1.
  defect_summary: >
    Widening `CommandResult` (attempt 1) to add a `stdout` field — needed so
    captureConfiguration/performRestore's re-verification `secrets list` calls can parse the
    NAME/DIGEST table from the in-memory return value — silently changed the safety of one
    pre-existing, unrelated call site: `commands.push(configure)` in the main mutation loop pushed
    the FULL CommandResult (including the new stdout field) for the
    `supabase secrets set --env-file season-<id>.env` command straight into `evidence.commands`,
    which is serialized into the uploaded evidence JSON. That env file's stdout could echo back
    SPORTSMONKS_API_TOKEN or the freshly-minted FOOTBALL_INGESTION_TRIGGER_SECRET on success or a
    partial/validation failure, and none of the existing sanitizer's known shapes
    (sbp_/sb_secret_/sb_publishable_ prefixes, eyJ… JWTs, authorization headers, the literal words
    access_token/refresh_token/token_hash/hashed_token/password) would catch a SportsMonks token or
    a random hex trigger secret. Before attempt 1, CommandResult had no stdout field at all, so this
    was a regression introduced by attempt 1's own type widening, not a pre-existing issue — the
    restore path's own `commands.push` (added in attempt 1) was already written correctly, stripped
    to `{ operation, exitCode }` literals; only the one older call site was missed.
  fix:
    - file: scripts/backend/g7-historical-performance-backfill-runner.ts
      description: >
        Added a dedicated `EvidenceCommand { operation, exitCode }` type — documented with a
        comment explaining exactly why it must never be widened to carry stdout — and a
        `toEvidenceCommand(result: CommandResult): EvidenceCommand` helper that strips stdout.
        `evidence.commands` is now typed and cast as `EvidenceCommand[]` (was `CommandResult[]`),
        so a future accidental push of a bare `CommandResult` is now also a type error, not just a
        runtime leak. Changed the one flagged call site, `commands.push(configure)` in the main
        mutation loop, to `commands.push(toEvidenceCommand(configure))`. The restore path's
        existing `commands.push({ operation, exitCode })` literals were left untouched (already
        correct) but now type-check against the same narrowed `EvidenceCommand[]` array. Audited
        every `commands.push` (there are exactly two in the file, both now safe) and every other
        `.push(` call in the file (evidenceSecrets, unsetNames, perName, requests, seasonResults —
        none of these ever held a CommandResult or stdout).
    - file: scripts/backend/g7-historical-performance-backfill-runner.test.ts
      description: >
        Added `assertNoStdoutLeak(value)`, a recursive walker that throws if any object anywhere
        in a value carries a `stdout` key, and a new describe block "evidence never carries raw
        command stdout" with one test per code path that produces written evidence: capture-only
        (returned evidence + capture.json), dry-run (returned evidence), the default success path
        (returned evidence + result.json, plus an explicit assertion that every entry in
        `written.commands` has exactly the keys `["exitCode","operation"]`), the mid-run-failure
        path (result.json), `--restore` (returned evidence + restore-after-cancel.json), and
        `--restore-only` (returned evidence + restore-only-result.json). Verified this test suite
        actually catches the regression: manually reverted the fix (`commands.push(configure as
        unknown as EvidenceCommand)`) and re-ran the new tests — two of the six failed with
        `FOUND_STDOUT_KEY_AT $.commands[0].stdout`, exactly at the season-configuration entry the
        Reviewer identified; re-applied the fix and all tests passed again.
  verification:
