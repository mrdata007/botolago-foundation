defects:
  - id: 1
    severity: HIGH
    requirement: >
      Engineering brief, "Evidence hygiene constraints" (finding 2, evidence-hygiene) and
      constraints: "sha256 hex digests and secret names are allowed, values are not"; "raw `secrets
      list` output must nevertheless stay in the runtime dir ... and never be copied to the evidence
      dir, because under the alternative interpretation the DIGEST column could be plaintext."
    statement: >
      The Builder's refactor widened the internal `CommandResult` type (runner.ts:375-379) to add a
      `stdout: string` field — needed so `captureConfiguration` and `performRestore`'s re-verification
      `secrets list` call can parse the NAME/DIGEST table from the returned value instead of only from
      the runtime-dir raw log file. This is correct for those two call sites. But one pre-existing call
      site was not updated to match: in the main mutation loop, `commands.push(configure)`
      (runner.ts:975) pushes the FULL `CommandResult` — including the new `stdout` field — for the
      `secrets set --project-ref ... --env-file season-<id>.env` call straight into `evidence.commands`,
      which is serialized into `g7-historical-performance-backfill-result.json` in the EVIDENCE
      directory (not the runtime directory) and is exactly the file the workflow's "Preserve sanitized
      command evidence" / "Verify evidence contains no credentials" / upload pipeline processes.
      Before this task, `CommandResult` had no `stdout` field at all (verified: `git show
      e43b856:.../runner.ts` — the pre-fix interface is `{ operation, exitCode }` only, and the pre-fix
      `runCommand` returned exactly that), so this exact same `commands.push(configure)` line was
      already present but was safe. Widening the shared type turned it into a latent leak path: if
      `supabase secrets set --env-file <file>` ever writes anything to stdout that reflects the
      env-file's content on success or (more likely) on a partial/validation error — the season env
      file being set at that point contains SPORTSMONKS_API_TOKEN and the freshly-minted
      FOOTBALL_INGESTION_TRIGGER_SECRET in plaintext — that text lands verbatim in the uploaded
      evidence JSON. The existing sanitizer/scanner (phase7f-scan-sanitized-evidence.py, the workflow's
      credential grep) only matches known shapes (sbp_/sb_secret_/sb_publishable_ prefixes, `eyJ…` JWT
      shapes, `authorization:` headers, and the literal words access_token/refresh_token/token_hash/
      hashed_token/password) — none of which match a SportsMonks API token, a randomly-generated hex
      trigger secret, a season id, a date, or a team-id list, so this specific leak shape would not be
      caught by the existing guardrails. The restore path elsewhere in the same file
      (performRestore's `commands.push` at line 1066-1071) was written carefully to push only
      `{ operation, exitCode }` literals, deliberately excluding `stdout` — showing the Builder was
      aware of the hygiene rule for that path but missed the one older call site the type-widening
      silently affected. No test in the (otherwise thorough) new test suite exercises or asserts
      anything about `commands[n].stdout` for the season-configuration entry (confirmed by grep: no
      match for "configure" as an assertion subject, and the only leak-check test in the suite,
      "captures presence/fingerprints, never leaking raw digests into evidence" at
      runner.test.ts:523-541, covers only the capture path's evidence, not the mutation-loop's
      commands array), so the Builder's and the Verifier's test runs could not have caught this.
    evidence: >
      scripts/backend/g7-historical-performance-backfill-runner.ts:375-378 (CommandResult now carries
      stdout), :403 (runCommand returns it), :967-978 (commands.push(configure) — the full object,
      unfiltered), vs. :1064-1071 (performRestore's commands.push — explicitly stripped to
      {operation, exitCode}); pre-fix baseline `git show
      e43b856faf2d41cc4a810ba4f513ff82c8dc131f:scripts/backend/g7-historical-performance-backfill-runner.ts`
      lines ~244-247 (old CommandResult had no stdout field) and ~409-413 (same push site, safe under
      the old type). `grep -n "configure" scripts/backend/g7-historical-performance-backfill-runner.test.ts`
      returns no assertions on this evidence path.
    owner: Builder
    correction: >
      Strip `stdout` before pushing the season-configuration command into evidence, matching the
      pattern already used for the restore commands: change `commands.push(configure);` to
      `commands.push({ operation: configure.operation, exitCode: configure.exitCode });` (or narrow the
      evidence-facing type to a `{operation, exitCode}` shape entirely, keeping the raw stdout only on
      the return value used internally by capture/verify parsing, never on anything pushed into
      `evidence.commands`). As a general hardening, add a unit test asserting that no entry in
      `evidence.commands` for any code path ever contains a `stdout` key, so a future refactor of
      `CommandResult` cannot silently reintroduce this.

