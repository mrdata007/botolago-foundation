root_cause_closure:
  result: closed_subject_to_defect_1
  notes: >
    Traced the code path myself rather than trusting either report. RESTORE_SEASON=26027 is fully
    deleted (grep confirms zero live references). The finally block in the default mode still cannot
    survive SIGINT/SIGTERM/SIGKILL (this is inherent to any in-process Bun finally and is not something
    this task could fix in-process) — but the design correctly does not rely on it: the workflow's
    separate `if: always()` "Restore production function configuration" step calls `--restore` mode,
    which is idempotent (no-ops via the `restore-verified` marker if the in-process finally already
    succeeded, otherwise reads the runtime-dir pre-run-config.json written by the same mutation step's
    own capture-at-mutation-time call and performs restore+reverify). Traced the workflow step
    dependency graph (steps.capture.outcome, env.G7_RESTORE_ONLY) and confirmed there is no window
    where a cancellation before the capture step's outcome is recorded could skip restoration: the
    restore step is unconditionally gated on `always()` plus either restore_only or capture having
    already succeeded, and capture runs (and must complete) before any mutation is attempted, so if
    capture never completed there is nothing yet to restore. Partial-failure and partial-success cases
    (a `secrets set` that exits non-zero after partially applying, or exits 0 while silently dropping a
    key) are both caught by the per-name re-verification against a fresh `secrets list` in
    `performRestore`, which checks actual observed state against intended state independent of the
    CLI's own exit code — this is the correct adversarial design and I could not find a case where a
    partial mutation would be reported `verified: true` incorrectly.

fingerprint_scheme_review:
  false_negative_risk: >
    Real and by design (fail-closed): case-sensitive hex comparison, and no digest-algorithm fallback
    beyond a plaintext-equality escape hatch, means any change in how the platform computes DIGEST
    (a different algorithm, a different case convention, a salt) would make every restore refuse to
    proceed. This is the brief's own documented HIGH risk with fail-closed as the accepted mitigation;
    not a new finding.
  false_positive_risk: >
    Did not find one. `fingerprintMatches` requires either sha256hex(supplied) === fingerprint or a
    raw plaintext-equality fallback; both are exact-match, non-fuzzy comparisons. Absence vs. empty
    string is handled correctly: `parseSecretsListTable` only inserts a NAME into the table when both
    NAME and DIGEST cells are non-empty, so a name is only ever "present" with a real digest string, or
    "absent" (fingerprint null) — there is no state where an empty digest is treated as a match against
    an empty supplied value. The one comparison-hygiene nit worth naming: `fingerprintMatches` uses
    plain `===` rather than a constant-time comparison; this is a timing-side-channel best-practice gap
    in the abstract, but the comparison happens entirely within a single trusted CI process comparing
    values it computed and captured itself (no attacker-controlled network input reaches this
    comparison), so I do not treat it as a defect worth blocking on — noting it as a residual
    observation only.

