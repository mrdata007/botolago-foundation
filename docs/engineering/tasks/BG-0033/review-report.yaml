deviation_review:
  - id: restore_only_mode
    verdict: reasonable
    notes: >
      Independent read, not deferring to the Verifier: the brief names three CLI modes in the
      "structure" required_change but separately, in the runbook required_change, spells out exactly
      this fourth operation in prose ("a dedicated restore_only: true input that captures nothing and
      applies the reviewed current-runtime inputs, then verifies by fingerprint") for the double-failure
      case where no pre-run-config.json exists to restore from. A mode that truly "captures nothing" and
      just writes reviewed inputs blind would contradict the brief's own fail-closed, prove-before-write
      design (every other path in the brief requires a captured fingerprint before any `secrets set`).
      Capturing the live state fresh, then proving the reviewed inputs against those fresh fingerprints,
      then writing and re-verifying, is the only reading of the brief's two required_changes that is
      internally consistent, and it is implemented with the identical prove-then-write-then-reverify
      discipline as every other mode (buildRestorePlan + performRestore, unchanged code paths). Agree
      with the Verifier: reasonable, in-spirit, not scope creep.
  - id: non_blocking_season_identity_crosscheck
    verdict: reasonable_with_a_caveat
    notes: >
      Read the brief's exact sentence again independently: it groups three checks and says "Record the
      three booleans in evidence," with no explicit "refuse if false" — unlike the immediately
      surrounding fingerprint-mismatch sentence, which is its own explicit refusal clause. So the
      non-blocking reading is textually defensible, and the fingerprint proof (the only requirement the
      brief states as an unconditional gate) already independently catches a wrong
      FOOTBALL_SPORTSMONKS_SEASON_ID input in the ordinary case, since that value's fingerprint is
      captured from the actually-live secret before the run. My caveat, not raised by the Verifier:
      the fingerprint gate only protects the *season id* field itself against a wrong value that
      differs from what's currently live — it does nothing to catch the case where the operator-supplied
      G7_CURRENT_SEASON_ID is wrong in a way that happens to already be what's live (e.g. production
      was already misconfigured by an earlier bad run, and the operator's reviewed input, sourced from
      the same bad state, reasserts it). The catalog/provider cross-check exists precisely to catch that
      class of error against an independent source of truth (the database's is_current row, the
      provider's own record) and making it evidence-only means a materially wrong season identity can
      still be "restored" and verified as long as it's internally self-consistent with whatever is
      already live. This is a real but narrow residual gap, already implicitly acknowledged by the
      brief's own framing that these are diagnostic cross-checks and by both Builder and Verifier
      flagging this as the more debatable of the two deviations. It does not rise to a FAIL-worthy
      defect on its own — the brief's text does not clearly mandate blocking here, and blocking on two
      more live network calls has its own availability cost the brief doesn't ask for — but the Chief
      should treat "confirm current-season identity via a fresh capture-only or restore_only dispatch
      whenever the pre-run assumption about what's live might itself be wrong" as an operational
      practice, not just a one-time BG-0002 unblock step.

