summary: >
  The Builder's implementation matches the brief's required_changes and acceptance_criteria on every
  point checked independently: the RESTORE_SEASON defect is fully removed and replaced with a
  capture-prove-write-verify design that fails closed on any fingerprint mismatch, never leaks raw
  digests to evidence, forces the run verdict to fail unless restoration is verified, and provides an
  idempotent --restore mode for the workflow's if: always() post-step because a finally block cannot
  survive SIGKILL. All local tests (25 targeted + 740 full suite), typecheck, secrets/migrations/config
  integrity checks pass, matching the Builder's claimed numbers exactly under independent re-execution.
  Ticket/workflow/test parity was independently re-verified with a standalone script. No forbidden path
  was touched and no live production action occurred anywhere in the branch's history. Both self-flagged
  deviations (the added --restore-only mode, and the non-blocking season-identity cross-check) are
  judged reasonable and consistent with the brief's own stated design principles, not unauthorized scope
  creep or a weakened requirement. No defect found.
