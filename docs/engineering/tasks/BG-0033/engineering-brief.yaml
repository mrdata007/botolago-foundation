status: DONE
note_to_chief: >
  Three things change the plan. (1) Restoration cannot be read-then-write: the platform returns only
  digests (the CLI's DIGEST column IS the API `value`), so the runner must prove the supplied
  current-runtime values against captured fingerprints before it mutates, and re-prove after — six
  season-coupled keys, not one. (2) A `finally` is worthless under cancellation (reproduced: Bun exits
  on SIGINT/SIGTERM without running it; SIGKILL follows anyway), so the workflow needs an
  `if: always()` restore step that runs `bun runner.ts --restore` before evidence/cleanup, plus a
  restore_only dispatch path for the double-failure case. (3) skip_deploy=true is off the table for A4
  once A2 ships; gate it on function version + ezbr_sha256 identity, default false. Everything here is
  still blocked live by BG-0002 (token from a non-member account); the first live action after it is
  fixed should be a --capture-only dispatch, which also answers whether the trigger secret is present.
