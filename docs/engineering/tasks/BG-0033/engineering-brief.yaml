root_cause:
  classification: VERIFIED
  description: >
    The runner treats "restore" as "re-apply a compile-time season constant" (RESTORE_SEASON=26027 and
    the whole 15-key 2025/26 env file) instead of "return production to what it was", and it places
    that logic in an in-process `finally` that Bun does not execute on SIGINT/SIGTERM and that cannot
    execute on SIGKILL; the workflow adds no `if: always()` restore step. Both halves were written on
    2026-08-02 when 26027 happened to be the live season, so the bug was invisible; since the 2026/27
    activation (28647) a successful, failed or cancelled run each leaves the live catalog/fixtures/
    ratings ingestion pointed at a completed season and (on cancellation) with a live one-time trigger
    secret still set.
  secondary:
    classification: VERIFIED
    description: >
      Scope is pinned to exactly [26027, 24319] in three coupled places (runner.validateManifest and
      season loop, runner evidence header, ticket JSON + workflow-embedded dict + runner test), so the
      owner's 26027-only decision cannot be executed without a coordinated change.

required_changes:
  - component: scripts/backend/g7-historical-performance-backfill-runner.ts — structure
    change: >
      Refactor main() into an exported `runHistoricalPerformanceBackfill(deps)` with injectable
      { env, spawn (or cliPath), fetch, now, writeFile } and a thin CLI entry supporting three modes:
      `--capture-only`, default (capture → mutate → restore → verify), and `--restore` (idempotent
      restore+verify from the capture file). Add a `G7_DRY_RUN=1` guard mode that performs capture
      and plans the restore but executes no `secrets set/unset` and no HTTP POST, writing the same
      evidence shape with `dryRun: true`.
    reason: "capture/restore/cancel paths must be unit-testable with a fake CLI; cancellation recovery needs an entry point that runs outside the killed process"
  - component: runner — capture (before any mutation)
    change: >
      Run `supabase secrets list --project-ref <ref>` (text output only; never --output json/yaml/toml,
      never --output-format json) with stdout captured to `<runtime>/capture-secrets.raw.log` (0600).
      Parse the NAME/DIGEST table; for each of the 15 managed names record { present: boolean,
      fingerprint: <DIGEST column or null> } into `<runtime>/pre-run-config.json` (0600, runtime dir
      only). Fail closed (production_config_capture_failed) on non-zero exit, unparsable table, or
      zero rows. Emit to EVIDENCE only { name, present, fingerprintSha256: sha256(fingerprint) } —
      never the fingerprint itself.
    reason: "the actual pre-run configuration must be known before it is overwritten; digests are the only read-back the platform offers"
  - component: runner — restore plan proven BEFORE mutation
    change: >
      Build the restore env from reviewed inputs, not constants: SPORTSMONKS_API_TOKEN (same secret),
      FOOTBALL_PROVIDER=sportsmonks, FOOTBALL_PROVIDER_BASE_URL, LEAGUE_ID=860, COUNTRY_CODE=MA,
      COMPETITION_TYPE=league, TIMEOUT_MS, MAX_RETRIES, and the season-coupled keys SEASON_ID,
      SEASON_START, SEASON_END, FIXTURE_FROM, FIXTURE_TO, TEAM_IDS from required workflow inputs
      (G7_CURRENT_SEASON_ID etc.). For every name present pre-run, require
      sha256hex(suppliedValue) == captured fingerprint (accept also suppliedValue == fingerprint to
      stay correct if the API ever returns plaintext); any mismatch → refuse with
      production_config_restore_unprovable and DO NOT MUTATE. Names absent pre-run are scheduled for
      `secrets unset` (explicit names only). FOOTBALL_INGESTION_TRIGGER_SECRET: if absent pre-run →
      unset after the run; if present pre-run → refuse to run (its value is unrecoverable) unless an
      optional masked input G7_CURRENT_TRIGGER_SECRET is supplied AND its fingerprint matches, in
      which case restore it. Cross-check G7_CURRENT_SEASON_ID: (a) api.football_season_catalog first
      row isCurrent === true and its label equals the provider season name for that id, (b) provider
      season is_current true, league 860 (reuse sportsmonks-production-probe), (c) fingerprint match.
      Record the three booleans in evidence. Never write RESTORE_SEASON or any season literal into
      the restore path; delete the constant.
    reason: "restores must target the observed configuration; the platform cannot return values, so proof-by-fingerprint is the only way to know the supplied restore value equals the live one"
  - component: runner — restore + verify (success, failure, and via --restore after cancellation)
    change: >
      Restore = one `secrets set --env-file <restore.env>` for the present names, then one
      `secrets unset <absent names…>` (only if non-empty; explicit names), then re-run `secrets list`
      and compare each of the 15 names against the capture (present → fingerprint equal; absent →
      absent). Write `restoration: { attempted, setExit, unsetExit, verified, perName: [{name,
      expectedPresent, observedPresent, fingerprintMatched}], verifiedAt }` into the result file, and
      a marker `<runtime>/restore-verified` on success. Verdict is `fail` unless verified === true,
      even when the backfill itself passed. The `--restore` mode reads pre-run-config.json and the
      restore inputs, is a no-op when the marker exists, and otherwise performs restore+verify and
      writes `restore-after-cancel.json` into the evidence dir.
    reason: "restoration must be proven, not assumed; the same code path must be callable from a workflow post-step because the in-process finally cannot survive cancellation"
  - component: runner — season scope
    change: >
      Read G7_SEASON_IDS (comma-separated) from the workflow input; require a non-empty, duplicate-free
      subset of {26027, 24319} in manifest order; keep validateManifest requiring the shared preflight's
      two-season manifest shape (the shared module is untouched) but iterate only the requested
      subset; set evidence.requestedSeasonIds to the actual list; keep the 240-fixture invariant per
      requested season. For this task the ticket pins ["26027"].
