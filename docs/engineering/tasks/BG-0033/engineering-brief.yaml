risks:
  - severity: HIGH
    risk: "Fingerprint algorithm assumption wrong (API `value` is not sha256(value)) → the pre-mutation proof never matches and the runner refuses to start."
    mitigation: "Fail-closed by design; a --capture-only dispatch (no mutation) reveals the fingerprint shape after BG-0002 is fixed; the equality fallback covers the plaintext case."
  - severity: HIGH
    risk: "FOOTBALL_INGESTION_TRIGGER_SECRET is currently present in production (unknown since 2026-08-02) → strict policy refuses to run."
    mitigation: "--capture-only dispatch first; owner decides between supplying G7_CURRENT_TRIGGER_SECRET or accepting an explicit 'unset and re-issue' exception recorded in the ticket."
  - severity: HIGH
    risk: "Double failure: the mutation step is killed and the always() restore post-step is also terminated (5-minute cap, runner outage) → production stays on 26027 with a live trigger."
    mitigation: "restore_only dispatch path in the workflow + runbook; finalize verdict red on RESTORE_OUTCOME != success; A4 checklist item: confirm fingerprints via a capture-only dispatch after any red run."
  - severity: MEDIUM
    risk: "Current-runtime inputs (SEASON_START/END, FIXTURE_FROM/TO, TEAM_IDS) are unknown to the reviewer; if any is present pre-run with an unexpected value the proof fails."
    mitigation: "That is the desired behaviour; a capture-only dispatch lists presence and digests so the inputs can be reviewed before the real dispatch."
  - severity: MEDIUM
    risk: "skip_deploy misuse after A2 lands leaves the old worker (version 53) serving the run."
    mitigation: "identity check on version + ezbr_sha256 recorded in the ticket; default false."
  - severity: MEDIUM
    risk: "Ticket JSON, workflow dict, runner evidence header and runner test drift."
    mitigation: "single commit; parity unit test parsing the workflow dict (BG-0034 pattern); config-integrity guard on the workflow."
  - severity: LOW
    risk: "Gate 2F rollback file still pins 26027 (same defect class) — not in scope here."
