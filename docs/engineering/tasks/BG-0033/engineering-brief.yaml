  - "Evidence rules (phase7f scanner, credential grep, 80-line sanitizer) apply to every new file in the evidence dir; sha256 hex digests and secret names are allowed, values are not."
  - "Restore post-step must finish within GitHub's 5-minute post-cancellation window (three CLI calls, seconds each)."
