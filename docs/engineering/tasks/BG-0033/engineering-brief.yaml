      names" (body: array of names).
    evidence: "Supabase MCP search_docs → https://supabase.com/docs/reference/api/v1-list-all-secrets, v1-bulk-create-secrets, v1-bulk-delete-secrets; body constraints from the CLI's embedded schema (name regex ^(?!SUPABASE_).*, max 256; value max 24576)"
  - classification: VERIFIED
    statement: >
      The pinned CLI (package.json supabase 2.109.1; verified binary v2.109.1 is a Bun-compiled bundle)
      implements `secrets list` as v1ListAllSecrets → sort by name → text output = a two-column table
      whose headers are literally ["NAME","DIGEST"] and whose second column is the API item's `value`
      field. With `--output json|yaml|toml` (or `--output-format json`) it prints the RAW API items.
      `--output env` is rejected. `secrets set` merges, in order: `[edge_runtime.secrets]` from
      ./supabase/config.toml if present (the repository's block is commented out, so nothing is
      merged), then --env-file (parsed by a dotenv parser, so quoting rules apply), then NAME=VALUE
      args; names starting with SUPABASE_ are skipped with a stderr note; then ONE v1BulkCreateSecrets
      call. `secrets unset NAME…` calls v1BulkDeleteSecrets after a confirmation that is auto-accepted
      when --yes is given or stdin is not a TTY (CI); with no names it unsets EVERY non-SUPABASE_
      secret — a footgun the runner must never trigger (always pass explicit names).
    evidence: "strings extracted from the v2.109.1 linux_amd64 release binary: bQL=['NAME','DIGEST']; YaH maps (name, value); waH list handler; kaH set handler; paH unset handler; supabase/config.toml:400-401 (# [edge_runtime.secrets] commented)"
