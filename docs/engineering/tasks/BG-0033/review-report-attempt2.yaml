findings_non_blocking:
  - id: 1
    title: >
      The "type-level durability" claim in both the implementation report and
      verification-report-attempt2.yaml is overstated — do not rely on it as the real protection.
    detail: >
      Both reports claim that narrowing `evidence.commands` to `EvidenceCommand[]` makes "a future
      accidental push of a bare CommandResult ... also a type error, not just a runtime leak" /
      "any future bare CommandResult push is a compile-time error." I tested this directly and it
      is false, for two independent reasons: (1) TypeScript's structural typing permits assigning a
      value of a wider type (CommandResult, which has all of EvidenceCommand's fields plus stdout)
      to a narrower target type when the value comes from a variable rather than an object literal
      — excess-property checking only fires on literals. I reproduced this both in an isolated
      minimal repro and by copying the real file, reverting the fix line to
      `commands.push(configure)`, and running `tsc --noEmit` against it with the project's own
      strict compiler options: no error is reported at that line (only unrelated environment
      errors from missing ambient Bun/Node types, none touching the push call). (2) Independently
      of (1), this file is not even in the scope `tsc --noEmit` checks in this repo:
      tsconfig.json's `include` is `["src/**/*.ts", "src/**/*.tsx", "vite.config.ts",
      "eslint.config.js"]` — `scripts/backend/**` is not listed, and there is no second tsconfig
      for the scripts directory. So `bun run typecheck` (the command both reports cite as having
      passed) does not typecheck this file at all, for this change or any other. Bun's own
      `bun test`/script execution transpiles TypeScript without type-checking, so there is no
      compile-time backstop here in practice, at any layer.
    impact: >
      Not a live leak — the currently-shipped code is correct on every path I traced, and this is
      a documentation/durability-claim inaccuracy, not a functional defect. Real protection against
      a future regression of this class currently rests on: (a) the explicit warning comments left
      on `CommandResult`/`EvidenceCommand`/`toEvidenceCommand` in the source, (b) the new
      `assertNoStdoutLeak` regression tests actually running in CI's `bun run test`, and (c) the
      workflow-level defense-in-depth in g7-production-historical-performance-backfill.yml
      (gate4-sanitize-command-log.ts + phase7f-scan-sanitized-evidence.py + the explicit
      known-secret-value grep before upload-artifact), all of which are independent of the type
      system and all of which I confirmed are untouched and still in place. I judge this
      non-blocking for attempt 2's verdict because the actual runtime behavior is correct and
      multiply defended, but the specific "compile-time error" claim should not be repeated or
      relied upon going forward.
    suggested_correction_if_ever_touched_again: >
      Either (a) correct the claim in future reports to say the protection is the code comment +
      test suite, not the type system, or (b) if durable compile-time enforcement is actually
      wanted, add scripts/backend/**/*.ts to a tsc project that CI runs (or a dedicated
      tsconfig for scripts/) AND use a technique that survives structural widening (e.g. a branded
      type on EvidenceCommand, or constructing evidence.commands via a wrapper function that only
      accepts an object literal so excess-property checking fires). Neither is required for this
      task; noting for whoever next touches this file.

