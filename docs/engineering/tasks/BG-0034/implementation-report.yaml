changes:
  - file: scripts/backend/sportsmonks-historical-performance-probe.ts
    description: >
      Kept the existing sampled-fixture pass (now 7 fixed requests: the 26027 sample grew by
      fixture 19489216; seasonCoverage derives the expected sample count per season from the
      constant instead of the literal 3; requestCount is the constant's length). Added a second,
      independent pass runHistoricalPerformanceInvariantProbe: for every season in
      HISTORICAL_PERFORMANCE_INVARIANT_SEASONS ([26027]) it enumerates all league-860 fixtures
      through the same fixtures/between windows (buildFixtureWindows + TWO_SEASON_BACKFILL_SCOPE
      from the preflight), the same filters/page size (fixtureLeagues:860, per_page 50,
      timezone UTC, has_more pagination, 10-page cap) the two-season coverage audit and the
      fixture ingestion runtime use, then fetches each fixture with the edge worker's exact
      request shape (include lineups.details, filters lineupDetailTypes:<the worker's
      HISTORICAL_PERFORMANCE_DETAIL_TYPE_IDS>) and classifies it with
      classifyFixtureInvariants. Reviewed ticket fixtures of the season are pinned into the
      target set, so 19489216 is classified even when enumeration is partial
      (enumerated:false, enumerationComplete:false are recorded instead of aborting).
      Evidence sportsmonks-historical-performance-invariants.json holds, per fixture:
      fixtureId, seasonId, kickoff (provider starting_at normalised to ISO or null),
      enumerated, lineupRows, validPlayerRows, excludedIncompleteRows, starterRows, teamCount,
      invalidDetailRows, failures[], pass; per season: expectedFixtures 240, fixturesEnumerated,
      enumerationComplete, pinnedFixtureIds, requests, fixtures, passing, failing,
      failuresByCode (seeded with the six worker codes at 0); plus totals, requestCount,
      providerPayloadIncluded:false and a credential-in-evidence guard. No names, no raw payload.
      Pacing is unchanged from the existing scripts: strictly sequential requests through
      requestSportsMonksJson (15 s timeout, 3 attempts, Retry-After honoured up to 30 s); no
      new delay was introduced because none of the existing probes or the audit use one.
      main() writes both evidence files and exits 0 whenever the probe itself succeeded; a
      failing fixture is the answer the dispatch is asked for, not a probe failure.
  - file: scripts/backend/sportsmonks-historical-performance-probe.test.ts
    description: >
      Rewritten around the new surface: ticket parity (loads the JSON ticket, extracts and
      parses the Python dict literal embedded in the workflow's verification step, deep-equals
      both, and equals the probe's exported constants), a source-level parity test that the
      six-code constant equals exactly the coverageFailures.push("...") literals in the worker
      module, the sampled pass at 7 requests / 4+3 samples, pure classification cases (pass;
      lineup_rows_out_of_range alone; valid_player_rows_out_of_range (necessarily together with
      starter_rows_mismatch); incomplete_rows_limit_exceeded alone; starter_rows_mismatch
      alone; team_count_mismatch alone; an invalid detail, which the worker aborts as
      invalid_provider_detail before reaching invariant six; fixture_scope_mismatch as a
      failing row), kickoff normalisation, full 240-fixture enumeration with the worker's
      includes asserting the 19489216 row and failuresByCode, partial enumeration still
      classifying 19489216, aggregation of every code across a season, evidence key allow-list
      and token/player_id/details absence, and fail-closed on an out-of-scope listing.
  - file: docs/production/g7-historical-performance-probe-trigger.json
    description: >
      requestId g7-historical-performance-coverage-2026-08-02-03 -> g7-historical-performance-coverage-2026-09-18-01;
      fixtures gains {"seasonId": 26027, "fixtureId": 19489216} (grouped with the other 26027
      entries); new key "invariantSeasons": [26027]. Everything else byte-identical.
  - file: .github/workflows/g7-sportsmonks-historical-performance-coverage.yml
    description: >
      Embedded expected ticket updated identically to the JSON (verified equal by the new unit
      test and by an independent Python eval). timeout-minutes 10 -> 45 with the derivation in
      a comment. New step "Report coverage invariant classification" (id invariants, runs only
      when the probe step succeeded) prints per-season enumerated/complete/fixtures/passing/
      failing, the sorted failuresByCode histogram and the full 19489216 row, fails with
      HALTING_FIXTURE_NOT_CLASSIFIED if that row is missing, and exports failing /
      halting_failures outputs. INVARIANTS_OUTCOME joins the finalize verdict and the commit
      status gate; the status description appends "invariant-failing fixtures: N". Unchanged:
      owner actor / main ref / repository guard, GITHUB_RUN_ATTEMPT == 1, confirmation string,
      expected_commit == GITHUB_SHA, environment production-football-ingestion, only
      SPORTSMONKS_API_TOKEN, add-mask, bun test + secrets check quality step, evidence scan,
      artifact upload (30 days), protected-file cleanup, concurrency group, permissions.
  - file: docs/engineering/tasks/BG-0034/implementation-report.yaml
    description: this report.
