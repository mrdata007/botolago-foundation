invariant_source_decision: >
  IMPORT, not replicate. supabase/functions/_shared/sportsmonks-historical-player-performance.ts
  uses no Deno-only global (only fetch, crypto.subtle, TextEncoder, setTimeout) and imports
  only ./sportsmonks-player-ratings.ts; scripts/backend/sportsmonks-two-season-coverage-audit.ts
  already imports normalizeHistoricalFixture from it under Bun, and bun test resolves the .ts
  extension import without node_modules (the workflow's quality step runs bun test without
  bun install, verified locally). The probe therefore calls the worker's own
  normalizeHistoricalFixture and reads the diagnostic it attaches to
  historical_fixture_coverage_incomplete (lineupRowsSeen, validPlayerRows,
  excludedIncompleteRows, starterRows, teamCount, invalidDetailRows, failures[]); thresholds
  and codes cannot drift because none are redefined. The only local constant is the list of
  six code names used to seed the histogram with zeros, and a unit test asserts it equals the
  coverageFailures.push literals in the worker source.
