residual_risks:
  - id: R1
    title: "45-minute job timeout vs a literal application of the sister audit's allowance"
    assessment: NOT A DEFECT (accepted ops risk), reasoning below.
    detail: >
      Facts: 7 sampled + ~6 listing + 240 per-fixture = ~253 provider requests. The sister audit's 90 min / 492 requests is
      ~10.98 s per request; 253 x 10.98 s = ~46.3 min, ~1.3 min above timeout-minutes 45. The probe writes both evidence files
      only after both passes complete (main(): runHistoricalPerformanceProbe -> write -> runHistoricalPerformanceInvariantProbe
      -> write), so a runner-cancelled job would leave no evidence and no listing for that run.
      Reasoning for not grading this as a defect: (1) No acceptance criterion or allowed-scope rule sets a timeout value; treating
      the sister figure as a mandatory floor would be inventing a requirement. (2) The 11 s/request figure is a reviewed budget
      ceiling, not an observed pace; the only cited observation (5 fixtures incl. DB RPCs in 3.4 s) puts the run at ~3 min, some
      15x under the timeout. (3) Neither 45 nor 90 minutes is a worst-case bound anyway: requestSportsMonksJson allows 3 attempts
      x 15 s plus Retry-After up to 30 s per request, so any timeout here is a heuristic ceiling, as the sister's is. (4) The
      failure mode is benign and recoverable: the workflow is read-only, cleanup removes the runtime dir, no state is mutated,
      and the owner can simply dispatch again (the GITHUB_RUN_ATTEMPT guard forbids re-running the same run, not a fresh
      dispatch). (5) The Builder documented the derivation and the expected pace honestly in the workflow comment and the
      ImplementationReport; nothing was hidden. A 3% shortfall against a budget the run is not expected to approach does not
      refute "the deliverable can produce the listing".
      Owner note before dispatch: if the first dispatch is cancelled at 45 min with no artifact, the provider is throttling to the
      allowance pace; the minimal follow-up is either timeout-minutes 50 (253 x 11 s rounded up) or writing
      sportsmonks-historical-performance-invariants.json incrementally per fixture so a partial listing survives. Either is a
      one-line/one-function change under the same allowed paths and does not need to block this merge.
  - id: R2
    title: "Worker invariant six (invalid_detail_rows_present) is unreachable"
    detail: >
      Confirmed in the worker: the catch that increments invalidDetailRows always rethrows, so the coverage block only runs
      with invalidDetailRows == 0. The probe reports what the worker evaluates (invalidDetailRows 0 on classified rows; a bad
      detail surfaces as the worker's abort code invalid_provider_detail/duplicate_provider_detail with null counts, pass:false).
      That is faithful to the worker and satisfies "classify as the worker does"; it is a finding for BG-0011 step A2, not this task.
  - id: R3
    title: "Runner resolution of the cross-directory .ts import in the quality step"
    detail: >
      The workflow's quality step runs `bun test` without `bun install`. The test imports only repository files and bun:test, and
      the ImplementationReport states this was verified locally without node_modules, but it was not reproduced here (this
      workspace has node_modules). Unchanged mechanism from origin/main; low risk.
  - id: R4
    title: "Ledger closure depends on the dispatch"
    detail: >
      The acceptance item "owner dispatch on merged main produces a per-fixture pass/fail listing naming the failing invariant of
      19489216" is satisfied only by the run log / artifact of that dispatch. Expected: step log line
      `fixture=19489216 {...,"failures":[...],"pass":false}`, artifact g7-historical-performance-<run_id> containing
      sportsmonks-historical-performance-invariants.json with 240 rows and enumerationComplete true, and commit status
      botolago/g7-historical-performance ending "invariant-failing fixtures: N". The repository already embeds a prior
      diagnostic for 19489216 (starterRows 21 -> starter_rows_mismatch); the dispatch is expected to reproduce that code.

