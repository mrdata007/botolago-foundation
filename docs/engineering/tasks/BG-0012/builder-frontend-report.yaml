  test: "bun test — 819 pass / 0 fail across 122 files"
  lint: "bun run lint — 0 errors, 13 warnings (all pre-existing react-refresh/only-export-components warnings on files I did not touch: AuthProvider, MatchTabs, PageBackground, ui/badge, ui/button, ui/form, ui/navigation-menu, ui/sidebar, ui/toggle, i18n/provider, fantasy-owned-provider)"
  build: "bun run build — succeeded (vite build + nitro), no errors"

visual_verification_for_orchestrator:
  - "Load /news with an empty or slow network to see the skeleton state (lead-shaped + 4 row skeletons), then the real lead/featured/latest layout once home_modules resolves."
  - "Pick a category chip and confirm the Latest feed refetches filtered by that taxonomy slug (network tab: news_feed p_category_slug), and that unrelated sections (lead/featured/club filter) don't reload."
  - "Pick a club chip and confirm the same for p_team_id; toggle 'Suivre'/'Following' while signed in."
  - "Scroll to the bottom of Latest and click the load-more control repeatedly until it disappears (nextCursor exhausted) — confirm no duplicate cards appear."
  - "Force home_modules to return lead: null (or check a day with no active lead placement) and confirm the lead Section is simply absent, not a placeholder."
  - "Open an article whose hero has no media/broken URL and confirm a brand-gradient card renders instead of a broken-image icon."
  - "Switch interface language to Arabic and open both /news and /news/$articleId: confirm dir=rtl end-to-end, chips/badges mirror via logical properties, and relative times use ar-MA formatting (format-time.ts, untouched)."
  - "View page source / a link-preview unfurl on an article to confirm canonical link, OpenGraph/Twitter tags, and the application/ld+json NewsArticle block reflect the actually-rendered language edition."
  - "Resize to a phone width (375px) and a desktop width (1280px) on both pages and confirm no horizontal overflow and that the featured rail's 2-column grid only applies at sm: and above."

commands_to_reproduce_checks: |
  bun install
  bun run typecheck
  bun test
  bun run lint
  bun run build
