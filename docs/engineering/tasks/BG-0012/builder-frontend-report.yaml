task: BG-0012 — Builder-Frontend (public /news + /news/$articleId redesign)
branch: agent/news-cms-launch
base: main@108435e871b78a836cdd5600fd91d076fe6434a6
scope_note: >
  Consumed only the existing public read RPCs via newsService /
  getNewsRepository() / SupabaseNewsRepository / MockNewsRepository. Did not
  touch src/backend/news/*, src/services/news.ts, any admin.* route, or any
  supabase/migrations/*. Two narrow, deliberate exceptions to the literal
  file list, both explained below (boundary_exceptions).

files_changed:
  created:
    - src/components/news/news-data.ts        # pure helpers: category derivation, gradient token cycling, featured-treatment rule, breaking-placement check, feed-page dedup, dir(), public request context
    - src/components/news/news-data.test.ts    # bun:test coverage for all of the above
    - src/components/news/CategoryChips.tsx    # taxonomy-driven category chip row
    - src/components/news/ClubFilterRow.tsx    # club discovery row (extracted/preserved from old news.tsx, same follow behavior)
    - src/components/news/FeaturedGrid.tsx     # varied "Top stories" rail (hero / compact / horizontal by position) + breaking badge
    - src/components/news/PlacementBadge.tsx   # "Dernière minute / عاجل" corner ribbon for placement === "breaking"
    - src/components/news/LatestFeed.tsx       # chronological feed with real useInfiniteQuery keyset pagination
    - docs/engineering/tasks/BG-0012/builder-frontend-report.yaml
  modified:
    - src/routes/news.tsx                      # full landing-page rebuild
    - src/routes/news.$articleId.tsx            # full article-page rebuild
    - src/lib/article-meta.ts                  # now DTO-driven (language-correct head) + NewsArticle JSON-LD + buildCanonicalArticleUrl
    - src/lib/article-meta.test.ts             # rewritten for the new DTO-based signature + FR/AR + JSON-LD coverage
    - src/styles.css                           # added 7 new --news-gradient-* custom properties only; no existing rule or --fpl-* token touched
    - scripts/qa/i18n-gate.ts                  # see boundary_exceptions #2

boundary_exceptions:
  - file: src/lib/article-meta.test.ts
    reason: >
      Not in the literal allowed-file list, but it is article-meta.ts's own
      test companion and the task explicitly asks for tests covering the
      canonical URL / OpenGraph / JSON-LD changes to that file. Left
      unedited it would fail to compile against the new signature. No
      overlap with Builder-CMS's backend/admin/migration files.
  - file: scripts/qa/i18n-gate.ts (BASELINES constant only)
    reason: >
      Replacing the hardcoded tab UI with real taxonomy-driven category
      chips (requirement D) retired 10 now-unreferenced dictionary keys
      (news.tab.for_you/latest/transfers/analysis/interviews,
      news.section.transfers/analysis/interviews/saved, news.saved.empty)
      and 4 template-key t() call sites, moving the repo's committed W3/W4
      i18n-gate baselines from 237/100 to 245/96. The gate script's own
      comment prescribes exactly this: "Changing any of these numbers is a
      deliberate, reviewed act: state in the commit message why the count
      moved" — done here and in the commit message. This is a pure
      constant-value edit with no functional/behavioral change and no
      overlap with backend/admin files.
  - note: >
      I did NOT delete the now-unreferenced dictionary keys themselves
      (src/i18n/dictionaries.ts is out of boundary) — they remain in the
      dictionary, just unused, which is exactly what the W3 warning is
      designed to surface for a future cleanup pass by whoever owns that
      file.

requirements_landing_page:
  A_lead_area: full
  A_notes: >
    Renders home_modules.lead verbatim via presentArticleForDisplay +
    existing ArticleCard "lead" variant (hero image via MediaImage/
    FailureAwareImage, category badge, headline, deck, relative+absolute
    publish time via format-time.ts). No client-side story selection: if
    `lead` is null the whole lead Section is simply absent.
  B_top_stories: full
  B_notes: >
    FeaturedGrid gives home_modules.featured real editorial rhythm by
    position: item 0 = large image-led hero card, items 1-2 = compact
    dense rows, items 3+ = smaller side-by-side image cards
    (featuredTreatmentForIndex, unit-tested). Any item whose `placement`
    field is "breaking" gets a red PlacementBadge ribbon positioned so it
    never collides with the card's own category tag.
  C_latest_pagination: full
  C_notes: >
    LatestFeed uses TanStack Query's useInfiniteQuery against
    getNewsRepository().getFeed(), decoding/encoding the DTO's real
    {publishedAt, id} keyset cursor via the repository's own
    encodeNewsCursor. "Load more" fetches the next page and appends
    (de-duplicated); the control is hidden once nextCursor is null. No
    page-number pagination anywhere.
  D_content_discovery: partial
  D_notes: >
    CategoryChips is fully taxonomy-driven in the sense required — no
    hardcoded/fabricated category list, no fake "Fixtures"/"Match Reports"
    tabs. HOWEVER: NewsRepository (src/backend/news/contracts.ts, out of
    my boundary) does not currently expose a getTaxonomies() method, and
    neither MockNewsRepository nor SupabaseNewsRepository call
    api.news_taxonomies — so that RPC is NOT actually wired into the
    frontend contract despite the brief's assumption that it is. As the
    closest in-boundary approximation, deriveCategoryOptions() collects
    the real, distinct `primaryCategory` values already present on
    home_modules' lead/featured/latest cards. This is 100% real data, but
    it will only surface categories that currently have an article in one
    of those three lists — a category with zero currently-placed articles
    won't appear until either (a) a getTaxonomies() method is added to the
    shared NewsRepository contract (backend/CMS builder's file) or (b) the
    chip list is widened to sample a larger feed page too. Flagging this
    gap explicitly per the task's own instruction ("if the seed data is
    sparse, render only what's real and note the gap").
  E_club_discovery: full
  E_notes: >
    ClubFilterRow preserves the exact prior behavior (select/clear filter,
    follow/unfollow via followService with requireAuth gating), extracted
    into its own component and restyled to sit in the new layout.
  F_editorial_placements: full
  F_notes: >
    Entire page is placement-driven: lead/featured come only from
    home_modules, "breaking" is the one placement value distinguished
    visually today (checked the real DTO enum:
    home_lead/news_lead/editors_pick/featured/breaking/trending — only
    "breaking" gets a distinct badge per the brief's own example; the
    others already drive section membership, so a second badge for them
    was judged to be visual noise rather than a real requirement).
  G_states: full
  G_notes: >
    Loading: real skeletons (ArticleCardSkeleton, SkeletonList) for
    lead/featured and for the Latest feed independently. Error: ErrorState
    with retry, scoped per section (home_modules error does not block the
    Latest feed or filters, and vice versa). Empty: EmptyState when lead
    is null AND featured is empty; LatestFeed has its own EmptyState.
    No-image: MediaImage's `fallback` prop is set via
    presentArticleForDisplay to gradientTokenForId(id), which
    deterministically cycles through the 6 non-white
    --news-gradient-{hero,ocean,matchday,aqua,dark,promo} tokens (never a
    broken-image icon).
  scope_change_from_prior_page: >
    Removed the old page's manual "article language" auto/fr/ar selector
    and the on-page "Saved articles" rail. Rationale: (1) the dual-edition
    selector conflicted with real single-language keyset pagination
    (requirement C) and the brief's structure assumes one coherent
    edition per view — the interface language (already fr/ar-switchable
    app-wide) now drives home_modules/feed directly; (2) a personal
    saved-articles list is not part of the premium-editorial-destination
    brief and remains fully reachable at /profile (verified) — the
    save/unsave action itself (SavedButton) is still on every card and on
    the article page.

requirements_article_page:
  hero_image: full
  category_badge: full
  headline_deck: full
  author: partial
  author_notes: >
    Renders `author?.name ?? publisher?.name` when either is present, and
    omits the byline entirely (no fabricated name) when neither is. In
    practice the DTO/mock always populates at least a publisher, so this
    only degrades if a real editorial row has neither — a genuine backend
    data gap, not a frontend limitation.
  publisher: full
  publish_and_updated_time: full
  publish_and_updated_time_notes: >
    Shows "updated" only when updatedAt differs from publishedAt by more
    than 60s, to avoid noise from rows where both timestamps default to
    the same value.
  reading_time: full
  image_caption_credit: partial
  image_caption_credit_notes: >
    Renders hero.caption / hero.credit as a <figcaption> when either is
    present on the DTO (schema supports both: mediaSchema.caption,
    mediaSchema.credit). Current seed/mock data has both null, so the
    figcaption does not currently render for any article — this is a
    content gap, not a missing wiring: the field is read and displayed as
    soon as an editorial row populates it.
  sanitized_body: full
  sanitized_body_notes: >
    Unchanged pattern — dangerouslySetInnerHTML on the DTO's own bodyHtml,
    no client-side re-sanitization added or removed.
  tags_and_teams: full
  related_articles: full
  save_bookmark: full
  share: full
  share_notes: >
    Web Share API with clipboard-copy fallback, both now sharing the
    canonical URL (buildCanonicalArticleUrl) instead of window.location.href.
  canonical_og_jsonld: full
  canonical_og_jsonld_notes: >
    buildArticleHead now reads article.language directly (the edition that
    actually loaded, fr OR ar) instead of hardcoding French — this was the
    named bug in the brief and is covered by a dedicated test
    ("reads the CURRENTLY RENDERED language's title/summary, not French,
    for an Arabic edition"). Prefers seo.title/seo.description when the
    DTO provides them. Adds one application/ld+json NewsArticle block via
    the router's head().scripts, built only from real DTO fields
    (headline, datePublished, dateModified, image, author, publisher,
    inLanguage, mainEntityOfPage) — no field is fabricated; author/image
    are simply omitted when the DTO has none.
  rtl_and_typography: full
  rtl_and_typography_notes: >
    dir/lang set from the loaded edition's own language on every text
    block (article element, byline row, figcaption); only Tailwind logical
    utilities used throughout new/changed markup (ms-/me-/ps-/pe-/start-/
    end-/text-start/text-end), matching the BG-0026 convention — grepped
    existing components before writing new ones. Body copy kept at
    max-w-[68ch] for readable line length.
  no_synthetic_content: full

gradient_tokens_added:
  - "--news-gradient-hero: linear-gradient(125deg, #00195A 0%, #0151FC 55%, #49CFFF 100%)"
  - "--news-gradient-ocean: linear-gradient(135deg, #000C2D 0%, #0036B0 55%, #0151FC 100%)"
  - "--news-gradient-matchday: linear-gradient(110deg, #002787 0%, #0151FC 55%, #85ADFF 100%)"
  - "--news-gradient-aqua: linear-gradient(90deg, #0151FC 0%, #1F8CFF 55%, #49CFFF 100%)"
  - "--news-gradient-dark: linear-gradient(145deg, #000C2D 0%, #00195A 55%, #0036B0 100%)"
  - "--news-gradient-light: linear-gradient(115deg, #FFFFFF 0%, #E6EEFF 55%, #C2D6FF 100%)"
  - "--news-gradient-promo: linear-gradient(130deg, #0036B0 0%, #0151FC 55%, #49CFFF 100%)"
  location: "src/styles.css :root, directly after --brand-charcoal, before the existing 'Extra semantic accents' block"
  note: >
    Added once, as fixed exact-hex values per the brief (no separate dark-
    mode redefinition — the brief specified fixed hex values, not a
    light/dark pair, and these are all deep-saturated blues that read fine
    against both this app's light and dark surfaces). No --fpl-* token was
    read, written, or referenced from any News file.

font_situation:
  botola_sans_found: false
  action_taken: >
    Re-ran `find . -iname "*botola*sans*" -not -path "*/node_modules/*"` at
    the start of this task — zero matches, confirming the earlier check.
    Did not fabricate, download, or rename any font as "Botola Sans". Left
    the existing, already-reviewed typography untouched: Manrope (Latin)
    and Noto Sans Arabic (Arabic), loaded via the Google Fonts <link> in
    src/routes/__root.tsx (a file I did not touch). This is a genuine
    missing-asset dependency: if/when actual Botola Sans font files are
    added to the repo, __root.tsx's font <link>/`@font-face` setup (owned
    by whoever manages global head assets) would need weight-400/500/600/
    700 @font-face declarations added — out of this task's file boundary.

tests_added:
  - file: src/components/news/news-data.test.ts
    runner: bun:test
    covers: >
      publicNewsContext shape; deriveCategoryOptions (dedup, sort, empty-
      source, never-fabricates); gradientTokenForId (deterministic, always
      one of the 6 brand tokens); presentArticleForDisplay overriding the
      legacy gradient; featuredTreatmentForIndex (hero/compact/row by
      position); isBreaking (only "breaking" flagged); appendFeedPage
      (order-preserving, de-duplicating — the pagination-append logic
      LatestFeed relies on); dirFor (ar -> rtl, fr -> ltr).
  - file: src/lib/article-meta.test.ts (rewritten)
    runner: vitest (matches this file's pre-existing convention; bun test
      already runs it via its vitest-compat shim, verified)
    covers: >
      canonical URL encoding; full FR head shape (title/description/og/
      twitter/canonical/published_time/image); the BG-0012-named bug fix —
      an Arabic edition's OWN title/summary/og:locale render instead of
      French; seo.title/seo.description override; article:modified_time
      appearing only when updatedAt really differs; the null-article
      fallback head (and that it emits no JSON-LD script); the NewsArticle
      JSON-LD block's real fields; JSON-LD never fabricating an author or
      an image when the DTO has neither.
  pass_counts: >
    Both new/changed test files: 40 passing tests, 102 expect() calls
    (`bun test src/lib/article-meta.test.ts src/components/news/news-data.test.ts src/services/news.test.ts`).
    Full repo suite after all changes: 819 pass / 0 fail across 122 files
    (`bun test`), including the untouched src/i18n/i18n-gate.test.ts and
    src/services/news.test.ts (both re-verified green, not just re-run).
  component_rendering_tests_not_added: >
    This repo has no React component-rendering test harness at all today
    (no @testing-library/react, no jsdom/happy-dom config; the two
    existing "news" test files — services/news.test.ts and the old
    article-meta.test.ts — are both pure-logic tests, no rendered DOM).
    Installing a new test-rendering stack was out of scope for a frontend-
    file-boundary task and risked destabilizing shared tooling. Given
    that, "landing page rendering / category filter switching / club
    filter / load-more pagination / FR+AR rendering / responsive" are
    covered here at the pure-logic layer that actually drives that
    behavior (category derivation, feed-page pagination/dedup, gradient
    fallback, dir mapping, JSON-LD/canonical language correctness) rather
    than via rendered-DOM assertions, exactly as the task instructions'
    own escape valve allows ("describe how the orchestrating session
    should verify visually"). See visual_verification below for what to
    click through by hand.
  tests_e2e_precedent: >
    Checked tests/e2e/*.e2e.ts: all are Playwright acceptance/journey
    specs hitting a real staging/prod-like environment (auth flows,
    fantasy), not a pattern for isolated component/viewport testing of a
    single route — did not force-fit a Playwright spec here for that
    reason, per the task's own "otherwise confirm... via whatever this
    repo's convention is" guidance (there isn't one for this kind of
    check yet).

