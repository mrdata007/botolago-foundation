      or after this fix). A season that accumulated a job_runs row (e.g. via
      api.service_begin_fantasy_job for apply_price_changes, recalculate_rankings,
      etc., none of which require an app.fantasy_teams row to exist first)
      before ever having a team could still hit a different FK violation on
      `delete from app.fantasy_seasons`, even with this fix applied.
    status: pre-existing, not introduced by this PR (confirmed: fantasy_job_runs
      predates the original, unfixed rollback function by two weeks; the
      original function had the identical gap for its entire lifetime).
    owner: Chief (to open as a new, separate ledger follow-up ticket; out of
      BG-0032's stated scope, which named leagues/memberships/rankings/
      mutation_audit only)
    correction: >
      Follow-up ticket: confirm whether fantasy_job_runs rows realistically
      exist for a season before its Fantasy catalog is ever rolled back (most
      job types fire after teams/gameweeks are active, which the
      fantasy_catalog_in_use guard already blocks indirectly in the common
      case, but a season staged and then abandoned before any team registers
      could still trigger a job run via a scheduled/manual invocation), and
      if so extend a future migration's rollback cleanup or guard to cover it
      the same way this fix covers leagues/memberships/rankings.
  - risk: >
      LAUNCH_LEDGER.yaml on this branch is stale relative to current
      origin/main (missing BG-0031's next_production_approvals_packet and
