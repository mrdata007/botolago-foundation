pr_route_assessment: >
  This RPC is a production data-deletion path, so even though it is fully
  covered by local pgTAP + CI-equivalent commands (all independently re-run
  by the Verifier and spot-checked again here) rather than gated by a
  server-side CI pipeline, a PR still adds real value beyond what direct
  branch review captures: (1) it gives a durable, linkable review record tied
  to a diff rather than a floating branch, (2) it forces the LAUNCH_LEDGER.yaml
  staleness the Verifier flagged to be resolved through a visible merge/rebase
  step instead of a silent force-push, and (3) GitHub's diff view is a better
  surface than raw git for the Chief's final read of a ~150-line SQL function
  body where line-by-line byte-identity with the original matters. Recommend:
  rebase onto current origin/main, reconcile LAUNCH_LEDGER.yaml (keep BG-0031/
  BG-0033 content from main, keep only the BG-0032 entry from this branch),
  then open a PR for the Chief's merge decision. This review does not
  duplicate that reconciliation work and did not touch the ledger.

