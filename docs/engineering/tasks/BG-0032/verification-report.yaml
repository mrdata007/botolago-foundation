mutation_audit_independent_conclusion: >
  CONFIRMED, no gap found. Grepped every migration file for
  "fantasy_mutation_audit": only the CREATE TABLE
  (20260720141847_fantasy_teams_transfers_chips.sql:219-243, columns id,
  user_id, fantasy_team_id, operation, accepted, stable_error_code,
  base_version, resulting_version, idempotency_key, safe_metadata,
  occurred_at — no fantasy_season_id/fantasy_league_id column) plus later
  files that only INSERT into it or add an index; no ALTER TABLE anywhere
  touches its columns or constraints. Independently queried live production
  (project tkewgajrljbwgwedqsxn) read-only against pg_constraint and
  information_schema.columns for app_private.fantasy_mutation_audit: exactly
  two FKs (fantasy_team_id -> app.fantasy_teams ON DELETE RESTRICT, user_id ->
  app.profiles ON DELETE RESTRICT), no FK to app.fantasy_seasons or
  app.fantasy_leagues, columns matching the migration exactly. Also
  independently confirmed app.fantasy_teams.fantasy_season_id ->
  app.fantasy_seasons is itself ON DELETE RESTRICT (pg_constraint query against
  production), which is the load-bearing link in the Builder's argument: a
  team can never be deleted out from under a still-existing mutation_audit
  row, and the RPC's pre-existing PT409 fantasy_catalog_in_use guard already
  refuses unless zero app.fantasy_teams rows exist for the season, and the RPC
  never deletes app.fantasy_teams. The chain is airtight: at the point
  `delete from app.fantasy_seasons` executes, zero teams exist for that
  season, so zero mutation_audit rows can reference a team that belonged to
  it. No cleanup code for mutation_audit was needed. This resolves the
  ledger's title (which named mutation_audit as a blocker) as unsupported by
  the schema, exactly as the Builder concluded.
  SEPARATE OBSERVATION (not part of the mutation_audit question, flagged for
  awareness, not a defect in this fix): app_private.fantasy_job_runs also has
  fantasy_season_id -> app.fantasy_seasons ON DELETE RESTRICT (nullable), and
  job rows are inserted by api.service_begin_fantasy_job for
  open_gameweek/lock_deadline/recalculate_provisional_points/
  finalize_gameweek/restore_free_hit/roll_free_transfers/
  recalculate_rankings/apply_price_changes — none of which require an
  app.fantasy_teams row to exist. Neither the pre-existing RPC nor this
  migration cleans up or checks fantasy_job_runs. In principle a season that
  accumulated a job_runs row (e.g. an apply_price_changes run) before any team
  was ever created could still hit a *different* FK violation on `delete from
  app.fantasy_seasons`, even after this fix. This is outside BG-0032's stated
  scope (the ledger title and reproduction only named
  leagues/memberships/rankings/mutation_audit) and the Builder's fix correctly
  and completely addresses everything named in scope; recommend a follow-up
  ticket to confirm whether job_runs rows are realistically ever created
  before rollback is attempted, and if so extend the guard/cleanup similarly.

