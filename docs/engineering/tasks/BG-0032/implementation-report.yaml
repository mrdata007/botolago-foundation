changes:
  - file: supabase/migrations/20260918170000_fantasy_catalog_rollback_cleanup.sql
    description: >
      New additive migration (sorts after 20260918160000_season_bounds_guard.sql). CREATE OR REPLACE
      of api.service_rollback_fantasy_catalog: same signature, SECURITY DEFINER, SET search_path = '',
      identical PT403/PT404/PT409 stale_update/already-rolled-back/advisory-lock/PT409
      fantasy_catalog_in_use guard code, byte-identical existing deletes (fixture assignments, price
      history, price evidence, players, gameweeks, season, competition cleanup) and return shape,
      plus one new block inserted immediately after the fantasy_catalog_in_use guard: (1) delete
      app.fantasy_rankings where fantasy_season_id = the season; (2) delete
      app.fantasy_league_memberships joined to app.fantasy_leagues on league_id where the league's
      fantasy_season_id = the season; (3) count then delete app.fantasy_leagues where
      fantasy_season_id = the season, feeding a new declare removed_leagues integer. The returned
      jsonb's `removed` object gains one additive key, `leagues`; players/gameweeks/fixtures keys are
      unchanged. Nothing in the new block reads, writes or deletes app.fantasy_teams. The migration
      file carries an extensive header comment documenting the mutation_audit investigation and why
      no change was made for it. Revoke-all/grant-to-service_role footer for the function reissued
      identically to the original migration.
  - file: supabase/tests/database/fantasy_catalog_rollback_cleanup.test.sql
    description: >
      New pgTAP file, 18 assertions. Manual fixture: two independent Football/Fantasy seasons (A is
      rolled back, B only holds one live app.fantasy_teams row so a league membership of A's league
      can reference an existing team without A itself ever holding a team row, which the
      fantasy_catalog_in_use guard would otherwise forbid). Cases: (e) authorization — a
      request.jwt.claims role=authenticated caller gets PT403 forbidden; (d) a wrong expected source
      digest gets PT409 stale_update and changes nothing (league still present); (b) critical
      regression — inserting a live app.fantasy_teams row under season A itself still raises PT409
      fantasy_catalog_in_use, and afterward the team, league, membership, ranking and season rows for
      A are all still present, unchanged; (a) the fix — with zero teams under season A but one
      league + one membership + one ranking, rollback succeeds (alreadyRolledBack=false,
      removed.leagues=1) and all four (rankings, memberships, leagues, season) are gone for A, while
      season B's team is untouched; (c) a second rollback call on the same activation id
      short-circuits with alreadyRolledBack=true and raises nothing.
