mutation_audit_resolution: >
  See docs/engineering/tasks/BG-0032/engineering-brief.yaml findings for full reasoning and evidence.
  Summary: app_private.fantasy_mutation_audit has no foreign key to app.fantasy_seasons or
  app.fantasy_leagues (only to app.fantasy_teams and app.profiles, both ON DELETE RESTRICT), and the
  function's pre-existing PT409 fantasy_catalog_in_use guard already refuses to proceed unless zero
  app.fantasy_teams rows exist for the season; since this function never deletes app.fantasy_teams,
  no mutation_audit row can be referencing a team of that season once the guard has passed. Confirmed
  both from the migration source (which is authoritative for the fix) and by a read-only query
  against Production V2. No cleanup code was added for mutation_audit.

