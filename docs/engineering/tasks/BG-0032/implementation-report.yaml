unexpected_observations:
  - "The ledger's BG-0032 title also names app_private.fantasy_mutation_audit as a blocker alongside fantasy_leagues/fantasy_league_memberships. Verified this is not accurate (see mutation_audit_resolution above); the ledger update for this task notes the correction rather than silently dropping it."
  - "app.fantasy_rankings.league_id is nullable and app.fantasy_gameweeks (already deleted by the pre-existing code) has no relationship to leagues/rankings/memberships, so no ordering interaction exists between the new block and the pre-existing gameweek/player deletes; the new block was placed early (right after the guard) purely for readability, not because of any FK ordering requirement relative to the later deletes."
  - "A league's membership rows are not constrained at the database level to reference a team of the league's own Fantasy season — this is what makes the new pgTAP test's two-season fixture realistic without needing the full 240-player staging flow."

