changes:
  - file: .github/workflows/backend-quality.yml
    description: >
      RC-1. Both "Config integrity guard" steps now run
      `node scripts/backend/check-config-integrity.mjs`. Step names, comment blocks and
      positions (after setup-bun, before `bun install --frozen-lockfile`) unchanged; no other line touched.
  - file: .github/workflows/fantasy-authenticated-e2e.yml
    description: >
      RC-1: the "Config integrity guard" step moved from after `bun install` to immediately after
      setup-bun (before "Mask protected values") with run line
      `node scripts/backend/check-config-integrity.mjs` and a three-line comment. RC-3: new step
      "Guard credential presence per target" directly after "Guard target resolution", with
      step env STAGING_URL_SET / STAGING_KEY_SET / PRODUCTION_URL_SET / PRODUCTION_KEY_SET computed
      as `${{ vars.X != '' }}` / `${{ secrets.X != '' }}` booleans and EXPECTED_URL computed with the
      same dispatch-and-production predicate as the job-level VITE_SUPABASE_URL expression; the
      script runs under `set -euo pipefail`, switches on $FANTASY_E2E_TARGET (staging/production
      arms per the brief, plus a fail-closed `*)` arm), then `test -n "$EXPECTED_URL"` and
      `test "$VITE_SUPABASE_URL" = "$EXPECTED_URL"`. No key or URL value is echoed (only the target
      token). Triggers, job `if:`, environment `fantasy-e2e`, mask step, schedule-forces-staging
      test, the existing "Guard credential presence" step and the artifact upload set are unchanged.
  - file: scripts/backend/check-config-integrity.test.ts
    description: >
      RC-1b, additions only (24 -> 27 tests): new describe "guard invocation path (BG-0029)" asserts
      (a) both backend-quality.yml guard steps' run line is exactly
      `node scripts/backend/check-config-integrity.mjs`, (b) the same for
      fantasy-authenticated-e2e.yml plus guard index < `bun install --frozen-lockfile` index,
      (c) no .yml/.yaml file under .github/workflows contains `bun run config:integrity:check` or
      `bun scripts/backend/check-config-integrity.mjs`. `readdirSync` added to the node:fs import.
  - file: scripts/backend/check-config-integrity.mjs
    description: >
      RC-1c (optional): header usage comment (lines 13-16) and the usage string in `usage()` now
      say `node scripts/...`. RULES, scanText, resolveTargets, formatViolation, exit codes and the
      80-char echo are untouched (AT-3 historical payload still yields exactly 7 violations).
  - file: docs/qa/SECURITY_INCIDENT_2026_09_18_ESLINT_LOADER.md
    description: >
      RC-1c (optional): parenthetical at line 68 changed from "(`bun run config:integrity:check`)"
      to "(invoked by path with node in CI)". Nothing else.
  - file: tests/e2e/fantasy-league-cleanup.ts
    description: >
      RC-2, new helper. `createLeagueCleanup({ email, password })` builds a non-persisting
      supabase-js client from process.env.VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY (throws
      with a clear message if either is absent), signs in with `auth.signInWithPassword`, selects
      `.schema("api")`, resolves season id and team id from `rpc("fantasy_hub", { p_language: "fr" })`,
      and exposes `archiveLeague(id)` (rpc archive_fantasy_league(p_league_id, p_team_id); throws on
      error or when data !== true), `sweepE2ELeagues()` (rpc fantasy_leagues(p_season_id,
      p_visibility "private", p_limit 100); archives only items with role === "owner" AND name
      starting with "E2E Ligue "; returns the archived ids) and `dispose()` (local sign-out).
      Also exports `leagueIdFromUrl()` (pattern /\/fantasy\/leagues\/([0-9a-f-]{36})/) and
      `E2E_LEAGUE_NAME_PREFIX`. Nothing runs at import time; no email/token/key is ever logged.
  - file: tests/e2e/fantasy.journey.e2e.ts
    description: >
      RC-2, insertions only (0 removed lines; still 6 `test(` blocks; every existing `expect(`
      byte-identical). Inside the describe (under the same `hasUser` skip): module state
      `leagueCleanup` / `createdLeagueId` and a `test.afterEach` that is a no-op unless the league
      test set the state; when set it awaits `archiveLeague(createdLeagueId)` (a throw fails the
      test red), annotates `league-archived`, and always disposes the client. The league test now
      starts by creating the cleanup handle and running `sweepE2ELeagues()` (annotated
      `league-sweep`), asserts the generated name carries the sweep prefix, and after the detail
      navigation captures the id from `page.url()`, asserts it is non-null and annotates
      `league-id`. Skipped suite: `test.skip(!hasUser)` at describe level skips the tests and their
      hooks, so no cleanup code executes without credentials (verified by AT-4).
  - file: src/i18n/i18n-allowlist.ts
    description: >
      RC-4: comment lines 9-10 only, past tense: "That is deliberate: before BG-0024 repaired its
      copy, `profile.title` surfaced as a named W1/W2 warning, never absorbed." Exported objects,
      imports and every other line unchanged (git diff origin/main -- src/ shows exactly those two lines).

