  # ---------------------------------------------------------------- R3: presence per resolved target
  - classification: VERIFIED
    statement: >
      VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY are computed as
      `(dispatch && target=='production') && <production var/secret> || <staging var/secret>`.
      FANTASY_E2E_TARGET is computed independently as `dispatch && inputs.target || 'staging'`.
    evidence: ".github/workflows/fantasy-authenticated-e2e.yml:54,:62-63"
  - classification: INFERRED
    statement: >
      Under GitHub expression semantics an unset var/secret evaluates to '' which is falsy, so on a
      production dispatch with SUPABASE_PRODUCTION_URL or SUPABASE_PRODUCTION_PUBLISHABLE_KEY
      unset the `||` arm yields the staging value; the run is labelled production but exercises
      staging. Fails safe but silently mislabelled (review observation 3).
    evidence: "review-report.yaml:149-154; expression semantics not demonstrable in-repo"
  - classification: VERIFIED
    statement: >
      The existing "Guard credential presence" step only checks that the four resolved values are
      non-empty (`test -n`), which is satisfied by the staging fallback, so it cannot detect the
      mislabel. "Guard target resolution" only validates the target token.
    evidence: ".github/workflows/fantasy-authenticated-e2e.yml:74-91"
  - classification: INFERRED
    statement: >
      Presence of a secret can be asserted without exposing it by evaluating
      `${{ secrets.NAME != '' }}` into a step env boolean; vars can additionally be compared by
      value (`test "$VITE_SUPABASE_URL" = "$EXPECTED_URL"`) because vars are not secret. No
      workflow in the repository uses the `!= ''` idiom today (grep: no matches), so this has no
      in-repo precedent and must be exercised in the real environment.
    evidence: "grep \"!= ''\" over .github/workflows -> no matches"

