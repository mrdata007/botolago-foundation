root_cause:
  classification: VERIFIED
  description: >
    R1: BG-0020's brief prescribed the npm-script form; the guard therefore starts through two of
    the very files it scans (package.json resolves the script, the bun runtime reads bunfig.toml),
    and in fantasy-authenticated-e2e.yml it additionally runs after `bun install` hooks.
    R2: the journey test exercises league creation through the UI, the UI offers no owner-side
    removal, the owner cannot "leave" (role <> 'owner' guard), and BG-0020 explicitly deferred
    cleanup; the archive RPC exists but is not wired to any UI.
    R3: the URL/key env expressions use `cond && prod || staging`, whose fallback arm is taken
    whenever the production value is empty, while the target label is computed separately;
    the presence guard checks non-emptiness only.
    Comment: BG-0024 repaired the dictionary and the gate test but did not touch the prose in
    i18n-allowlist.ts (ledger BG-0024 remaining_risks already names it for BG-0029).

required_changes:
  - id: RC-1
    component: .github/workflows/backend-quality.yml (two run lines), .github/workflows/fantasy-authenticated-e2e.yml (guard step moved + run line)
    change: >
      backend-quality.yml: in BOTH jobs replace `run: bun run config:integrity:check` with
      `run: node scripts/backend/check-config-integrity.mjs`; keep the step name
      "Config integrity guard", its position (after setup-bun, before `bun install --frozen-lockfile`)
      and the comment block; change nothing else. Do not add actions/setup-node unless the first
      real run proves node absent (see unknowns).
      fantasy-authenticated-e2e.yml: move the "Config integrity guard" step to immediately after
      setup-bun (before "Mask protected values" is acceptable; it MUST precede
      `bun install --frozen-lockfile`) and change its run line to
      `node scripts/backend/check-config-integrity.mjs`. Every other step stays in its order.
    reason: >
      The guard must not be reachable through package.json or the bun runtime (bunfig.toml), and
      must run before any install hook, in every workflow that runs it.
  - id: RC-1b
    component: scripts/backend/check-config-integrity.test.ts (additions only)
    change: >
      Add assertions: (a) in backend-quality.yml every "Config integrity guard" step's `run:` line
      is exactly `node scripts/backend/check-config-integrity.mjs`; (b) the same for
      fantasy-authenticated-e2e.yml, and there the guard index is lower than
      `bun install --frozen-lockfile`; (c) no file under .github/workflows contains
      `bun run config:integrity:check` or `bun scripts/backend/check-config-integrity.mjs`.
      Keep all 24 existing tests.
    reason: Lock the hardening so a future edit cannot quietly reintroduce the routed invocation.
  - id: RC-1c (optional, cosmetic)
    component: scripts/backend/check-config-integrity.mjs lines 14-15 and 164; docs/qa/SECURITY_INCIDENT_2026_09_18_ESLINT_LOADER.md:67-71
    change: >
      Update the usage wording from `bun scripts/...` to `node scripts/...` and the incident doc's
      parenthetical from "(`bun run config:integrity:check`)" to "(invoked by path with node in CI)".
      No rule, exit code or output-format change; if touched, RULES/scanText/resolveTargets/
      formatViolation must be byte-identical in behaviour (the 24 tests and the RC-2-A2 fixture
      from BG-0020 must still pass).
    reason: Keep the documented invocation consistent with CI; strictly non-functional.
  - id: RC-2
    component: tests/e2e/fantasy.journey.e2e.ts (league test only) and a new helper tests/e2e/fantasy-league-cleanup.ts
    change: >
      Smallest safe option that uses only existing RPCs: archive from the test process.
      Helper (new file): build a supabase-js client from process.env.VITE_SUPABASE_URL /
      VITE_SUPABASE_PUBLISHABLE_KEY with `{ auth: { persistSession: false, autoRefreshToken: false } }`,
      authenticate as the synthetic manager (preferred: `auth.signInWithPassword` with
      E2E_FANTASY_EMAIL/PASSWORD; fallback if Auth settings block it: bearer token taken from the
      page's localStorage session and passed via `global.headers.Authorization`, as in
      src/lib/mcp/tools/get-fantasy-team.ts), select `.schema("api")`, resolve the team id via
      `rpc("fantasy_hub", { p_language: "fr" })` -> data.team.id, then expose:
        archiveLeague(leagueId): rpc("archive_fantasy_league", { p_league_id, p_team_id }) -> must return true / no error;
        sweepE2ELeagues(): rpc("fantasy_leagues", { p_season_id: hub.season.id, p_visibility: "private", p_limit: 100 })
          and archive every item with role === "owner" and name matching /^E2E Ligue /.
      Suite: in the "leagues: create, open detail, go back" test, capture the league id from
      page.url() after the detail navigation (pattern /\/fantasy\/leagues\/([0-9a-f-]{36})/), keep
      every existing assertion untouched, and in a `finally` (or test.afterEach scoped to this
      test) call archiveLeague(id) and assert it succeeded (a failed cleanup is a red test, not a
      log line). Run sweepE2ELeagues() once before creating the league (test start or a
      beforeAll under the same `hasUser` skip) so leagues left by earlier failed runs are
      archived too; assert it did not error. Never print emails, tokens or keys; league ids are
      fine to annotate via test.info().annotations. No mock/data-mode branches: the suite already
      only runs when credentials are injected, and VITE_SUPABASE_URL/KEY presence is a hard
      precondition of the cleanup (throw with a clear message if absent so CI goes red rather than
      leaking leagues).
    reason: >
      `archive_fantasy_league` is the only removal contract the API exposes to the owner; it hides
      the league from listings, standings and the scoring worker, so production is left free of
      accumulated E2E leagues without a schema change, a new RPC, or a service-role secret in CI.
      Deterministic reuse is impossible without changing src, and a service-side cleanup workflow
      (phase6-staging-cleanup.yml pattern) needs management-API credentials and is not the
      smallest option.
  - id: RC-3
    component: .github/workflows/fantasy-authenticated-e2e.yml ("Guard target resolution" step, or a new step directly after it)
    change: >
      Add step-level env computed by expressions that never carry secret values:
        STAGING_URL_SET: ${{ vars.SUPABASE_STAGING_URL != '' }}
        STAGING_KEY_SET: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY != '' }}
        PRODUCTION_URL_SET: ${{ vars.SUPABASE_PRODUCTION_URL != '' }}
        PRODUCTION_KEY_SET: ${{ secrets.SUPABASE_PRODUCTION_PUBLISHABLE_KEY != '' }}
        EXPECTED_URL: ${{ FANTASY_E2E_TARGET == 'production' && vars.SUPABASE_PRODUCTION_URL || vars.SUPABASE_STAGING_URL }}
          (write it with the same `github.event_name == 'workflow_dispatch' && inputs.target == 'production'` predicate used on line 62, not with the env name)
      and under `set -euo pipefail`:
        case "$FANTASY_E2E_TARGET" in
          staging)    test "$STAGING_URL_SET" = "true";    test "$STAGING_KEY_SET" = "true" ;;
          production) test "$PRODUCTION_URL_SET" = "true"; test "$PRODUCTION_KEY_SET" = "true" ;;
        esac
        test -n "$EXPECTED_URL"
        test "$VITE_SUPABASE_URL" = "$EXPECTED_URL"
      Keep the existing schedule-forces-staging test and the existing "Guard credential presence"
      step unchanged. Do not echo any key; echoing the resolved URL host is acceptable (vars are
      not secret and the existing step already echoes the target).
    reason: >
      A production dispatch with a missing production var/secret currently runs against staging
      under a "production" label; this makes it a red run at the guard step.
  - id: RC-4
    component: src/i18n/i18n-allowlist.ts lines 9-10 (comment text only)
    change: >
      Replace "That is deliberate — `profile.title` stays a named W1/W2 warning until BG-0024
      replaces its English placeholder copy." with wording in the past tense that keeps the
      design rationale, e.g. "That is deliberate: before BG-0024 repaired its copy,
      `profile.title` surfaced as a named W1/W2 warning instead of being absorbed." No change to
      IDENTICAL_ALLOWED / NO_ARABIC_SCRIPT_ALLOWED, no import change, no other line.
    reason: The comment describes a defect that no longer exists; comment-only follow-up recorded by the BG-0024 ledger entry.

constraints:
  - The six existing `test(` blocks and every existing assertion in tests/e2e/fantasy.journey.e2e.ts remain (league creation is still exercised through the UI); only additions.
  - No credential VALUES anywhere; only secret/variable names. No new secrets or variables are introduced by RC-1..RC-4 (RC-3 reads names that already exist in the workflow).
  - No new RPC, migration, policy or schema change; cleanup uses api.archive_fantasy_league and api.fantasy_leagues / api.fantasy_hub as they exist.
  - The guard's scanned set, rules, exit codes and 80-char echo are unchanged.
  - fantasy-authenticated-e2e.yml keeps exactly the triggers workflow_dispatch and schedule, the job `if:`, the environment `fantasy-e2e`, the mask step, the schedule-forces-staging test and the narrowed artifact upload set.
  - src/** is untouched except the comment at src/i18n/i18n-allowlist.ts:9-10.
  - Sweep filter is owner-only and name-prefixed (`E2E Ligue `); it must never archive a league the synthetic account merely joined.

risks:
  - "MEDIUM (R1): if `node` is not on PATH on the runner, both backend-quality jobs fail at the guard step on every PR. Detectable on the first PR run; remedy is a pinned actions/setup-node step placed before the guard (still before bun install). Not expected on ubuntu-latest."
  - "MEDIUM (R2): the archive call runs with the synthetic manager's credentials from the Playwright process; if Auth blocks the second sign-in, the league test fails red after its assertions passed. Mitigation: bearer-token fallback documented in RC-2; a red run is preferable to silent accumulation."
  - "LOW (R2): each cleanup writes one app_private.fantasy_mutation_audit row (operation 'archive_league') and archived league rows remain (soft delete). Both are bounded to one row per run; app_private.fantasy_idempotency_keys rows expire after 30 days by design. Hard deletion is not available through the API and out of scope."
  - "LOW (R2): the sweep could archive an owner's league whose name legitimately starts with 'E2E Ligue ' on a production account; the account is synthetic and dedicated, so exposure is nil in practice."
  - "LOW (R3): `secrets.X != ''` semantics cannot be exercised without the fantasy-e2e environment; if the expression behaves differently than assumed the guard fails closed (red), never open."
  - "LOW (all): a CI-visible failure of the new workflow assertions is the intended loud behaviour; none of the changes can make a previously red condition green."

contradictions:
  - "BG-0020's implementation_scope listed tests/e2e/** as forbidden; BG-0029 R2 cannot be satisfied without touching the suite (the UI offers no removal path). The BG-0020 review and the ledger both name league cleanup as a follow-up to this task, so tests/e2e/fantasy.journey.e2e.ts is allowed here, additions only."
  - "The BG-0020 brief specified the npm-script form that R1 now removes; this is the hardening the review itself recommended, not a deviation."
  - "scripts/qa/i18n-gate.ts:31-32 carries the same stale profile.title prose as the allowlist; the task names only the allowlist lines, so the gate comment is left as an observation for Chief."

unknowns:
