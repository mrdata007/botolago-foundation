researched_commit: 1603c1c (origin/main, read-only worktree /home/user/research-main)
objective: >
  Hardening follow-ups from the BG-0020 review, all P2, area e2e:
  R1 invoke scripts/backend/check-config-integrity.mjs by path with node (not through
  package.json/bunfig.toml) in every workflow that runs it;
  R2 stop the authenticated Fantasy E2E suite from accumulating one league per run in the
  target Supabase project;
  R3 make the fantasy-authenticated-e2e workflow assert credential presence per RESOLVED
  target so a missing production var/secret can no longer silently fall back to staging while
  the run is labelled "production";
  plus one comment-only item: src/i18n/i18n-allowlist.ts lines 9-10 still describe
  profile.title as a pending BG-0024 defect although BG-0024 is merged.

