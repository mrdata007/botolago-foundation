  - "AT-9 (R2 live): archive/sweep against staging via a real dispatch; requires the fantasy-e2e GitHub Environment (BG-0028) and credentials the Verifier must not use. NOT_TESTABLE. The archive RPC contract (returns boolean, owner-only) is taken from the brief's Researcher findings, not exercised."
  - "AT-10 (R3 live): `secrets.X != ''` evaluation for an unset secret and the URL pin on a real production/staging dispatch. NOT_TESTABLE without the environment; shell half of the guard is proven fail-closed locally."
  - "AT-11 (R1 live): `node` present on PATH on the GitHub-hosted runner. NOT_TESTABLE locally (node v22.22.2 here proves the script runs under node, not runner availability). If absent, both backend-quality jobs go red on the first PR run — loud, not silent."

security_observations:
  - "No secret value can be echoed by the new step: the step env holds only the strings 'true'/'false' for the four presence booleans plus EXPECTED_URL, which is a vars.* value (not a secret); the only echo prints $FANTASY_E2E_TARGET. Keys are never placed in a shell comparison that could surface in `set -x` output (no -x is enabled)."
  - "Presence-guard bypass analysis: (1) a production dispatch with SUPABASE_PRODUCTION_URL or _PUBLISHABLE_KEY empty -> PRODUCTION_*_SET='false' -> red (locally replayed). (2) production URL set but key empty -> job-level key silently falls to staging key, but PRODUCTION_KEY_SET='false' -> red. (3) The one residual way the guard passes while the run is effectively staging: SUPABASE_PRODUCTION_URL and _PUBLISHABLE_KEY both SET but populated with the staging project's values (a misconfiguration of the environment values, not a missing value). The brief scopes R3 to missing values; recording as a known limit, not a defect. (4) If GitHub rendered `secrets.X != ''` as anything other than the literal `true` (unknown #5 in the brief) the guard fails closed."
  - "The helper includes `signIn.error.message` and RPC `error.message` in thrown errors; Supabase auth/PostgREST error messages do not carry the submitted password or key, and Playwright attaches those messages to the report artifact (playwright-report is uploaded). Low risk; noted because the artifact set is public to repo collaborators."
  - "Sweep is bounded to `p_limit: 100` private leagues per run; if more than 100 stale E2E leagues ever accumulate, one run archives at most the first page. Bounded, not a security issue; subsequent runs drain the rest."
  - "AT-8's literal secret-shape grep returns 2 over origin/main...HEAD solely because the Builder's implementation-report.yaml quotes the grep patterns (`sb_secret_`) as command text. Not a credential; a future gate that runs the same grep over docs/engineering/tasks/** will trip on process artifacts that quote it."
  - "Unchanged from BG-0020 (observation only, outside scope): the unit test harness still spawns the guard with `bun <script>` for its CLI tests; that is a test subprocess, not a CI invocation, and RC-1b (c) is scoped to .github/workflows."

