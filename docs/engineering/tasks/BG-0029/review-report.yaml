# ------------------------------------------------------------------ judgement on the points raised
judgements:
  helper_review: >
    tests/e2e/fantasy-league-cleanup.ts: requireEnv throws by NAME before any client is built (credential absence -> red,
    not a leaked league); client is non-persisting (persistSession/autoRefreshToken/detectSessionInUrl false);
    signInWithPassword as preferred by RC-2; `.schema("api")`; archiveLeague throws on error and on `data !== true`;
    sweep is owner-only AND prefix-gated; no console/stdout/stderr anywhere; thrown messages carry env names, RPC names,
    league ids and upstream error text only, never email/password/key/token. Nothing executes at import.
    Suite: afterEach is state-gated (`if (!cleanup) return`), archives inside try with dispose in finally, a throw
    fails the test; sweep runs before creation and an error throws; annotations carry counts and league ids only;
    every pre-existing line byte-identical; serial mode + workers 1 in CI keep the module state single-writer.
    Meets RC-2 and the constraints.
  security_observation_error_messages_in_report: >
    ACCEPTED, not a defect. The helper interpolates `signIn.error.message` / RPC `error.message` into thrown errors,
    which Playwright renders into the uploaded playwright-report. Supabase Auth and PostgREST error messages do not
    echo the submitted password, publishable key or access token (they carry codes/text such as
    'Invalid login credentials' or 'league_access_denied'); the project URL is not interpolated either. The brief
    forbids printing emails, tokens and keys and explicitly allows league ids; this is honoured. Trace is already
    'off' when E2E_FANTASY_EMAIL is set (playwright.config.ts). Residual is low and recorded below.
  r3_residual_values_misconfigured: >
    OUT OF SCOPE for this brief. R3's objective and RC-3 are scoped to a MISSING production var/secret silently
    falling back to staging under a 'production' label; the new step makes that a red run and additionally pins
    VITE_SUPABASE_URL to the target's own variable. A production var/secret that is SET but populated with the
    staging project's values is an environment-value misconfiguration the brief does not ask to detect and that
    cannot be detected without knowing the projects' identities (forbidden: any Supabase project setting or data).
    Recorded as a residual risk for the environment owner (BG-0028), not a defect.
  at8_literal_grep_two_hits: >
    ACCEPTED, criterion intent holds. The 2 hits are both in docs/engineering/tasks/BG-0029/implementation-report.yaml
    (lines 220 and 249 of the diff) where the Builder quotes the AT-5 and AT-8 command lines verbatim; the matched
    text is the grep pattern token `sb_secret_` itself, followed by a quote, not a credential value. The brief's own
    AT-5 text contains the same token, so any faithful implementation report trips AT-8's literal grep: the
    criterion is self-referential when applied to the process artifact it also allows. Over every non-process file
    the count is 0, and at the code commit 4eb6348 it is 0. The Verifier recorded the raw count rather than hiding
    it; no secret value is present anywhere in the change. Not softened: a hit in a code or workflow file would
    have been a FAIL.
  rc3_extra_default_arm: >
    The `*)` case arm (exit 1) is an addition to the brief's sketch. It only tightens (a token outside
    staging/production is already rejected by the preceding step); it cannot turn a red condition green. Acceptable.
  rc1_guard_before_mask_step: >
    The guard now runs before 'Mask protected values'. RC-1 explicitly allows this placement. The guard prints only
    file paths and up to 80 chars of violating lines from tracked configuration files, never environment values, so
    ordering relative to the mask step does not expose a secret.

