residual_risk:
  - >
    HIGHEST: the migration has never been executed. It needs at minimum a
    `supabase db reset` on a Docker-capable machine before promotion.
  - >
    src/backend/generated/database.types.ts was edited by hand against its own
    "do not edit" header. Regenerate and diff.
  - >
    The decision to expose another manager's display_name to authenticated
    callers is a policy judgement, not a verified fact. See the
    open_question_for_the_reviewer block in engineering-brief.yaml.
  - >
    overallBoard() fetches the whole board client-side, bounded at 20 pages of
    100 (2000 teams), matching the existing player-pool bound. Beyond that the
    board silently truncates. With 7 teams in production this is not a launch
    risk, but it is the natural follow-up once the season grows: move sort,
    search and paging server-side and stop walking the cursor in the browser.
