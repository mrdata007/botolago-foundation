    - ok 2 - a title naming one club produces exactly one story_teams row
    - ok 3 - and that one row is the club the title actually names
    - ok 4 - a title naming two clubs records both rather than guessing one
    - ok 5 - a two-club story therefore never yields a single-club result
    - ok 6 - and the two rows are the two clubs the title names
    - ok 7 - a title naming no club gets no row — "المغرب" alone is the country
    - ok 8 - a club with no current-season membership gets no association invented
    - ok 9 - the unqualified الفتح does not match FUS Rabat
    - ok 10 - across the fixture the seed writes exactly the three rows it should
    - ok 11 - re-running the seed inserts no new row
    - ok 12 - and leaves every existing row, created_at included, untouched
  synced_copy_check: >
    The seed body inside the test and the body in the migration were compared
    programmatically and are byte-for-byte identical.
  harness_sanity_check: >
    supabase/tests/database/news_domain.test.sql was run unchanged on the same
    local cluster: 19 ok, 0 not ok. The harness executes the repository's
    existing suites faithfully.
  authority: >
    CI's Backend quality `database-quality` job runs the suite on the pull
    request and is the authority. The numbers above are from the local cluster.

# ---------------------------------------------------------------------------
# Does the crest branch actually fire? Two halves, both executed.
# ---------------------------------------------------------------------------
crest_branch_evidence:
  half_1_database:
    what: >
      On the local cluster, a production-shaped fixture was inserted inside a
      transaction: a current season, Wydad Casablanca and Raja Casablanca with
      current-season squad rows, and two PUBLISHED, HERO-LESS Arabic editions
      copied verbatim from production — one naming Raja only, one naming Raja
      and Wydad. supabase/migrations/20260921220000_story_teams_seed.sql was
      then executed as a FILE (\i of the real migration, not a retyped copy),
      and api.news_feed('ar', 10, …) was called as the `anon` role.
    before: app.story_teams = 0 rows
    after: >
      3 rows — (single-club story → Raja Casablanca) and (two-club story → Raja
      Casablanca, Wydad Casablanca).
    api_news_feed_anon_result:
      - title: الرجاء يتجه للاستغناء عن ساخو لتسجيل البرازيلي فيليبينهو
        hero: null
        teamIds_length: 1
      - title: استدعاء الزاكي لشرارة والرشدان يربك حسابات الرجاء والوداد قبل انطلاق البطولة
        hero: null
        teamIds_length: 2
    conclusion: >
      The seeded row reaches the browser payload. `hero: null` is what makes
      MediaImage show the placeholder; `teamIds` of length 1 is exactly the
      `clubIds` that ArticleHeroFallback tests with `clubIds?.length === 1`.
      The transaction was rolled back; nothing persisted, and nothing was run
      against production.
  half_2_browser:
    what: >
      NEWS_ENABLED was flipped to true in the working tree (NOT committed — the
      commit was confirmed clean of it), the Vite dev server was started, and
      headless Chromium from /opt/pw-browsers (PLAYWRIGHT_BROWSERS_PATH; no
      `playwright install` was run) loaded /news and inspected every
      [data-article-hero-fallback] element in the real DOM.
    observed:
      - mode: crest
        crest_title: RS Berkane
        card: "Mercato : Berkane finalise un attaquant ivoirien"
        clubIds_length: 1
      - mode: crest
        crest_title: AS FAR
        card: "Analyse tactique : la pressing haute de l'AS FAR"
        clubIds_length: 1
      - mode: crest
        crest_title: Raja CA
        card: "Interview : « Le Raja doit retrouver son ADN offensif »"
        clubIds_length: 1
      - mode: wordmark
        card: "Le Wydad relance la course au titre après le derby"
        clubIds_length: 2
      - mode: wordmark
        card: "Fantasy : les meilleurs choix pour la journée 14"
        clubIds_length: 2
    page_errors: none
    conclusion: >
      On a hero-less article with exactly one club the component renders
      data-article-hero-fallback="crest" and mounts ClubCrest for that club; on
      a hero-less article with two clubs it renders "wordmark". The branch
      fires, and it declines on ambiguity, in a real browser.
  honest_limitation: >
    The two halves were proven separately rather than as one chain. There is no
    PostgREST in this sandbox, so the browser could not be pointed at the local
    PostgreSQL cluster; the browser half ran against the app's mock data source,
    which supplies clubIds in exactly the shape half 1 showed api.news_feed
    produces. What is NOT demonstrated end to end in one process is the wire
    between PostgREST and the React tree — that wire is unchanged by this task
    and is exercised by the existing journeys.

