could_not_verify:
  - >
    Whether the migration's insert is permitted in production without a new RLS
    policy was established by reading pg_roles (postgres has rolbypassrls =
    true) and by the precedent of the direct UPDATE in
    20260921170000_news_stand_down.sql, not by executing a write. If promotion
    fails on RLS, that is the place to look.
  - >
    The Arabic alias for CODM Meknès is unconfirmed (see known_false_negatives).
    It matches nothing today.
  - >
    Everything above is the shape of production as of 2026-09-21. Ingestion
    keeps running (it simply no longer publishes), so the corpus will have grown
    by the time the migration is promoted and the seeded count will be higher
    than 23. The seed is not pinned to 23 anywhere; it matches whatever is
    present when it runs.

recommendation: >
  Seed it. 23 rows from 108 stories is a low yield, but the yield is low because
  the corpus is mostly not about Botola Pro clubs, not because the matching is
  weak: all 23 rows were reviewed against their titles and none is wrong. Two of
  the 17 single-club rows are marginal in editorial terms (a player interview
  and a rival coach's quote), and on both the crest shows a club the headline
  genuinely names, which is the bar the crest has to clear. The migration is
  inert until News is switched back on, and re-running it is a no-op, so the
  cost of being wrong later is a follow-up DELETE of 23 rows.
