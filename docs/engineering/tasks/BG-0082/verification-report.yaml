  docker_available: false
  supabase_cli_usable: false
  substitute: >
    A PostgreSQL 16.13 cluster was initdb'd locally, postgresql-16-pgtap was
    already present in the image, and all 73 files under supabase/migrations
    were applied in order to a fresh database — including
    20260921220000_story_teams_seed.sql — plus minimal local stand-ins for the
