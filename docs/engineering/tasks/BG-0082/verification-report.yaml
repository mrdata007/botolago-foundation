false_positives_found: >
  None. All 23 rows were read one by one against their titles; every one names
  the club it is mapped to. There is no row where the crest would show a club
  the headline does not mention.

known_false_negatives:
  - title: بطائق الاشتراك السنوية للرجاء الأغلى في البطولة دون مباراة الديربي
    why: >
      "للرجاء" carries the attached preposition ل, so "الرجاء" is not a
      substring. This is the cost of not stemming Arabic prefixes. Missing a
      crest is the cheap failure and it was chosen deliberately.
  - scope: >
      88 stories match nothing. That is the honest shape of the corpus, not a
      defect: the great majority are about foreign leagues, the national team,
      Moroccan players abroad or football governance, and name no Botola Pro
      club at all. Nine current-season clubs (Amal Tiznit, CODM Meknès,
      CR Khemis Zemamra, Ittihad Tanger, Kawkab Marrakech, UTS Rabat,
      Widad Témara, Difaâ El Jadida, FUS Rabat) appear in no title in the
      corpus and therefore get no rows.
  - club_name_confidence: >
      The Arabic alias for CODM Meknès ("النادي المكناسي") is the one alias
      this builder is not fully confident of. It matches nothing in the current
      corpus, so it costs nothing today; it is flagged so a reviewer who knows
      the club can correct it in a later migration rather than assume it was
      checked.

traps_explicitly_handled:
  wydad_short_name_WCA: >
    Never read. short_name and code are not matched on at all.
  zemamra_name_code_disagreement: >
    Never read. 'CR Khemis Zemamra' is matched by its Arabic name
    ("نهضة الزمامرة" / "الزمامرة") and the Latin token "Zemamra", not by 'RCAZ'.
  saudi_al_fateh: >
    The corpus contains "…أمام الفتح" (the SAUDI club). The bare token الفتح is
    not an alias, so FUS Rabat is not matched. Asserted in the pgTAP suite.
  morocco_vs_clubs: >
    "المغرب" alone means Morocco and appears in many national-team headlines.
    Only "المغرب الفاسي" and "المغرب التطواني" are aliases. Asserted.
  widad_temara_vs_wydad_casablanca: >
    Wydad Casablanca is matched on "الوداد" (with the definite article), which
    is not a substring of "وداد تمارة". The two clubs cannot cross-match.
  french_short_codes: >
    The French title "Barrages Botola Pro: D2 Jour de vérité pour le RCOZ et le
    KAC" matches nothing, as it should: neither club is in the current season
    and no code is matched on.

