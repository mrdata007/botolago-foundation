    reference (anon/authenticated/service_role/authenticator,
    auth.users/sessions/mfa_factors/identities, auth.uid()/jwt()/role()/email(),
    storage.buckets/objects and storage.foldername/filename/extension). This is
    the same approach BG-0043 documented. It is not `supabase db reset`; it is
    the same migration set on the same major version, and it is stated as such.
  migrations_applied: 73
  result: the whole set applied with no error

