    rendering) is untouched by this task and was not exercised.
security_observations:
  - >
    No new dependency, no network access, no secrets read. The script's filesystem access is
    read-only (Bun.Glob scan + Bun.file text reads under src/) and it exits via process.exit
    only under `import.meta.main`, so importing it from tests has no side effects.
  - >
    Non-blocking robustness note (not a criterion failure): buildUsageIndex defaults to the
    relative root "src", so both the CLI and the test depend on being run from the repo root.
    Invoked from another cwd the glob would match nothing, W3 would jump to 985 and W4 to 0,
    and the gate would fail loudly rather than pass silently - fail-safe, but worth a note.
  - >
    src/i18n/__fixtures__/broken-dictionary.ts ships inside src/ and is imported by
    scripts/qa/i18n-gate.ts at module top level. It is not referenced by any application
    entry point, so it cannot reach the app bundle; it carries no secrets, only synthetic
    fixture strings.
