    The gate is not wired into any CI workflow file as a standalone step; it reaches CI only
    through `bun run test` discovering src/i18n/i18n-gate.test.ts (verified locally). No CI
    run was executed on this branch, so green CI is inferred from the local full-suite run,
    not observed.
  - >
    The brief's original control "app.name removed from the allow-list -> W1=7 -> exit 1" was
    not tested as written; per Chief scope decision (2) the replacement control was tested
    instead and passes. Whether the count-vs-suppress semantics is the product-desired one is
