unresolved:
  - >
    Acceptance control "app.name removed from the allow-list -> W1=7 > 6 -> exit
    1" cannot hold under the committed baselines and was not implemented as
    written. W1=6 and W2=5 are raw counts of the findings themselves (measured:
    6 identical fr/ar pairs, 5 ar values with no Arabic script), and all five
    W1 findings plus auth.email_placeholder are allow-listed. If the allow-list
    subtracted from the count, W1 would be 1 and W2 would be 0, contradicting
    both committed baselines. The gate therefore counts findings and lets the
    allow-list annotate them (suppressed with justification vs reported by
    name), which is also what "W1=6, five suppressed as allow-listed,
    profile.title reported" in the brief describes. Removing app.name from
    IDENTICAL_ALLOWED leaves W1=6 and the gate passing, but app.name becomes a
    second named warning next to profile.title; that observed behaviour is
    pinned by a test with the discrepancy explained in a comment. Chief should
    confirm this reading or re-specify the control.
unexpected_observations:
  - >
    src/i18n/dictionaries.ts profile.title is "Profile\n\n" in both fr and ar
    (English copy, two trailing newlines). Already known and owned by BG-0024;
    left untouched, and it is the single named W1/W2 warning the gate prints.
  - >
    The static prefix scan finds 10 template prefixes, not the 9 in the brief,
    because "fantasy.chip.state." nests inside "fantasy.chip.". Key coverage is
    unaffected — W3 measured 237, exactly the committed baseline.
scope_deviations:
  - package.json script omitted by Chief instruction
  - >
    W4 is defined as "t() call sites whose argument is not a literal key",
    counting enumerable template-prefix sites (37) together with fully opaque
    expressions (63) = 100, which reproduces the committed baseline exactly and
    matches the Researcher's wording "100 t() call sites with non-literal
    arguments". Counting only fully opaque sites would give 63 and miss the
    baseline.
  - >
    The usage index excludes all of src/i18n/ rather than naming
    dictionaries.ts, the allow-list and the fixtures individually. The only
    other file there, provider.tsx, contains no key literals, so the measured
    counts are identical; the broader rule keeps the gate's own test file from
    making keys look reachable by quoting them in assertions.
  - >
    E6 is implemented as "allow-listed key is not a dictionary key" (the runtime
    counterpart of the typecheck guard), the case the brief's negative control
    exercises. An allow-list entry whose underlying condition no longer applies
    is not treated as an error; NO_ARABIC_SCRIPT_ALLOWED keeps language.arabic
    and news.language.ar as the brief specified even though both already contain
    Arabic script.
