commits:
  - "BG-0014: i18n gate script, typed allow-list, broken fixture and CI test"
  - "BG-0014: implementation report"
changes:
  - file: scripts/qa/i18n-gate.ts
    description: >
      New. Pure `auditI18n(dicts, usage, allow, baselines)` plus a CLI wrapper
      (`bun scripts/qa/i18n-gate.ts`, and `--fixture` to audit the broken
      fixture) that prints a report and exits 1 on any failure. Errors E1 key in
      one language only, E2 empty/whitespace value, E3 placeholder-token set
      differs, E4 unbalanced or repeated {accent} span, E5 literal t("…") key
      absent from the dictionary, E6 stale allow-list entry (allow-listed key is
      not a dictionary key). Warnings W1 identical fr/ar values, W2 ar values
      with no Arabic script, W3 keys unreferenced in src/, W4 non-literal t()
      call sites, each ratcheted against a committed exact-equality baseline in
      the exported `BASELINES`. Usage index is built with Bun.Glob over
      src/**/*.{ts,tsx}, classifying each t() argument as LITERAL, TEMPLATE
      (static prefix ending in "." or "_") or OPAQUE, and additionally
      collecting every quoted string literal for W3 reachability. No new
      dependency. The header documents the exact-equality ratchet and the
      "never wire W3 to deletion" rule.
  - file: src/i18n/i18n-allowlist.ts
    description: >
      New. IDENTICAL_ALLOWED (app.name, language.french, language.arabic,
      news.language.ar, notfound.code) and NO_ARABIC_SCRIPT_ALLOWED (those five
      plus auth.email_placeholder), each entry carrying a justification string,
      both `as const satisfies Partial<Record<TranslationKey, string>>` so a
      renamed or deleted dictionary key breaks `bun run typecheck`.
      profile.title is deliberately not allow-listed and therefore stays a named
      W1 and W2 warning.
  - file: src/i18n/__fixtures__/broken-dictionary.ts
    description: >
      New. Hand-written two-language fixture (not derived from the real
      dictionary) injecting E1 fixture.only_fr, E2 fixture.empty, E3
      fixture.placeholder, E4 fixture.accent and one W1 fixture.identical, plus
      the fixture's own baselines so the fixture run reports only the injected
      defects.
  - file: src/i18n/i18n-gate.test.ts
    description: >
      New. 21 bun:test cases in four describes — "current tree" (0 errors, every
      warning count exactly equal to its committed baseline, gate passes,
      profile.title reported by name, allow-listed keys suppressed with
      justifications, every literal t() key resolves), "broken fixture" (exactly
      the injected E1..E4 with their keys, exactly one W1, gate fails),
      "negative controls" (E1..E6 each provoked in memory, W1 and W3 baseline
      drift each failing the gate, allow-list entry removal changing visibility)
      and "usage classification" (argument classifier and source indexer).
      Discovered by the existing `bun run test` CI step.
