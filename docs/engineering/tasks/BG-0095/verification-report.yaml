    evidence: "Tapping a selected club or position chip clears it; the active sort chip flips direction."
  - item: "Wydad renders as 'WCA' everywhere"
    status: "LAYOUT MADE SAFE, data untouched"
    evidence: >
      The grid row now reads 'WCA Wydad Casablanca' instead of 'WCA WCA', via a
      general do-not-print-the-same-string-twice rule, not a special case. The
      underlying `short_name` row is left to the separate data fix.
  - item: "Difficulty grid header shows only '27 sept.'"
    status: FIXED
    evidence: "Reads '24–27 sept.' / '24–27 شتنبر', locale-formatted, MATCH_TIME_ZONE-pinned."
  - item: "No price filter on /fantasy/players"
    status: FIXED
    evidence: "A `UiSelect` price-max filter with bands derived from the pool's own 4.7–12.0 range."
  - item: "No asc/desc toggle on the sort control"
    status: FIXED
    evidence: "Tapping the active sort flips direction; the chip carries an arrow and an sr-only description of the current order."
  - item: "React #418 on /fantasy/players/$playerId"
    status: FIXED
    evidence: >
      Root cause identified as the missing SSR query bridge in src/router.tsx —
      the loader warms a cache that only exists server-side, so the server
      rendered a populated page and the client's first render rendered the
      loading state. Fixed by carrying the player through router loader data
      (which IS serialized) as `initialData`, making both first renders
      identical. No page errors in any of the 32 player-detail passes.
  - item: "Do club ids resolve on the Supabase path?"
    status: ANSWERED
    evidence: >
      Yes, perfectly: 0 of 16 pool `footballTeamId` values and 0 of 14
      `FixtureDifficulty.clubId`/`opponentClubId` values fail to match
      `football_team_catalog`. The mismatch is mock-only. The real production
      gaps are null colours (all 21) and null `code` (13 of 21), which is why
      club identity in this lane leans on the crest and the name.

