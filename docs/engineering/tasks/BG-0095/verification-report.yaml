task_id: BG-0095
lane: "D — leagues, rankings, fixtures/FDR and the player screens"
branch: bg-0095-leagues-players

method:
  problem: >
    Two things stopped a straightforward browser run against production. The
    frontend on this branch calls `api.fantasy_player_season_stats` and
    `api.fantasy_gameweek_summary`, neither of which is deployed on the
    production project (both PGRST202), so /fantasy/fixtures and the player
    screens resolved to their error state. Separately, the sandbox's egress
    relay drops Supabase tunnels mid-exchange under a browser's parallel load
    ("tunnel closed (code 1006) after 36s", recorded by the proxy itself), so
    even the reachable RPCs were unreliable from Chromium.
  approach: >
    The real production payloads were captured once over plain HTTPS, where
    single requests do succeed, and then served to the running app at the
    BROWSER EDGE via Playwright request interception. The app, the router, the
    query layer and every component are the real ones; only the network answer
    is pinned. The two undeployed RPCs are answered with their contract's
    documented pre-season shape (`items: []`, `form: null`, `averagePoints:
    null`), which is the state production is actually in.
  fidelity_check: >
    Before any code changed, this harness reproduced the brief's independently
    measured production defect EXACTLY: /fantasy/players rendered a document
    37,191px tall at a 390px viewport, matching the brief's figure to the pixel.
    The difficulty grid rendered 14 team rows with the header reading "27 sept.",
    also as reported. That agreement is what licenses the after-numbers below.
  captured_payloads:
    - "api.fantasy_hub — season 2026/2027, gameweek 1, deadline 2026-09-24T18:30:00Z, rankingAvailable false"
    - "api.fantasy_fixture_difficulty — 14 rows, all gameweek 1"
    - "api.fantasy_player_pool — 6 keyset pages, 539 players, 16 distinct clubs"
    - "api.football_team_catalog — 21 clubs"
    - "api.fantasy_top_players (gw1) — [] (empty, which is the defect)"
    - "api.fantasy_gameweeks, api.fantasy_leagues, api.fantasy_rules"
  environments:
    - "Production-shaped: vite dev on port 4272 with production Supabase config, payloads pinned as above."
    - "Mock: vite dev on port 4271 (VITE_*_MODE=mock) for the auth-gated league screens and for tables with enough rows to exercise truncation."
  ports: >
    4271 and 4272. Port 4173 (playwright.config's default) was never bound —
    sibling lanes hold it, and every run passed an explicit base URL.
  browser: "Chromium from /opt/pw-browsers via PLAYWRIGHT_BROWSERS_PATH. `playwright install` was never run."

