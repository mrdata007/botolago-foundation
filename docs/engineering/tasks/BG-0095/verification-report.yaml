seven_fixture_assertion:
  status: PASS
  what_was_asserted: >
    /fantasy/fixtures renders exactly 14 `[data-fdr-fixture]` cells in the GW1
    column across 14 team rows. Fourteen club-cells is seven fixtures, because
    the grid gives each fixture one cell per club.
  combinations: "16 (fr/ar x light/dark x 390/430/768/1440) — 14/14 in every one"
  fixtures_named:
    - "Amal Tiznit v Ittihad Tanger"
    - "CODM Meknès v Difaâ El Jadida"
    - "CR Khemis Zemamra v Maghreb Fès"
    - "FUS Rabat v UTS Rabat"
    - "Hassania Agadir v Kawkab Marrakech"
    - "Moghreb Tétouan v RSB Berkane"
    - "Widad Témara v Wydad Casablanca"
  postponed_match: >
    FAR Rabat and Raja Casablanca appear in NEITHER the fixture list nor the
    difficulty grid: the 14 team rows are the 14 other clubs. Both clubs do have
    players in the pool (31 and 33), and both are correctly offered in the
    players-screen club filter — the postponement removes their GW1 fixture, not
    the clubs. A FAR Rabat player's detail page renders its Calendrier tab empty,
    which is the same fact reaching the same conclusion by a second route.
  why_it_cannot_regress: >
    The grid emits one marker per service row, with no padding, no filtering and
    no count assumption anywhere in the file. A stale frontend assumption cannot
    reintroduce the match because there is no assumption to go stale.
  cross_checked_against_source: >
    The same census was run directly against api.fantasy_fixture_difficulty over
    plain HTTPS: 14 rows, all gameweek 1, 7 distinct fixtures, FAR and Raja
    absent. The rendered grid and the RPC agree.

