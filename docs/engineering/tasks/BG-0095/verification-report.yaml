    list's watch and compare buttons, and the pagers.

contrast:
  requirement: ">= 4.5:1, measured from rasterised sRGB"
  method: >
    Two passes per page: the page as it renders, then the same page with every
    glyph painted transparent. A pixel that differs between them is a glyph
    pixel, and the second pass at that coordinate is the true background behind
    it — compositing, gradients and overlapping sticky columns included. The
    reported figure is the 95th percentile of the per-pixel ratios inside each
    element, which lands on the glyph core and discards the antialiased ramp.
    A first attempt that took percentiles of the whole element crop was
    discarded as unsound: a three-letter chip has too few glyph pixels to reach
    any percentile of its own box, and a sticky column's box overlaps whatever
    is scrolled underneath it. That method reported 30 "failures" which the
    glyph-diff method shows are all comfortably passing.
  elements_measured: 586
  failures: 2
  detail: >
    Both failures are the same control in the two dark-mode passes:
    GameweekSelector's gameweek number, measured 1.12:1 — foreground rgb(5,25,58)
    on rgb(27,36,51). It is `text-[color:var(--fpl-ink-deep)]`, i.e.
    `--ui-ink-deep` used as a foreground, which is the BG-0083 defect exactly.
    Sibling-owned; raised as KIT-1, not worked around locally.
  worst_in_lane_owned_files:
    players: { fr_light: 5.86, fr_dark: 7.22, ar_light: 5.75, ar_dark: 7.28 }
    player_detail: { fr_light: 5.86, fr_dark: 7.28, ar_light: 5.75, ar_dark: 7.28 }
    fixtures: { fr_light: 5.25, fr_dark: 5.90, ar_light: 5.25, ar_dark: 5.90 }
    rankings: { fr_light: 5.63, fr_dark: 6.75, ar_light: 5.75, ar_dark: 7.28 }
    top_players: { fr_light: 5.30, ar_light: 5.75 }

arabic:
  document_direction: "rtl confirmed on every ar pass"
  column_order: >
    Genuinely mirrored, not visually faked: in the Arabic rankings table the rank
    column sits at the right edge and the total at the left, with movement
    furthest left. The mirroring comes from the document direction over logical
    properties; no `dir`-conditional layout code exists in the lane.
  latin_name_truncation:
    status: FIXED
    finding: >
      A Latin team or manager name inside an RTL table was clipped at the START
      of the string — "…iadi de Tanger" instead of "Ittihad Riadi d…". `truncate`
      places the ellipsis at the end of the ELEMENT's direction, and the element
      inherited `rtl` from the table.
    fix: >
      `dir="auto"` on the truncating name cell itself — not on the row and not on
      the table, both of which must stay RTL. 20 name cells across rankings, both
      league tables, the podium, the players list, the player detail and
      top-players. `<bdi>` was removed where it sat inside the truncating element,
      since it isolated the text but left the clipping edge wrong; it is kept
      where a name sits inline within a sentence.
    evidence:
      method: >
        A/B on one live page: the "before" is the shipped page with that single
        attribute stripped back off, so the two differ by exactly the change.
        A long Latin name and a long Arabic name were placed in the same table at
        390px, as requested.
      before:
        - "'Ittihad Riadi de Tanger' — dir absent, computed direction rtl, clipped at start-of-string (WRONG)"
        - "'اتحاد طنجة الرياضي المغربي' — computed direction rtl, correct"
      after:
        - "'Ittihad Riadi de Tanger' — dir=auto, computed direction ltr, clipped at end-of-string (CORRECT)"
        - "'اتحاد طنجة الرياضي المغربي' — dir=auto, computed direction rtl, still correct"
      screenshots:
        - "shots/rtl-rankings-BEFORE-ar-390.png — rows 1-2 read '…iadi de Tanger'"
        - "shots/rtl-rankings-AFTER-ar-390.png — the same rows read 'Ittihad Riadi d…'"
      screenshot_note: >
        Both images are the same table: only the two probed rows are reverted in
        the BEFORE shot, so the defect and the fix sit side by side in one frame.

