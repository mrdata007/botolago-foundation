base: "origin/chief/launch-fixes-3"

summary: >
  The eight Fantasy routes and five components in this lane are converted onto
  the V2 UI kit. Every one of them now measures zero on the design-divergence
  meter, down from 387 for the lane. Seven live defects are fixed along the way:
  the unpaginated 539-row player list, the useless "Aucun contenu disponible"
  on top-players, a club filter offering clubs that cannot return a player, a
  filter that could not be deselected, a difficulty-grid header that named a
  four-day gameweek after one of its days, a React #418 hydration failure that
  fired on every single load of the player detail route, and Latin names
  truncating from the wrong end inside Arabic tables. League standings stayed
  tables throughout, as instructed.

