pgtap:
  docker_available: false
  supabase_cli_usable: false
  substitute: >
    Rather than claim the suite ran when it could not, a real PostgreSQL 16.13 cluster was
    initdb'd locally, postgresql-16-pgtap was installed into it, and all 69 files under
    supabase/migrations were applied in order to a fresh database (plus minimal local stand-ins
    for the Supabase-managed roles and the auth/storage objects the migrations reference —
    auth.users/sessions/mfa_factors, storage.buckets/objects, auth.uid()/jwt(), which Supabase
    provides and a bare cluster does not). This is not `supabase db reset`; it is the same
    migration set on the same major version, and it is stated here as such.
  migrations_applied: 69
  result: 20 assertions, 20 ok, 0 not ok
  assertions:
    - ok 1 - fixture: all 8 synthetic clubs start active
    - ok 2 - happy path: the maintenance body reports exactly 3 deactivated clubs
    - ok 3 - happy path: exactly the three unreferenced clubs are now inactive
    - ok 4 - happy path: the five participating clubs stay active
    - ok 5 - happy path: a club with a current-season fixture but no squad row is left alone
    - ok 6 - happy path: a club with a current-season squad row but no fixture is left alone
    - ok 7 - second run: no club is deactivated a second time
    - ok 8 - second run: the active count is unchanged
    - ok 9 - second run: no updated_at is bumped again
    - ok 10 - rollback to savepoint restores all 8 clubs to active
    - ok 11 - count guard: the wrong expected count refuses and names every affected club
    - ok 12 - count guard: the refusal rolled the write back — every club is still active
    - ok 13 - fantasy guard: the fantasy club joins the 8 base clubs as active
    - ok 14 - fantasy guard: a candidate with a fantasy player refuses and names the club
    - ok 15 - fantasy guard: a club with a fantasy player is left alone
    - ok 16 - no current season: the body refuses instead of deactivating every club
    - ok 17 - no current season: nothing was written
    - ok 18 - catalog: all 8 clubs are offered before the deactivation
    - ok 19 - catalog: the deactivation runs
    - ok 20 - catalog: api.football_team_catalog offers only the five participating clubs afterwards
  harness_sanity_check: >
    supabase/tests/database/football_domain.test.sql was run unchanged on the same local cluster:
    11 ok, 0 not ok. The harness executes the repository's existing suites faithfully.
  script_file_rehearsal: >
    scripts/backend/football-deactivate-non-current-teams.sql was additionally executed as a whole
    file (only the two call parameters changed from (5, 16) to (3, 5) to match the synthetic
    fixture) against the same local cluster, seeded and then rolled back. It ran end to end:
    the notice listed the three clubs before the write, the review SELECTs printed 5 active /
