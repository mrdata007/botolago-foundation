root_cause:
  classification: VERIFIED
  description: >
    app.teams.active is a provider-upsert flag with no season semantics: api.ingest_football_catalog_entity
    sets active=true on insert and on every fresh update of a team and has no code path that sets it false
    (20260731180229_gate2b_football_catalog_ingestion.sql:284-301), while the SportsMonks mapper feeds it
    from `/teams/seasons/{seasonId}` without any season or active field (sportsmonks-catalog.ts:543-561).
    The G5 two-season historical backfill dispatched the `teams` catalog job for seasons 26027 (2025/26, run
    8f75c9ed on 2026-07-31) and 24319 (2024/25, run c590ee5b on 2026-08-02 13:43, per
    g5-two-season-backfill-runner.ts:76-79), inserting the relegated/historical clubs as active=true. The
    2026/27 catalog runs (28647, 2026-09-14/17/18) only upsert the 16 participants and never reconcile the
    complement, so the five stale rows stayed active. The 2026-08-02 updated_at values are crest attachments
    from the same runs (attach_football_team_crest bumps updated_at), not a later activation.

required_changes:
  - component: scripts/backend/football-team-deactivate-non-current.sql (NEW, data-only runbook; option (a), RECOMMENDED FOR LAUNCH)
    change: >
      Rehearsed single-transaction runbook in the exact shape of scripts/backend/football-team-identity-seed.sql
      (origin/agent/BG-0018-club-codes): `begin; select set_config('request.jwt.claims','{"role":"service_role"}',true);`
      then one DO block that (1) materialises a temp table of the five (id uuid, name) hard-coded as VALUES with the
      ids and names from this brief; (2) Guard 1: exactly 5 rows, 5 distinct ids, each id matches an app.teams row
      whose name equals the listed name exactly (raise otherwise); (3) Guard 2 (participation): for every listed id,
      zero rows in app.team_memberships where season_id = (select id from app.seasons where is_current) and active,
      AND zero rows in app.fixtures for that season as home or away team; raise if any listed id participates;
      (4) Guard 3 (completeness): the set of active teams NOT participating in the is_current season (memberships
      OR fixtures) must equal the listed set exactly — raise if the complement contains an unlisted id or misses a
      listed one, so the script fails closed if production drifts; (5) the single write:
      `update app.teams t set active = false from pg_temp.bg0043_targets v where t.id = v.id and t.active is distinct from false`
      with get diagnostics row_count; (6) Guard 4 (post-condition): count(*) from app.teams where active = 16 and
      jsonb_array_length(api.football_team_catalog('fr',100)) = 16, raise otherwise. Touches ONLY app.teams.active
      (the teams_set_updated_at trigger will bump updated_at on the 5 changed rows; a re-run changes 0 rows and
      bumps nothing). Never writes name, short_name, slug, code, colours, crest, memberships, fixtures, standings
      or provider mappings; no DELETE anywhere. Ends with a review SELECT of all 21 rows (id, name, active,
      updated_at) and a commented `-- commit;` exactly like the BG-0018 runbook.
    reason: >
      Smallest safe change that restores the 16-club public catalogue for launch, is idempotent, fails closed on
      drift, and is verifiable in a rolled-back rehearsal. Uses the same production-operation protocol the Verifier
      and owner already accepted for BG-0018 (SQL editor / service context, rehearsal JSON + implementation report).
  - component: docs/engineering/tasks/BG-0043/rehearsal-team-deactivation.json and docs/engineering/tasks/BG-0043/implementation-report.yaml (NEW)
    change: >
      Rehearsal evidence in the BG-0018 format (task, role, script, protocol "begin -> set_config -> pre snapshot ->
      DO block run 1 -> mid snapshot -> DO block run 2 -> checks -> raise exception 'REHEARSAL_BG0043 <json>' -> rollback",
      pre/mid/final snapshots, catalog lengths, historical read probes) plus the implementation report.
    reason: "The committed production run requires owner approval after Verifier PASS; the rehearsal artefact is the proof."
  - component: supabase/migrations/<new>_football_team_activity_reconciliation.sql (option (b), SEPARATE Builder-Backend task; NOT part of BG-0043 launch scope)
    change: >
      Durable rule so `active` follows current-season participation. Preferred design (additive, no rewrite of
      historical behaviour): a service-role RPC api.service_reconcile_football_team_activity(p_provider_name text,
      p_season_external_id text) that, given the season mapping, sets app.teams.active = true for teams that have an
      active membership or a fixture in that season and false for the remainder, only when the mapped season is
      is_current; invoked by the catalog runner after a successful `teams` job whose config.seasonId maps to the
      is_current season (sportsmonks-catalog.ts runJob) and by scripts/backend/current-season-recovery.ts.
      Alternative: change the 'team' branch of api.ingest_football_catalog_entity to accept an optional
      seasonExternalId and only force active=true when that season is_current — this touches the same lines
      (277-302) BG-0036 must rewrite for the `code = v_code` clobber, so (b) should be folded into BG-0036 or
      sequenced right after it to avoid two competing rewrites of the RPC. Either variant needs a pgTAP test
      (historical teams job must not re-activate; current-season job must deactivate the complement).
    reason: >
      Without (b), any historical backfill re-run with a fresh provider timestamp re-activates the five, and every
      future relegation will recreate BG-0043. Ranked second because it needs a migration, a runner change and the
      Phase 7E manifest ordering already constrained by BG-0027/BG-0031/BG-0042.

ranking:
  - "(a) data runbook first: unblocks the launch catalogue with zero code/migration risk; owner-approved single committed run."
  - "(b) ingestion rule second, as its own Builder-Backend task, ideally merged with BG-0036 (same RPC lines 277-302)."

constraints:
  - "Read-only role: this brief changes no state; the rolled-back rehearsal is the Builder's first action, the committed run is owner-approved and executed by the Shipper/owner (BG-0018 precedent, LAUNCH_LEDGER BG-0018 delivery note)."
  - "No deletion of history: the five keep their fixtures (30/30/60/30/30), standings, memberships, performances, crest assets and provider mappings; only app.teams.active changes."
  - "The runbook must hard-code the five ids AND recompute the participation complement, failing closed if the two disagree."
  - "Do not touch app_private.football_provider_mappings.active for the five: ingestion uses mapping.active to resolve external ids for historical fixtures/performances, and the mapping has no season scope."
  - "supabase/migrations/** and supabase/functions/** are out of scope for option (a); option (b) must respect scripts/backend/validate-migrations.mjs and the Phase 7E-B manifest order (BG-0042 hazard)."

risks:
  - "Onboarding/profile pickers: users who already chose one of the five as favourite would keep a hidden club; today favourites = 0 and followed_teams = 0, so no live user is affected (VERIFIED)."
  - "Historical backfill re-run: re-dispatching the G5 teams job for 24319/26027 would (i) with a fresh provider timestamp set active=true again, (ii) with an unchanged timestamp still fail crest attachment (attach_football_team_crest requires team.active) and end the run 'partial'. Mitigation: do not re-run historical catalog jobs before (b) lands; the runbook is idempotent and can be re-applied."
  - "Cached clients: react-query holds the club list up to 5 min (useFantasyScreen) and per-session elsewhere; Lovable-published bundle unaffected because the change is data-only. A user mid-session may see a club vanish from a filter on refetch (cosmetic)."
  - "Search/history pages: there is no club route in src/routes; match detail, standings and fixtures pages read by team id without an active predicate, so history renders unchanged. app_private.football_team_json will emit active:false, which the presenter ignores."
  - "Season 2026/27 bounds are wrong today (ends_on = starts_on = 2026-09-24, BG-0031). The runbook's participation guard uses is_current, not dates, so it is not affected; do not switch the guard to date ranges."
  - "If the owner intends the catalogue to include historical clubs for browsing (product decision), deactivation would be wrong; the catalog function's own comment and the Fantasy gating support the current-club semantics (INFERRED)."

contradictions:
  - "BG-0018 engineering brief assumed 16 active teams; production had 21 (recorded in the BG-0018 implementation report). This brief supersedes that assumption for the 2026-09-18 baseline."
  - "LAUNCH_LEDGER BG-0043 says the five were 'last written 2026-08-02'; that timestamp is the crest attachment inside historical catalog runs, while the activation itself happened at insert (2026-07-31 for three, 2026-08-02 13:43 for two). Same conclusion, different mechanism."

unknowns:
  - "Whether the product owner wants historical clubs selectable as a favourite in onboarding (no product doc found). The recommendation assumes current-season clubs only."
  - "Whether the G5 two-season backfill runner will ever be re-dispatched against production (would interact with the deactivation as described in risks)."
  - "Whether the Verifier's pgTAP environment (BG-0027 decision pending) should carry a regression test for option (b); option (a) has no database-test change."

