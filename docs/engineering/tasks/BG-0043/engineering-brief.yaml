task_id: BG-0043
objective: >
  Production app.teams holds 21 active rows instead of the 16 Botola Pro 2026/27 clubs. Five clubs
  that are not in the 2026/27 season (Chabab Mohammédia, JS Soualem, Olympic Safi, Olympique Dcheïra,
  Yacoub El Mansour) remain active=true, so api.football_team_catalog (anon/authenticated) exposes
  them. Establish how `active` is maintained, which surfaces consume it, what changes if the five
  become inactive, and the smallest safe correction (data-only rehearsed runbook and/or a durable
  ingestion rule).
researched_at: 2026-09-18
sources:
