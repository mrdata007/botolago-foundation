follow_ups:
  - >
    The durable rule (brief option (b)). Without it, a historical backfill re-run with a fresh
    provider timestamp re-activates the five, and the next relegation recreates BG-0043. The
    brief recommends folding it into BG-0036, which already rewrites
    api.ingest_football_catalog_entity lines 277-302.
  - >
    If option (b) lands, this script becomes a one-off; the pgTAP suite should stay, because it
    also pins api.football_team_catalog's `active` predicate as a regression.
