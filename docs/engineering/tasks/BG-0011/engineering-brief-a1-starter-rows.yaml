root_cause:
  classification: VERIFIED
  description: >
    SportsMonks publishes complete 39–41-row lineups for season 26027 in which some rows carry a participation
    type (11 starter / 12 substitute) but NO player_id. The worker drops every such row as "incomplete" before
    reading its type and then requires exactly 22 IDENTIFIED starters; whenever one of the anonymous rows is a
    starter the fixture fails starter_rows_mismatch. Proven directly for 19489216 (raw 22 starters + 18
    substitutes, 2 anonymous rows, 21 identified starters); the same arithmetic holds for all 64 failures and
    the anonymous-row trait is present in 104 of 240 fixtures (40 of which pass because their anonymous rows are
    substitutes). The defect is concentrated by club (Dcheïra 70%, Safi 50% of their fixtures), which points to a
    few specific players lacking a provider identity all season rather than a random feed fault; three round-7
    fixtures (2025-11-02) are outliers with 12–13 anonymous rows and are genuinely incomplete.
  secondary:
    classification: VERIFIED
    description: >
      The 22-starter rule is duplicated in the worker, in two branches of the ingest RPC and in a production
      CHECK constraint, and the 240/240 rule in the runner and in the rating-inputs RPC; no path exists that
      reaches v2 ratings for 26027 without a new additive migration, and no migration can be promoted while
      BG-0002 is open.
  unresolved:
    classification: UNKNOWN
    description: >
      Per-fixture RAW starter counts for the 63 non-pinned failures, whether anonymous rows expose any other
      identity, and how many of the 176 passing fixtures would fail the DB-level starter re-check because of an
      unmapped starter.

