  Two facts change the plan. First, the 22-starter rule is a production CHECK constraint and two RPC branches,
  not just a worker line, so every A2 variant needs a promoted migration and therefore BG-0002 twice (promotion
  and backfill). Second, the A0 result is not "64 bad fixtures": for the one fixture where RAW and ACCEPTED counts
  are both recorded the provider declares 22 starters and one of them has no player_id; the arithmetic is
  consistent for all 64 and the failures cluster by club (Dcheïra 70%, Safi 50%), so a small number of
