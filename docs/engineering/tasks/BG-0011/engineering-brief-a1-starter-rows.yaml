    accepted-coverage rule and therefore REQUIRES A REVISED ENGINEERING BRIEF with its own verification
    (unit tests, DB tests, a read-only proof run) before a Builder touches it. Coverage figures assume the
    hidden DB-level mapping gate (finding 2b) costs zero fixtures; subtract whatever the pre-A4 measurement finds.
  items:
  - option: a
    name: "Accept 21..22 identified starters when excludedIncompleteRows ≥ 1 (persist the 21)"
    achievable_coverage: "226/240 = 94.2% (50 fixtures with 21 starters join the 176); 20-starter and the three outliers stay excluded → still needs the rating-inputs threshold relaxed"
    changes:
      worker: "normalizeHistoricalFixture :518 → tolerance rule; coverage object unchanged; new unit tests (existing test at .test.ts:241-255 asserts 21 starters → 503 and must be rewritten)"
      migration: "NEW additive migration: create-or-replace api.ingest_historical_player_fixture_performance (pre-check :100 and reconciliation :241) and DROP/ADD historical_performance_coverage_counts_check to admit starter_rows 21 only when excluded_incomplete_rows ≥ 22 − starter_rows; must not alter the current-season branch's own 22 checks (20260914200726) or its CHECK current_performance_coverage_complete_check; supabase/tests/database/historical_player_performances.test.sql extended"
      runner: "no change to batch validation (performanceRows ≥ fixturesProcessed*22 still true, validPlayerRows ≥ 35); fixture_count_mismatch stays because every fixture is still processed — UNLESS the 14 excluded fixtures remain, in which case option c's runner change is needed as well"
      rating_inputs: "NEW additive migration relaxing covered_fixture_count = expected to covered ≥ expected − ceiling (14 here) and performance_count ≥ covered*22"
    blast_radius: "worker + 2 RPC branches + 1 CHECK + 1 rating RPC + 2 test suites; touches a table shared with the live current-season ingestion; a weaker invariant permanently (a fixture whose provider payload truly lists only 21 starters would now pass)"
    fairness: "no catalog player is penalised; the anonymous starter's minutes are lost to nobody"
    timeline: "0.5–1 day build+review; promotion + backfill both wait on BG-0002; feasible only if BG-0002 closes by ~2026-09-20T12:00Z"
