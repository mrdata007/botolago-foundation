rule:
  old: >
    Exactly 22 identified starters (player_id present in the provider payload) required per
    fixture. Any fixture short of this was rejected outright (starter_rows_mismatch) and none of
    its data was used, even fixtures short by just one or two starters.
  new: >
    Exactly 22 provider-reported raw starters required per fixture (unchanged -- this was already
    universal, 240/240). Of those 22, at most 4 may be anonymous (missing player_id).
    identifiedStarterRows = 22 - anonymousStarterRows. Only identified rows are persisted for
    pricing; anonymous rows are never assigned to any player, never treated as another player's
    stats, and never represented as an "observed zero" appearance/minutes. A fixture with more
    than 4 anonymous starters is quarantined ENTIRELY: none of its rows -- not even the identified
    ones -- are used.
  honesty_note: >
    This is an explicit, scoped RELAXATION of the prior rule, not "the same invariant read more
    carefully" and not "all existing invariants preserved unchanged". Every OTHER existing
    invariant (lineup_rows_out_of_range, valid_player_rows_out_of_range,
    incomplete_rows_limit_exceeded, team_count_mismatch, invalid_detail_rows_present, and the
    still-universal 22-raw-starters check, now named raw_starter_rows_mismatch) is unchanged.

