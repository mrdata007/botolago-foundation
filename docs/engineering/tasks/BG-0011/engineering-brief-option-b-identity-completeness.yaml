objective: >
  Implement option (b) from engineering-brief-a1-starter-rows.yaml ("count anonymous rows by
  type: invariant becomes identifiedStarters + anonymousStarters == 22, persist identified rows
  only") using the measured coverage from BG-0044 (238/240, cap 4), not the earlier estimate
