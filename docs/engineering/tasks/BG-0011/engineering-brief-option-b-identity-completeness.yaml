owner_addendum_2026_09_19_second_pass:
  summary: >
    The owner (via the coordinator) read the actual migration SQL directly and found two
    unresolved issues in the first pass's fix: (1) the "traceable quarantine marker" was a
    SEPARATE table (app_private.historical_performance_fixture_quarantine) populated by deleting
    the fixture's coverage row and inserting a thinner one elsewhere -- a delete-then-reinsert in
    disguise, and the pgTAP tests never actually proved the coverage row itself survived (it
    didn't). (2) the migration's own scope comment claimed table-level separation from the live
    current-season path that does not exist -- app.player_fixture_performances and
    app_private.historical_performance_fixture_coverage are genuinely shared with that live path.
    Both are now fixed: single-table design (coverage_outcome/quarantine_reason columns on the
    existing coverage table, no second table, no DELETE anywhere), and a corrected scope comment
    plus a new hard source_version-scoped CHECK constraint (see scope_enforcement above). All fixes
    are backed by a REAL local pgTAP run against Postgres 17 via
    `npx supabase db start && npx supabase test db` (not static review): 42/42 test files, 911/911
    tests pass, including current_finished_fixture_performances.test.sql,
    fantasy_scoring_worker.test.sql, fantasy_verified_finalization.test.sql,
    fantasy_postwork_journal.test.sql and fantasy_finalized_notification_batches.test.sql (the
    five files that touch the shared tables from the live-scoring side), named explicitly per the
    coordinator's request. See implementation-report-option-b.yaml for the exact test list and a
    full account of two real bugs this local run caught and this session fixed.

