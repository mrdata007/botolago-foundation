ks provider mapping,\n      459 have a 2025/2026 team_membership and 305 a 2024/2025 one. The 42 players with a\n      NULL evidence source are exactly the 42 unmapped players, who would legitimately\n      remain at the neutral 6.0 / 0 fallback (GK 4.8, DEF 5.0, MID/FWD 7.2) under any\n      corrected re-pricing.\n    evidence: >\n      Read-only query joining app.fantasy_players to app_private.football_provider_mappings\n      and app.team_memberships (catalog 539, mapped 497, in_2025_26 459, in_2024_25 305),\n      cross-checked against the 42 NULL-source evidence rows.\n\n  - classification: VERIFIED\n    statement: >\n      Option B cannot differentiate prices at the current scale. api.service_apply_fantasy_price_changes\n      delegates movement to the ruleset thresholds, which in both published rulesets are\n      minimum_net_transfers = 250, small_rate_threshold = 0.03, large_rate_threshold = 0.08,\n      small_movement 0.10, large_movement 0.20, max per gameweek 0.20. The movement rule\n      requires |net transfers| >= max(250, ceil(0.03 * active_teams)); with 3 active teams\n      the floor is 250 and every movement is necessarily 0. The RPC also refuses unless the\n      gameweek status is 'finalized' or 'corrected', and GW1 is currently 'open'.\n    evidence: >\n      supabase/migrations/20260720163222_fantasy_ruleset_v1.sql lines 679-790\n      (api.service_apply_fantasy_price_changes, status gate and demand CTE);\n      src/backend/fantasy/pricing.ts calculatePriceMovement; read-only query on\n      app.fantasy_price_rules joined to app.fantasy_rulesets (v1.0 and v1.1 identical);\n      read-only query on app.fantasy_gameweeks (sequence 1, status 'open',\n      deadline_at 2026-09-23T22:30Z, season status 'registration_open').\n\n  - classification: VERIFIED\n    statement: >\n      There is no supported write path that edits app.fantasy_players.price in place for a\n      re-pricing. The only price mutator is api.service_apply_fantasy_price_changes, which\n      bumps price_version and writes fantasy_player_price_history with reason\n      'gameweek_market_demand'; it is not an initial-pricing tool. All 539 rows currently\n      sit at price_version = 1, and the BEFORE INSERT OR UPDATE trigger\n      app_private.fantasy_enforce_player_rules rejects any price outside\n      [absolute_minimum 3.50, absolute_maximum 15.00], any price not a multiple of 0.10,\n      and on INSERT any price outside [initial_minimum 4.00, initial_maximum 12.50].\n    evidence: >\n      supabase/migrations/20260720163222_fantasy_ruleset_v1.sql lines 469-504 (trigger\n      function) and 679-790 (price RPC); read-only queries on pg_trigger for\n      app.fantasy_players and on app.fantasy_players (min/max price_version = 1, n = 539).\n\n  - classification: VERIFIED\n    statement: >\n      Re-pricing via the supported route means rollback plus re-stage, and rollback is\n      currently blocked by the existing teams. api.service_rollback_fantasy_catalog raises\n      PT409 'fantasy_catalog_in_use' if any app.fantasy_teams row exists for the fantasy\n      season; it then deletes the price history and the evidence rows, deletes the fantasy\n      players, gameweeks and season, and stamps rolled_back_at.\n      api.service_stage_fantasy_catalog refuses ('fantasy_catalog_already_staged') while a\n      non-rolled-back run or a fantasy_seasons row exists for the football season. All four\n      operations require app_private.is_service_request().\n    evidence: >\n      supabase/migrations/20260803210943_fantasy_catalog_activation.sql lines 863-960\n      (rollback), 548-620 (stage guards), 984-992 (grants); activation run\n      c0de2026-0917-4a11-8f00-000000000001 read from\n      app_private.fantasy_catalog_activation_runs (staged 2026-09-17T21:03:52Z,\n      opened 2026-09-17T21:04:14Z, rolled_back_at NULL, player_count 539).\n\n  - classification: VERIFIED\n    statement: >\n      Re-staging has a hard time box. api.preview_fantasy_cata