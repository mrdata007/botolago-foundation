cision, not a builder assumption.\n    evidence: >\n      Rollback guard at supabase/migrations/20260803210943_fantasy_catalog_activation.sql\n      lines 899-902 combined with the team inventory above. Not directly established:\n      whether the owner regards these three teams as disposable.\n\n  - classification: INFERRED\n    statement: >\n      Even after a corrected rating ingestion, confidence is applied twice and will keep\n      low-minute players near the neutral price. The worker already shrinks by confidence\n      (rating = 6 + c * (unshrunk - 6)) and fantasy_initial_price_v1 shrinks the result by\n      confidence again (adjusted = 6 + (rating - 6) * c), giving an effective factor of\n      c squared. A player with 450 minutes (c = 0.5) retains only 25 percent of his\n      position-relative signal. Full-season players (c = 1) are unaffected, so meaningful\n      differentiation would still appear, but the spread will be narrower than the bands\n      suggest.\n    evidence: >\n      supabase/functions/_shared/sportsmonks-player-ratings.ts line 528 and\n      supabase/migrations/20260803210943_fantasy_catalog_activation.sql line 161.\n      Not directly established: the real minutes distribution, which is unknown because no\n      real minutes exist in production.\n\n  - classification: VERIFIED\n    statement: >\n      The documented behaviour matches what production did; nothing was mis-implemented\n      against the runbook. The runbook states that a player without approved historical\n      evidence is recorded explicitly as rating 6.0 with confidence 0 and that no provider\n      or client invents a rating, and the evidence table comment says the same. The bridge\n      activation doc records the outcome as \"539 fantasy players priced 4.8-7.2 by the\n      reviewed price algorithm\".\n    evidence: >\n      docs/backend/FANTASY_CATALOG_ACTIVATION_RUNBOOK.md lines 38-59;\n      table comment at supabase/migrations/20260803210943_fantasy_catalog_activation.sql\n      line 92-93; docs/backend/FANTASY_2026_27_BRIDGE_ACTIVATION.md line 22.\n\nroot_cause:\n  classification: VERIFIED\n  description: >\n    The pricing algorithm behaved exactly as specified; it was fed a constant. Every one\n    of the 539 evidence rows carries source_rating 6.0 and source_confidence 0, which is\n    the algorithm's explicit \"no approved historical evidence\" input, and that constant\n    maps deterministically to one price per position (GK 4.8, DEF 5.0, MID 7.2, FWD 7.2).\n    The constant originates upstream: the SportMonks player-ratings edge worker completed\n    five runs with records_fetched = 0 yet still persisted a neutral row for every squad\n    candidate, because confidence = min(1, minutes / 900) is 0 when no provider statistics\n    are returned and the worker zero-fills any candidate missing from the statistics map.\n    app.player_season_ratings is consequently populated (1188 active rows across the two\n    completed seasons) but contains only placeholders, so the price is uniform by\n    construction. The alternative fixture-performance rating path\n    (botolago-preseason-rating-v2-fixture-performance) exists and would produce genuine\n    differentiation, but its coverage gate is unsatisfied: only 6 of 480 finished\n    historical fixtures were ingested before the backfill worker failed and was abandoned\n    on 2026-08-02. There is therefore no differentiating rating data anywhere in\n    production today, and no re-run of the existing pricing code can create it.\n\nrequired_changes:\n  - component: \"Owner product decision (BLOCKS everything below)\"\n    builder_type: None\n    change: >\n      Choose between: (A) delay differentiated pricing until real rating inputs exist,\n      accepting a rollback and re-stage of the 2026/2027 catalog before\n      2026-09-23T00:00:00Z and the deletion of the 3 QA/E2E teams; (B) ship GW1 with\n      uniform-by-position prices as the deliberate, documented launch state; or