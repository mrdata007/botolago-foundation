istorical performance backfill (api.ingest_historical_player_fixture_performance, 20260802010100)\"\n    builder_type: Builder-Data\n    change: >\n      Resume and complete the player_fixture_performances backfill for season\n      92e5dbe8-44a9-4b83-bdc8-78f03dfa4584 until all 240 finished fixtures have reconciled\n      app_private.historical_performance_fixture_coverage rows and >= 5280 performance rows,\n      diagnosing the 3 failed runs first. Only then can\n      api.football_historical_player_rating_inputs and\n      api.ingest_historical_player_season_ratings (algorithm\n      botolago-preseason-rating-v2-fixture-performance) produce real ratings.\n    reason: >\n      This is the only rating path whose inputs are already partially in the database, and\n      its coverage gate is all-or-nothing (6 of 240 fixtures today).\n\n  - component: \"api.service_rollback_fantasy_catalog + api.preview_fantasy_catalog_activation + api.service_stage_fantasy_catalog (20260803210943)\"\n    builder_type: Builder-Data\n    change: >\n      If and only if option A is chosen and real ratings are in place: remove the 3\n      fantasy_teams rows (owner-approved destructive step), call\n      api.service_rollback_fantasy_catalog(c0de2026-0917-4a11-8f00-000000000001,\n      <current source digest>), re-run api.preview_fantasy_catalog_activation and confirm\n      ready with no blockers, then api.service_stage_fantasy_catalog with a fresh\n      idempotency key and the new digest, then api.service_open_fantasy_registration.\n      Execute no step after 2026-09-23T00:00:00Z.\n    reason: >\n      There is no in-place price mutator for initial pricing; rollback-and-restage is the\n      only supported route, rollback refuses while teams exist, and the preview gate closes\n      24 hours before the 2026-09-24T00:00:00Z kickoff.\n\n  - component: \"docs/backend/FANTASY_2026_27_BRIDGE_ACTIVATION.md and docs/backend/FANTASY_CATALOG_ACTIVATION_RUNBOOK.md\"\n    builder_type: Builder-Backend\n    change: >\n      Record explicitly that the 2026/2027 opening prices were computed from the neutral\n      fallback for all 539 players because no rating evidence existed, and add a\n      pre-stage check that the rating inputs are non-degenerate (not every candidate at\n      rating 6.0 / confidence 0) before staging a catalog.\n    reason: >\n      The runbook documents the neutral fallback as a per-player exception; production hit\n      it for 100 percent of players and nothing in the activation gates flagged that.\n\n  - component: \"app_private.fantasy_initial_price_v1 double confidence shrinkage\"\n    builder_type: None (flag only)\n    change: >\n      Flag to the owner that confidence is applied twice (once in the worker's rating, once\n      in the price function), giving an effective c-squared shrink for part-season players.\n      Do not change it: the bands and the shrink are published product rules.\n    reason: >\n      Changing the algorithm's product rules is explicitly outside this task's scope, but\n      the owner should know the spread will be narrower than the published bands imply.\n\nconstraints:\n  - \"Read-only for this brief: no writes, no transactions, no set_config; only SELECT via mcp__Supabase__execute_sql on project tkewgajrljbwgwedqsxn.\"\n  - \"app_private.fantasy_initial_price_evidence is service-facing only: grants are revoked from public, anon, authenticated AND service_role; it is written solely by app_private-owned definer functions and deleted only by api.service_rollback_fantasy_catalog. There is no UPDATE path, so evidence cannot be corrected in place; it can only be removed with its fantasy_players rows and re-created by a new stage.\"\n  - \"api.service_stage_fantasy_catalog, api.service_open_fantasy_registration and api.service_rollback_fantasy_catalog all gate on app_private.is_service_request(); they are unreachable from anon/authenticated clients.\"\n  - \"api.service_rollback_fantasy_catalog raises PT409 'fantasy_catalog_in_use' while any app.fantasy_teams row exists for the fantasy season; 3 such rows exist.\"\n  - \"api.service_stage_fantasy_catalog raises PT409 'fantasy_catalog_already_staged' while a non-rolled-back activation run or a fantasy_seasons row exists for football season d03223b0-8f4a-4309-93e1-2a708d7c3584.\"\n  - \"api.preview_fantasy_catalog_activation blocks with 'activation_window_closed' within 24 hours of the earliest kickoff (2026-09-24T00:00:00Z) and with 'initial_price_invalid' if any computed price falls outside 4.00-12.50.\"\n  - \"app.fantasy_players.price_version is 1 for all 539 rows and is incremented only by api.service_apply_fantasy_price_changes; a re-stage creates new rows at price_version 1 rather than advancing the existing ones.\"\n  - \"Trigger app_private.fantasy_enforce_player_rules rejects any price outside 3.50-15.00, any price that is not a multiple of 0.10, and on INSERT any price outside 4.00-12.50.\"\n  - \"api.service_apply_fantasy_price_changes requires gameweek status 'finalized' or 'corrected' and refuses if a later gameweek is open/locked/live/provisional/finalizing; GW1 is 'open' and is the only gameweek.\"\n  - \"api.ingest_player_season_ratings accepts 1-50 rows per call, provider must be 'sportsmonks', algorithm must be 'botolago-preseason-rating-v1'; api.ingest_historical_player_season_ratings accepts 1-1000 rows and deactivates all existing active ratings for the season before inserting.\"\n  - \"Only 497 of 539 catalog players have an active sportsmonks mapping; the other 42 can only ever carry the neutral fallback price without fabricating data.\"\n\nrisks:\n  - \"Time box: a rollback-and-restage must finish before 2026-09-23T00:00:00Z or the activation preview closes and the 2026/2027 catalog is frozen at uniform prices for GW1 regardless of the decision.\"\n  - \"Rollback is destructive and partially irreversible: it deletes all 539 fantasy_players, their 539 price-history rows and their 539 evidence rows. The evidence of the current opening prices would be lost unless exported (read-only) first.\"\n  - \"Deleting the 3 fantasy_teams rows to unblock rollback has no RPC and would be a direct table write; it destroys 45 squad memberships and 8 transfer batches and may break in-flight QA/E2E suites.\"\n  - \"Completing the historical backfill depends on the same provider that already returned nothing for season statistics; the fixture-detail endpoint may be equally unavailable, in which case option A is unreachable and the choice narrows to B or C.\"\n  - \"Re-ingesting ratings for 2025/2026 via api.ingest_historical_player_season_ratings deactivates every existing active rating row for that season in one statement; if the new payload is incomplete, players silently fall back to the neutral 6.0/0 and the uniform prices reappear for them.\"\n  - \"Option B leaves 323 of 539 players indistinguishable at 7.20, which removes the budget trade-off that the 100.0 budget and 15-player squad exist to create; the price-movement rules will not repair this until active_teams is large enough for 250 net transfers on a single player.\"\n  - \"A re-stage changes every price, so any transfer, squad or leaderboard artefact captured against the current prices (including the digest 9eede640...5885b recorded in the bridge doc) becomes stale.\"\n\ncontradictions:\n  - \"docs/backend/FANTASY_PREACTIVATION_AUDIT.md (line ~19) asserts the design derives ratings from provider evidence 'rather than a client-maintained or hard-coded rating', and (line ~63) that missing evidence returns a nullable rating rather than inventing data. In production the rating is neither provider-derived nor null: 1188 rows carry a hard-coded neutral 6.0/0 written by the worker after fetching zero records. The intent and the realized behaviour diverge even though no individual code path violates its own contract.\"\n  - \"docs/backend/FANTASY_2026_27_BRIDGE_ACTIVATION.md line 22 presents '539 fantasy players priced 4.8-7.2 by the reviewed price algorithm' as a successful activation outcome; the same range is in fact the signature of a total absence of rating evidence. The record is literally true and materially misleading.\"\n  - \"The Extractor report sets uniform_price_flag: false while also reporting 3 distinct prices with a single value per position; the flag appears to test global uniformity only and does not detect within-position uniformity, which is the actual defect.\"\n\nunknowns:\n  - \"Why the SportMonks season-statistics endpoint returned nothing for provider seasons 26027 and 24319: plan entitlement, Botola Pro coverage gap, or a missing include parameter. Not observable from the database; requires a provider API call or account inspection.\"\n  - \"Why the 3 player_fixture_performances ingestion runs failed on 2026-08-02: error_code and error_summary were not inspected for those rows, and whether the failure is provider-side or worker-side is unresolved.\"\n  - \"Whether the provider can supply fixture-level lineup/statistic details for all 240 fixtures of 2025/2026, which determines whether the v2 rating path is reachable at all.\"\n  - \"Whether the owner regards the 3 QA/E2E teams as disposable, and whether any non-QA registration is expected before the 2026-09-23T22:30:00Z deadline.\"\n  - \"Whether the intended product answer for the 42 unmapped players is the neutral fallback price or exclusion from the catalog.\"\n  - \"Whether the double confidence shrinkage (worker and price function) is intentional or an unnoticed compounding; no design document states it.\"\n  - \"Whether a Fantasy price-batch worker/schedule is actually enabled in production; api.service_run_fantasy_price_batch exists (20260914200744) but no price-batch execution was observed.\"\n\nacceptance_tests:\n  - \"Diagnostic (must hold before any remediation is called complete): select count(*) from app_private.fantasy_initial_price_evidence where source_rating = 6.0 and source_confidence = 0 returns a number materially below 539; today it returns 539.\"\n  - \"Rating input non-degeneracy: select count(distinct rating), min(rating), max(rating), sum(minutes) from app.player_season_ratings where active and football_season_id = '92e5dbe8-44a9-4b83-bdc8-78f03dfa4584' returns more than one distinct rating and a non-zero minutes total.\"\n  - \"Worker regression: a ratings run whose provider response yields records_fetched = 0 terminates with status 'failed' and an explicit error_code, and inserts zero rows into app.player_season_ratings (unit test against calculatePreseasonRatings / the run wrapper in supabase/functions/_shared/sportsmonks-player-ratings.test.ts).\"\n  - \"Coverage gate: api.football_historical_player_rating_inputs('sportsmonks', <2025/26 external id>) returns coveredFixtureCount = expectedFixtureCount = 240 with performanceCount >= 5280 instead of raising HISTORICAL_PERFORMANCE_INCOMPLETE.\"\n  - \"Price differentiation after a re-stage: select position, count(distinct price) from app.fantasy_players join app.fantasy_positions using (position_id) where active group by 1 returns more than one distinct price in every position, and the global count(distinct price) is materially greater than 3.\"\n  - \"Fallback honesty: every catalog player whose evidence row still has source_rating 6.0 and source_confidence 0 has exactly the fallback price for his position (GK 4.80, DEF 5.00, MID 7.20, FWD 7.20), and the count of such players equals the count of players without an active mapped rating (currently 42).\"\n  - \"Evidence integrity after a re-stage: count(*) from app_private.fantasy_initial_price_evidence equals count(*) from app.fantasy_players for the new fantasy season, every row has algorithm_code 'botolago-initial-price-v1.0', and every calculated_price equals the corresponding app.fantasy_players.price.\"\n  - \"Price-history integrity after a re-stage: exactly one app.fantasy_player_price_history row per fantasy player with reason 'initial_catalog_v1', old_price NULL, source_version 1, and app.fantasy_players.price_version = 1 for all rows.\"\n  - \"Non-regression of the movement path: api.service_apply_fantasy_price_changes still refuses with PT409 'gameweek_not_finalizable' while GW1 is 'open', and still returns movement 0 for every player while active_teams is below 250 / 0.03.\"\n  - \"If option B is chosen: docs/backend/FANTASY_2026_27_BRIDGE_ACTIVATION.md states explicitly that the 4.8/5.0/7.2/7.2 prices are the neutral fallback for all 539 players and not a rating-derived result, and a pre-stage guard exists that blocks or loudly warns when every candidate carries rating 6.0 / confidence 0.\"\n\nimplementation_scope:\n  builder_type: Builder-Backend\n  allowed_paths:\n    - supabase/functions/_shared/sportsmonks-player-ratings.ts\n    - supabase/functions/_shared/sportsmonks-player-ratings.test.ts\n    - supabase/functions/_shared/sportsmonks-historical-player-performance.ts\n    - supabase/functions/_shared/sportsmonks-historical-player-performance.test.ts\n    - supabase/migrations/ (new additive migration only, for a pre-stage degenerate-rating guard)\n    - supabase/tests/database/fantasy_catalog_activation.test.sql\n    - docs/backend/FANTASY_CATALOG_ACTIVATION_RUNBOOK.md\n    - docs/backend/FANTASY_2026_27_BRIDGE_ACTIVATION.md\n    - docs/backend/FANTASY_PREACTIVATION_AUDIT.md\n  forbidden_paths:\n    - supabase/migrations/20260803210943_fantasy_catalog_activation.sql (published; do not edit in place)\n    - supabase/migrations/20260803173344_fantasy_preactivation_hardening.sql\n    - supabase/migrations/20260801010100_player_season_ratings.sql\n    - supabase/migrations/20260802010100_historical_player_performances.sql\n    - supabase/migrations/20260720163222_fantasy_ruleset_v1.sql\n    - src/backend/fantasy/pricing.ts (bands, shrink and movement thresholds are published product rules)\n    - src/components/** and all UI\n    - Any production write (app.fantasy_players, app.fantasy_teams, app.fantasy_squad_memberships, app.player_season_ratings, app_private.fantasy_initial_price_evidence) outside the named service RPCs and outside an owner-approved Builder-Data operation\n\nstatus: HALTED_FOR_INPUT\nhalt_reason: >\n  No safe remediation is available without an owner product decision. Option A\n  (re-price from existing rating data) is not merely a re-run: production holds no\n  differentiating rating data at all (all 1188 app.player_season_ratings rows are neutral\n  6.0 / confidence 0 with zero counters, and the fixture-performance alternative has 6 of\n  240 required fixtures), so it first requires a provider-side fix that is outside the\n  database, then a rollback that is blocked by 3 existing fantasy_teams rows whose deletion\n  is a destructive, RPC-less data operation, and the whole sequence must complete before\n  2026-09-23T00:00:00Z. Option B (accept uniform-by-position GW1 prices) is viable but is a\n  launch-quality decision, and the price-movement rules will NOT differentiate over time at\n  current scale: with 3 active teams the movement floor of max(250, 0.03 * active_teams) is\n  250 net transfers, so every movement is exactly 0. Option C is by definition an owner\n  decision. A builder must not choose among these on its own authority.
