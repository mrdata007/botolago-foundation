task_id: BG-0011
role: Researcher
attempt: 1
objective: Why do the 539 production prices collapse to GK 4.80 / DEF 5.00 / MID+FWD 7.20, and what produces differentiated prices without fabricating data.
findings:
  - {
      classification: VERIFIED,
      statement: "Opening price = f(position, source_rating, source_confidence): adjusted = 6 + (rating−6)·confidence; price = band_min + ((adjusted−4)/6)·(band_max−band_min), rounded to 0.1; bands GK 4.0–6.5, DEF 4.0–7.0, MID/FWD 4.5–12.5.",
      evidence: "20260803210943_fantasy_catalog_activation.sql:127-165; src/backend/fantasy/pricing.ts",
    }
  - {
      classification: VERIFIED,
      statement: "All 539 evidence rows carry source_rating 6.0 and source_confidence 0 (459 attributed to season 2025/26, 38 to 2024/25, 42 NULL = the 42 unmapped players). Rating 6 / confidence 0 yields exactly 4.8 / 5.0 / 7.2 / 7.2.",
      evidence: "read-only query on app_private.fantasy_initial_price_evidence",
    }
  - {
      classification: VERIFIED,
      statement: "app.player_season_ratings holds 1188 active rows (887 players, 2 seasons) that are ALL rating 6.0 / confidence 0 with zero appearances, minutes, goals and NULL provider_rating — placeholders, not history.",
      evidence: "read-only aggregate query",
    }
  - {
      classification: VERIFIED,
      statement: "The ratings edge worker computes confidence = min(1, minutes/900) and rating = 6 + confidence·(unshrunk−6); with no provider statistics it emits 6.0/0 for every candidate. Five player_ratings ingestion runs 'succeeded' with records_fetched = 0 and inserted 561 + 627 placeholder rows.",
      evidence: "supabase/functions/_shared/sportsmonks-player-ratings.ts:489-552, 340-374; app_private.football_ingestion_runs",
    }
  - {
      classification: INFERRED,
      statement: "Provider cause: GET /v3/football/statistics/seasons/players/{seasonId} returned nothing for provider seasons 26027 / 24319 (entitlement, coverage or include parameter). Not directly observed.",
    }
  - {
      classification: VERIFIED,
      statement: "The richer v2 rating path (fixture performances) is gated on full coverage: 240 reconciled coverage rows and ≥ 5280 performance rows per season; production has 6 coverage rows and 228 performance rows for 2025/26 (backfill failed and stopped 2026-08-02; 3 failed runs), 0 for 2024/25.",
      evidence: "20260802010100_historical_player_performances.sql:575-607; read-only queries",
    }
  - {
      classification: VERIFIED,
      statement: "Candidate selection would consume corrected 2025/26 ratings unchanged (lateral join on latest active rating of a completed prior season). Coverage if real: 497 of 539 mapped players; 42 remain at the neutral fallback legitimately.",
      evidence: "20260803210943:166-232; mapping/membership queries",
    }
  - {
      classification: VERIFIED,
      statement: "Option B cannot differentiate at current scale: movement requires |net transfers| ≥ max(250, ceil(0.03·active_teams)) — with 3 teams the floor is 250, so every movement is 0; the price RPC also requires a finalized/corrected gameweek.",
      evidence: "20260720163222_fantasy_ruleset_v1.sql:679-790; app.fantasy_price_rules",
    }
  - {
      classification: VERIFIED,
      statement: "No in-place initial re-pricing path exists: only rollback (refuses while any fantasy_teams row exists — 3 exist) + re-stage; preview closes 24 h before the earliest kickoff, i.e. 2026-09-23T00:00Z.",
      evidence: "20260803210943:863-960, 548-620, 454-459",
    }
  - {
      classification: VERIFIED,
      statement: "Existing teams: 3 QA/E2E teams (bank 7.80, value 92.20, 15 memberships each, 8 transfer batches, no chips). A rollback deletes them (no re-basing RPC).",
      evidence: "read-only queries on app.fantasy_teams etc.",
    }
  - {
      classification: INFERRED,
      statement: "Confidence is applied twice (worker and price function) → effective c² shrink for part-season players; spread narrower than bands imply.",
    }
root_cause:
  classification: VERIFIED
  description: The pricing algorithm behaved as specified but was fed a constant neutral input (6.0 / 0) for every player because the provider ratings ingestion fetched zero statistics yet wrote placeholder rows and reported success; the alternative fixture-performance rating path has 6 of 240 required fixtures. No differentiating rating data exists in production; no re-run of existing code can create it.
options_for_owner:
  A: "Fix the provider ratings source (entitlement/endpoint) or complete the 2025/26 performance backfill, then rollback + re-stage the catalog (deletes the 3 QA teams) — all before 2026-09-23T00:00Z."
  B: "Ship GW1 with uniform-by-position prices as the documented launch state; movement rules will not differentiate until active teams are large (250 net transfers floor)."
  C: "A different opening-price product rule (e.g. manual tiering) — new rule, new data."
required_changes:
  - { component: "owner product decision (blocks A/B/C)", builder_type: None }
  - {
      component: "supabase/functions/_shared/sportsmonks-player-ratings.ts",
      builder_type: Builder-Backend,
      change: "an empty provider statistics response (records_fetched = 0 or coverage below a minimum share) must fail the run and persist no rows instead of writing 6.0/0 placeholders",
      reason: "the silent success is what allowed staging on empty evidence",
    }
  - {
      component: "SportMonks entitlement / season statistics",
      builder_type: "investigation then Builder-Backend",
    }
  - {
      component: "historical performance backfill (api.ingest_historical_player_fixture_performance)",
      builder_type: Builder-Data,
      change: "resume to 240/240 fixtures and ≥ 5280 rows for 2025/26; diagnose the 3 failed runs",
    }
  - {
      component: "rollback + preview + re-stage + open registration",
      builder_type: Builder-Data,
      change: "only under option A with real ratings and owner approval to delete the 3 teams; nothing after 2026-09-23T00:00Z",
    }
  - {
      component: "docs FANTASY_2026_27_BRIDGE_ACTIVATION.md / FANTASY_CATALOG_ACTIVATION_RUNBOOK.md",
      builder_type: Builder-Backend,
      change: "state that all 539 opening prices are the neutral fallback; add a pre-stage non-degeneracy check on rating inputs",
    }
constraints:
  - evidence table has no UPDATE path; only rollback deletes it
  - price trigger: 3.50–15.00, multiples of 0.10, insert 4.00–12.50
  - price_version = 1 for all rows; only the movement RPC increments it
  - 42 unmapped players can only carry the fallback price
risks:
  - time box 2026-09-23T00:00Z for any re-stage
  - rollback destroys 539 players/history/evidence and the 3 teams
  - provider may be equally unavailable for fixture details → option A unreachable
  - option B leaves 323 players indistinguishable at 7.20
contradictions:
  - FANTASY_PREACTIVATION_AUDIT.md says missing evidence yields a null rating; production holds 1188 hard-coded neutral rows.
  - FANTASY_2026_27_BRIDGE_ACTIVATION.md presents "priced 4.8–7.2 by the reviewed algorithm" as success; the range is the signature of no evidence.
  - Extractor's uniform_price_flag tests global uniformity only.
unknowns:
  - provider response/entitlement for seasons 26027/24319
  - error codes of the 3 failed backfill runs
  - whether the owner treats the 3 QA teams as disposable
acceptance_tests:
  - "count of evidence rows with rating 6.0 / confidence 0 materially below 539 (today 539)"
  - "player_season_ratings for 2025/26: >1 distinct rating and non-zero minutes"
  - "worker unit test: records_fetched = 0 → run failed, zero rows inserted"
  - "after any re-stage: >1 distinct price per position; evidence = players; one history row per player (initial_catalog_v1); price_version 1"
  - "if option B: bridge doc states the fallback explicitly and a pre-stage degenerate-rating guard exists"
implementation_scope:
  builder_type: Builder-Backend (worker hardening, docs) / Builder-Data (backfill, re-stage under approval)
  allowed_paths:
    [
      supabase/functions/_shared/sportsmonks-player-ratings.ts(+test),
      supabase/functions/_shared/sportsmonks-historical-player-performance.ts(+test),
      new additive migration for a pre-stage guard,
      supabase/tests/database/fantasy_catalog_activation.test.sql,
      docs/backend/FANTASY_CATALOG_ACTIVATION_RUNBOOK.md,
      docs/backend/FANTASY_2026_27_BRIDGE_ACTIVATION.md,
      docs/backend/FANTASY_PREACTIVATION_AUDIT.md,
    ]
  forbidden_paths:
    [
      existing migrations,
      src/backend/fantasy/pricing.ts,
      UI,
      any production write outside the named RPCs or an owner-approved Builder-Data operation,
    ]
status: HALTED_FOR_INPUT
halt_reason: No safe remediation without an owner product decision (A/B/C); option A additionally depends on provider data not in the database and a destructive deletion of 3 teams, all before 2026-09-23T00:00Z.
