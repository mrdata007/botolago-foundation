scripts:
  g7-historical-performance-backfill-runner.ts:
    exported_functions:
      - "export class HistoricalPerformanceBackfillError extends Error"
    env_vars_read: [SPORTSMONKS_API_TOKEN, SUPABASE_SECRET_KEY, CONFIRMATION, GITHUB_ACTIONS, EXPECTED_PROJECT_REF, EXPECTED_COMMIT, GITHUB_SHA, GITHUB_ENV]
    batch_size_lines: |
      11:const BATCH_SIZE = 5;
      93:    fixturesProcessed > BATCH_SIZE ||
      367:    batchSize: BATCH_SIZE,
      431:            batchSize: BATCH_SIZE,
    cursor_resume_mechanism_lines: |
      107:      : numericCursor(response.nextCursor, "invalid_historical_next_cursor");
      113:    throw new HistoricalPerformanceBackfillError("historical_performance_cursor_mismatch");
      418:      let cursor: string | null = null;
      430:            afterFixtureExternalId: cursor,
      436:        const batch = validateHistoricalPerformanceBatch(invocation.response, season.id, cursor);
      450:        cursor = batch.nextCursor;
    behavior_note: "Cursor is per-run in-memory (starts at null each invocation) and driven by afterFixtureExternalId echoed back via checkpoint.nextCursor in football_ingestion_runs; resume across separate GitHub Actions runs relies on reading the last succeeded run's checkpoint.nextCursor and is not automatic within the script."

  g7-historical-performance-backfill-preflight.ts:
    exported_functions: []
    constants: "EXPECTED_PROJECT_REF=tkewgajrljbwgwedqsxn, EXPECTED_FIXTURES_PER_SEASON=240, MAX_BATCHES_PER_SEASON=60, BATCH_SIZE=5, CONFIRMATION=RUN_G7_TWO_SEASON_HISTORICAL_PERFORMANCE_BACKFILL, ALGORITHM_VERSION=botolago-preseason-rating-v2-fixture-performance, RESTORE_SEASON={id:26027,startingAt:2025-09-12,endingAt:2026-07-05}"
    env_vars_read: [G7_BACKFILL_EVIDENCE_DIR, EXPECTED_COMMIT]

