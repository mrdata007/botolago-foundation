traceable_quarantine_marker (owner addendum item 2, REDESIGNED per the second correction): >
  app_private.historical_performance_fixture_coverage (the SAME table every fixture's coverage row
  already lived in -- no second table) now carries coverage_outcome ('accepted'|'quarantined') and
  quarantine_reason, constrained by CHECK to the single explicit value
  'anonymous_starter_rows_exceeded' (not an implicit "absent from a query result"), and further
  constrained so coverage_outcome can never disagree with the measured anonymous_starter_rows fact.
  A later audit reads the fixture's own, single, always-present coverage row -- no join to a second
  table -- to see exactly whether and why it was quarantined, when (provider_observed_at,
  created_at, updated_at), and (unlike the first correction) what the full original audit trail
  (lineup_rows_seen, valid_player_rows, team_count, etc.) was at quarantine time.

all_or_nothing_quarantine (owner addendum item 3): >
  Enforced at TWO independent layers, both regression-tested: (1) worker layer --
  normalizeHistoricalFixture throws historical_fixture_anonymous_starters_exceeded before ever
  returning a `rows` array, so ingestBAtch never even attempts to call the ingest RPC for an
  over-cap fixture (proven by the new end-to-end unit test below, which asserts
  ingest_historical_player_fixture_performance is called exactly zero times for the quarantined
  fixture in a batch that also contains a normal fixture). (2) DB layer, defense in depth -- even
  if a caller bug sent an over-cap fixture's rows to api.ingest_historical_player_fixture_performance
  directly, the RPC raises HISTORICAL_FIXTURE_ANONYMOUS_STARTERS_EXCEEDED before its first mutating
  statement, so zero rows are ever inserted (proven by pgTAP case (c)/(g), executed against a real
  local Postgres, asserting `count(*) = 0` in app.player_fixture_performances for that fixture
  after the rejected call).

