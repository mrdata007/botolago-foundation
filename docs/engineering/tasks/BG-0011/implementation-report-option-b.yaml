third_correction_2026_09_19_critical_wire_format_bug:
  severity: CRITICAL
  what_the_reviewer_found: >
    supabase/functions/_shared/sportsmonks-historical-player-performance.ts built the ACCEPT-path
    `coverage` object without an `identifiedStarterRows` key -- only the QUARANTINE path's
    diagnostic copy had that key added (via a spread-and-override). The two paths were supposed to
    be symmetric and were not: whoever (this Builder, in an earlier round) added the new BG-0011
    fields patched the quarantine diagnostic but never went back to the base `coverage` object the
    accept path also uses. Since `api.ingest_historical_player_fixture_performance` reads
    `identified_starter_rows := (p_coverage ->> 'identifiedStarterRows')::integer` and immediately
    rejects the call with INVALID_PROVIDER_PAYLOAD when that resolves to SQL NULL, EVERY SINGLE
    accepted historical fixture ingest call -- not just the 2 quarantined outliers, all 238 meant
    to succeed -- would have failed outright in real use. This is a total regression of this task's
    entire purpose, and it shipped past two prior rounds of "758/758 bun, 911/911 pgTAP, all green"
    reporting from this Builder.
  why_this_builder_s_own_tests_never_caught_it (root-cause self-assessment, not just the fix): >
    (1) The bun unit tests mock the Supabase RPC client and assert with `toMatchObject`, a SUBSET
    match -- a payload missing a key never fails a `toMatchObject` assertion that doesn't name that
    key, and none of this task's tests asserted the FULL shape of `p_coverage`. (2) The pgTAP tests
    call the SQL RPCs with JSONB literals this Builder hand-wrote directly in the .sql file, always
    including every field a human remembers to type -- they never once passed the REAL object the
    TypeScript code actually produces. The TS-to-SQL wire format itself had never been exercised
    end to end by anything in this branch until this round. Both are real, structural gaps in this
    Builder's own test discipline, not bad luck; the fix below closes the gap with a new test
    category, not just a one-line patch to the symptom.
  the_fix: >
    supabase/functions/_shared/sportsmonks-historical-player-performance.ts: the `coverage` object
    (previously built once, then used as-is for the accept-path return and separately
    spread-and-overridden for the quarantine diagnostic) now includes `identifiedStarterRows:
    starterRows` directly, at its single point of construction, so BOTH the accept-path return and
    the quarantine-path diagnostic use the exact same, already-complete object -- eliminating the
    class of bug (two call sites reading one shared object, only one of them patched) rather than
    just adding the missing key back. Confirmed `anonymousStarterRows` was already present in this
    object (only `identifiedStarterRows` was missing).
  new_test_category_added: >
    scripts/backend/historical-performance-e2e-wire-format.test.ts (NEW). No precedent for a
    bun:test file that talks to a running local Postgres existed in this repo (every other
    *.test.ts mocks its dependencies; every DB-level test is a pgTAP .test.sql run via
    `supabase test db`). This file uses Bun's built-in `Bun.SQL` client (ships with Bun 1.3.11,
    no new package dependency) pointed at the local stack's direct Postgres port
    (`supabase/config.toml`'s `[db] port`, 55322). It (1) calls the REAL, unmocked
    `normalizeHistoricalFixture` with a realistic synthetic SportsMonks-shaped payload for an
    accepted fixture (3 anonymous starters, within the 0-4 cap), (2) takes its REAL returned
    `coverage`/`rows`/`sourceVersion` completely unmodified (only remapping team/player external
    ids to ones seeded in the local DB, which stands in for the provider-mapping step, not for the
    coverage/rows shape itself), (3) sends them to the REAL `api.ingest_historical_player_fixture_performance`
    RPC running in the REAL local Postgres, and asserts it succeeds (not INVALID_PROVIDER_PAYLOAD).
    It does the mirror image for a quarantined fixture (6 anonymous starters) against
    `api.quarantine_historical_player_fixture_performance`. If it cannot reach a local Postgres
    within 3 seconds, every test in the file is skipped with an explicit console message (so it
    never breaks `bun test` for a contributor without a local stack running) -- for THIS task's own
    verification it was confirmed to actually run, not skip (see results below). It cleans up its
    own seed rows in `afterAll` so repeated runs against the same local stack are idempotent
    (verified by running it twice in a row with no reset in between).
  sibling_instance_check (explicitly requested by the reviewer): >
    Grepped every `->> '<key>'` read in the new migration
    (20260919120000_historical_anonymous_starter_tolerance.sql) against the TypeScript object(s)
    that produce the value sent as that RPC's jsonb parameter: (1) per-row fields (externalPlayerId,
    externalTeamId, started, appeared, minutes, goals, assists, cleanSheets, goalsConceded, saves,
    penaltiesSaved, penaltiesMissed, yellowCards, redCards, secondYellowDismissals, ownGoals,
    providerRating) match the `HistoricalPlayerPerformanceRow` interface exactly, key for key --
    this interface is unconditionally fully populated (built once in `emptyPerformance()` then
    mutated, never partially), so there is no missing-key risk of this class here. (2) The coverage
    object's 8 SQL-read keys (anonymousStarterRows, identifiedStarterRows, lineupRowsSeen,
    validPlayerRows, excludedIncompleteRows, teamCount, detailRows, invalidDetailRows) are all now
    present on the single object both RPCs consume (the fix above). (3) No other TS-built object in
    this task's changed files is sent as a jsonb RPC parameter read via `->>` in SQL. This was the
    only instance of this bug class in this branch's changes, and the new e2e test (not just this
    manual grep) is what would catch a future recurrence.

second_correction_2026_09_19:
  issue_1_quarantine_table_was_delete_then_reinsert:
    finding: >
      The first correction's app_private.historical_performance_fixture_quarantine table was a
      genuine delete-then-reinsert-elsewhere pattern: api.quarantine_historical_player_fixture_performance
      deleted the fixture's app_private.historical_performance_fixture_coverage row and inserted a
      thinner row into a different table, carrying none of lineup_rows_seen / valid_player_rows /
      excluded_incomplete_rows / detail_rows / invalid_detail_rows / team_count / source_version /
      provider_observed_at. The pgTAP tests proved the fixture/player/mapping rows survived but
      never proved the COVERAGE row survived, because it didn't.
    fix: >
      Single-table redesign. app_private.historical_performance_fixture_quarantine is DELETED from
      this migration entirely -- it does not exist anywhere in this branch (verified by
      `grep -rn historical_performance_fixture_quarantine` across supabase/, docs/, scripts/: the
      only remaining hits are prose in docs describing this history). Instead,
      app_private.historical_performance_fixture_coverage gained coverage_outcome
      ('accepted'|'quarantined') and quarantine_reason columns.
      api.quarantine_historical_player_fixture_performance now UPSERTs the SAME row a fixture has
      always had (or its first-ever row), mirroring api.ingest_historical_player_fixture_performance's
      p_coverage shape exactly (p_source_version + p_coverage, not two bare integers), carrying the
      full audit trail. Contains NO DELETE statement. Accepting a fixture again
      (api.ingest_historical_player_fixture_performance) flips the SAME row's coverage_outcome back
      to 'accepted' and clears quarantine_reason via its ordinary ON CONFLICT DO UPDATE -- also no
      DELETE.
    constraint_redesign: >
      historical_performance_coverage_counts_check now derives coverage_outcome from the facts
      (`(coverage_outcome = 'quarantined') = (anonymous_starter_rows > 4)`) and forces a quarantined
      row's starter_rows/performance_rows to exactly 0 at the constraint level via a CASE
      expression, not by RPC discipline alone. One subtlety this required fixing after the first
      local pgTAP run failed on it: the pre-existing (immutable) historical_performance_coverage_reconciled_check
      requires `not reconciled or performance_rows = valid_player_rows`; since a quarantined row's
      performance_rows is forced to 0 while valid_player_rows keeps the audit value, `reconciled`
      must be `false` for a quarantined row. This is correct, not a weakening: every query that
      matters (api.football_historical_player_rating_inputs) filters explicitly by
      `coverage_outcome = 'accepted'`, not by `reconciled`, so a quarantined row's reconciled value
      has no bearing on it being (correctly) excluded.
    difficulty_encountered_and_resolved: >
      Getting the constraint predicate right took three real local-Postgres iterations (see
      bugs_found_and_fixed_by_this_run below) -- this is disclosed plainly rather than presented as
      clean on the first attempt. All three were found and fixed via actual execution, not left as
      known issues.
  issue_2_scope_comment_was_factually_wrong:
    finding: >
      The migration's header comment claimed "the live current-season Fantasy scoring/ingestion
      path uses ENTIRELY SEPARATE tables and RPCs" naming a table
      (app_private.current_finished_fixture_coverage) and an RPC
      (api.ingest_current_finished_fixture_performance) that DO NOT EXIST.
      20260914200726_current_finished_fixture_performances.sql instead ADDS COLUMNS to the SAME
      app_private.historical_performance_fixture_coverage and app.player_fixture_performances
      tables this migration modifies, via api.ingest_current_player_fixture_performance (the real
      RPC name). That data is read by app_private.fantasy_scoring_input_document
      (20260914200719_fantasy_scoring_worker_contracts.sql), called from
      app_private.fantasy_assert_scoring_snapshot in the live gameweek-finalization path
      (20260914200730_fantasy_verified_finalization.sql) -- confirmed not to be dead code.
    fix: >
      The migration's header comment is corrected to state this plainly (see the file itself) and
      names the three real files. Real safety now rests on: (1) row-level season-status scoping
      (unchanged, was already correct); (2) a NEW hard CHECK constraint,
      `anonymous_starter_rows = 0 or source_version ~ '^sportsmonks-fixture:[0-9a-f]{64}$'`, making
      it a Postgres-enforced impossibility (not an accident of defaults) for a current-season row
      to ever carry a nonzero anonymous-starter count; (3) column-default compatibility with the
      unmodified current-season RPC's existing insert. Both (2) and (3) are now regression-tested
      against a real local Postgres (see per_case_mapping items scope-1/scope-2 below).

summary: >
  Implemented option (b) from engineering-brief-a1-starter-rows.yaml, using BG-0044's measured
  coverage (238/240, exactly 2 outliers: fixtures 19596474 and 19596475) rather than the earlier
  estimate (237/240, cap 3). The old rule (exactly 22 identified starters) is replaced by: exactly
  22 raw provider starters (unchanged, universal), of which at most 4 may be anonymous; a fixture
  with more than 4 anonymous starters is quarantined entirely -- ALL of its rows, including its
  14-15 identified-player rows, are excluded, not just the anonymous ones. Scope is limited to the
  historical (completed-season) SportsMonks ingestion path by table/RPC/source-version/
  season-status separation from the live current-season path (all four levels, detailed in the
  engineering brief, and now regression-tested end to end -- see below). Pricing/rating formulas
  were not touched.

