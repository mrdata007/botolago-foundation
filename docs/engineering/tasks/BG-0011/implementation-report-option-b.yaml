why_the_probe_test_rewrites_are_not_cosmetic: >
  scripts/backend/sportsmonks-historical-performance-probe.ts directly imports and calls
  normalizeHistoricalFixture, so it is not a mock of the worker -- it is a second real execution of
  it. Several of its existing test fixtures used the OLD workaround shape of "N declared starters +
  M anonymous starter rows" where N + M did not equal 22 (a pattern that only worked because the
  old worker code never checked the raw total, only the identified count). Under the new
  raw_starter_rows_mismatch check, those shapes now trip an invariant they were never meant to
  exercise. Each rewritten fixture keeps the SAME intended failure mode (e.g. "more than 100
  lineup rows", "fewer than 22 identified rows", "more than 20 excluded rows") while making the raw
  starter total correctly sum to 22, using anonymous *substitutes* (which do not affect the starter
  count) instead of anonymous *starters* wherever the test was not specifically about anonymous
  starters. The one test genuinely about the halting fixture (19489216) was changed from 1
  anonymous starter (now correctly accepted, no longer representative of a failure) to 5 (one over
  the cap), since 1 anonymous starter is exactly the case this task makes newly acceptable.

