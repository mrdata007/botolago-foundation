no_delete_confirmation (owner addendum item 1): >
  Confirmed by direct grep of every file this task touches: the only `delete from` statements
  anywhere in this branch's changes are (1)
  `delete from app_private.historical_performance_fixture_coverage where fixture_id = ...` inside
  api.quarantine_historical_player_fixture_performance (clears a stale coverage row belonging to
  THIS TASK'S OWN bookkeeping table if a fixture that was previously accepted is later
  re-quarantined -- an edge case that, per the production finding above, has never actually fired
  for either outlier fixture in production, since neither ever had a coverage row) and (2)
  `delete from app_private.historical_performance_fixture_quarantine where fixture_id = ...`
  inside api.ingest_historical_player_fixture_performance (the reverse transition, clearing a
  stale quarantine record if a fixture is later accepted). Neither statement, nor any other
  statement in this branch, ever deletes from app.fixtures, app.players,
  app_private.football_provider_mappings, or app.player_fixture_performances (the last of these is
  only ever soft-deactivated via `active = false`, never row-deleted, exactly as the pre-existing
  code already did). Fixture records, player identities/relationships, and provider-mapping audit
  evidence for the two outlier fixtures (and every other fixture) remain fully intact and
  retrievable under this migration -- proven by regression test (k) below, executed against a real
  local Postgres.

traceable_quarantine_marker (owner addendum item 2): >
  app_private.historical_performance_fixture_quarantine (new table, this migration) records, per
  fixture: anonymous_starter_rows, identified_starter_rows, and a `reason` column constrained by
  CHECK to the single explicit value 'anonymous_starter_rows_exceeded' (not an implicit
  "absent from a query result"). A later audit can join this table to app.fixtures /
  app_private.football_provider_mappings to see exactly which fixtures were quarantined, when
  (provider_observed_at, created_at, updated_at), and why.

all_or_nothing_quarantine (owner addendum item 3): >
  Enforced at TWO independent layers, both regression-tested: (1) worker layer --
  normalizeHistoricalFixture throws historical_fixture_anonymous_starters_exceeded before ever
  returning a `rows` array, so ingestBAtch never even attempts to call the ingest RPC for an
  over-cap fixture (proven by the new end-to-end unit test below, which asserts
  ingest_historical_player_fixture_performance is called exactly zero times for the quarantined
  fixture in a batch that also contains a normal fixture). (2) DB layer, defense in depth -- even
  if a caller bug sent an over-cap fixture's rows to api.ingest_historical_player_fixture_performance
  directly, the RPC raises HISTORICAL_FIXTURE_ANONYMOUS_STARTERS_EXCEEDED before its first mutating
  statement, so zero rows are ever inserted (proven by pgTAP case (c)/(g), executed against a real
  local Postgres, asserting `count(*) = 0` in app.player_fixture_performances for that fixture
  after the rejected call).

