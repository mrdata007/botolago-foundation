      - "the derive_ratings response carries action derive_ratings, historicalOnly true, algorithmVersion botolago-preseason-rating-v2-fixture-performance, ratingRange.minimum >= 4 and < maximum <= 10, candidates 100..1000, counters.rejected 0"

