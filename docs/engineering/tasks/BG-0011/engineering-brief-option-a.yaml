required_changes:
  - step: A0
    component: "diagnosis — .github/workflows/g7-sportsmonks-historical-performance-coverage.yml (or g7-sportsmonks-historical-coverage-audit.yml)"
    builder_type: Builder-DevOps
    change: >
      Re-point the read-only probe ticket at fixture 19489216 (plus a random sample of, ideally all,
      240 season-26027 fixtures) and dispatch it. Classify each fixture against the six worker
      invariants and report the count of non-conforming fixtures per season.
    reason: "The only evidence that would have answered this (run artifacts) expired on 2026-09-01; without this number step A2's feasibility and duration are unknowable."
    blocking_dependency: none — read-only, needs only SPORTSMONKS_API_TOKEN and an owner dispatch
    duration: "~10 min including dispatch"
    acceptance: "a machine-readable classification listing, per fixture, lineupRows/validRows/starterRows/teamCount/invalidDetailRows and pass|fail; the failing invariant of 19489216 is named"

  - step: A1
    component: "go/no-go gate"
    builder_type: None (Chief)
    change: >
      If A0 shows a handful of non-conforming fixtures → proceed to A2 with a worker relaxation.
      If it shows a large share, or that the provider lineup depth is systematically below 22 starters
      → Option A is UNREACHABLE; escalate to the owner for B or C before 2026-09-21T12:00Z.
    reason: "protects the time box; there is no second attempt after 2026-09-22T22:30Z"
    duration: "same day as A0"

  - step: A2
    component: "supabase/functions/_shared/sportsmonks-historical-player-performance.ts (+ .test.ts)"
    builder_type: Builder-Backend
    change: >
      Replace the hard abort in normalizeHistoricalFixture with a bounded, explicit and auditable
      handling of a non-conforming fixture, matching the pattern migration 20260802010200 already
      established for mapping failures: count the fixture as `excludedCoverageFixtures`, persist
      nothing for it, continue the batch, and fail the run only when the count exceeds a small reviewed
      ceiling. Propagate the count through the batch response, the runner's
      validateHistoricalPerformanceBatch and the evidence file. Do NOT weaken the per-row invariants of
      an ACCEPTED fixture.
    reason: >
      One provider defect currently blocks 100% of the dataset; the rating inputs need coverage of the
      finished fixtures, and the exact-240 rule is the reason nothing at all has landed.
    coupled_change: >
      api.football_historical_player_rating_inputs currently demands covered_fixture_count = every
      finished fixture (20260802010100:578-593). If any fixture is legitimately excluded, this must be
      relaxed in a NEW additive migration to a reviewed minimum share (e.g. >= 95% of finished fixtures
      AND performanceCount >= coveredFixtures * 22), never by editing 20260802010100.
    reason_coupled: "otherwise derive_ratings still raises HISTORICAL_PERFORMANCE_INCOMPLETE and the backfill is pointless"
    blocking_dependency: A0/A1
    duration: "half a day incl. unit tests and review"
    acceptance: "unit test: a batch containing one invariant-breaking fixture completes, persists the conforming fixtures, and reports the exclusion; a batch above the ceiling still fails with an explicit code"

  - step: A3
    component: ".github/workflows/ (new) g7-historical-performance-backfill-dispatch.yml + scripts/backend/g7-historical-performance-backfill-runner.ts"
    builder_type: Builder-DevOps
    change: >
      Smallest viable change set, in this order of preference:
      (i) add a `season_ids` workflow input (default "26027,24319") and relax validateManifest from
          "exactly [26027,24319]" to "a non-empty subset of the reviewed pair", so 26027 can run alone;
      (ii) add a `skip_deploy` boolean input that skips the link / db push / functions deploy steps when
          the deployed artifact already matches the reviewed commit — production football-ingest is
          already at the required version 53, and every required migration is already applied, so these
          steps only consume the management credential without changing anything;
      (iii) fix RESTORE_SEASON to the CURRENT provider season rather than the literal 26027, or read it
          from a required workflow input, so the finally block cannot strand production on a completed
          season.
      The `supabase secrets set/unset` calls MUST stay — they are what makes the run target the right
      season and what retires the one-time trigger secret. Keep every existing guard
      (actor/ref/repo, GITHUB_RUN_ATTEMPT == 1, CONFIRMATION string, EXPECTED_COMMIT == GITHUB_SHA,
      ticket JSON verification, concurrency group botolago-production-v2-mutation, evidence sanitisation
      and credential scan) and extend the hardcoded expected-ticket JSON to the new inputs.
    reason: "halves the exposure and the runtime, removes two unnecessary management-API operations, and repairs a latent production-config bug"
    blocking_dependency: "A2 merged; dispatching still requires BG-0002"
    duration: "half a day"
    acceptance: "workflow dry-run on a non-production ref proves the guards still fail closed on a wrong commit / wrong confirmation / attempt 2"

  - step: A4
    component: "production data — G7 backfill + v2 rating derivation for season 26027"
    builder_type: Builder-Data
    change: >
      Owner-dispatches the workflow at the reviewed commit with
      CONFIRMATION=RUN_G7_TWO_SEASON_HISTORICAL_PERFORMANCE_BACKFILL, season_ids=26027,
      skip_deploy=true. The runner writes the function secrets (SEASON_ID 26027 + a fresh 64-hex
      trigger secret), then POSTs
      https://tkewgajrljbwgwedqsxn.supabase.co/functions/v1/football-ingest
      with headers `x-botolago-ingestion-job: historical_player_performances`,
      `x-botolago-ingestion-key: <trigger>`, apikey/Authorization = SUPABASE_SECRET_KEY, body
      {"job":"historical_player_performances","action":"ingest_batch","afterFixtureExternalId":<cursor|null>,"batchSize":5}
      for up to 60 batches, then once
      {"job":"historical_player_performances","action":"derive_ratings"} — which is the call chain that
      reaches api.football_historical_player_rating_inputs and then
      api.ingest_historical_player_season_ratings (worker line ~945). It finally restores the
      production season secret and unsets the trigger secret.
    reason: "this is the only supported path that produces botolago-preseason-rating-v2-fixture-performance rows"
    guards: >
      Runs under concurrency group botolago-production-v2-mutation; must not overlap Gate 4. Cursor is
