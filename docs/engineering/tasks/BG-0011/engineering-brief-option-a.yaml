risks:
  - severity: CRITICAL
    risk: "service_rollback_fantasy_catalog fails on app.fantasy_leagues (4 rows, RESTRICT, not deleted by the RPC). If discovered only at execution time, the transaction aborts and the time box burns."
    mitigation: "step A7 deletes the leagues first; verified by pg_get_functiondef, not assumed."
  - severity: CRITICAL
    risk: "Fixture 19489216's defect may be systemic across many of the 240 fixtures, making 240/240 unreachable at any effort."
    mitigation: "step A0 measures it read-only before anything is committed; A1 is an explicit no-go gate."
  - severity: CRITICAL
    risk: "BG-0002 is not resolved in time. Every hour of delay compresses A2–A5 against a deadline that cannot move."
    mitigation: "escalate now; A0/A1 proceed in parallel so the go/no-go is not also waiting on the credential."
  - severity: HIGH
    risk: "Between A8 (rollback) and A11 (open) production has no fantasy season and api.fantasy_hub returns fantasy_season_closed — the public site shows the unavailable banner."
    mitigation: "run A7+A8+A9+A10 in ONE transaction and A11 within minutes; announce a maintenance window; never start the sequence without a green A5."
  - severity: HIGH
    risk: "Digest drift between A9 and A10 (PT409 stale_update), e.g. a provider fixture/round ingestion or an orchestrator dispatch."
    mitigation: "single transaction; FANTASY_AUTOMATION_ENABLED stays unset; no ingestion workflow dispatched during the window."
  - severity: HIGH
    risk: "A4 runs but derive_ratings still yields a narrow band, so prices barely differentiate and the destructive rollback buys nothing."
    mitigation: "A5 is a hard gate evaluated on fantasy_catalog_candidates BEFORE any deletion; the catalog is not touched if it fails."
  - severity: MEDIUM
    risk: "The runner's RESTORE_SEASON=26027 strands the production ingestion runtime on the 2025/26 season after A4, breaking current-season ingestion."
    mitigation: "A3 item (iii); otherwise a manual secret restore to 28647 must be part of A4's checklist."
  - severity: MEDIUM
    risk: "Confidence is applied twice (once in the worker rating, once in fantasy_initial_price_v1's 6+(r-6)*c), so the realised spread will be narrower than the 4.0–12.5 bands suggest; the owner may find it underwhelming after a destructive rollback."
    mitigation: "A9's priceRange is shown to the owner before A10 commits."
  - severity: MEDIUM
    risk: "The 42 unmapped players and any player with no 2025/26 appearance keep the 6.0/0 fallback; some clubs (Tiznit, Témara, MA Tétouan) are bridged from public lists and will be largely undifferentiated."
    mitigation: "state it in the bridge doc; it is correct behaviour, not a defect."
  - severity: LOW
    risk: "A4 re-processes the six already-covered fixtures (cursor starts at null); on conflict they update in place."
    mitigation: "verified idempotent by the ON CONFLICT (fixture_id) DO UPDATE and by run da1a4d96 having updated 188 rows with 0 inserts."

contradictions:
  - "docs/backend/FANTASY_2026_27_BRIDGE_ACTIVATION.md step 1 states app.seasons 2026/27 ends_on was corrected from 2026-09-24 to 2027-06-30. Production reads ends_on = 2026-09-24 with updated_at 2026-09-18T10:06:23Z — a provider ingestion reverted it today. This also explains the source-digest drift, and it means the preview blocker `season_ended` (ends_on < current_date) starts firing on 2026-09-25, i.e. the season row itself will block any activation after kickoff day."
  - "The handoff (and LAUNCH_LEDGER BG-0011) time-box Option A to 2026-09-23T00:00Z. The stage gate is indeed 2026-09-23T00:00Z, but api.service_open_fantasy_registration closes at 2026-09-22T22:30Z. A plan built to the stated box would stage a catalog it could never open."
  - "The handoff asks for the failed runs' sanitized JSON. It no longer exists: all three artifacts expired on 2026-09-01 and the API returns 410. The failure codes survive only because commits 2b204b5 and bb092bd copied them into the runner source with matching sha256 digests."
  - "docs/backend/FANTASY_CATALOG_ACTIVATION_RUNBOOK.md promises 'clean rollback'. The rollback is not clean: it ignores app.fantasy_leagues, app.fantasy_league_memberships and app_private.fantasy_mutation_audit, all RESTRICT, and will therefore fail on any season that ever had a user league."
  - "The G7 ticket and preflight pin the scope to two seasons at 240 fixtures each (480), while the pricing path provably consumes only the latest completed season. Half of the reviewed blast radius delivers no product value."

