rollback_plan:
  principle: >
    The destructive sequence is deliberately ordered so that everything irreversible happens last and
    only after a green, read-only proof. Nothing before step A7 changes fantasy state.
  before_A7: "Abort freely. A0–A6 are read-only or additive (ratings ingestion is season-scoped and touches no fantasy table); the live catalog keeps serving the uniform prices."
  during_A7_A10: >
    Run A7, A8, A9 and A10 in a SINGLE transaction. Any failure — the league FK, PT409 stale_update,
    PT409 fantasy_catalog_not_ready, fantasy_catalog_integrity_failed — rolls the whole thing back and
    leaves the 2026-09-17 catalog, the 3 teams, the 4 leagues and GW1 3cc19aaa intact and still open.
    This is the primary and strongly preferred safety mechanism.
  if_the_transaction_was_split_and_A10_fails_after_A8_committed:
    - "Production is left with no fantasy season (fantasy_hub → fantasy_season_closed) and the old activation marked rolled_back."
    - "Forward recovery is the only path: re-run A9 and A10 with a FRESH digest and idempotency key …0005, then A11. There is no un-rollback RPC and the deleted players/teams/leagues cannot be restored by any supported operation."
    - "If A10 cannot be made to pass before 2026-09-22T22:30Z, escalate immediately: the season cannot be opened for this kickoff. The A6 export is the only record of the deleted state; restoring it would require a hand-written, owner-approved data migration outside every reviewed path — treat it as a last resort, not a plan."
  if_A11_fails_after_A10_succeeded:
    - "The catalog is staged but private; the site still shows fantasy_season_closed."
    - "Re-issue A11 with a new idempotency key (…0006) and the SAME digest, provided the deadline is still more than 24 h away; the stage itself is reusable and idempotent under its own key."
    - "If the deadline gate has closed, the staged catalog cannot be opened for GW1. Options: correct the 2026/27 season calendar (see contradictions — ends_on and the placeholder kickoff) so a later gameweek becomes the first, or roll back the new stage (now legal: no teams exist) and ship B."
  if_A4_fails:
    - "No fantasy state has changed. The backfill is resumable: re-dispatch with a fresh confirmation (GITHUB_RUN_ATTEMPT must be 1, so a new dispatch, not a re-run). Coverage rows already written are idempotently updated."
    - "The one durable side effect to check is the production function secrets: confirm FOOTBALL_SPORTSMONKS_SEASON_ID is back to the current season (28647) and FOOTBALL_INGESTION_TRIGGER_SECRET is unset."

