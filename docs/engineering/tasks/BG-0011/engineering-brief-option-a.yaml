root_cause:
  classification: VERIFIED
  description: >
    The G7 two-season backfill is halted 6/240 fixtures into season 26027 because the edge worker
    aborts an entire batch — and therefore the entire season — on the first SportsMonks fixture whose
    lineup payload violates its strict coverage invariants, and that fixture is external id 19489216,
    the very next fixture after the last successful cursor 19489214. Run 1's distinct failure
    (`mapping_not_found`, an unmapped provider lineup player raising P0002 inside
    api.ingest_historical_player_fixture_performance) was already repaired by commit 2b204b5 /
    migration 20260802010200 and is not a live cause. There is no per-fixture quarantine for coverage
    failures the way there now is for mapping failures, and both the runner
    (fixturesProcessed == 240) and api.football_historical_player_rating_inputs
    (covered == expected finished fixtures, performanceCount >= 5280) are all-or-nothing, so one bad
    provider fixture blocks every v2 rating and therefore every differentiated price.
  secondary:
    classification: VERIFIED
    description: >
      Independently of the data defect, the pipeline cannot be executed at all today: the runner and
      the workflow both drive the Supabase Management API (supabase link / db push / functions deploy /
      secrets set / secrets unset) and the edge worker takes its target season and trigger secret from
      function secrets that the last run deliberately unset. BG-0002 (invalid SUPABASE_ACCESS_TOKEN,
      HTTP 401) is a hard blocker on every write path of Option A's step 1.
  unresolved:
    classification: UNKNOWN
    description: >
      Which specific invariant fixture 19489216 breaks, and how many of the remaining 234 fixtures of
      2025/26 (and of the 240 of 2024/25) break it too. Until that is measured, the size of the fix is
      not known and step 1 cannot be scheduled with confidence.

hard_dependencies_on_human_action:
  - id: BG-0002
    type: HARD BLOCKER for steps A2–A4 (the ratings backfill)
    statement: >
      Option A step 1 cannot start until a valid Supabase Management API credential exists, because the
      target season and the one-time trigger secret must be written into the football-ingest function's
      secrets before any HTTP invocation, and the workflow additionally runs link/db push/functions deploy.
    acceptable_alternatives:
      - Refresh SUPABASE_ACCESS_TOKEN in the GitHub environment `production-admin-activation` (the
        ledger's stated remedy).
      - OR the owner sets the two function secrets by hand in the Supabase dashboard
        (FOOTBALL_SPORTSMONKS_SEASON_ID=26027 and a fresh FOOTBALL_INGESTION_TRIGGER_SECRET, restoring
        FOOTBALL_SPORTSMONKS_SEASON_ID=28647 afterwards) and a deploy-free dispatch workflow performs
        only the HTTP invocations with SUPABASE_SECRET_KEY. This removes the token dependency but
        substitutes a manual, error-prone secret edit on a live ingestion runtime and is NOT recommended.
    not_blocking: >
      Steps A0 and A1 (read-only provider classification) and steps A5–A11 (fantasy rollback/re-stage,
      which run against the database with SUPABASE_SECRET_KEY / an owner psql session) do NOT need it.
  - id: BG-0011-OWNER-1
    type: HARD approval, already granted by choosing A
    statement: >
      Explicit owner approval to permanently delete 3 fantasy_teams, 53 squad memberships, 8 transfer
      batches, 8 transfers, 3 lineups, 45 lineup players, 4 leagues, 4 league memberships, 16 mutation
      audit rows, 539 fantasy players, 539 price-history rows and 539 initial-price-evidence rows.
      Treated here as given; the Builder-Data must still re-confirm the counts immediately before deleting.
  - id: BG-0004
    type: MUST REMAIN UNSET
    statement: >
      FANTASY_AUTOMATION_ENABLED must stay unset and the orchestrator must not be dispatched from the
      start of the rollback until after the re-stage is verified, or a calendar sync can move rounds or
      fixtures between preview and stage and cause PT409 stale_update.
  - id: BG-0011-OWNER-2
    type: DECISION required before A2
    statement: >
      Whether to accept a scope reduction to season 26027 only (2024/25 is provably not needed for
