judgment_calls:
  - topic: "Parity-test exception for post_gate4_baseline"
    finding: ACCEPTED
    reasoning: >
      test_workflow_batch_choices_match_the_manifest_batches_in_order compares
      the workflow options to BATCHES keys minus post_gate4_baseline. The
      VerificationReport (V8) shows 0 occurrences of post_gate4_baseline in
      the workflow on origin/main and in every prior workflow revision; the
      promoter comment documents it as promoted via separately reviewed
      provider canaries and retained only so later batches can prove the
      chain. The exception therefore encodes existing behaviour rather than
      creating a new exclusion, and adding the option to the workflow would
      have been a scope expansion. The test still fails closed: any future
      batch added to BATCHES without a workflow option breaks it (mutation
      check V5 confirms the inverse direction too). This is not a requirement
      expansion and not a weakening of any existing test.
  - topic: "Ordering consequence: 57-file history prefix"
    finding: ACCEPTED
    reasoning: >
      batch_history_prefix("fantasy_deadline_guard") returns 57 files ending
      in 20260918120000_fantasy_calendar_sync.sql. assert_history (unchanged)
      requires remote_versions[:57] == those 57 versions, then requires the
      remainder to be an exact prefix (possibly empty) of the two new
      versions, and rejects anything beyond them. Promotion of
      fantasy_deadline_guard will thus assert that Production V2 already
      holds 20260918120000 with its canonical single-statement SHA-256 row,
      and will accept either zero or one of the new versions already applied
      (safe partial-resume). This is the intended fail-closed chain
      semantics: the batch is unreachable until fantasy_calendar_sync has
      been promoted, which the objective records as done on 2026-09-18. If
      production were missing that row the run stops at the read-only
      preflight with "remote migration history does not match the required
      prior batches" before any mutation. No weakening was needed or made.
  - topic: "Two BG-0003 files in one batch rather than two batches"
    finding: ACCEPTED
    reasoning: >
      The objective specifies a single batch containing both files; the
      promoter already supports multi-file batches and assert_history handles
      a partially applied batch as an exact prefix. Consistent with the brief.
