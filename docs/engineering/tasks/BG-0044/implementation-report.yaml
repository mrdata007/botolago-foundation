    description: >
      lineupPayload gains anonymousSubstitutes (rows without player_id declared type 12) and
      anonymousHint (player_name/jersey_number copied onto anonymous rows). New tests: the
      19489216 shape (22 raw starters, one anonymous starter + one anonymous substitute ->
      starterRows 21, rawStarterRows 22, rawSubstituteRows 18, anonymousStarterRows 1,
      anonymousSubstituteRows 1, anonymousRowsWithTeamId 2, failures
      [starter_rows_mismatch], identityTolerantPass true); five anonymous starters ->
