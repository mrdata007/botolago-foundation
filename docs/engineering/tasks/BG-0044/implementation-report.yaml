changes:
  - file: scripts/backend/sportsmonks-historical-performance-probe.ts
    description: >
      Read-only extension of the BG-0034 invariants pass; the worker call and every invariant
      are untouched. New exported pure function rawLineupCounters(payload): a second pass over
      the SAME payload.data.lineups array normalizeHistoricalFixture iterates (no extra
      request) that reads type_id on every record row BEFORE the identity test and returns
      counts only: rawStarterRows (type_id 11 over all record rows), rawSubstituteRows
      (type_id 12), anonymousStarterRows (type_id 11 and player_id null/undefined),
      anonymousSubstituteRows (type_id 12 and player_id null/undefined),
      anonymousRowsWithTeamId (anonymous rows of any type whose team_id is a positive
      integer), anonymousRowsWithNameOrJersey (anonymous rows carrying a non-blank
      player_name string or a finite jersey_number; blank strings do not count). Non-record
      rows are skipped (they cannot carry a type); all six counters are null when the payload
      has no lineups array. New exported identityTolerantPass(counters, failures) =
      rawStarterRows === 22 && anonymousStarterRows <= 4 && every failure code is
      starter_rows_mismatch (so an empty failures list, i.e. a worker pass, also reads true;
      any other coverage code or a row-level abort code reads false; null counters read false).
      classifyFixtureInvariants merges the counters and identityTolerantPass into every row it
      returns (pass, coverage-failure and row-level-abort branches alike); `pass` and
      `failures` are still exactly the worker's verdict. Season summary gains
      rawStarterExactly22 (rows with rawStarterRows === 22), identityTolerantPassing and
      anonymousStarterHistogram (string key = anonymousStarterRows value -> fixtures; rows
      with null counters are not keyed). Evidence top level gains invariantCounters:
      "anonymous-starters-v1" (new constant HISTORICAL_PERFORMANCE_INVARIANT_COUNTERS);
      providerPayloadIncluded stays false; the credential-in-evidence guard is unchanged.
      HISTORICAL_PERFORMANCE_REQUEST_ID -> g7-historical-performance-coverage-2026-09-18-02.
      main()'s PASS log line additionally prints identityTolerantPassing. Request count,
      pacing, includes and filters are unchanged.
