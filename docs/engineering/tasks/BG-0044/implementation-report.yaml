      neither the value, "77", "player_name" nor "jersey_number" appears in the serialized row,
      blank name not counted; null counters for a non-array lineups payload and counting of
      non-record / team-less rows. Existing exact-equality rows (worker pass, invalid-detail
      abort, 19489216 in the 240-fixture run) extended with the seven new keys; the
