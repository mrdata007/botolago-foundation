  - id: DEF-1a
    statement: the calendar sync must never derive a window/deadline from a placeholder (mixed rounds)
    assessment: VERIFIED-by-evidence
    evidence: >
      supabase/migrations/20260918140000_fantasy_calendar_sync_unconfirmed_guard.sql.
      My own `diff -u` against 20260918120000 shows five hunks only: header
