criteria:
  - id: OBJ-detect
    statement: detects an open/scheduled gameweek approaching its deadline while a counting fixture carries an unconfirmed 00:00 UTC placeholder kickoff
    assessment: VERIFIED-by-evidence
    evidence: >
      supabase/migrations/20260918130000_fantasy_deadline_watch.sql — loop over
      status in ('scheduled','open'), count filter on
      `not app_private.fantasy_kickoff_confirmed(f.kickoff_at)` over
      `a.superseded_at is null and a.counts_points`, `continue when unconfirmed = 0`,
      `continue when hours > p_warn_hours`. Placeholder predicate reused, not
      redefined (no second definition in TypeScript). Live rehearsal R1 /
      verification (i): GW1 3cc19aaa-ea33-4909-845b-db33314b4071, sequence 1, open,
      deadlineAt 2026-09-23T22:30:00+00:00, unconfirmedFixtures 8,
      totalCountingFixtures 8, deadlineDerivedFromPlaceholder true.
  - id: OBJ-escalate
    statement: escalates via a red workflow run
    assessment: VERIFIED-by-evidence
    evidence: >
      Verdict union widened to "ok"|"waiting"|"escalate"|"failed" with mergeVerdict
      (rank ok<waiting<escalate<failed) and shouldFailRun; import.meta.main now
      `if (shouldFailRun(summary.verdict)) process.exitCode = 1` with the
      FANTASY_ORCHESTRATOR_<VERDICT> line kept. Workflow step has set -euo pipefail
      and no continue-on-error (unchanged). Unit tests "mergeVerdict ranks…",
      "shouldFailRun turns the workflow step red only for failed and escalate",
      "an escalating watch turns the pass red without changing what the pass did".
    note: >
      The import.meta.main wiring itself is not executed by any test (only
      shouldFailRun is). Acknowledged by the Verifier under `untested`; the
      one-line change is directly readable in the diff. Not a defect against any
      listed criterion.
  - id: OBJ-evidence
    statement: sanitized evidence names gameweek, deadline, affected fixtures and provider state; remediation pointer
    assessment: VERIFIED-by-evidence
    evidence: >
      RPC emits gameweekId, sequence, status, deadlineAt, startsAt, hoursToDeadline
      (2dp, negative when elapsed), deadlinePassed, unconfirmedFixtures,
      totalCountingFixtures, deadlineDerivedFromPlaceholder, severity, and
      fixtures[] (fixtureId, homeTeam, awayTeam, providerKickoffAt,
      assignedKickoffAt, originalKickoffAt, fixtureStatus, assignmentStatus,
      frozen, providerUpdatedAt, sourceSequence) ordered by f.kickoff_at, f.id.
      Top level carries schemaVersion 1, seasonId, seasonStatus, warnHours,
      escalateHours, serverTime and remediation
      'scripts/backend/fantasy-realign-gameweek-calendar.sql'.
      summary.deadlineWatch = {warnHours, escalateHours, affected, escalations,
      informational, remediation}. No field name matches
      /(access_token|refresh_token|token_hash|hashed_token|password)/i — asserted
      by unit test over the whole serialized summary, so the phase7f scan cannot
      suppress the upload.
  - id: OBJ-never-invent
    statement: never invents a kickoff, never creates or moves a deadline; idempotent; no production mutation
    assessment: VERIFIED-by-evidence
    evidence: >
      The RPC is declared `stable`, contains no insert/update/delete/merge and no
      advisory lock; its only use of app_private.fantasy_calculate_deadline is
      inside the boolean `deadlineDerivedFromPlaceholder` comparison
      (`gw.deadline_at is not distinct from …`), never assigned to a column.
      fantasy_calculate_deadline is itself STABLE
      (20260720163222_fantasy_ruleset_v1.sql:396), so the STABLE declaration holds.
      Entries ordered by sequence_number, fixtures by (kickoff, id), gameweeks
      '[]' when none → reruns serialise identically except clock-derived fields
      (unit test "two passes over the same state serialise identically";
      rehearsal R2 / verification). Post-rollback production snapshot: gameweeks 1,
      active assignments 8, in-season fixtures 8, all fixtures 488, deadline audit
      rows 0, GW1 deadline 2026-09-23 22:30:00+00 / status open / first kickoff
      2026-09-24 00:00:00+00, watch_fn_present 0. Independently reproduced by the
      Verifier.
  - id: OBJ-security
    statement: service-only exposure
    assessment: VERIFIED-by-evidence
    evidence: >
      security definer, `set search_path = ''`, `app_private.is_service_request()`
      as the first statement (PT403 forbidden), bounded integers
      (0 <= escalate <= warn <= 720, PT400
      fantasy_deadline_watch_window_invalid), season resolution PT404. Footer
