defects: []

observations:
  - id: OBS-1
    subject: 72 h / 24 h default warn window vs "approaching its deadline"
    finding: ops parameter, not a defect
    reasoning: >
      GW1 enters the informational window at 2026-09-20T22:30Z and the escalation
      window at 2026-09-22T22:30Z, i.e. red from ~24 h before the point of no
      return; with the hourly cron (minute 12) that is ~24 escalating runs before
      the deadline elapses and the remediation script becomes illegal
      (current_deadline_already_passed). The brief classifies 72/24 as INFERRED ops
      parameters, overridable, and the objective says "approaching", not a specific
      horizon — so this is a tuning choice, not a requirement miss. The defaults are
      defined in exactly one conceptual place as required (RPC defaults mirrored by
      the exported constants DEADLINE_WATCH_WARN_HOURS / _ESCALATE_HOURS).
      The workflow override does cover it: the orchestrate step passes
      `vars.FANTASY_DEADLINE_WATCH_WARN_HOURS` / `_ESCALATE_HOURS`, an unset
      variable expands to "" which deadlineWatchHours() maps to the default, and
      invalid or inverted values throw fantasy_deadline_watch_window_invalid
      (unit-tested for "abc", "721" and warn < escalate). Caveat, not a defect:
      the override path has never been exercised in a real workflow run, and
      setting it requires a repository-variable change by the Chief. If ops wants
      more lead time on GW1, set FANTASY_DEADLINE_WATCH_ESCALATE_HOURS (e.g. 120)
      before 2026-09-22T22:30Z.
  - id: OBS-2
    subject: brief self-contradiction in the threshold acceptance test
    owner: Researcher
    finding: >
      acceptance_tests "(null,72,240) → escalate" contradicts required_changes
      "validate p_warn_hours >= p_escalate_hours". Correct the wording in a future
      brief; no code change required.
  - id: OBS-3
    subject: predicate asymmetry in 20260918140000
    finding: >
      The new skip counts unconfirmed assignments by f.kickoff_at while the
      new_start/new_end select filters on a.assigned_kickoff_at. These diverge only
      for assignments that were not realigned (frozen ones, which take the
      gameweek_locked path). The failure mode is fail-safe — new_start becomes null
      and nothing is written. No action required.
  - id: OBS-4
    subject: escalate and failed are indistinguishable from the job status
    finding: >
      Both exit 1 from the same step; an operator must read the
      FANTASY_ORCHESTRATOR_ESCALATE stdout line or the evidence artifact. This is
      exactly what the brief specified (the red run is the only channel that
      exists) and is documented in the workflow header and the runbook. There is no
      auto-suppression, so a provider that never publishes produces an indefinitely
      red hourly workflow — a known, bounded risk already recorded in the brief.
  - id: OBS-5
    subject: pre-existing contradiction not repaired (correctly out of scope)
    finding: >
      calendarSyncSchema still strips rounds[].roundId / sequence / deadlineAt that
      the sync SQL emits. The DEF-1(b) correlation needs only gameweekId and notes,
      both of which survive the schema. Leaving it alone is right for this task.
  - id: OBS-6
    subject: Verifier process disclosure
    finding: >
      The VerificationReport discloses an accidental
      `git checkout origin/main -- .` into the main working tree, reverted with
      `git reset --hard HEAD` and the 12 added files quarantined in the scratchpad;
      `git status --porcelain` is clean at 1736478a. I confirm the repository at
      /home/user/botolago-foundation is clean and no branch, commit or remote was
      affected; this does not touch the reviewed commit 95d79a7. Informational for
      the Chief (the main tree's HEAD is behind origin/main).

release_blockers:
  - "Neither migration is promoted to Production V2. Until 20260918130000 is promoted, the guard RPC does not exist and every pass degrades to `waiting` with fantasy_deadline_watch_failed — a GREEN run. The escalation channel is therefore inert until promotion; promote before relying on it, and before 2026-09-20T22:30Z if GW1 is to be caught by the default window."
  - "Until 20260918140000 is promoted, the production sync body is still the unguarded 20260918120000 version (confirmed: position('unconfirmed_active' in prosrc) = 0), so a partially published round can still write a placeholder-derived deadline. DEF-1(a) is fixed in the repository, not yet in the database."
  - "DEF-1(b) is TypeScript-side and effective against the current production sync notes, so the BG-0001 blocker (locking GW1 at 2026-09-23T22:30Z on a placeholder-derived deadline) is removed once this branch is deployed — not before. Do not set FANTASY_AUTOMATION_ENABLED=true until this branch is merged and deployed."
  - "BG-0001 DEF-3 remains unproven: the composed orchestrator has never advanced a gameweek (workers array always empty). Does not block BG-0003."
  - "BG-0001 DEF-4 (Chief-owned migration-promotion evidence integrity) was not in BG-0003's scope and is not addressed by this change."

bg0001_disposition: OPEN_PENDING_DEF3
bg0001_disposition_reasoning: >
  BG-0001's defects DEF-1(a), DEF-1(b) and DEF-2 are now evidenced and are
  discharged by this branch. DEF-3 ("evidence in which orchestrateFantasySeason
  itself drives at least one gameweek, with a non-empty workers array") is
  neither satisfied nor withdrawn: the Builder and the independent Verifier both
  report it not attempted for an environmental reason (no Docker daemon, hence no
  local Supabase stack; production writes are forbidden to both roles), and
  nothing was fabricated in its place. Per the Reviewer contract, required
  evidence that is missing cannot be accepted as met, so BG-0001 cannot be marked
  DONE. DEF-4 (Chief-owned) is likewise still open. BG-0003 is graded on its own
  approved objective plus DEF-1/DEF-2 and passes; BG-0001 stays OPEN pending DEF-3
  (and DEF-4), which needs either a non-production database with a working
  container runtime or a sanctioned rolled-back end-to-end orchestrator session.

