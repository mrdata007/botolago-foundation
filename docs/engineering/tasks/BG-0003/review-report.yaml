      extended function comment. deadline_locked / new_deadline_in_past / update /
      counters / payload are textually unchanged (re-indented only).
      Behaviour proved on live data, rolled back: Builder R5 (round 90) and the
      Verifier's independent round 91 — 7 confirmed + 1 placeholder →
