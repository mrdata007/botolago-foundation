  - id: DEF-1b
    statement: the orchestrator must refuse a deadline_passed worker target when the round note says deadlineUnconfirmed
    assessment: VERIFIED-by-evidence
    evidence: >
      scripts/backend/fantasy-season-orchestrator.ts — gameweeksWithUnconfirmedDeadline()
      correlates rounds[].gameweekId with either the string note
      "deadline_unconfirmed" or the object note {deadlineUnconfirmed: true};
