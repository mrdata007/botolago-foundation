      deadline_passed branch unrefused.
  - id: DEF-2
    statement: rolled-back rehearsals proving deadline_locked, new_deadline_in_past and fantasy_gameweek_locked
    assessment: VERIFIED-by-evidence
    evidence: >
      docs/engineering/tasks/BG-0003/rehearsal-deadline-guard.json R6/R7/R8, each
