  - "The deadline watch RPC is not promoted to Production V2. Until it is, the orchestrator's guard call fails and the pass degrades to `waiting` with `fantasy_deadline_watch_failed` (covered by a unit test); the calendar sync keeps its current, unguarded body until 20260918140000 is promoted too."
