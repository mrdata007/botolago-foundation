unexpected_observations:
  - "The brief's threshold acceptance test `(null,72,240) → escalate` contradicts its own validation rule `p_warn_hours >= p_escalate_hours`: with warn 72 the call is refused with PT400. I implemented the validation as written and ran the threshold scenarios with warn 720 (the documented maximum), recording the refusal of (72,240) as well."
  - "With the default 72 h warning window the live GW1 is NOT reported today: its deadline is 131.5 h away. The brief's R1 expectation (`(null,72,24)` returns GW1) therefore cannot hold on 2026-09-18; it starts holding on 2026-09-20T22:30Z. Both the default call (empty) and a 720 h call (GW1) are in the evidence. Chief may want to reconsider the default warn window or the acceptance wording."
  - "In the R2 rehearsal both watch calls ran inside one DO block, so statement_timestamp() — and therefore serverTime and hoursToDeadline — is identical rather than merely close; the payloads are byte-identical. This is stronger than the stated property, not weaker."
  - "app.fantasy_gameweeks carries a unique index fantasy_gameweeks_one_current_idx (one current gameweek per season), so a second `open` gameweek cannot be staged. R6 therefore had to be rehearsed on the live GW1 (inside the rolled-back transaction) rather than on a synthetic open gameweek. Not a defect, but it constrains future rehearsals."
  - "Unrelated and NOT repaired: calendarSyncSchema still strips rounds[].roundId / sequence / deadlineAt that the sync SQL emits (contradiction already noted by the Researcher). The DEF-1(b) correlation only needs gameweekId and notes, both of which survive."
