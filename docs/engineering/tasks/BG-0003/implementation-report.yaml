  - "BG-0003: add the fantasy deadline watch and refuse placeholder-derived deadlines"
changes:
  - file: supabase/migrations/20260918130000_fantasy_deadline_watch.sql
    description: >
      New, additive, read-only migration. Adds
      api.service_fantasy_deadline_watch(p_fantasy_season_id uuid default null,
      p_warn_hours integer default 72, p_escalate_hours integer default 24)
      returns jsonb, plpgsql, stable, security definer, search_path ''.
      is_service_request() guard (PT403 forbidden); window validation
      (PT400 fantasy_deadline_watch_window_invalid); season resolution like the
      sync (PT404 fantasy_season_not_found). Emits a scheduled/open gameweek
      only when an active counting assignment has an unconfirmed kickoff
      (app_private.fantasy_kickoff_confirmed) and hoursToDeadline <= warnHours,
      with severity info/escalate, deadlineDerivedFromPlaceholder (comparison
      only) and the affected fixtures ordered by providerKickoffAt, fixtureId.
      No insert/update/delete/merge, no advisory lock, no deadline derivation.
      Footer revokes from public/anon/authenticated, grants to service_role,
      comments the function.
  - file: supabase/migrations/20260918140000_fantasy_calendar_sync_unconfirmed_guard.sql
    description: >
      DEF-1(a). New file that re-creates api.service_sync_fantasy_calendar with
      the same body except: the new_start/new_end derivation now ignores
      assignments whose assigned kickoff is unconfirmed, and the whole
      window/deadline update is skipped with the note "deadline_unconfirmed"
      while any active counts_points assignment of that gameweek still carries
      an unconfirmed kickoff. Header comment explains the change; same
      revoke/grant footer. The existing 20260918120000 file is untouched.
  - file: scripts/backend/fantasy-season-orchestrator.ts
    description: >
      Adds deadlineWatchSchema / DeadlineWatch, DEADLINE_WATCH_WARN_HOURS (72)
      and DEADLINE_WATCH_ESCALATE_HOURS (24), Verdict "ok"|"waiting"|"escalate"|"failed"
      with mergeVerdict and shouldFailRun, clock-free summarizeDeadlineWatch,
      OrchestratorOptions.deadlineWatch, the guard call after the second
      calendar sync (try/catch → {error: fantasy_deadline_watch_failed} and
      waiting), summary.deadlineWatch, exit code 1 for failed and escalate, and
      FANTASY_DEADLINE_WATCH_WARN_HOURS / _ESCALATE_HOURS validation in
      orchestratorEnvironment. DEF-1(b): selectWorkerTargets now returns
      {targets, skipped} and refuses a deadline_passed target for an open
      gameweek whose round note carries deadlineUnconfirmed: true (or the
      string "deadline_unconfirmed"), correlating rounds[].gameweekId with
      gameweeks[].id; the refusal appears as summary.skipped[] =
      {gameweekId, sequence, reason: "deadline_unconfirmed"} and degrades
      ok → waiting through mergeVerdict. All verdict transitions now go through
      mergeVerdict. No existing step was restructured.
  - file: scripts/backend/fantasy-season-orchestrator.test.ts
    description: >
      Existing selectWorkerTargets assertions updated for the {targets, skipped}
      return (same selections asserted; nothing weakened or removed). New
      "fantasy deadline watch" suite: schema accept/reject (schemaVersion 2,
      unknown severity, non-uuid gameweekId), summarizeDeadlineWatch partition
      + sequence ordering + clock-freedom, mergeVerdict precedence,
      shouldFailRun, escalating watch → escalate with workers/performances
      unchanged and both syncs made, informational-only watch → ok, worker
      failure outranking an escalation, watch error and unexpected payload →
      waiting + fantasy_deadline_watch_failed, byte-identical serialisation
      across two passes and no phase7f secret substring, default and overridden
      RPC args, environment window validation, and the two DEF-1(b) refusal
      tests.
  - file: .github/workflows/fantasy-season-orchestrator.yml
    description: >
      Header comment documents the deadline watch, the four verdicts and that
      escalate/failed exit non-zero (the red run is the only escalation
      channel); the orchestrate step passes the optional repository variables
      FANTASY_DEADLINE_WATCH_WARN_HOURS / _ESCALATE_HOURS. No continue-on-error,
      concurrency, job if or step order change.
  - file: docs/backend/FANTASY_SEASON_ORCHESTRATION_RUNBOOK.md
    description: >
      New "Deadline watch" section (what is detected, the two tiers and
      defaults, how to read the deadlineWatch block, the operator procedure,
      that the guard never invents a kickoff nor moves a deadline and that
