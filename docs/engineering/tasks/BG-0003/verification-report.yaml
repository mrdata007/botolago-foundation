security_observations:
  - "api.service_fantasy_deadline_watch is a new SECURITY DEFINER surface, but it is declared STABLE, sets search_path = '', calls app_private.is_service_request() as its first statement and bounds both integer parameters (0 <= escalate <= warn <= 720). I confirmed the refusal against live authenticated claims: PT403 'forbidden'. The footer revokes from public, anon, authenticated and grants only to service_role."
  - "Read-only confirmed empirically, not just by the STABLE declaration: across the whole rehearsal the row counts (gameweeks 1, active assignments 8, in-season fixtures 8, deadline audit 0) and GW1's deadline are identical before and after, and api.service_fantasy_deadline_watch does not exist in production (pg_proc count 0)."
  - "No new field name matches /(access_token|refresh_token|token_hash|hashed_token|password)/i, so the phase7f evidence scan will not suppress the artifact upload; asserted by unit test over the whole serialized summary and confirmed by reading the RPC's jsonb keys."
  - "Minor asymmetry in 20260918140000: the guard counts unconfirmed assignments by f.kickoff_at while the new_start/new_end select filters on a.assigned_kickoff_at. These can diverge only when an assignment's kickoff was not realigned (frozen assignments, which take the gameweek_locked path instead). The failure mode is fail-safe: new_start becomes null and nothing is written. No action required, but it is the one place where the two predicates are not the same column."
  - "The escalation channel is still only a red workflow run. `escalate` exits 1 from the same step as `failed`, so an operator cannot distinguish them from the job status alone — only from the FANTASY_ORCHESTRATOR_ESCALATE stdout line and the evidence artifact. This is per the brief, but it means a permanently unpublished kickoff produces an indefinitely red hourly workflow with no suppression."
