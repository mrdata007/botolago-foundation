unexpected_observations:
  - >-
    Coverage is defined as the share of rating candidates matched by at least
    one accepted provider statistics record. A provider that returns a record
    for every candidate with has_values = false would still pass the guard and
    produce a full set of neutral 6.0 / confidence 0 ratings. Tightening the
    definition to "candidates with non-zero minutes" was not in the brief and
    would change behaviour for legitimately unused squad players, so it was not
    implemented.
  - >-
    p_error_code for failed runs was previously always the generic
    player_ratings_failed, which hid provider_unavailable,
    provider_rate_limited and mapping_not_found in the run record. The fix
    required threading the real code through for the two new codes; it now
    applies to every failure code of this worker. The DB constraint accepts any
    ^[a-z][a-z0-9_]{1,63}$ value, so all existing codes remain valid.
