    The degeneracy inspector counts the 6.0 / 0 fallback of players WITHOUT
    any rating row as an input (that is what the candidate query prices), so
    a season with no ratings ingested at all is degenerate, not merely a
    season of placeholder rows. A single real rating with confidence > 0
    lifts the flag; the guard is deliberately narrow (block only the exact
    all-neutral signature) so it cannot block a legitimately thin but real
    rating set. The preview's ratingDegeneracy object gives operators
    distinctRatings / maxConfidence to judge thin coverage manually.
