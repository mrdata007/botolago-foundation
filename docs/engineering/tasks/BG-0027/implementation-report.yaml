  - "BG-0027: fail closed on empty or thin provider player statistics"
changes:
  - file: supabase/functions/_shared/sportsmonks-player-ratings.ts
    description: >-
      Added exported and documented MIN_STATISTICS_COVERAGE (0.5),
      PLAYER_STATISTICS_UNAVAILABLE and PLAYER_STATISTICS_COVERAGE_INSUFFICIENT.
      The worker now tracks which candidates a provider season-statistics record
      was successfully matched to, and after paging - before any
      ingest_player_season_ratings call - throws
      player_statistics_unavailable when records_fetched = 0 and
      player_statistics_coverage_insufficient when
      covered/candidates < MIN_STATISTICS_COVERAGE. The existing catch path
      therefore completes the run as failed with zero rows persisted.
      complete_football_ingestion now receives the actual RatingsRuntimeError
      code as p_error_code (default unchanged: player_ratings_failed), so the
      ingestion run record carries the fail-closed code.
  - file: supabase/functions/_shared/sportsmonks-player-ratings.test.ts
    description: >-
      New describe block "SportsMonks player rating statistics coverage guard"
      with four tests: exact error-code/constant values; zero provider records
      -> 503 player_statistics_unavailable, no ingest_player_season_ratings
      call, run completed failed with that p_error_code; coverage 1/4 below the
      floor -> 503 player_statistics_coverage_insufficient, no rows persisted;
      coverage 2/4 at the floor -> 200, four rows persisted with unchanged
      rating/confidence values and run succeeded. Existing algorithm and runtime
      tests are unmodified.
  - file: docs/backend/FANTASY_CATALOG_ACTIVATION_RUNBOOK.md
    description: >-
      One paragraph in "Initial-price algorithm" documenting the fail-closed
      rule, both error codes, the 0.5 coverage floor, and the pre-stage check
      that the latest player_ratings run succeeded without those codes.
