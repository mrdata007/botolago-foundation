verifier_rehearsal:
  description: >-
    Recommended Verifier check in a rolled-back production transaction (no
    durable effect; the final forced error guarantees rollback even if a step
    is forgotten). Replace <SEASON_ID> with the 2026/27 football season uuid.
    Expect step 3 to return degenerate = true today (all inputs are 6.0 / 0
    per BG-0011) and step 4 to fail with PT409
    fantasy_rating_inputs_degenerate; if a catalog is currently staged, step
    4 instead fails earlier with fantasy_catalog_already_staged, which is the
    pre-existing behaviour and still proves zero inserts.
  command: |
    begin;
    select set_config('request.jwt.claims', '{"role":"service_role"}', true);
    -- 1. inline the full body of
    --    supabase/migrations/20260918150000_fantasy_rating_degeneracy_guard.sql here
    -- 2. row counts before
    select (select count(*) from app.fantasy_seasons) seasons,
           (select count(*) from app.fantasy_players) players,
           (select count(*) from app_private.fantasy_initial_price_evidence) evidence;
    -- 3. inspector + preview field
    select app_private.fantasy_rating_inputs_degenerate('<SEASON_ID>');
    select api.preview_fantasy_catalog_activation('<SEASON_ID>') -> 'ratingDegeneracy';
    -- 4. guarded stage (expected: ERROR PT409 fantasy_rating_inputs_degenerate)
    savepoint stage_attempt;
    select api.service_stage_fantasy_catalog(
      '<SEASON_ID>', 'botolago-fantasy-v1.1',
      api.preview_fantasy_catalog_activation('<SEASON_ID>') ->> 'sourceDigest',
      gen_random_uuid(), 16, 30, 240, 240, 800
    );
    rollback to savepoint stage_attempt;
    -- 5. row counts after must equal step 2
    select (select count(*) from app.fantasy_seasons) seasons,
           (select count(*) from app.fantasy_players) players,
           (select count(*) from app_private.fantasy_initial_price_evidence) evidence;
    do $$ begin raise exception 'REHEARSAL % - rolling back', now(); end $$;
    rollback;
  note: >-
    A bare `raise exception` is not valid top-level SQL, hence the DO block;
    the transaction aborts either way and `rollback;` completes it. Nothing
    here was executed by the Builder.
