  hand_computation:
    formula_source: supabase/migrations/20260803210943_fantasy_catalog_activation.sql:150-163
    quoted_lines: |
      ('GK'::text, 4.0::numeric, 6.5::numeric),
      ('DEF'::text, 4.0::numeric, 7.0::numeric),
      ('MID'::text, 4.5::numeric, 12.5::numeric),
      ('FWD'::text, 4.5::numeric, 12.5::numeric)
      ...
      adjusted_rating := 6 + (p_rating - 6) * p_confidence;
      return round((minimum_price + ((adjusted_rating - 4) / 6)
        * (maximum_price - minimum_price)) * 10) / 10;
    rated_midfielder_player_1_8: >-
      degeneracy-player:1:8 is player_number 8, which the fixture maps to
      'midfielder' (player_number <= 12 after the <= 7 defender band), so the
      MID band 4.5..12.5 applies. adjusted = 6 + (10 - 6) * 1 = 10;
      (10 - 4) / 6 = 1; 4.5 + 1 * (12.5 - 4.5) = 12.5; round(12.5 * 10) / 10 =
      round(125) / 10 = 12.5; stored in numeric(8,2) -> '12.50'. Assertion
      '12.50' holds.
    rejected_prior_value_for_the_record: >-
      With the old rating = 8.8: adjusted = 6 + (8.8 - 6) * 1 = 8.8;
      (8.8 - 4) / 6 = 0.8; 4.5 + 0.8 * 8 = 10.9; round(109) / 10 = 10.9 ->
      '10.90', confirming the Reviewer's figure and why '12.50' failed.
    neutral_prices_rating_6_confidence_0: |
      adjusted = 6 + (6 - 6) * 0 = 6 for every neutral candidate; (6 - 4) / 6 = 1/3.
      GK:  4.0 + (1/3) * (6.5 - 4.0)  = 4.0 + 0.8333 = 4.8333; round(48.333)/10 = 4.8 -> 4.80
      DEF: 4.0 + (1/3) * (7.0 - 4.0)  = 4.0 + 1.0    = 5.0;    round(50)/10     = 5.0 -> 5.00
      MID: 4.5 + (1/3) * (12.5 - 4.5) = 4.5 + 2.6667 = 7.1667; round(71.667)/10 = 7.2 -> 7.20
      FWD: 4.5 + (1/3) * (12.5 - 4.5) = 4.5 + 2.6667 = 7.1667; round(71.667)/10 = 7.2 -> 7.20
    distinct_price_count: >-
      Neutral set = {4.80, 5.00, 7.20} (three, MID and FWD coincide). Plus the
      rated midfielder at 12.50 = {4.80, 5.00, 7.20, 12.50} = 4 distinct
      prices. Assertion count(distinct price) = 4 holds. (Under option (b) the
      set would have been {4.80, 5.00, 7.20, 10.90}, also 4.)
