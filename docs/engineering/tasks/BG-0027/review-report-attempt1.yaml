defects:
  - requirement: >-
      AC-c (launch ledger BG-0027): "a pre-stage non-degeneracy guard (additive
      migration) blocks or loudly warns when every candidate carries rating
      6.0 / confidence 0".
    evidence: >-
      git diff --name-status 1736478a..HEAD touches four paths and none under
      supabase/migrations/**; git ls-files supabase/migrations at HEAD ends at
      20260918120000_fantasy_calendar_sync.sql (pre-existing). A search of
      origin/main migrations for any degeneracy/distinct-rating/confidence=0
      check in api.preview_fantasy_catalog_activation or
      api.service_stage_fantasy_catalog (20260803210943:496, :548) finds none,
      so the guard exists neither on main nor in this branch. The
      ImplementationReport records database_changes: [] and
      scope_deviations: [] and does not state that AC-c was descoped or
      deferred; the only delivered artefact is a runbook sentence ("confirm the
      latest player_ratings ingestion run succeeded and carries no such error
      code"), which is a manual instruction, not a guard, and does not detect
      the degenerate condition at all: a run that succeeded on has_values=false
      records (see defect 2) passes that check while every rating is 6.0 / 0.
      The VerificationReport verified a criterion set that did not contain AC-c
      (its AC3 even asserts "no migration" as a positive property), so the
      Verifier PASS does not cover this ledger criterion. Under the Reviewer
      contract a missing required migration is a hard FAIL.
    owner: Builder-Backend
    correction: >-
      Add one additive migration (new file under supabase/migrations/, no edits
      to existing migrations) that introduces a non-degeneracy check on the
      rating inputs consumed by the catalog stage - e.g. a function
      app_private.assert_rating_inputs_not_degenerate(season) that inspects the
      latest active app.player_season_ratings rows feeding the candidate
      selection and raises an explicit sqlstate/code (or returns a loud
      warning field in api.preview_fantasy_catalog_activation) when
      count(distinct rating) = 1 and max(confidence) = 0 - and call it from
      api.preview_fantasy_catalog_activation and api.service_stage_fantasy_catalog
      (create-or-replace of those two functions is permitted only as an
      additive migration that preserves their existing behaviour for
      non-degenerate input). Add a database test in
      supabase/tests/database/fantasy_catalog_activation.test.sql covering
      both the degenerate (blocked/warned) and the healthy (unchanged) path.
      Record the migration under database_changes in the ImplementationReport.
      If the Chief instead decides AC-c is delivered by a separate task, that
      decision must be written explicitly in the ImplementationReport
      scope_deviations and the ledger acceptance criterion moved; the Reviewer
      cannot accept a silent omission.
  - requirement: >-
      Objective "Ratings ingestion must fail closed on empty provider
      statistics (no silent 6.0/0 placeholders)" and AC-a "... (or coverage
      below a minimum share) ends failed with an explicit error code and
      inserts zero rows".
    evidence: >-
      Reproduced from fresh context with a scratchpad-only test
      (<scratchpad>/bg0027-reviewer-hasvalues.test.ts, imports the HEAD
      module, nothing added to the repo): 10 candidates, provider returns for
      each a record with has_values=false and details [] -> HTTP 200, body
      counters {fetched:10, validated:10, inserted:10, rejected:0},
      ratingRange {minimum:6, maximum:6}, exactly one
      ingest_player_season_ratings call with 10 rows all rating 6 /
      confidence 0, complete_football_ingestion p_status "succeeded",
      p_error_code null. Cause: sportsmonks-player-ratings.ts line 391
      `if (raw.has_values === false) return metrics;` returns empty statistics,
      but line 754 `covered.add(normalized.externalPlayerId)` still counts the
      candidate as covered, so `covered.size / candidates.length` is 1.0 and
      the guard at line 769 passes. A record that the provider itself flags as
      carrying no values is "empty provider statistics" in the plain sense of
      the objective; defining coverage so that such records count as coverage
      defeats the "coverage below a minimum share" clause of AC-a and leaves
      the exact BG-0011 production signature (a full set of neutral 6.0 / 0
      rows written as history under a "succeeded" run) reachable through a
      degraded-but-present provider response. The Builder disclosed this in
      unexpected_observations and the Chief opened BG-0030, but with AC-c also
      undelivered (defect 1) there is no second line of defence, so it is a
      live fail-open in the very path this task exists to close, not an
      acceptable follow-up.
    owner: Builder-Backend
    correction: >-
      Count a candidate as covered only when the matched provider record
      actually carries statistics: do not add to `covered` when
      raw.has_values === false (e.g. have normalizedStatistics expose a
      hasValues flag, or check the raw record before covered.add). Do not
      change the rating formula, the shrink, or the treatment of has_values=true
      records with zero minutes (legitimately unused squad players remain
      covered and still shrink to 6.0 / 0 individually, so the Builder's
      stated concern is not affected). Add a unit test in
      sportsmonks-player-ratings.test.ts: all candidates matched by
      has_values=false records -> 503 player_statistics_coverage_insufficient,
      no ingest_player_season_ratings call, completion p_status "failed" with
      that p_error_code and p_records_inserted 0. Close or fold BG-0030
      accordingly.
release_blockers:
  - >-
    No pre-stage non-degeneracy guard exists (defect 1): a re-stage under
    BG-0011 option A can still be executed on all-neutral rating inputs
    without any database-level block or warning.
  - >-
    A provider response of has_values=false records still produces a
    "succeeded" run that writes only 6.0 / 0 placeholder rows (defect 2).
residual_risks:
  - >-
    Three RatingsRuntimeError codes (invalid_runtime_configuration,
    request_too_large, invalid_request) are raised before
    begin_football_ingestion, so no run row carries them; pre-existing and
    unchanged, no action required for this task.
  - >-
    Widening p_error_code from the generic player_ratings_failed to the real
    RatingsRuntimeError code is a behaviour change for every failure of this
    worker, not only the two new codes. It is correct and all 17 codes satisfy
    the DB constraint ^[a-z][a-z0-9_]{1,63}$, but any operator tooling or
    alert that string-matched "player_ratings_failed" will no longer fire for
    provider_unavailable / provider_rate_limited / mapping_not_found runs.
  - >-
    MIN_STATISTICS_COVERAGE = 0.5 is a Builder-chosen constant; the objective
    left "minimum share" unspecified. 0.5 blocks the BG-0011 case but would
    still accept a run in which half the squad is written as 6.0 / 0. Once
    defect 1 is delivered the pre-stage guard is the backstop for that case.
  - >-
    Database suites (backend:db:test / backend:db:lint / supabase db reset)
    were not run by Builder, Verifier or Reviewer (no local Supabase stack).
    Irrelevant for the current diff (no migration) but they become mandatory
    evidence for the migration required by defect 1.
notes:
  - >-
    What is delivered is correct as far as it goes. Verified in the review
    worktree at 449273c: `bun test supabase/functions/_shared/sportsmonks-player-ratings.test.ts`
    -> 9 pass / 0 fail / 34 expect() calls (bun 1.3.11). The failure path
    traces end to end: counts.fetched === 0 -> throw
    RatingsRuntimeError(player_statistics_unavailable) at line 766-767, or
    covered.size / candidates.length < 0.5 -> player_statistics_coverage_insufficient
    at line 769-771, both before calculatePreseasonRatings and before any
    ingest_player_season_ratings RPC; the single catch at line 810 derives
    `code` from the RatingsRuntimeError and passes it to complete(), which
    forwards it verbatim as p_error_code with p_status "failed" and
    p_records_inserted 0 (counts.inserted never incremented). The zero-record
    part of AC-a and AC-b are therefore met; AC-a's coverage clause is
    defeated only by the has_values=false definition (defect 2).
  - >-
    No forbidden scope touched: rating formula lines (confidence =
    min(1, minutes/900); unshrunk = 4 + 6*performance; rating =
