security_observations:
  - >-
    RESIDUAL FAIL-OPEN, disclosed by the Builder and independently reproduced.
    Coverage counts a candidate as covered as soon as one accepted provider
    record was matched to it, regardless of whether that record carries any
    metrics. normalizedStatistics returns empty metrics for
    `has_values === false` (source line 391) but the candidate is still added
    to `covered`. Reproduced in
    <scratchpad>/bg0027-hasvalues.test.ts: 10 candidates, provider returns a
    has_values=false record with empty details for each -> HTTP 200, one
    ingest_player_season_ratings call, 10 rows persisted, first row
    {rating: 6, confidence: 0}, run completed "succeeded". That is exactly the
    BG-0011 production signature (neutral 6.0 / confidence 0 rows written as if
    they were history), so a provider that degrades to empty-but-present
    records still bypasses the guard. The BG-0011 brief wording ("empty
    provider statistics response (records_fetched = 0 or coverage below a
    minimum share)") is satisfied by the delivered definition, and no AC for
    BG-0027 covers this, so it does not refute any criterion - but it should be
    raised as follow-up work (e.g. define coverage over candidates with
    non-zero minutes, or add a non-degeneracy check on the rating distribution
    before persisting).
  - >-
    Division-by-zero / NaN hole in `covered.size / candidates.length` is not
    reachable: an empty candidate set is rejected earlier. Verified in
    <scratchpad>/bg0027-edge.test.ts - candidates [] with provider rows ->
    HTTP 503 {"error":"invalid_database_response"} and a single
    complete_football_ingestion with p_status "failed",
    p_error_code "invalid_database_response", p_records_inserted 0.
  - >-
    Widening p_error_code from the single generic "player_ratings_failed" to
    the real code exposes provider-side failure reasons
    (provider_unavailable, provider_rate_limited, mapping_not_found, ...) in
    the ingestion run record. These are internal operator-facing rows, not the
    HTTP response body, which already returned the same codes before this
    change; no new information is disclosed to callers.
