residual_risks:
  - >-
    Narrow guard threshold (carried forward from attempt-2 review, not
    re-flagged as new): the inspector fires only when count(distinct
    source_rating)=1 and max(source_confidence)=0, i.e. exactly "every
    candidate is the neutral fallback." A season where most but not all
    candidates are 6.0/0 (e.g. one real rating among hundreds of placeholders)
    clears the guard. The worker's own 0.5 coverage floor is the first line of
    defence for that case; this guard is the second-line, database-level
    backstop for the fully-degenerate case it was scoped to catch. No change
    requested here; a stricter joint threshold would be a follow-up task, not
    a defect in this one.
  - >-
    Guard ordering (carried forward): fantasy_rating_inputs_degenerate runs
    after the idempotency-replay, already-staged, not-ready and stale-digest
