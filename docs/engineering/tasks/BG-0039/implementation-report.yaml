not_executed:
  - "No Phase 7E-B dispatch, no Management API call and no credential use (forbidden). The diagnostic is proven only by unit tests with synthetic responses; the real classification of run 35343091384 is obtained by the owner's next dispatch at the merged main commit."
unresolved:
  - "UNKNOWN (per brief instruction): the Supabase Management API reference does not publish the 200 body schema of GET /v1/organizations, so whether an alternative identity key (slug) or a pagination wrapper is an officially documented shape could not be confirmed from docs. Coordinator-supplied read-only evidence (via the MCP layer, not the v1 endpoint) shows one organization whose id equals its slug inside an {\"organizations\": [...]} wrapper — a shape the promoter already accepts. Because a slug match cannot prove membership by organization id, NO additive acceptance path was added; the rule remains row[\"id\"] == project.organization_id. The new project_organization_id_matched_row_keys field will show ['slug'] on the next run if the identity key has in fact moved, without accepting it."
  - "Interpretation guide for the next run's message: organizations_request_failed: ... HTTP 401/403 => the token cannot list organizations (token type/scope); organizations_response_type=list organizations_row_count=0 => the token authenticates but sees no organizations (token is not a personal access token of an org member); organizations_row_count>=1 with matched_row_keys=[] and 'id' in row_keys => the account is a member of other organizations but not the project's; matched_row_keys=['slug'] (or another key) => the identity key moved and a reviewed rule change is needed."
unexpected_observations:
  - "Before this change, a GET /v1/organizations response that was neither a list nor a dict (or a dict whose 'organizations' value was not a list) would raise AttributeError inside assert_management_target and be reported by main() as 'promotion_failed: unexpected_AttributeError' rather than a stable PromotionError. The new organization_rows_from helper closes that hole as a side effect of the diagnostic (still a hard failure). Noted because it is a small behavioural change, not a repair of unrelated code."
  - "assert_management_target is called twice per promotion (preflight and postflight); the diagnostic applies equally to both call sites without further change."
  - "Ruff is the only Python linter available here and is not wired into any repository gate; pytest is not installed and no workflow uses it, so the CI form (python -m unittest <file>) was used."
