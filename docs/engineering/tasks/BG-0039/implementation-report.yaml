changes:
  - file: scripts/backend/phase7e-production-migration-promoter.py
    description: >
      Two helpers added directly above assert_management_target and the ownership
      section of assert_management_target rewritten; nothing else in the file changed.
      organization_rows_from(organizations): returns the rows of a GET /v1/organizations
      response — the list itself, or the "organizations" key of a dict wrapper (only if
      that value is a list), else []. This is the same shape acceptance as before; the
      only behavioural difference is that a non-list/non-dict response or a non-list
      wrapper value now yields no rows (guard fails with PromotionError) instead of
      escaping as an AttributeError caught by main() as "unexpected_AttributeError".
      describe_organizations_response(organizations, project): builds the sanitized
      diagnostic string. It emits only structural facts, never values:
      organizations_response_type (list | dict | python type name),
      organizations_top_level_keys (sorted key names, [] unless dict),
      organizations_row_count, organizations_non_dict_row_count,
      organizations_row_keys (sorted set of key names across dict rows),
      project_has_organization_id (true|false), and
      project_organization_id_matched_row_keys (sorted key names under which the
      project's organization_id equalled a row value, e.g. ['slug'] if the identity key
      moved off "id"; [] when nothing matched). Key names are the only strings copied
      from the response.
      assert_management_target: the call order (project, then organizations) is
      unchanged. The organizations GET is wrapped in try/except PromotionError and
      re-raised as "organizations_request_failed: <original message>" so a non-2xx
      reply keeps ManagementClient's existing "<classification>: HTTP <status>" text
      (no body content beyond the already-sanitized code) and additionally names the
      failing call. The membership test is unchanged in meaning: it still raises unless
      project.organization_id is truthy and some row (now also required to be a dict)
      has row["id"] == organization_id. On failure the message is
      "authenticated account does not own the selected project: " + the diagnostic.
      The acceptance rule was NOT widened (no slug or alternative-key acceptance; see
      unresolved). build_transaction, assert_history, read_history, load_migrations,
      ManagementClient, sanitize, run_batch, main, BATCHES and every EXPECTED_* table
      were confirmed byte/value-identical to origin/main via inspect.getsource.
  - file: scripts/backend/tests/test_phase7e_production_migration_promoter.py
    description: >
      Added a fake ORGANIZATION_ID ("org_9f3c2b1a7d5e4c6b" — not a real Supabase ref) and
      an ownership_client() factory that serves a healthy project, completed backup and the
      two reviewed Edge Functions while returning (or raising) a caller-supplied
      organizations response. Five new tests: (a)
      test_ownership_guard_accepts_a_list_containing_the_project_organization — list
      containing the id passes; (b)
      test_ownership_guard_reports_sanitized_shape_when_list_lacks_the_organization —
      list without it raises PromotionError whose message contains the shape fields and
      contains neither the project org id nor the row id/slug/name values; also covers
      project without organization_id (project_has_organization_id=false), an empty list
      (row_count=0), and the identity key appearing under "slug" instead of "id"
      (still fails; matched_row_keys=['slug']; no values leaked); (c)
      test_ownership_guard_keeps_the_dict_wrapper_behaviour — {"organizations": [...]}
      containing the id passes; a paginated-looking wrapper without it fails with
      response_type=dict and the top-level key names but not the cursor value; a dict
      keyed "data" yields row_count=0 and fails; (d)
      test_ownership_guard_never_leaks_row_values — rows carrying billing_email, name,
      id and slug values: the message and sanitize(message) contain none of them while
      the key names are listed; (e)
      test_ownership_guard_keeps_the_management_api_failure_classification — a raised
      "management_api_request_failed: HTTP 403" surfaces verbatim behind the
      "organizations_request_failed: " prefix. All 11 pre-existing tests are unchanged
      and pass.
  - file: docs/engineering/tasks/BG-0039/implementation-report.yaml
    description: this report.
