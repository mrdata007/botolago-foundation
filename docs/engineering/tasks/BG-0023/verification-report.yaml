remains_unproven:
  - >
    The suite has NOT been run through `supabase test db` against a real Supabase local stack. In
    particular the CASCADE from auth.users through app.profiles was exercised against a HAND-WRITTEN
    auth.users stand-in, not GoTrue's real table. The cascade edges themselves come from the
    repository's own migration (app.profiles.id references auth.users(id) on delete cascade) and
    were independently confirmed against production's live catalog, but GoTrue's own internal tables
    (sessions, identities, mfa_factors, one_time_tokens, refresh_tokens) are only approximated
    locally. Before running HALF 2 against production for real, expect the delete to also remove
    those rows — they all cascade — and note that the RESTRICT guard will refuse first anyway.
  - >
    Nothing in this lane has been executed against production. HALF 2 has only ever run against the
    local cluster and inside rolled-back transactions. The read-only half of every guard has been
    rehearsed against production and is reported above.
  - >
    Whether the owner wants the accounts deleted at all is an owner decision, presented as
    Decision 2 in the human-actions section with the irreversibility stated plainly and three
    options offered.
