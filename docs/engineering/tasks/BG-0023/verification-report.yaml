pgtap:
  docker_available: true
  supabase_cli_usable: false
  detail: >
    The docker binary exists and `docker info` returns a client block, but the Supabase CLI is not
    installed on this machine (`which supabase` is empty), so `supabase test db` / `supabase db
    reset` could not be run and the suite was NOT executed through the repository's own harness.
  substitute: >
    The same local harness described in docs/engineering/tasks/BG-0057/verification-report.yaml: a
    real PostgreSQL 16.13 cluster initdb'd under /var/lib/postgresql/bg0057 with the system
    postgresql-16-pgtap extension, all 72 supabase/migrations applied in order to a fresh database,
    plus minimal stand-ins for the Supabase-managed roles and auth/storage objects. This is NOT
    `supabase db reset`; it is the same migration set on the same major version.
  migrations_applied: 72
  result: 27 assertions, 27 ok, 0 not ok
  assertions:
    - ok 1 - fixture: three leagues start active — two duplicates and one unrelated
    - ok 2 - fixture: exactly three accounts match the synthetic pattern
    - ok 3 - default run: exactly the two duplicate leagues are reported, and nothing else
    - ok 4 - default run: one league remains active
    - ok 5 - default run: the unrelated "Ligue QA Test" is left alone
    - ok 6 - default run: NO account is deleted — p_include_accounts defaults to false
    - ok 7 - default run: not even a deletion REQUEST is filed
    - ok 8 - default run: api.archive_fantasy_league wrote one audit row per league
    - ok 9 - second run: nothing is archived a second time
    - ok 10 - second run: no additional audit row is written
    - ok 11 - rollback to savepoint restores all three leagues to active
    - ok 12 - league-count guard: the wrong expected count refuses and names every matching league
    - ok 13 - league-count guard: the refusal rolled everything back
    - ok 14 - membership-drift guard: a second member refuses and names the league
    - ok 15 - membership-drift guard: nothing was archived
    - ok 16 - RESTRICT guard: a blocking idempotency key refuses by name instead of a raw FK violation
    - ok 17 - RESTRICT guard: no account was deleted
    - ok 18 - RESTRICT guard: the refusal rolled the league archiving back too — the halves share one transaction
    - ok 19 - account-count guard: a widened pattern that catches a real user refuses and names every match
    - ok 20 - account-count guard: the real user is still there
    - ok 21 - account half: 2 league rows plus 3 account rows are reported
    - ok 22 - account half: the three synthetic accounts are gone
    - ok 23 - account half: the surviving account is the real user, not a synthetic one
    - ok 24 - account half: app.profiles cascaded away with auth.users
    - ok 25 - account half: the leagues were archived in the same transaction
    - ok 26 - second run: neither half finds anything left to do, and neither raises
    - ok 27 - rollback to savepoint restores all four accounts
  plan_line_caveat: >
    As in the BG-0057 suite, finish() under-reports the plan because `rollback to savepoint` rolls
    back pgTAP's internal counter. The authoritative count is the 27 `ok` lines and 0 `not ok` lines
    above.
  bugs_caught_by_this_suite: >
    Two real defects in the script, both found by assertions failing and both fixed before commit:
    (1) a bare `%` instead of `%s` in the qa_league_membership_drift format() call, which turned a
    named refusal into an opaque `22023: unrecognized format() type specifier` error; (2) a
    varchar(255) auth.users.email returned into a `text` result column, which raised `structure of
    query does not match function result type` AFTER the archiving half had already run. Both are
    recorded in docs/engineering/tasks/BG-0023/implementation-report.yaml.
  harness_sanity_check: >
    Three of the repository's existing suites were run unchanged on the same local cluster:
    football_deactivate_non_current_teams.test.sql -> 20 ok / 0 not ok (exactly the 20 assertions
    the BG-0043 verification report claims), fantasy_domain.test.sql -> 28 ok / 0 not ok,
    fantasy_rls.test.sql -> 16 ok / 0 not ok.
  script_file_rehearsal: >
    scripts/backend/fantasy-cleanup-qa-artifacts.sql was executed as a WHOLE FILE, completely
    unchanged, against the same local cluster, twice. (1) Against an empty database: it printed
    `already_applied (leagues)` and `account half SKIPPED`, and all three review SELECTs ran. (2)
    Against a database seeded with the synthetic fixture: it archived both duplicates through
    api.archive_fantasy_league, printed `account half SKIPPED — p_include_accounts is false, so no
    account-deletion path ran and no account was touched`, returned the two league rows, and the
    review SELECTs showed 'Ligue QA Test' still active, both duplicates at active=f, the population
    row with auth_users unchanged, and the two 'archive_league' mutation-audit rows. The session
    ended with an implicit ROLLBACK. This proves the file itself — not just the body — parses and
    runs, and that the shipped default deletes nothing.
  body_sync_check: >
    The pg_temp body in the script and the copy in the pgTAP test were compared programmatically
    and are byte-for-byte identical (225 lines).

