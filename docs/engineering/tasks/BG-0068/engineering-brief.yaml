objective: >
  The master plan's TEAM_TRANSLATIONS was never built. app.competition_translations,
  app.venue_translations, app.country_translations and app.taxonomy_translations all
  exist; there is no app.team_translations. Every language-aware Football read
  therefore returns app.teams.name — a Latin string — even for p_language = 'ar', so
  an Arabic reader sees all 16 Botola clubs spelled in a foreign alphabet. Add the
  missing table, teach the reads to prefer it, and draft the Arabic names for owner
  approval.

finding:
  classification: VERIFIED
  evidence: >
    Production tkewgajrljbwgwedqsxn, read-only: `select table_schema, table_name from
    information_schema.tables where table_name like '%translation%'` returns exactly
    app.competition_translations, app.country_translations, app.taxonomy_translations
    and app.venue_translations. No team translations table exists.
    `pg_get_functiondef(app_private.football_team_json)` shows 'name', team.name and
    'shortName', team.short_name with `requested_language` accepted and then ignored —
    the one place a team becomes JSON, and it had no translation join at all.

