scope_deviation:
  - id: D1
    subject: api.fantasy_player_pool and api.fantasy_fixture_difficulty
    severity: needs a Chief decision, does not block the rest
    statement: >
      The brief asked for six RPCs to coalesce the translated name. Four were done.
      Two were not, and could not be without breaking a hard rule of the same brief.
    detail: >
      api.fantasy_fixture_difficulty(uuid, integer, integer) emits fixtureId,
      gameweekId, gameweek, clubId, opponentClubId, kickoffAt, isHome, difficulty,
      confidence and algorithmVersion — ids and numbers. There is no team name in its
      payload to translate. Adding one would be a payload change, not a translation.

      api.fantasy_player_pool DOES emit teamName and teamShortName and they are Latin
      in Arabic today, but it takes no language argument. CREATE OR REPLACE cannot add
      a parameter, so giving it p_language needs a DROP — a signature change, which the
      brief forbids and which the generated Supabase types,
      src/backend/fantasy/supabase-repository.ts and the 22 Playwright journeys are
      pinned to. I wrote and then deleted an alternative that read the language from
      the `request.headers` GUC: nothing in this codebase sends Accept-Language
      (`grep -rn "accept-language" src/ scripts/` → no hits), so it would have keyed
      the squad builder's club names off the viewer's browser locale instead of the
      app's selected language — a silent wrong answer in place of an honest Latin one.
    recommendation: >
      Give api.fantasy_player_pool a p_language parameter in its own release, together
      with the type regeneration, the repository call site and the journey updates.
      Until then the squad builder shows Latin club names while every catalog, match,
      standings and team surface shows Arabic.

  - id: D2
    subject: src/backend/generated/database.types.ts
    severity: CI will fail without this
    statement: >
      app.team_translations is a new table in a generated schema (public, app, api), so
      database.types.ts is now stale. `bun run backend:types:generate` shells out to
      `supabase status` and needs a running local stack; there is no Docker in this
      environment, so it could not run. Per the brief I did NOT hand-edit the file —
      the generator's formatting differs from a human's and
      `bun run backend:types:check` in .github/workflows/backend-quality.yml compares
      byte-for-byte.
    action_required: >
      Whoever has Docker runs `bun run backend:types:generate` on this branch and
      commits the result before the PR can go green.
