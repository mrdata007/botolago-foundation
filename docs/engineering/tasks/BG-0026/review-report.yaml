judgments:
  - question: "(1) Is BottomNav px-2 -> px-0.5 an acceptable realisation of scope_mutation_1?"
    answer: ACCEPTABLE
    reasoning: "The mutation allows 'label/slot padding or one typographic step so all five fr labels fit at 390px'. px-0.5 is the padding option, one utility on one line. Touch target: the Link keeps flex-1 min-h-11 min-w-11 and measures 69.6 x 45 px in both languages (>= 44 px WCAG-size target, full slot width), and the tap area is the whole Link, not the label, so padding has no effect on it. Label spacing: the largest neighbour gap after the change is Actualités..Fantasy = 14.1 px (156.6 -> 170.7), and Arabic nearest pair المباريات..الملف الشخصي = 12.1 px (88.6 -> 100.7), so labels do not visually merge. No typographic change was needed, which keeps the fr rendering pixel-identical outside sub-pixel re-centering (Verifier fr diff <= 61 px in the label row on hub/news/profile). The Arabic profile label now ellipsizes inside its own slot instead of overlapping المباريات, which is the D5 requirement."
  - question: "(2) Could the dir=\"auto\" span in fantasy.fixtures.tsx change anything for Arabic club names?"
    answer: "NO (verified)"
    reasoning: "dir=auto resolves from the first strong character; an Arabic name resolves to rtl, the same as the inherited cell direction, so text-align:start, ellipsis side and glyph order are unchanged - the isolated Chromium reproduction shows byte-identical metrics and pixel-identical rendering for Arabic names with and without the attribute. The only additional effect is unicode-bidi:isolate, which isolates the name from surrounding text; the span's only sibling is the crest, so nothing adjacent can be re-ordered. For Latin names it produces exactly the intended end-side truncation. Mixed-script names would resolve by their first strong character, which is the correct behaviour for a standalone name. Edge case: a name starting with digits or punctuation falls back to the parent (rtl); no club shortName in the FDR table is of that form as far as the brief's evidence shows, and the fallback is the pre-change behaviour, so no regression is possible."
  - question: "(3) Are the prettier reflows in dialog.tsx and fantasy.fixtures.tsx within scope?"
    answer: WITHIN SCOPE
    reasoning: "In both files the diff is the one required token change (sm:text-left -> sm:text-start; adding dir=\"auto\") on the one allowed line, and the only other bytes changed are whitespace/newlines that wrap that same JSX element to print-width. No other attribute, token or line is affected (dialog +3/-1 around l.76; fixtures +3/-1 around l.176), dialog.tsx:44 is untouched. The brief's T4 requires `bun run lint` with no new warnings and the repo's lint runs prettier/prettier as an error, so the reflow is a necessary consequence of the required change, not an expansion. It is disclosed in the ImplementationReport scope_deviations."
  - question: "(4) Is the Verifier's untested list (authenticated surfaces) an acceptable risk for a P2 merge?"
    answer: ACCEPTABLE
    reasoning: "The brief itself sets the verification bar at public routes ('Public unauthenticated routes only for verification; authenticated states are compared against docs/qa/fpl-screens/ar_*.png'), so the gap was anticipated by the Researcher and accepted in the approved brief. The untested items are (a) the chevron-left mirror on GameweekSelector/fantasy.points/primitives back button: it is one global CSS rule keyed on a lucide class, and the identical rule/class was verified in the browser on the public /fantasy/rankings back button (same primitives.tsx component) and the /matches date strip; the affected call sites were enumerated and are all prev/back affordances; (b) T7 FDR: the mechanism is reproduced in isolation with the same DOM structure (this report); (c) toaster stripe, input-otp corners, profile-setup gutter: verified in the built CSS (border-inline-start-width:4px under the toaster selector, border-inline-end, first:rounded-s-md, last:rounded-e-md, pe-1) - these are pure logical-property substitutions whose LTR rendering is identical by definition, so the only residual risk is RTL-only and cosmetic. For a P2 cosmetic task with zero forbidden-path, test or data impact and a public-route baseline that reproduces the defects on main and the fixes on HEAD, the residual risk is proportionate. Recommendation (non-blocking): the first authenticated Arabic QA pass after merge should re-take ar_fdr.png and ar_points.png to close T7 formally."

