      excludes hyphen-prefixed tokens):
      rg -P -o --no-heading -n '(?<![A-Za-z0-9_\-])-?(?:(?:ml|mr|pl|pr|left|right|border-l|border-r|rounded-l|rounded-r|rounded-tl|rounded-tr|rounded-bl|rounded-br|scroll-pl|scroll-pr|scroll-ml|scroll-mr)-[^\s"'`{}]+|text-left|text-right|float-left|float-right|clear-left|clear-right|origin-left|origin-right|origin-top-left|origin-top-right|origin-bottom-left|origin-bottom-right|border-l|border-r|rounded-l|rounded-r)(?=[\s"'`}]|$)' src -g '*.tsx' -g '*.ts'
