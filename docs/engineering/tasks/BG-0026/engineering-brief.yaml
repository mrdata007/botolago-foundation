task_id: BG-0026
role: Researcher
attempt: 1
objective: >
  RTL layout audit: inventory and classify every physical-direction Tailwind utility in src/,
  screenshot the main Fantasy/news screens in Arabic (dir=rtl, 390px) and name visible defects,
  identify short-label truncation candidates, and scope the fix (logical-utility mapping for class (a)
  plus component-level fixes). Evidence base: worktree /home/user/research-main at origin/main 1603c1c,
  dev server http://127.0.0.1:4173 (primary tree, same commit), Playwright/Chromium 1194,
  docs/engineering/tasks/BG-0014*/ scout report and brief, docs/qa/fpl-screens/ar_*.png (commit 3b2083a).

findings:
  # ---------------------------------------------------------------- mechanism
  - classification: VERIFIED
    statement: >
      Direction is switched at runtime by the I18nProvider: after mount it sets
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr" (and lang / data-lang);
      SSR always emits <html lang="fr" dir="ltr">. Context exposes `dir` for components.
    evidence: "src/i18n/provider.tsx:54-60 and :74; src/routes/__root.tsx:141"
  - classification: VERIFIED
    statement: >
      Only five global RTL CSS rules exist: font-family switch, body line-height, and scaleX(-1)
      mirroring for .lucide-chevron-right, .lucide-arrow-right, .lucide-arrow-left. There is NO rule
      for .lucide-chevron-left.
    evidence: "src/styles.css:427-431"
  - classification: VERIFIED
    statement: >
      Tailwind v4 (tailwindcss ^4.2.1, @tailwindcss/vite ^4.2.1) CSS-first config; logical utilities
      are ALREADY in use in app code, so no utility needs defining in src/styles.css:
      text-start/text-end/pe-6/end-1 (src/components/fpl/AddPlayerScreen.tsx:213,226,229,232,273,282),
      -ms-1 pe-2 (src/components/fpl/primitives.tsx:56), end-4 (src/components/ui/dialog.tsx:59,
      src/components/ui/sheet.tsx:82), start-1/2 (src/components/fantasy/RankingsPodium.tsx:63,
      src/components/matches/EventTimeline.tsx:45, src/components/shell/FirstLaunchLanguage.tsx:26),
      sticky start-0 (src/routes/fantasy.fixtures.tsx:173), ms-1 / pe-3 (src/routes/news.tsx:226,454),
      ms-auto (src/components/fantasy/FantasySubNav.tsx:64), text-end (src/components/common/MatchCard.tsx:316,
      src/components/fpl/SquadListTable.tsx:72). `rtl:` variants are used in 7 files.
    evidence: "package.json:67,88; grep output cited per file:line above"

  # ---------------------------------------------------------------- inventory
  - classification: VERIFIED
    statement: >
      The Scout's "111" is reproduced exactly by
      `grep -rnoE '\b(ml|mr|pl|pr|left|right)-[0-9a-z\[]|text-left|text-right' src` -> 111 matches
      (same result restricted to *.ts/*.tsx). That regex over-counts: `\b` matches after a hyphen, so
      `slide-in-from-left-52`, `top-left`, `-left-`, etc. are counted, and a prose comment
      ("right-aligned", src/components/fpl/SquadListTable.tsx:24) is included.
    evidence: "command run in /home/user/research-main; output 111 / 111"
  - classification: VERIFIED
    statement: >
