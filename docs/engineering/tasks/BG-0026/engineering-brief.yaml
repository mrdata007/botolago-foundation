constraints:
  - "No copy/dictionary changes (src/i18n/** forbidden); truncation is mitigated structurally only."
  - "No new dependency; no tailwind config file (v4 CSS-first, src/styles.css only for the one CSS rule)."
  - "Physical `side` contracts of Sheet/Sidebar and translate-centred dialogs stay physical (class b)."
  - "Do not touch DateStrip.tsx:96-97 or GameweekSelector.tsx: they are correct once the chevron-left rule exists."
  - "Public unauthenticated routes only for verification; authenticated states are compared against docs/qa/fpl-screens/ar_*.png."

risks:
  - "Adding the .lucide-chevron-left rule mirrors every ChevronLeft in RTL: the audit found 13 usages outside ui/; all are back/prev affordances (primitives.tsx:38, GameweekSelector.tsx:33, fantasy.points.tsx:192, fantasy.rankings.tsx:221, DateStrip.tsx:96-97). The rankings:221 rtl:rotate-180 MUST be removed in the same change or it double-flips."
  - "input-otp: the `input-otp` library renders slots in DOM order; in RTL the flex group places slot 0 on the right. Logical corner utilities fix the visual frame, but digit entry order in RTL is UNKNOWN (U3); if product wants a strictly LTR code box, wrap InputOTPGroup with dir=\"ltr\" instead (auth.verify.tsx, not in allowed paths - escalate)."
  - "tailwind-merge ^3.5.0 treats ps-/pe- and pl-/pr- as separate groups; any caller passing className=\"pl-*\" to these primitives would no longer override. Grep found no such callers for the 6 live primitives."
  - "Sonner: `group-[.toaster]:border-s-4` relies on Tailwind v4 generating border-inline-start-width under the arbitrary group variant; verify in the built CSS (acceptance test 6)."
  - "The body font override (styles.css:439) means Arabic renders in a fallback font; widths in the truncation table may differ once that is fixed (separate task)."

contradictions:
  - "Scout count 111 vs precise 87 (same family) / 113 (broad): the Scout regex counted hyphen-internal tokens and a comment. Neither count implies 111 must-flip sites; must-flip is 31."
  - "GameweekSelector.tsx:21-22 and DateStrip.tsx:94-97 document a global chevron-* mirroring contract that src/styles.css:429-431 only half implements."
  - "docs/qa/FANTASY_INDEPENDENT_QA_2026_09_18.md cites ar_*.png as RTL evidence without recording D2/D6, both visible in those files."

