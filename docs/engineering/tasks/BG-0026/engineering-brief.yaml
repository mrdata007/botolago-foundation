root_cause:
  classification: VERIFIED
  description: >
    Two independent causes. (1) The remaining physical-direction utilities are concentrated in copied
    shadcn primitives (110/113); app code has already been migrated to logical utilities, but the 6
    primitives that actually render (select, dropdown-menu, sonner, sheet, dialog, input-otp) plus one
    route still carry 31 physical tokens that place indicators, paddings, accent borders and corner
    radii on the LTR side. (2) The icon-mirroring contract is incomplete: components were written on the
    assumption that "the .lucide-chevron-* classes are flipped in RTL by global styles"
    (GameweekSelector.tsx:21-22, DateStrip.tsx:94-97), but styles.css:429-431 mirrors only
    chevron-right / arrow-right / arrow-left, and three sites additionally apply `rtl:rotate-180` to an
    already-mirrored ChevronRight. The bottom-nav overflow (D5) and FDR start-truncation (D6) are local
    flex/bidi omissions, not utility-direction issues.

