  radius, Tailwind type-ramp size or unprefixed `tracking-*`. Product-wide,
  divergence from the kit fell from 1898 to 1728 — because 96% of what is left
  belongs to lanes other than this one. The honest answer to "can global design
  consistency be called PASS" is in `remaining_work` below, and it is no.

