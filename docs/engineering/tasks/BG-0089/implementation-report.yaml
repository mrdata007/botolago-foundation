# ---------------------------------------------------------------------------
# What changed
# ---------------------------------------------------------------------------

changes:
  - area: 404 and error states (src/routes/__root.tsx)
    what: >
      The two screens a visitor can reach with no app shell around them were
      the last two still painting a `cta-brand` pill, `text-brand` and the
      Tailwind ramp. Both now use kit tokens. They deliberately stay on plain
      elements rather than `UiButton`/`UiLinkButton`, because the error
      boundary renders when the router may itself be what failed, so nothing
      there should need router context to paint.

  - area: first-launch language chooser (src/components/shell/FirstLaunchLanguage.tsx)
    what: >
      The first screen a new visitor ever sees, and the loudest surviving
      piece of V2: a 24px-radius `glass-surface glass-strong` panel with
      `border-white/20`, `shadow-2xl`, `bg-white/40` option tiles and a
      `cta-brand` pill — all light-only. Now an opaque kit card with kit
      radii, type scale and ink/gradient pairings. 22 divergences to 0.

  - area: navigation
    what: >
      `TopBar` desktop nav links were 36px tall (meta type + `py-2`) against
      the product's 44px floor; they now carry `ui.space.tap`.
      `LanguageSwitcher`'s trigger was a V2 glass pill sitting directly beside
      those links and is now the same vocabulary, also at 44px.

  - area: match pages
    what: >
      `MatchScoreHeader` (ten unprefixed `tracking-*`, `--brand-accent`,
      `--surface-hover`, the Tailwind ramp), `LineupsView`, `CompetitionHeader`
      and the `EventTimeline` / `StatComparison` empty states moved to kit
      tokens. `StandingsTable`'s form pills were painting straight out of the
      Fantasy `--fpl-*` palette — a light-only reconstruction with no dark
      counterpart (BG-0084) — and now use `--ui-positive` / `--ui-negative` /
      `--ui-surface-sunken`.

  - area: standings sort controls
    what: >
      The column-header sort buttons measured 6–24px wide by 15px tall. They
      are the only way to sort the table. Now `ui.space.tap` (44px), which
      costs nothing at 390px because the table already sits in an
      `overflow-x-auto` scroller.

  - area: Home
    what: >
      `FantasySummaryCard`'s four metric captions were `truncate` in a
      four-across 390px row, which cut three of four French captions mid-word
      ("Points de la…", "Classement gén…"). They now wrap to two clamped
      lines; the grid stretches the tiles so the row stays aligned.

  - area: Profile, auth, legal
    what: >
      `profile.tsx`'s legal-link row, `AuthPromptDialog`'s two CTAs,
      `AuthModeBadge` (a raw `bg-amber-500/90` + `text-black`, illegible the
      moment the app is in dark mode), `LegalDocumentView` and
      `FantasyAlertList` (`text-sky-900` on `bg-sky-500/10`, same problem) all
      moved to kit tokens.

  - area: Arabic letter-spacing (BG-0069)
    what: >
      44 unprefixed `tracking-*` declarations were given the `ltr:` prefix
      across matches, common, shell, auth, news, admin and the vendored shadcn
      files that are actually rendered. Arabic letterforms join, and spacing
      them apart breaks the word.
    caveat: >
      35 remain, every one of them in `src/routes/fantasy.*`,
      `src/components/fantasy/**` or `src/components/fpl/**`. Those files are
      owned by the Fantasy lanes. The fix is mechanical — prefix with `ltr:` —
      and it is listed in `remaining_work` so it does not get lost.

  - area: News (behind NEWS_ENABLED=false, done because it was cheap)
    what: >
      `CategoryChips` is now the kit's `UiChip`; its row also stopped claiming
      `role="tablist"`, which it never was — selecting a category filters a
      feed in place, it does not switch panels. `ClubFilterRow`, `SavedButton`,
      `LatestFeed` and `PlacementBadge` moved off `--glass-border` /
      `bg-white/50` / `--brand-accent` onto kit tokens.

  - area: BG-0100 — competition timezone
    what: >
      Six date formatters followed the viewer's browser while the match card
      beside them pinned `Africa/Casablanca`. Fixing the formatters alone
      would not have been enough: the day *boundary* arithmetic was also
      browser-local, so a 20:00 Casablanca kickoff was bucketed into the wrong
      day for anyone outside UTC+1, and the backend (already correctly asked
      for a Casablanca day) had its answer re-filtered through the wrong
      calendar.
    added:
      file: src/lib/match-kickoff.ts
      exports: [matchDayKey, isSameMatchDay, startOfMatchDay, addMatchDays, matchDayFromKey]
      notes: >
        The zone offset is read at the instant in question rather than
        hardcoded, because Morocco is not a fixed +01:00 — the clock drops to
        +00:00 for Ramadan and back. `addMatchDays` therefore steps calendar
        days, not 86_400_000 ms.
    call_sites_fixed:
      - "src/components/matches/DateStrip.tsx — four formatters, the day boundaries, the ±N stepping and the same-day test"
      - "src/routes/matches.index.tsx — the heading formatter, `sameDay`, `startOfDay`, `dateFromKey` and the React Query key"
      - "src/routes/matches.$matchId.tsx — the match-day heading"
      - "src/routes/index.tsx — the Home greeting's date line"
      - "src/services/football.ts — `dateKey()`, which builds the day sent to the backend"
    left_alone_deliberately:
      - "src/lib/format-time.ts — also unpinned, but serves only News (NEWS_ENABLED=false); tracked separately."
      - "The Fantasy deadline — every surface that renders it already pins Africa/Casablanca."
    test: src/lib/match-day.timezone.test.ts
    test_notes: >
      14 assertions run in child processes launched under TZ=UTC,
      America/Los_Angeles, America/Sao_Paulo, Asia/Tokyo and Pacific/Auckland.
      `TZ` is read once at startup, so reassigning `process.env.TZ` mid-run
      does not move the local calendar and a single-process test would have
      proved nothing. One test asserts the broken and correct answers actually
      differ ("2026-09-25" locally in Auckland vs "2026-09-24" in the
      competition calendar), so the suite fails loudly if it ever stops
      testing anything.

# ---------------------------------------------------------------------------
# Requests for the foundation lane (NOT made here — the kit is not mine)
# ---------------------------------------------------------------------------

kit_change_requests:
  - id: K1
    component: UiSegmented
    request: >
      A `size` prop, and a 44px floor on every segment. Segments are
      `min-h-10` (40px), under the product's own tap floor, on what is the
      primary navigation of the screens that use it. They also hardcode
      `ui.text.body` (15px), and four French tab labels
      (Résumé / Stats / Compos / H2H) do not fit a 390px row at that size.
    evidence: "Measured live at 390px and 1440px, FR and AR: the two Fantasy hub segments render 160×40 and 205×40."
    current_workaround: >
      `src/components/matches/MatchTabs.tsx` carries two arbitrary variants —
      `[&>button]:min-h-[var(--ui-tap-min)]` and
      `[&>button]:text-[length:var(--ui-text-meta)]` — reaching into the kit's
      internals from a call site. Left in place as instructed.

  - id: K2
    component: UiChip
    request: >
      Forward the `ref` to the underlying `<button>`, and accept an
      `aria-current` passthrough.
    why: >
      `src/components/matches/DateStrip.tsx` has to wrap every chip in a
      positioning `<div>` purely to hang a ref for scroll-into-view, and a day
      in a date strip is a position within a set, not a toggle — it should
      announce `aria-current="date"`, but the chip only offers `aria-pressed`,
      so the strip claims the wrong semantics. Both would be removed by this
      change.

  - id: K3
    component: MatchCard
    request: "Deprecate and then remove the `glass` prop."
    why: >
      It is inert — both settings resolve to the same kit card — and no caller
      in the repository passes it. Verified by grep across src/.

  - id: K4
    component: "ui.tone.ink on light surfaces (relates to BG-0083)"
    request: "Already known, restated with a live example."
    why: >
      `src/components/shell/ThemeSwitcher.tsx` documents why it cannot reuse
      `UiSegmented`: the active segment paints `text-[color:var(--ui-ink)]` on
      `var(--ui-surface)`, and `--ui-ink` is a dark navy in BOTH themes, so on
      the dark surface the active label computes to roughly 1.4:1. A second
      component now exists working around the same token.

