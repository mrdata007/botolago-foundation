remaining_work:
  verdict: >
    Global design consistency is NOT PASS. It is PASS for the public
    application surface this lane owns and was able to verify end to end. 1728
    divergences remain across src/, and 1681 of them (97%) are in files this
    lane was told not to touch.

  items:
    - id: R1
      size: large
      count: 964
      what: "Fantasy routes, src/components/fantasy and src/components/fpl."
      detail: >
        Built on `--fpl-*`, which styles.css documents as a light-only
        reconstruction with no `.dark` counterpart, plus literal `bg-white`.
        Includes 35 unprefixed `tracking-*` — a live Arabic defect (BG-0069) on
        Fantasy screens.
      owner: "Fantasy lanes / BG-0084"
      note: >
        ~105 of these are in five components nothing imports — SquadListView,
        PlayerPickerDrawer, TransferReviewPanel, GameweekStatusStrip,
        FantasyChipCard. Confirm before converting them.

    - id: R2
      size: medium
      count: 320
      what: "Admin routes and src/components/admin."
      detail: >
        `admin.news.$articleEditionId.tsx` alone carries 92 (69 hardcoded
        colours). Not a launch surface and not user-facing, but it is part of
        "the product looks like one application" if any staff member sees it.
      owner: unassigned

    - id: R3
      size: small-but-free
      count: 170
      what: "40 vendored shadcn files in src/components/ui/ that nothing imports."
      detail: >
        sidebar (29), menubar (24), context-menu (22), calendar (10),
        navigation-menu (10), chart (8), carousel (6), table (5), accordion,
        alert, alert-dialog, badge, breadcrumb, hover-card, label, pagination,
        popover, resizable, scroll-area, switch, tabs, textarea, toggle,
        tooltip and the rest. Only dialog, dropdown-menu, input-otp, select,
        sheet and sonner are reachable from app code.
      recommendation: >
        Delete them. That removes 170 of the 1728 — a tenth of the product's
        apparent inconsistency — at zero visual risk, and it is a smaller
        change than converting them. It is a decision, not a conversion, so
        this lane did not take it.
      owner: unassigned

    - id: R4
      size: small
      count: 188
      what: "src/styles.css (85), src/lib/kits.ts (95), src/theme, src/lib/error-page.ts (8)."
      detail: >
        `kits.ts` is club kit colour DATA, not styling — it should stay hex and
        should arguably be exempted from the meter. `error-page.ts` is a
        standalone HTML string served when the app bundle itself fails to
        load, so it cannot reference app CSS custom properties. `styles.css` is
        the token file.
      owner: "foundation lane / exempt"

    - id: R5
