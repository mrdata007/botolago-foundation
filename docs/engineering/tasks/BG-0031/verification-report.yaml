security_observations:
  - "Confirmed flag/trigger discrepancy (rehearsal step b2): with bounds_locked_at set, a provider payload the monotone rule accepts (endsOn 2027-07-05) returns {outcome:'updated', endsOnPreserved:false} while the row stays 2027-06-30. Ingestion evidence will therefore under-report preservation while locked; the RPC is not lock-aware. Functional outcome is correct; reporting is misleading."
  - "No path found by which a provider payload can shrink ends_on: the floor always includes the existing ends_on (greatest(...)), so ends_on is monotone non-decreasing through the RPC even with no fixtures/memberships/fantasy season; the lock additionally freezes both bounds. Remaining provider influence: (1) ends_on can still be EXTENDED without limit when unlocked (b4: 2027-07-05 accepted) and cannot be shortened again by the provider afterwards; (2) starts_on can still be moved EARLIER without limit (only a later-than-first-fixture start is guarded, migration line 252-253); (3) label, competition_id, is_current and status are still overwritten and updated_at is bumped on every run (a_row updated_at changed in the rehearsal), so the fantasy catalog source digest keeps drifting each run (BG-0038 scope)."
  - "Builder-noted edge confirmed by reading (not reproduced): a season with NO fixtures whose provider payload moves a one-day season forward keeps ends_on but accepts the later starts_on, tripping seasons_date_range_check -> 22023 INVALID_PROVIDER_PAYLOAD (ingestion run error rather than silent write). Production 2026/27 has fixtures on its start day and is not affected."
  - "The lock is bypassable by any role with UPDATE on app.seasons that also changes bounds_locked_at (by design: the explicit owner path). Nothing in this change exposes app.seasons for direct writes; the RPC is SECURITY DEFINER and executable by service_role only (authenticated/anon: no EXECUTE, unchanged by the migration)."
  - "The inline migration takes ACCESS EXCLUSIVE on app.seasons for the ALTER TABLE; the rehearsal completed well within the 60s window. The migration writes no data; the 2026/27 correction + lock remain an owner-executed statement (the guard alone leaves the row at 2026-09-24)."

