hand_derived_expectations:
  setup: >
    Season 28647 inserted 2026-09-24..2026-12-31 (insert branch, unchanged). Attached data: fixture
    2026-09-24, membership valid_to 2027-06-30, fantasy ends_at 2027-05-31. Floor =
    greatest(2026-12-31, 2026-09-24, 2027-06-30, 2027-05-31) = 2027-06-30; first kickoff = 2026-09-24.
  case_1_regression_replay: >
    Payload 2026-09-24..2026-09-24. endsOn <= startsOn (true) -> preserved -> ends_on stays 2026-12-31.
    startsOn 09-24 > first kickoff 09-24 is false -> accepted (same value). Result minus id =
    {"outcome":"updated","endsOnPreserved":true,"startsOnPreserved":false}; row 2026-09-24..2026-12-31.
  case_1b_floor_from_memberships: >
    Payload endsOn 2027-03-31: not <= startsOn; 2027-03-31 < floor 2027-06-30 -> preserved -> ends_on
    stays 2026-12-31 (rule: keep the existing value, not the floor). endsOnPreserved 'true'.
  case_3_larger_accepted: >
    Payload endsOn 2027-07-05 > floor 2027-06-30 -> accepted; flags false/false; ends_on = 2027-07-05.
    Floor for the following cases becomes greatest(2027-07-05, ...) = 2027-07-05.
  case_3b_start_after_first_fixture: >
    Payload startsOn 2026-10-01, endsOn 2027-07-05: ends not preserved (07-05 = floor, not <); start
    10-01 > first kickoff 09-24 -> preserved -> starts_on stays 2026-09-24. Flags endsOnPreserved false,
    startsOnPreserved true.
  case_3c_start_before_first_fixture: >
    Payload startsOn 2026-09-20 <= 09-24 -> accepted; starts_on = 2026-09-20; startsOnPreserved 'false'.
  case_2_equality_isolated_from_floor: >
    Season 28648 inserted 2027-09-01..2027-09-01 (one-day season, allowed by ends_on >= starts_on);
    fixture 2027-09-01T18:00Z. Payload 2027-09-05..2027-09-05: floor = greatest(2027-09-01, 2027-09-01)
    = 2027-09-01 and 09-05 > floor, so only endsOn <= startsOn fires -> ends_on stays 2027-09-01; start
    09-05 > first kickoff 09-01 -> starts_on stays 2027-09-01. Result flags true/true; row unchanged
    [2027-09-01, 2027-09-01].
  case_4_lock: >
    4a: UPDATE sets bounds_locked_at '2026-09-18T12:00Z' + starts 09-24 + ends 2027-06-30: OLD lock is
    null -> trigger no-op -> [2026-09-24, 2027-06-30]. 4b: payload startsOn 2026-09-01 / endsOn
    2028-01-01 (RPC accepts both: 2028-01-01 > floor 2027-06-30, 09-01 <= first kickoff 09-24); the
    UPDATE fires the trigger with NEW.lock = OLD.lock -> starts/ends restored; outcome 'updated'; row
    still [2026-09-24, 2027-06-30]; bounds_locked_at unchanged. 4c: plain UPDATE ends_on 2027-07-31 ->
    trigger restores -> 2027-06-30. 4d: UPDATE ends_on 2027-07-31 + bounds_locked_at '2026-09-18T13:00Z'
    (distinct) -> passes -> 2027-07-31. 4e: UPDATE ends_on 2027-08-31 + bounds_locked_at null (distinct)
    -> passes -> 2027-08-31.

verifier_production_rehearsal_recipe: |
  NOT RUN by the Builder. Read-write session on production is the Verifier's/owner's; everything below
  is inside one transaction that ends in ROLLBACK. Run with the workflows on HOLD; the inline migration
  takes an ACCESS EXCLUSIVE lock on app.seasons and replaces the RPC for the duration of the transaction,
  so keep it short. The rehearsal is valid both before and after the owner correction: it asserts
  "ends_on unchanged" against the value captured at the start, and endsOnPreserved = true (the payload
  value 2026-09-24 is <= startsOn and below the membership floor 2027-06-30 either way).

    begin;
    -- 0. capture the current row
    create temporary table bg0031_before on commit drop as
      select id, starts_on, ends_on, status, is_current, updated_at
        from app.seasons where id = 'd03223b0-8f4a-4309-93e1-2a708d7c3584';
    -- 1. inline the guard migration (paste the full content of
    --    supabase/migrations/20260918160000_season_bounds_guard.sql here, or \i it with psql)
    -- 2. call the RPC exactly as the ingestion does, as service_role, inside a savepoint
    savepoint bg0031_rpc;
    select set_config('request.jwt.claims', '{"role":"service_role"}', true);
    set local role service_role;
    select api.ingest_football_catalog_entity(
      'sportsmonks', 'season', '28647',
      jsonb_build_object(
        'externalId', '28647', 'competitionExternalId', '860', 'label', '2026/2027',
        'startsOn', '2026-09-24', 'endsOn', '2026-09-24', 'current', true,
        'freshness', jsonb_build_object(
          -- must be >= the mapping's last_seen_at (2026-09-18T10:06:43Z) or the RPC raises STALE_UPDATE
          'updatedAt', to_char(clock_timestamp() at time zone 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.MS"Z"'),
          'sourceSequence', 0,
          'sourceVersion', 'sportsmonks:28647:bg0031-rehearsal',
          'provisional', false)))
      as rpc_result;
    -- expected: {"id":"d03223b0-8f4a-4309-93e1-2a708d7c3584","outcome":"updated","endsOnPreserved":true,"startsOnPreserved":false}
    reset role;
    -- 3. assert and abort
    do $$
    declare b record; a record;
    begin
      select * into b from bg0031_before;
      select id, starts_on, ends_on, status, is_current, updated_at
        into a from app.seasons where id = 'd03223b0-8f4a-4309-93e1-2a708d7c3584';
      if a.ends_on <> b.ends_on or a.starts_on <> b.starts_on then
        raise exception 'rehearsal FAILED: bounds moved % -> %', to_jsonb(b), to_jsonb(a);
      end if;
      if a.status <> 'active' or not a.is_current then
        raise exception 'rehearsal FAILED: status/is_current changed: %', to_jsonb(a);
      end if;
      raise notice 'rehearsal ok: bounds unchanged %..%', a.starts_on, a.ends_on;
      raise exception 'REHEARSAL_ROLLBACK';
    end $$;
    rollback;

  Read-only checks that need no transaction (any time after the migration is promoted):
    select pg_get_functiondef('api.ingest_football_catalog_entity(text,text,text,jsonb)'::regprocedure)
      like '%endsOnPreserved%';                                   -- true
    select tgname from pg_trigger where tgrelid = 'app.seasons'::regclass and not tgisinternal;
      -- seasons_protect_locked_bounds, seasons_set_updated_at
  Optional lock rehearsal (same pattern, rolled back): `update app.seasons set bounds_locked_at = now(),
  bounds_locked_reason = 'rehearsal' where id = 'd03223b0-...'`, then the RPC call with endsOn
  '2028-01-01' / startsOn '2026-09-01', then assert starts_on/ends_on equal the captured values.

