unexpected_observations:
  - "Behavioural edge of rule (b) worth a Chief decision (not changed, by spec): for a one-day season with NO fixtures, a provider payload that moves the single day forward (e.g. stored 2027-09-01..2027-09-01, payload 2027-09-05..2027-09-05) now keeps ends_on 2027-09-01 but accepts starts_on 2027-09-05, which violates seasons_date_range_check and surfaces as 22023 INVALID_PROVIDER_PAYLOAD (reproduced on the stub harness). Before the guard the move was accepted. Production 2026/27 has a fixture on its start day, so it is not affected; a future provider-created season with no fixtures could be. Option if wanted: also preserve starts_on when the preserved ends_on would be < the provider start."
  - "The RPC's endsOnPreserved/startsOnPreserved report the RPC's own decision, not the trigger's: with bounds_locked_at set, a provider update the monotone rule would accept returns endsOnPreserved=false while the row is in fact unchanged (test case 4b documents this). Making the RPC lock-aware (read bounds_locked_at in the same SELECT and force both flags true) is a two-line addition that the task's 'ONLY these additive changes' excluded; recorded for the Reviewer."
  - "Realisation detail: the fixture date is computed as (kickoff_at at time zone 'UTC')::date rather than kickoff_at::date so the floor does not depend on the session TimeZone; the fantasy_seasons expression already used the UTC form in the task statement. Production runs in UTC, so the values coincide."
  - "The migration uses `add column if not exists` and `drop trigger if exists` so a re-run of the file is idempotent; CREATE OR REPLACE FUNCTION is idempotent by nature."
  - "origin/main moved from 6dd5e98 to 92857fa and then db76141 during the build (unrelated commits); the branch was rebased onto db76141 (see `base`). If the Chief prefers the original base, `git rebase --onto 6dd5e98 db76141` restores it without content change (the manifest edit would then conflict with BG-0037's fantasy_deadline_guard batch, which only exists on the newer main, so the rebase is also functionally required for the scope addition)."
  - "Promoter inventory coupling (why the scope addition was necessary): test_batches_cover_the_exact_ordered_migration_chain compares supabase/migrations/*.sql on disk with BATCHES, so any migration merged without a manifest entry turns that test red on main. BG-0027's pending 20260918150000 migration will hit the same check and needs its own batch inserted BEFORE season_bounds_guard (with the season_bounds_guard prefix count moving 59 -> 60) when it lands."
  - "Environment: to run the throwaway PostgreSQL cluster as the unprivileged `postgres` OS user, the execute bit for 'others' was added on the ancestor directories of the session scratchpad (traverse only, no read); the cluster was stopped and its data stays in the scratchpad. Nothing outside the scratchpad and the repo was written."
