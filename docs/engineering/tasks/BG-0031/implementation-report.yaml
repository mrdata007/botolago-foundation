  - "Index coverage of the three floor subqueries (verified in the migrations): app.fixtures.season_id -> fixtures_season_round_kickoff_idx (season_id, round_id, kickoff_at, id) [20260720095345:139-140]; app.team_memberships.season_id -> team_memberships_season_idx (season_id, team_id, player_id) [20260720104000:20-21]; app.fantasy_seasons.football_season_id -> unique constraint fantasy_seasons_football_key (football_season_id) [20260720141826:159]. All three are leading-column matches; EXPLAIN on the stub cluster (enable_seqscan off) used exactly these three indexes. The extra cost per season UPDATE is one PK lookup plus three index range scans; competition/round/team paths are unchanged."
  - "Owner-lock semantics: while bounds_locked_at is set, only an UPDATE whose new bounds_locked_at IS DISTINCT FROM the old one (a new timestamp, or NULL to unlock) can move starts_on/ends_on. Within a single transaction `now()` is constant, so a correction issued in the same transaction that set the lock must use clock_timestamp() or an explicit timestamp; in separate transactions `now()` is fine."

