root_cause:
  classification: VERIFIED
  description: >
    Owner dispatch of fantasy-season-orchestrator.yml (run 35332956079, 2026-09-18T10:05:59Z) executed
    scripts/backend/current-season-recovery.ts in canary mode, which calls handleSportsMonksCatalogRequest
    in-process; its `seasons` job (football_ingestion_runs ffb562d6, 10:06:22.57-23.48Z) fetched SportsMonks
    /seasons/28647, whose ending_at was "2026-09-24" (the only published fixture date), mapped it to
    endsOn (sportsmonks-catalog.ts:502) and called api.ingest_football_catalog_entity, whose `when 'season'`
    branch unconditionally executes `update app.seasons set ... ends_on = v_ends_on ... where id = target_id`
    (20260731180229_gate2b_football_catalog_ingestion.sql:236-245). The manual correction of 2026-09-17T21:02:47Z
    (`update app.seasons set ends_on='2027-06-30' ...`, MCP session) was therefore overwritten. Two design gaps
    make this recur: (1) the RPC has no notion of an owner-corrected or provisional season bound and never
    compares the incoming value with existing data (fixtures, memberships, fantasy_seasons); (2) the
    freshness() fallback to observedAt defeats the STALE_UPDATE/skip guard for season payloads without a
    provider timestamp, so every run rewrites the row.

required_changes:
  # ranked durable fixes (a)
  - component: supabase/migrations/<new>_season_bounds_guard.sql (additive; CREATE OR REPLACE api.ingest_football_catalog_entity)
    change: >
      RANK 1 - make the season upsert monotone and correction-aware. In the `when 'season'` UPDATE branch:
      (a) never shrink ends_on below greatest(existing ends_on, max(app.fixtures.kickoff_at::date) for the season,
      max(app.team_memberships.valid_to) for the season, (app.fantasy_seasons.ends_at)::date); (b) treat a provider
      ending_at equal to starting_at or equal to the max published fixture date as provisional and keep the existing
      ends_on; (c) keep the existing starts_on when the provider start is later than the first published fixture.
      Log the decision in the returned jsonb ('outcome':'updated','endsOnPreserved':true) so ingestion evidence shows it.
      Body must be a full CREATE OR REPLACE of the function (schema-pinned search_path '' retained).
    reason: >
      The overwrite at 236-245 is the direct cause; a monotone rule protects any future manual correction without
      adding new columns and survives the freshness() always-update behaviour.
  - component: supabase/migrations/<new>_season_bounds_guard.sql (additive; columns + trigger)
    change: >
      RANK 2 (can be combined with rank 1) - add app.seasons.bounds_locked_at timestamptz null and
      bounds_locked_reason text null, plus a BEFORE UPDATE trigger app_private.protect_locked_season_bounds()
      that, when OLD.bounds_locked_at is not null and the session is not an explicit owner correction
      (e.g. new.bounds_locked_at is distinct from old.bounds_locked_at), keeps OLD.starts_on/ends_on.
      Set the lock on the 2026/27 row in the same data correction. Mirrors the existing manually_corrected
      concept of football_provider_mappings (20260720095345_football_match_ingestion.sql:604-628).
    reason: >
      Gives the owner an explicit, auditable way to pin a season's bounds independent of provider behaviour;
      rank 1 alone still lets the provider extend/shift bounds in surprising ways.
  - component: supabase/functions/_shared/sportsmonks-catalog.ts (+ sportsmonks-catalog.test.ts)
    change: >
      RANK 3 - in the `seasons` job mark the payload provisional when raw.ending_at <= raw.starting_at or when
      ending_at equals the last published fixture date known to the probe (freshness.provisional=true) and stop
      falling back to observedAt for updatedAt when the provider gives no timestamp (use the mapping's existing
      last_seen_at semantics or omit the update). Same edit is needed in src/backend/football/provider/sportsmonks-adapter.ts:223
      for parity, though that adapter is not the production write path.
    reason: >
      Reduces churn at the source; without it the RPC is called with a shrinking end date on every run and the
      skip guard never applies to seasons.
  - component: scripts/backend/current-season-recovery.ts (validateCurrentReadiness / environment)
    change: >
      RANK 4 (optional hardening) - do not pass a provider endingAt equal to startingAt as FOOTBALL_SPORTSMONKS_SEASON_END;
      fail soft with evidence "season_end_provisional" and let the catalog job skip the seasons entity, or pass the
      DB value read from api.football_season_catalog. Keep fixtureWindows unchanged (out of scope).
    reason: >
      Defence in depth for the only production writer; keeps the workflow idempotent as its header promises.
  - component: supabase/tests/database/football_ingestion.test.sql (+ new pgTAP cases)
    change: >
      Add cases: (1) seasons update with a smaller endsOn than existing fixtures/memberships keeps ends_on;
      (2) endsOn == startsOn is treated as provisional; (3) a later, larger endsOn is accepted; (4) locked bounds
      trigger keeps OLD values and allows the explicit owner path.
    reason: acceptance evidence for rank 1/2.
  # production data correction (b)
  - component: production data (app.seasons d03223b0-8f4a-4309-93e1-2a708d7c3584) - owner-approved one-row UPDATE
    change: |
      REHEARSAL (rolled back; run first, verbatim):
        begin;
        update app.seasons
           set ends_on = date '2027-06-30'
         where id = 'd03223b0-8f4a-4309-93e1-2a708d7c3584'
           and ends_on = date '2026-09-24'
           and starts_on = date '2026-09-24';
        -- verify exactly one row and the new state
        do $$
        declare r record;
        begin
          select id, starts_on, ends_on, status, is_current, updated_at into r
            from app.seasons where id = 'd03223b0-8f4a-4309-93e1-2a708d7c3584';
          if r.ends_on <> date '2027-06-30' or r.starts_on <> date '2026-09-24'
             or r.status <> 'active' or not r.is_current then
            raise exception 'rehearsal verification failed: %', to_jsonb(r);
          end if;
          if (select count(*) from app.team_memberships
               where season_id = r.id and valid_to > r.ends_on) <> 0 then
            raise exception 'memberships still exceed season end';
          end if;
          raise notice 'rehearsal ok: %', to_jsonb(r);
          raise exception 'REHEARSAL_ROLLBACK';
        end $$;
        rollback;
      PRODUCTION (only after owner approval and after the guard migration is live, or with the workflows kept on HOLD):
        update app.seasons
           set ends_on = date '2027-06-30'
         where id = 'd03223b0-8f4a-4309-93e1-2a708d7c3584'
           and ends_on = date '2026-09-24';
        -- expect UPDATE 1; then:
        select id, starts_on, ends_on, status, is_current, updated_at
          from app.seasons where id = 'd03223b0-8f4a-4309-93e1-2a708d7c3584';
      If rank 2 lands first, add `, bounds_locked_at = now(), bounds_locked_reason = 'BG-0031 owner correction 2027-06-30'` to the SET list.
    reason: >
      Restores the owner-approved bound recorded in FANTASY_2026_27_BRIDGE_ACTIVATION.md step 1 and the 2026-09-17T21:02:47Z
      statement; predicate on the regressed value makes it idempotent and safe against a concurrent provider update.
