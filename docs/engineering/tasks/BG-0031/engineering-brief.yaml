  - Database access here was read-only; the rehearsal and production UPDATE above were NOT executed.
  - Never edit existing migrations; only an additive migration with CREATE OR REPLACE of api.ingest_football_catalog_entity (full body, SECURITY DEFINER, SET search_path = '').
