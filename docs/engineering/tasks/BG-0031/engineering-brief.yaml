risks:
  - Applying the data fix without the guard and then dispatching a workflow silently reverts it again (freshness fallback guarantees an UPDATE each run).
  - The guard (rank 1) makes ends_on monotone: if the provider later publishes a legitimately shorter season, an explicit owner path is needed to shrink it (rank 2 provides it).
  - Rank 1 compares against app.fixtures/team_memberships/fantasy_seasons inside a SECURITY DEFINER RPC hot path; keep the subqueries indexed (fixtures.season_id, team_memberships.season_id exist per FKs - verify indexes in the migration).
