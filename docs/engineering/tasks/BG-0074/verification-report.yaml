    `playwright install` was not run.
  what_they_show: >
    Every league row carries a team name AND a manager name, in both languages,
    and the rankings podium tiles carry a manager name on each of the three
    tiles. The AR captures are right-to-left with the manager line below the
    team line, no clipping at 390px.
  honest_limit: >
    The dev server runs in mock mode (VITE_FANTASY_DATA_MODE=mock; the captures
