database_tests:
  docker: NOT AVAILABLE
  substitute: >
    A real PostgreSQL 16.13 cluster was stood up locally (initdb + pg_ctl,
    /var/lib/postgresql/bg0074, port 55432) with the postgresql-16-pgtap package
    already installed on the image. A minimal Supabase-shaped bootstrap created
    the anon/authenticated/service_role/authenticator roles, the `extensions`
    schema (pgcrypto + pgtap), an `auth` schema with users/sessions/mfa_factors
    and the real auth.uid()/auth.role()/auth.jwt() definitions, and a `storage`
    shim. All 73 committed migrations then applied cleanly in order, followed by
    this lane's 20260921200000.
  what_was_actually_run:
    - command: psql -f supabase/tests/database/fantasy_points_read_surfaces.test.sql
      result: 31 ok, 0 not ok, 0 psql errors
    - command: every file in supabase/tests/database/ against the same cluster, twice
      purpose: regression diff
      result: >
        Two databases were built -- `botolago_base` with the 73 committed
        migrations only, and `botolago` with this lane's migration on top -- and
        the whole suite was run against each. The two result tables are
        byte-identical except the one new file, which is 5 ok / 4 not ok / 1
        psql error on the baseline (as it must be) and 31 ok / 0 not ok with the
        migration. No existing test changed in either direction.
  honest_limits:
    - >
      Several existing suites (identity_domain, news_rls, admin_authorization and
      others) abort on this cluster because the auth shim is not the real GoTrue
      schema. That is an artifact of the substitute environment, not of this
      change: the failures are identical with and without the migration, which
      is exactly what the before/after diff above establishes.
    - >
      `bun run backend:types:generate` was NOT run. `supabase gen types` shells
      out to a Docker container even when given --db-url, and there is no Docker
      daemon here. src/backend/generated/database.types.ts is therefore
      unchanged and does not yet name api.fantasy_gameweek_summary; CI's
      artifact is authoritative. See the BG-0075 report for how the one call
      site type-checks meanwhile.

pgtap_assertions_for_this_task:
  - anon still holds no USAGE on the app schema
  - api.fantasy_league_standings keeps its exact signature
  - anon can still execute api.fantasy_league_standings
  - anon holds no select privilege on app.profiles
  - a signed-in league member sees the profile display name
  - an empty display_name falls back to the fantasy team name
  - a soft-deleted profile falls back to the fantasy team name
  - the league page is still ordered by rank, then team id
  - the item shape is the previous one plus managerName, nothing removed
  - an anonymous caller sees team names only, never a display_name
  - the private-league membership check is unchanged for anonymous callers

