  - component: supabase/migrations
    change: card tables, rules, settings, ledger, job log, retired numbers; erase lock; read functions; tick and prune jobs
    reason: the card's data model, calculation and reads
  - component: supabase/tests/database
    change: manager_card.test.sql; step-up count +4; erase lock key array
    reason: database evidence (CI database-quality)
  - component: docs/backend, AGENTS.md
    change: domain plan, operations runbook, deletion runbook lines, scheduled job entry
    reason: operations and one-writer rule
  - component: scripts/backend
