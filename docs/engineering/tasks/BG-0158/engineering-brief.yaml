task_id: BG-0158
objective: >
  Build the server side of the BotolaGO Manager Card: tables, a deterministic
  calculation of OVR, tier and four stats (CAP, SEL, TRF, CON) from stored
  Fantasy data, signed-in read functions, an on/off switch and a scheduled job,
  with tests, generated types and docs. Everything ships switched off, with no
  rules row. No card screens.
findings:
  - classification: VERIFIED
    statement: No Manager Card table, function or calculation exists on main or on any open pull request.
    evidence: origin/main 3f9c57fc supabase/migrations; open PR list 2026-10-08 (36 open)
  - classification: VERIFIED
    statement: Nothing sets a gameweek's status to corrected; the next gameweek opens only after postwork for the current version completes with status finalized.
    evidence: grep of supabase/migrations and scripts/backend; 20260914200740 lines 137-139
  - classification: VERIFIED
    statement: Gameweek boards are rewritten on provisional scores during each publish, so CON reads final team results directly.
    evidence: 20260720163222 api.service_recalculate_fantasy_rankings; scripts/backend/fantasy-lifecycle-runner.ts publishRankings
  - classification: VERIFIED
    statement: starting_points already includes automatic substitutions; player points are one row per player per gameweek, so double gameweeks are pre-summed.
    evidence: 20260927140000 lines 300-311; 20260720141850 fantasy_player_gameweek_points
  - classification: UNKNOWN
    statement: Whether unpushed Codex work on the card exists, and whether 20261005130000 and 20261006143700 are applied on production.
    evidence: ""
root_cause:
  classification: VERIFIED
  description: New feature requested by the owner; no prior implementation.
