branch: bg-0092-fantasy-shell
base: >
  origin/chief/launch-fixes-3 @ 38d9430 (the commit the worktree was created from).
  origin/chief/launch-fixes-3 advanced to e56f56b while this lane was running — it now
  carries the merged pitch lane and the kit lane's in-flight UiSegmented work. This
  branch was deliberately NOT rebased or merged onto it: the repo syncs to Lovable and
  history must not be rewritten, and taking sibling lanes' changes unverified would
  invalidate this lane's own measurements. Integration is the coordinator's merge.

summary: >
  Every Fantasy screen in the product renders inside this lane's files, so the work was
  done once in the shared chrome rather than 200 times at the call sites. `primitives.tsx`
  — imported by 15 Fantasy routes and 4 sibling-lane components — is now a thin adapter
  over `@/components/ui-kit` with an unchanged exported API, so screens no sibling lane
  has converted yet still pick up the themed tokens, the 44px tap floor and the one focus
  ring. The hub, help, profile, the frame, the gate and the nine `components/fantasy`
  state components were converted outright.

