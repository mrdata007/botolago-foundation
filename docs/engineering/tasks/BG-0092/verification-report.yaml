must_not_regress:
  gw1_seven_fixtures:
    status: "not at risk"
    evidence: >
      This lane changed presentation only and touched no fixture, gameweek or availability
      code. No file in the lane reads, filters or counts fixtures; grep for a hardcoded
      fixture count or a FAR Rabat / postponed special case across src/ finds nothing in
      any Lane A file. The postponed-fixture handling lives in
      src/backend/fantasy/fixture-assignment.ts, which this lane did not open.
  deadline_pinned_to_casablanca:
    status: "verified, and strengthened"
    method: >
      /fantasy rendered in three browser time zones — Africa/Casablanca, America/Sao_Paulo
      and Australia/Sydney — and the deadline line read byte-identically in all three
      ("Journée 14 Deadline: mercredi 23 sept., 10:30" on the dev dataset).
    change: >
      Both formatters this lane touched now pass timeZone: MATCH_TIME_ZONE from
      src/lib/match-kickoff.ts. fantasy.index.tsx and FplDeadlineLine previously passed the
      literal string "Africa/Casablanca", which is correct today but is exactly the kind of
      duplicate that drifts; they now reference the one constant.
  rankings_empty_state:
    status: "not regressed"
    evidence: >
      /fantasy/rankings rendered signed-out at 390px in fr and ar: no spinner
      (.animate-spin absent) and no error (role="alert" absent). The route belongs to a
      sibling lane; it renders through this lane's FplHeader and FplSegmented and was
      checked to confirm the chrome change did not break it. The dev dataset has scored
      gameweeks, so the "before anything has scored" branch is not reachable on this
      server — that specific branch remains the owning lane's to verify.

