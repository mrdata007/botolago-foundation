task_id: BG-0092
lane: "Lane A — shared Fantasy chrome and the hub"
branch: bg-0092-fantasy-shell

harness:
  server: >
    This lane started its OWN vite dev server and never used port 4173. playwright.config
    reuses an existing server on 4173 outside CI and other worktrees hold that port, so a
    measurement against it would be worthless. Runs were driven with E2E_BASE_URL against
    127.0.0.1:4295 (normal build) and 127.0.0.1:4301 (VITE_AUTH_MODE=mock, for the
    signed-in state). Chromium came from /opt/pw-browsers via PLAYWRIGHT_BROWSERS_PATH;
    `playwright install` was never run.
  chromium_flags: "--disable-lcd-text --force-color-profile=srgb"
  why_those_flags: >
    Chromium's default LCD subpixel antialiasing puts coloured fringes around every glyph.
    A first pass that picked the "most extreme pixel in the crop" as the foreground
    reported things like amber text on a white table cell (1.78:1) and bright green links
    (1.34:1) — those were fringe pixels, not text. Greyscale AA plus a pinned sRGB profile
    removes that class of false positive.
  contrast_method: >
    Rasterised sRGB, never a naive parse — the tokens are oklch and parsing
    `oklch(0.86 0.08 232)` by hand gives the wrong luminance. FOREGROUND: the element's
    computed `color` pushed through a 1x1 canvas inside the page, so Chromium itself does
    the oklch -> sRGB conversion and the value read back is what it painted. BACKGROUND:
    the real pixels of a screenshot of the element's own box. The background is taken as
    the plurality of the pixels that are NOT near the foreground, quantised to 8-step
    buckets and then averaged — because on a GRADIENT the glyph colour is a single flat
    value while the background is hundreds of near-identical ones, so a naive plurality
    picks the glyph and reports 1.00:1. Ratio is WCAG relative luminance.
  overflow_method: >
    Both halves, because `overflow-x: clip` hides overflow from scrollWidth entirely:
    (a) documentElement.scrollWidth - clientWidth, and (b) every element box inside
    main.fpl-column tested against the viewport, skipping SVG internals (no meaningful
    layout box) and anything inside a deliberate overflow-x auto/scroll/hidden ancestor.
  splash_note: >
    An early pass reported phantom overflow from `pointer-events-none absolute -inset-x-10
    -inset-y-14 blur-2xl` — that is src/components/splash/SplashScreen.tsx, the boot
    overlay, not a Lane A file. All measurements now wait for main.fpl-column to exist and
    for fonts to settle before reading anything.

matrix:
  widths: [390, 430, 768, 1440]
  languages: [fr, ar]
  themes: [light, dark]
  dark_mode: >
    DARK_MODE_ENABLED was NOT changed. `.dark` is applied by hand to documentElement and
    re-applied if the theme provider rewrites the class list on hydration — which is how a
    reviewer inspects the dark theme today. Every run asserts the class actually stuck
    (and that a light run did not come up dark); 0 failures on that assertion.
  routes: ["/fantasy", "/fantasy/help", "/fantasy/rules", "/fantasy/profile"]
  states:
    - "signed-out (the guest branch on /fantasy/profile, the hub's guest phase)"
    - "signed-in (mock session seeded the way LocalMockAuthService.signInWithEmail seeds it;
      exercises the authenticated hub, the team card, and FantasyScreenGate's ready path)"
    - "error (rest/v1 and functions/v1 aborted at the network layer, so the hub and
      /fantasy/profile render FantasyPhaseBody's real error branch, not a mock)"
  combos_run:
    main_pass: 80
    signed_in_pass: 32
    contrast_samples: "722 (main) + 256 (signed-in)"

