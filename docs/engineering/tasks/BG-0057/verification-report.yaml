  every one of the seven rows.

pgtap:
  docker_available: true
  supabase_cli_usable: false
  detail: >
    The docker binary exists and `docker info` returns a client block, but the Supabase CLI is not
    installed on this machine (`which supabase` is empty), so `supabase test db` / `supabase db
    reset` could not be run and the suite was NOT executed through the repository's own harness.
  substitute: >
    Rather than claim the suite ran when it could not, a real PostgreSQL 16.13 cluster
    (Ubuntu 16.13-0ubuntu0.24.04.1) was initdb'd locally under /var/lib/postgresql/bg0057, the
    system postgresql-16-pgtap extension was installed into it, and all 72 files under
    supabase/migrations were applied in order to a fresh database — plus minimal local stand-ins for
    the Supabase-managed roles and objects a bare cluster does not provide (anon / authenticated /
    service_role / supabase_auth_admin / supabase_storage_admin / authenticator roles;
    auth.users + sessions/refresh_tokens/mfa_factors/identities/audit_log_entries;
    storage.buckets/objects and storage.foldername/filename/extension; auth.uid()/role()/email()/jwt()).
    This is NOT `supabase db reset`; it is the same migration set on the same major version, and it
    is stated here as such.
  migrations_applied: 72
  result: 31 assertions, 31 ok, 0 not ok
  assertions:
    - ok 1 - fixture: all 20 synthetic fantasy players start active and eligible
    - ok 2 - fixture: no squad owns anything yet — the production precondition this script relies on
    - ok 3 - happy path: the body reports the named row as updated
    - ok 4 - happy path: the named row is now active = false AND eligible = false
    - ok 5 - happy path: the other two rows of the same cluster are left alone
    - ok 6 - happy path: exactly one row left the pool — 19 of 20 remain active and eligible
    - ok 7 - happy path: exactly one audit row is written, naming the retired player
    - ok 8 - happy path: the audit row records the before and after state of `active`
    - ok 9 - second run: the already-deactivated row reports was_updated = false instead of erroring
    - ok 10 - second run: no audit row is written for a no-op
    - ok 11 - second run: the audit table still holds exactly the one row from the first run
    - ok 12 - second run: the active/eligible count is unchanged
    - ok 13 - rollback to savepoint restores all 20 players to active and eligible
    - ok 14 - half-applied: a row that is already ineligible but still active is completed, not skipped
    - ok 15 - half-applied: both flags end false
    - ok 16 - not found: the all-zero placeholder in the shipped file refuses and names the id
    - ok 17 - not found: nothing was written
    - ok 18 - ownership guard: an owned player refuses and names the squad that holds it
    - ok 19 - ownership guard: the refusal rolled the write back — the player is still active and eligible
    - ok 20 - ownership guard: no audit row is written for a refusal
    - ok 21 - history guard: a sold membership still refuses and reports every attachment count
    - ok 22 - history guard: nothing was written
    - ok 23 - points guard: a player with point events refuses and names the count
    - ok 24 - points guard: nothing was written
    - ok 25 - gameweek-points guard: the aggregated table refuses on its own
    - ok 26 - selected-by-count guard: a non-zero counter with no membership refuses
    - ok 27 - selected-by-count guard: nothing was written
    - ok 28 - pool: all 20 players are offered before the retirement
    - ok 29 - pool: the retirement runs
    - ok 30 - pool: api.fantasy_player_pool offers 19 players afterwards — the retired row is gone
    - ok 31 - pool: the retired id is specifically absent from the pool payload
  plan_line_caveat: >
    finish() prints `1..13` rather than `1..31`, because `rollback to savepoint` also rolls back
    pgTAP's own internal test counter. This is a property of the repository's existing savepoint
    idiom, not of this suite — the BG-0043 suite behaves identically on the same cluster. The
    authoritative count is the 31 `ok` lines and 0 `not ok` lines above, which is what pg_prove
    counts.
  harness_sanity_check: >
    Three of the repository's existing suites were run unchanged on the same local cluster:
    football_deactivate_non_current_teams.test.sql -> 20 ok / 0 not ok (exactly the 20 assertions
    the BG-0043 verification report claims, reproduced independently), fantasy_domain.test.sql ->
    28 ok / 0 not ok, fantasy_rls.test.sql -> 16 ok / 0 not ok. The harness executes the
    repository's existing suites faithfully.
  script_file_rehearsal: >
    scripts/backend/fantasy-deactivate-duplicate-player.sql was executed as a WHOLE FILE against
    the same local cluster, twice. (1) Completely unchanged: it refused with
    `bg0057 refused: player_not_found — … id 00000000-0000-0000-0000-000000000000 …` and wrote
    nothing, proving the shipped file is inert. (2) With only the one call argument changed to a
    seeded synthetic id: it ran end to end — the NOTICE listed the target before the write, the
    returned row showed was_updated = t with an audit_event_id, the cluster review SELECT showed
    exactly one row at active=f/eligible=f with its siblings untouched, the pool totals printed
    19/19/1, and the audit SELECT printed the single
    'fantasy_catalog.deactivate_duplicate_player' row with safe_before/safe_after. The session then
    ended with an implicit ROLLBACK and a follow-up query confirmed 20 players active again. This
    proves the file itself — not just the body — parses and runs.
  body_sync_check: >
    The pg_temp body in the script and the copy in the pgTAP test were compared programmatically
    and are byte-for-byte identical (203 lines).

