remains_unproven:
  - >
    The suite has NOT been run through `supabase test db` against a real Supabase local stack. The
    local cluster carries hand-written stand-ins for auth.* and storage.*, so anything that depends
    on GoTrue or Storage behaviour beyond the table shapes and the four auth helper functions is
    untested here. The parts this suite actually exercises (app.*, api.*, app_private.*) come from
    the repository's own migrations, unmodified.
  - >
    Nothing in this lane has been executed against production. The script's WRITE half has only
    ever run against the local cluster and inside rolled-back transactions. The read-only half of
    every guard has been rehearsed against production and is reported above.
  - >
    Which row of each cluster is the real footballer is a data question the database cannot settle
    for the Boukhanfer cluster. That remains an owner decision.
