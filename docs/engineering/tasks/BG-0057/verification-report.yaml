  candidate set. Real numbers: candidate_rows = 7, player_not_found = 0, guard_owned_by_squad = 0,
  guard_squad_history_memberships = 0, guard_squad_history_transfers = 0,
  guard_squad_history_freehit = 0, guard_squad_history_autosubs = 0, guard_point_events = 0,
