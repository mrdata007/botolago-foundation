# ------------------------------------------------------------------
# 6. Regression sweep
# ------------------------------------------------------------------
regression_sweep:
  runner: Playwright Chromium, PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers (no install run)
  server: >
    bun run dev --host 127.0.0.1 --port 4319, started by this task and passed
    as E2E_BASE_URL. Port 4173 is held by other worktrees on this machine and
    was deliberately avoided — a measurement against another worktree's server
    is worthless.
  matrix: 2 themes x 2 languages (fr, ar) x 2 widths (390, 1440) x 4 pages (Home, Matches, Profile, Fantasy) = 32 loads
  horizontal_overflow:
    method: >
      documentElement.scrollWidth vs clientWidth, PLUS a per-element box check
      for anything extending past the viewport, skipping elements that are
      themselves overflow-x auto/scroll/hidden/clip or have such an ancestor —
      `html, body { overflow-x: clip }` means the page-level number alone
      cannot see a protruding box.
    scrollWidth_not_equal_clientWidth: 0 of 32
    unclipped_elements_past_the_viewport: 0 of 32
  screenshots:
    - evidence/light-fantasy-390-fr.png
    - evidence/dark-fantasy-390-fr.png
    - evidence/light-profile-390-fr.png
    - evidence/dark-profile-390-fr.png
    - evidence/light-matches-390-ar.png
    - evidence/dark-matches-390-ar.png
    - evidence/light-home-1440-fr.png
  whole_page_text_contrast:
    method: "every element with its own text node, scored against its nearest flat painted backdrop; elements over a background IMAGE are skipped as unmeasurable"
    light_failures_introduced_by_this_change: 0
    remaining_failures_and_who_owns_them:
      - owner: screen lane (src/components/fpl/**)
        count: 20
        what: 'literal `bg-white` surfaces in Fantasy screens leave themed text invisible in dark (e.g. "Général" / "Journée 14" at 1.09:1 on rgb(255,255,255))'
      - owner: screen lane (Fantasy call sites)
        count: 12
        what: '`--fpl-ink` / `--fpl-ink-deep` used as a TEXT colour (e.g. "Coupes" 1.13:1, "Notifications" 1.13:1). The alias layer makes them theme-aware but they are still fill tokens used as foregrounds — convert to ui.tone.ink'
      - owner: News/V1 palette lane
        count: 16
        what: "`--brand-primary` used directly as text (`text-brand`), 1.35-1.54:1 in dark"
      - owner: matches lane
        count: 16
        what: "`--color-live` (V1 token) at 4.04:1 on white in LIGHT as well — pre-existing, not a dark regression"
      - owner: dev-only
        count: 16
        what: 'AuthModeBadge "MODE DÉMO" renders literal black, 1.07:1'
      - owner: none (false positive)
        count: 24
        what: "the Welcome screen is a dark mesh in both themes; its white copy is scored against the page colour because the mesh is a background IMAGE on a sibling layer"
    evidence: evidence/page-text-sweep.json

not_verified:
  - "Fantasy screens behind auth (squad, pitch, transfers, populated leagues). They were exercised signed-out; UiPitchSurface and UiPlayerPlate are new and have no call site yet, so they are typechecked and contract-tested but not yet rendered with live data."
  - "The match DETAIL page, the only UiSegmented call site, needs live data this sandbox could not reach; its active segment was measured as the token pair the kit paints."
  - "Safari/Firefox. Chromium only."
  - "Real OS theme switching — dark was measured by applying `.dark` before first paint, which is what the shipped theme script does."

handover_to_screen_lanes:
  read_first: docs/engineering/DESIGN_SYSTEM_V2.md
  what_a_lane_still_has_to_write_itself:
    - "Anything data-shaped: a squad grid, a formation picker, a gameweek strip, a countdown, a league-join flow. The kit ships the units (plate, row, pitch shell, table cells) but composes none of them into a screen, on purpose."
    - "Club crests, jerseys and any club-identity artwork. `UiPlayerPlate`/`UiPlayerRow` take a `visual` node; the kit does not own kit art (JerseyVisual, ClubCrest stay where they are)."
    - "Translated labels for UiRankMovement (up/down/same) — the kit asks for them rather than inventing keys."
    - "A toast/snackbar. Not in the kit; the app uses sonner today."
    - "An avatar, a progress bar, a calendar and a carousel — still only in the shadcn V1 layer (src/components/ui/). If a converted screen needs one, ask for it rather than styling the V1 one."
    - "Tab ROUTING. UiSegmented is a controlled tablist; it does not own URL state."
