residual_risks:
  - >
    Switching "ar" -> "ar-MA" changes more than the digit system: ICU's ar-MA
    default also flips the hour cycle from 12h ("٠٢:٣٠ م") to 24h ("14:30")
    and uses Moroccan month names ("شتنبر" instead of "سبتمبر"). This is the
    inherent, intended consequence of adopting the same locale tag the 20+
    UI components already use (the objective's "same locale tags"), not an
    extra change, but product should be aware the Arabic article timestamp
    now reads in 24h Moroccan form. The Builder flagged the Western-digit
    assumption in unexpected_observations as the ledger required.
  - >
    Tests assert digit script and fr-FR parity but not the ar month form or
    hour cycle; a future ICU data update in Bun/Node could shift ar-MA
    output without failing the suite. Acceptable for a locale-tag alignment
    task; no correction required.
