  BG-0063:
    title: LAUNCH CHIEF — /fantasy/rankings was dead for every signed-out visitor
    area: fantasy
    severity: P0
    user_impact: >
      The page hung about 12 seconds on "Chargement…" and then showed "Une erreur est survenue".
      Anonymous visitors are most of the launch audience, and rankings is a linked hub tile.
    owner: Chief
    state: DONE
    depends_on: []
    root_cause: >
      api.fantasy_leagues declared p_visibility as app.fantasy_league_visibility. An argument is
      coerced to its parameter type in the CALLER's context, before a SECURITY DEFINER body is
      entered, so naming an app-schema type required the caller to hold USAGE on app. anon does
      not by design; authenticated does. The body was never at fault.
    why_it_looked_intermittent: >
      Omitting p_visibility succeeds, because the DEFAULT is evaluated inside the function. Only a
      call that actually sends "public" fails -- which is what the rankings page sends. Early crawl
      lanes that did not reach that call looked green.
    evidence:
      - >-
        before -- anon+visibility: 42501 permission denied for schema app; anon without it: OK;
        authenticated+visibility: OK
      - >-
        after -- anon+public OK; anon+private OK with 0 rows (no leak); anon+garbage PT400;
        anon+limit 999 PT400; authenticated+public OK
    resolution: >
      Migration 20260921120000: p_visibility becomes text and the enum is resolved inside the
      definer body. Deliberately NOT a grant of USAGE on app to anon, which would have fixed the
      symptom by opening the entire private schema. Grants, visibility predicate and security
      properties are unchanged.
    blast_radius: >
      api.fantasy_leagues was the only anon-callable function in api naming an app-schema type;
      every other one is authenticated-only and authenticated holds USAGE on app. Confirmed by
      catalog query, not by inspection.
    verification: {status: PASS, by: chief (six-case production probe as anon and authenticated)}

  BG-0064:
    title: LAUNCH CHIEF — Four production defects found by an anonymous crawl, all fixed
    area: frontend
    severity: P1
    owner: Chief
    state: DONE
    depends_on: []
    findings_fixed:
      - >-
        Back control landed on about:blank. Three surfaces called router.history.back() directly;
        opened cold (shared link, search result, push, bookmark) the app is the first history
        entry, so back left the site. Silent -- no console output. Now useBackTo(fallback).
      - >-
        Article JSON-LD was declared {tag, attrs, children}, but the router builds the script
        itself and turns every other key into an attribute. Emitted <script tag="script"
        attrs="[object Object]"> with no type, so browsers RAN the JSON and crawlers saw nothing.
        The old test asserted on the object we built rather than the shape the router consumes,
        which is why it passed.
      - >-
        Head-script children are written with dangerouslySetInnerHTML and every string in the
        JSON-LD is editor-supplied, so a </script> in a headline would have escaped into the
        document head. serializeJsonLd now escapes < > & as \u-sequences.
      - >-
        French home news rail rendered Arabic headlines. getNewsEdition's "auto" mode picked the
        freshest feed regardless of locale. The reader's own locale now wins whenever it has
        articles; the other language remains the empty-feed fallback, symmetric in both directions.
    verification: {status: PASS, by: chief (1132 tests, typecheck, eslint, prettier)}

