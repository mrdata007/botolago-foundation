  BG-0058:
    title: news_article_detail returns HTTP 500 for a not-found article
    area: news
    severity: P2
    user_impact: None. The reader sees the article.
    owner: Chief
    state: QUEUED
    detail: >
      /news/$articleId deliberately tries one language then falls back to the other so a UUID link
      stays readable across locales (services/news.ts getArticleWithLanguageFallback). The first
      attempt for an Arabic-only article raises news_article_not_found (P0002), which PostgREST
