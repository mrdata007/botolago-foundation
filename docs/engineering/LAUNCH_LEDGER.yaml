  BG-0069:
    title: Arabic text carries letter-spacing across the application
    area: frontend
    severity: P2
    user_impact: >
      38 distinct tracking-* patterns apply to Arabic text -- labels at 0.6px, badges at 1.6px
      and 1.4px, and negative tracking-tight on Arabic headings. Chromium preserves the joins, so
      letterforms do not visibly disconnect; the result is wrong spacing, not broken shaping.
    owner: Chief
    state: QUEUED
    depends_on: []
    rule: >
      Arabic is cursive and its letters join. Neither pulling them apart (tracking-wide) nor
      pushing them together (tracking-tight) is correct: the right amount is none. Every tracking
      utility that can reach Arabic text must be prefixed ltr:.
    prior_art: >
      Already applied to ADMIN_LABEL_CLASS and the Admin console headings; this is the same fix
      across the rest of the surfaces.
    why_deferred: >
      A wide mechanical change across many files, competing for the same files as the 390px
      match-card work. Worth doing in one deliberate pass rather than threaded through a release.

