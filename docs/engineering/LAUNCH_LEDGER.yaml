      renders, so nothing is broken for the reader — but a normal path logs a 500, which will mask
      real incidents once production error monitoring matters.
    why_deferred: >
      The principled fix changes the RPC's raised condition — a migration on a database-sensitive
      path requiring the heavy review route — to correct something with no user-visible breakage.
      Not a pre-launch risk worth taking. The route loader also hardcodes "fr", which makes the
      wasted first attempt certain for Arabic readers; it feeds SEO head tags, so it is not simply
      removable.

