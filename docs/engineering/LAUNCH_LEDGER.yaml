      Rule (stated honestly, not as invariant-preserving): 22 raw provider starters required per
      fixture (unchanged, measured universal 240/240); up to 4 of those 22 may be anonymous
      (missing player_id) and are never assigned to any player or recorded as an observed zero;
      a fixture with more than 4 anonymous starters is quarantined ENTIRELY (none of its rows,
      not even identified ones, used). Scoped strictly to the historical SportsMonks path
      (source_version prefix sportsmonks-fixture:, season status completed and not current) —
      never the live current-season Fantasy scoring path (sportsmonks-current-fixture: prefix),
      which shares the same underlying tables (app_private.historical_performance_fixture_coverage,
      app.player_fixture_performances) with the live gameweek-finalization RPC chain
      (app_private.fantasy_assert_scoring_snapshot, called from
      20260914200730_fantasy_verified_finalization.sql) — this table-sharing was NOT originally
      disclosed accurately (see correction 2 below) and is now a hard, source_version-regex-scoped
      CHECK constraint, not an accident of column defaults.
      Preservation policy (owner-mandated): single-table design on the pre-existing
      historical_performance_fixture_coverage table (no second table, no DELETE anywhere in the
      migration); coverage_outcome ('accepted'|'quarantined') and quarantine_reason
      ('anonymous_starter_rows_exceeded') are DERIVED by CHECK constraint from the measured
      anonymous_starter_rows count, never an independently-settable flag; a quarantined row is
      forced to starter_rows=0/performance_rows=0 at the constraint level while its full original
      audit fields (lineup_rows_seen, valid_player_rows, source_version, etc.) remain intact and
      selectable; performance rows are soft-deactivated (active=false), never deleted; fixture,
      player and provider-mapping rows are never touched.
      Multi-pass process (three real defects found and fixed across rounds, not zero-defect on
      first pass — recorded honestly):
      (1) Chief's own direct code read (not the Builder's self-report) caught the first-pass
      quarantine mechanism doing exactly the delete-then-reinsert-elsewhere pattern the owner had
      explicitly forbidden (moving the coverage row into a separate, thinner quarantine table) —
      corrected to the single-table upsert design above.
      (2) Chief's own direct code read caught the migration's own header comment falsely claiming
      the live current-season scoring path used "entirely separate tables" naming a table/RPC that
      do not exist — corrected to an accurate scope comment plus the hard source_version-scoped
      CHECK constraint, with new tests proving a current-season-shaped row can never carry a
      nonzero anonymous-starter count (both a bare UPDATE and the actual upsert path rejected,
      sqlstate 23514).
      (3) An independent fresh-context Reviewer (separate agent from the Builder and the separate
      independent Verifier) caught a CRITICAL, release-blocking bug neither the Builder's own
      tests nor the independent Verifier's re-run of those same tests could see: the worker's
      accept-path coverage object never included identifiedStarterRows (only the quarantine
      path's diagnostic had it), so api.ingest_historical_player_fixture_performance's NOT NULL
      check on that field would have rejected EVERY real accepted fixture in production use — a
      total regression of the feature, invisible to both suites because the bun tests mock the RPC
      client with subset-matching assertions and the pgTAP tests call the SQL RPC with hand-built
      JSONB that always included the field, so the actual TS-to-SQL wire format was never
      exercised end-to-end by anything. Fixed by constructing the coverage object once and sharing
