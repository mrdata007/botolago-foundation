<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manager Card mock</title>
    <!-- Direction mock for MANAGER_CARD_SORARE_STYLE_PLAN.md (revision 2: detail, number in the shirt, holographic top tiers, depth). Static, not app code. Fonts from Google Fonts for the mock only; the app self-hosts them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Changa:wght@300;800&family=Noto+Sans+Arabic:wght@700&family=Instrument+Serif&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --page: #f4f6f9;
        --ink: #111827;
        --muted: #5a667d;
      }
      :root[data-theme="dark"] {
        --page: #0b1020;
        --ink: #e7ecf3;
        --muted: #9aa6b8;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --page: #0b1020;
          --ink: #e7ecf3;
          --muted: #9aa6b8;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font:
          15px/1.5 Manrope,
          system-ui,
          sans-serif;
      }
      header {
        padding: 24px 16px 8px;
        max-width: 1240px;
        margin: 0 auto;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      h1 {
        font:
          800 22px/1.2 Changa,
          sans-serif;
        margin: 0;
        flex: 1 1 auto;
      }
      button {
        font:
          700 14px Manrope,
          sans-serif;
        min-height: 44px;
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid var(--muted);
        background: transparent;
        color: var(--ink);
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 2px;
      }
      p.note {
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 16px;
        color: var(--muted);
      }
      .row {
        max-width: 1240px;
        margin: 0 auto;
        padding: 28px 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 36px 28px;
        justify-content: center;
        align-items: flex-end;
      }
      figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      figcaption {
        font-size: 13px;
        color: var(--muted);
        text-align: center;
      }
      .stage {
        width: min(296px, calc(100vw - 32px));
        padding: 6px 0 18px;
      }
      .tokens {
        display: flex;
        gap: 14px;
        align-items: flex-end;
        flex-wrap: wrap;
        justify-content: center;
      }

      /* ---------- the card (eclat.css, abridged) ---------- */
      @property --mc-ax {
        syntax: "<number>";
        inherits: true;
        initial-value: 0;
      }
      @property --mc-ay {
        syntax: "<number>";
        inherits: true;
        initial-value: 0;
      }
      .mc-eclat {
        position: relative;
        aspect-ratio: 1000/1618;
        container-type: inline-size;
        --mc-ax: 0.24;
        --mc-ay: 0.64;
      }
      [dir="rtl"].mc-eclat {
        --mc-ax: -0.24;
      }
      .mc-eclat__persp {
        position: absolute;
        inset: 0;
        perspective: 300cqw;
      }
      .mc-eclat__tilt {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transform: rotateX(calc(var(--mc-ay) * 7deg)) rotateY(calc(var(--mc-ax) * 9deg));
      }
      .mc-eclat--settle {
        transition:
          --mc-ax 450ms cubic-bezier(0.2, 0.8, 0.2, 1),
          --mc-ay 450ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .mc-eclat--active .mc-eclat__tilt {
        will-change: transform;
      }
      .mc-l {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
        backface-visibility: hidden;
        transform: translateZ(calc(var(--z) * 1cqw)) scale(calc(1 - var(--z) / 300));
      }
      .mc-l--num [data-mc="ovr"] {
        pointer-events: auto;
      }
      .mc-l--base {
        --z: 0;
      }
      .mc-l--shirt {
        --z: 3;
      }
      .mc-l--num {
        --z: 6;
      }
      .mc-l--frame {
        --z: 8;
      }
      .mc-l--holo {
        --z: 9;
      }
      .mc-rim {
        --z: var(--k);
      }
      /* the contact shadow moves against the light */
      .mc-eclat__shadow {
        position: absolute;
        inset: 5% 7% -2.5% 7%;
        border-radius: 6cqw;
        pointer-events: none;
        background: rgb(8 12 24 / 0.42);
        filter: blur(4.5cqw);
        transform: translate(calc(var(--mc-ax) * -5cqw), calc(3cqw + var(--mc-ay) * 3cqw));
      }
      .mc-eclat--dark .mc-eclat__shadow {
        background: rgb(0 0 0 / 0.7);
      }
      /* raised number: highlight and shade copies follow the light */
      .mc-num-hi {
        transform: translate(calc(var(--mc-ax) * 5px), calc(var(--mc-ay) * -5px - 2px));
      }
      .mc-num-sh {
        transform: translate(calc(var(--mc-ax) * -7px), calc(var(--mc-ay) * 7px + 7px));
      }
      /* foil overlay */
      .mc-eclat__foil {
        position: absolute;
        inset: 0;
        pointer-events: none;
        --z: 9.5;
        --mc-sheen-angle: 115deg;
        transform: translateZ(calc(var(--z) * 1cqw)) scale(calc(1 - var(--z) / 300));
        clip-path: polygon(
          0 2.5%,
          4% 0,
          20.6% 0,
          21.6% 0.6%,
          100% 0.6%,
          100% 87.6%,
          80% 100%,
          0 100%
        );
      }
      [dir="rtl"] .mc-eclat__foil {
        --mc-sheen-angle: 245deg;
        clip-path: polygon(
          100% 2.5%,
          96% 0,
          79.4% 0,
          78.4% 0.6%,
          0 0.6%,
          0 87.6%,
          20% 100%,
          100% 100%
        );
      }
      .mc-eclat__foil::before {
        content: "";
        position: absolute;
        inset: 0;
        mix-blend-mode: soft-light;
        background: linear-gradient(
          var(--mc-sheen-angle),
          transparent calc(50% + var(--mc-ax) * 40% - 22%),
          rgb(255 255 255 / var(--mc-sheen)) calc(50% + var(--mc-ax) * 40%),
          transparent calc(50% + var(--mc-ax) * 40% + 22%)
        );
      }
      .mc-holo .mc-eclat__foil::after {
        content: "";
        position: absolute;
        inset: 0;
        mix-blend-mode: color-dodge;
        opacity: var(--mc-holo);
        background: repeating-linear-gradient(
          var(--mc-sheen-angle),
          #ff4d6d 0%,
          #ffb347 2%,
          #fff36b 4%,
          #6bff95 6%,
          #4dd6ff 8%,
          #7a6bff 10%,
          #ff6bd6 12%
        );
        background-size: 400% 400%;
        background-position: calc(50% + var(--mc-ax) * 50%) calc(50% - var(--mc-ay) * 50%);
        -webkit-mask-image: radial-gradient(
          circle at calc(50% + var(--mc-ax) * 45%) calc(50% - var(--mc-ay) * 45%),
          #000 0,
          rgb(0 0 0 / 0.45) 38%,
          rgb(0 0 0 / 0.18) 80%
        );
        mask-image: radial-gradient(
          circle at calc(50% + var(--mc-ax) * 45%) calc(50% - var(--mc-ay) * 45%),
          #000 0,
          rgb(0 0 0 / 0.45) 38%,
          rgb(0 0 0 / 0.18) 80%
        );
      }
      .mc-spark-a {
        opacity: calc(0.25 + (var(--mc-ax) + 1) * 0.375);
      }
      .mc-spark-b {
        opacity: calc(0.25 + (1 - var(--mc-ax)) * 0.375);
      }
      .mc-seal-holo {
        filter: hue-rotate(calc(var(--mc-ax) * 120deg));
      }
      .mc-f-d {
        font-family: Changa, sans-serif;
        font-weight: 800;
      }
      .mc-f-dl {
        font-family: Changa, sans-serif;
        font-weight: 300;
      }
      .mc-f-s {
        font-family: "Instrument Serif", serif;
        font-weight: 400;
      }
      .mc-f-b {
        font-family: Manrope, sans-serif;
      }
      .mc-f-a {
        font-family: "Noto Sans Arabic", sans-serif;
      }
      .mc-flat svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      @media (prefers-reduced-motion: no-preference) {
        .mc-beat .mc-tube {
          animation: mc-ignite 180ms steps(3) both;
        }
        .mc-beat .mc-field {
          animation: mc-reveal 420ms cubic-bezier(0.16, 1, 0.3, 1) 60ms both;
        }
        [dir="rtl"] .mc-beat .mc-field {
          animation-name: mc-reveal-rtl;
        }
        @keyframes mc-ignite {
          from {
            opacity: 0.15;
          }
          to {
            opacity: 1;
          }
        }
        @keyframes mc-reveal {
          from {
            clip-path: inset(0 100% 0 0);
          }
          to {
            clip-path: inset(0);
          }
        }
        @keyframes mc-reveal-rtl {
          from {
            clip-path: inset(0 0 0 100%);
          }
          to {
            clip-path: inset(0);
          }
        }
        /* phones (no hover): a slow idle float, only while on screen */
        @media (hover: none) {
          .mc-eclat--idle {
            animation: mc-float 7s ease-in-out infinite alternate;
          }
          @keyframes mc-float {
            0% {
              --mc-ax: 0.24;
              --mc-ay: 0.64;
            }
            50% {
              --mc-ax: -0.28;
              --mc-ay: 0.38;
            }
            100% {
              --mc-ax: 0.1;
              --mc-ay: 0.2;
            }
          }
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Manager Card · direction mock</h1>
      <button id="theme" type="button">Thème clair / sombre</button>
      <button id="replay" type="button">Rejouer « make »</button>
    </header>
    <p class="note">
      Follows MANAGER_CARD_SORARE_STYLE_PLAN.md (revision 2). Move a mouse or pen over a card: it
      tilts, its layers part in depth, the light, the raised number and the holographic foil follow.
      Sample data; club colours from the app's kit table.
    </p>
    <div class="row" id="full"></div>
    <div class="row" id="arabic" dir="rtl" lang="ar"></div>
    <div class="row" id="tokens"></div>

    <script>
      const SPECTRUM = [
        "#FF4D6D",
        "#FFB347",
        "#FFF36B",
        "#6BFF95",
        "#4DD6FF",
        "#7A6BFF",
        "#FF6BD6",
      ];
      const FOIL = {
        base: {
          plate: "#12151B",
          deep: "#262B35",
          glow: "#6B7484",
          tube: "#3A414D",
          label: "#8C95A3",
          edgeL: "#3A414D",
          edgeD: "#59616E",
          sheen: 0.12,
        },
        homa: {
          plate: "#111418",
          deep: "#3B4450",
          glow: "#C7D0DC",
          tube: "#EEF3F9",
          label: "#9BA5B2",
          edgeL: "#5C6672",
          edgeD: "#AEB8C5",
          sheen: 0.24,
          word: "LASTREET",
          wordFill: "#E6ECF3",
        },
        stade: {
          plate: "#1C1403",
          deep: "#7A4E12",
          glow: "#F2B544",
          tube: "#FFF2DA",
          label: "#AA9C7E",
          edgeL: "#9A6B16",
          edgeD: "#E9B055",
          sheen: 0.26,
          word: "STADE",
        },
        pro: {
          plate: "#1D0507",
          deep: "#8E1F27",
          glow: "#F0545A",
          tube: "#FFE1E2",
          label: "#B6A3A2",
          edgeL: "#B1262E",
          edgeD: "#EA6263",
          sheen: 0.26,
          word: "PRO",
        },
        champion: {
          plate: "#03111C",
          deep: "#155C80",
          glow: "#5FD0EE",
          tube: "#E0F5FC",
          label: "#86A0AE",
          edgeL: "#1F6F96",
          edgeD: "#6FCFE5",
          sheen: 0.28,
          word: "CHAMPION",
          holo: { foil: 0.3, grid: 0.16, sparks: 16, seal: 1 },
          ribbon: ["#5FD0EE", "#7A6BFF", "#6BFF95", "#B8F0FF"],
        },
        legend: {
          plate: "#13041C",
          deep: "#6A2380",
          glow: "#E061E8",
          tube: "#F9E1FD",
          label: "#9C93A6",
          edgeL: "#8E3A9A",
          edgeD: "#DE5EE4",
          sheen: 0.32,
          word: "LEGEND",
          holo: { foil: 0.42, grid: 0.26, sparks: 34, seal: 2 },
          ribbon: ["#FF6AD5", "#C774E8", "#AD8CFF", "#8795E8", "#94D0FF", "#5EE7DF", "#FFE29A"],
        },
      };
      const AR_TIER = {
        stade: "ملعب",
        pro: "محترف",
        champion: "بطل",
        legend: "أسطورة",
        homa: "LASTREET",
      };
      const OUTLINE =
        "M0 40Q0 0 40 0L206 0L216 10L972 10Q1000 10 1000 38L1000 1418L800 1618L28 1618Q0 1618 0 1590Z";
      const WINDOW =
        "M80 22H964Q982 22 982 40V1092Q982 1110 964 1110H80Q62 1110 62 1092V40Q62 22 80 22Z";
      const RING = OUTLINE + WINDOW; // the frame: outline minus the window (evenodd)
      const SHIRT =
        "M270 1110L270 440L214 462L196 350Q206 300 268 276L352 252L432 250L500 322L568 250L648 252L732 276Q794 300 804 350L786 462L730 440L730 1110Z";
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      let uid = 0;

      function fnv(str) {
        let h = 0x811c9dc5;
        for (const ch of str) {
          h ^= ch.codePointAt(0);
          h = Math.imul(h, 0x01000193) >>> 0;
        }
        return h;
      }
      function mulberry(a) {
        return () => {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function lum(hex) {
        const c = [1, 3, 5]
          .map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
          .map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
        return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
      }
      const contrast = (a, b) => {
        const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p);
        return (x + 0.05) / (y + 0.05);
      };
      function mix(a, b, t) {
        const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
        const A = p(a),
          B = p(b);
        return (
          "#" +
          A.map((v, i) =>
            Math.round(v + (B[i] - v) * t)
              .toString(16)
              .padStart(2, "0"),
          ).join("")
        );
      }
      const stops = (cols, op = 1) =>
        cols
          .map(
            (c, i, a) =>
              `<stop offset="${(i / (a.length - 1)).toFixed(3)}" stop-color="${c}" stop-opacity="${op}"/>`,
          )
          .join("");
      const star = (x, y, s) =>
        `M${x} ${y - s}Q${x} ${y} ${x + s} ${y}Q${x} ${y} ${x} ${y + s}Q${x} ${y} ${x - s} ${y}Q${x} ${y} ${x} ${y - s}Z`;

      /* ---------------- layers (shapes are drawn LTR and mirrored as a group in Arabic; text never) ---------------- */

      function fieldShapes(F, seed, tierKey, id) {
        const r = mulberry(fnv(seed));
        const R = (a, b) => a + (b - a) * r();
        let s = "";
        if (tierKey !== "base") {
          for (let i = 0; i < 6; i++) {
            const y0 = 110 + 150 * i + R(-50, 50),
              c1 = y0 + (r() < 0.5 ? -1 : 1) * R(80, 240),
              c2 = y0 + (r() < 0.5 ? -1 : 1) * R(80, 240),
              y1 = y0 + R(-110, 110);
            const d = `M-80 ${y0.toFixed(1)}C330 ${c1.toFixed(1)} 670 ${c2.toFixed(1)} 1080 ${y1.toFixed(1)}`;
            const w = R(5, 24),
              o = R(0.3, 0.7),
              stroke = F.holo ? `url(#${id}-ribbon)` : F.glow;
            if (i % 2)
              s += `<path d="${d}" stroke="${stroke}" stroke-width="${(w * 2).toFixed(1)}" opacity="${(o * 0.55).toFixed(2)}" fill="none" filter="url(#${id}-b10)"/>`;
            s += `<path d="${d}" stroke="${stroke}" stroke-width="${w.toFixed(1)}" opacity="${o.toFixed(2)}" fill="none" stroke-linecap="round"/>`;
            s += `<path d="${d}" stroke="${F.tube}" stroke-width="1.6" opacity="${(o * 0.9).toFixed(2)}" fill="none"/>`; // specular core
          }
        }
        const k = tierKey === "base" ? 0.5 : 1,
          barCol = tierKey === "base" ? "#8C95A3" : null;
        for (let i = 0; i < 22; i++) {
          const w = R(20, 150),
            y = Math.round(R(36, 600) / 12) * 12,
            x = R(70, 960 - w);
          s += `<rect x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${r() < 0.5 ? 8 : 13}" fill="${barCol || (i < 14 ? F.tube : F.glow)}" opacity="${((i < 14 ? R(0.35, 0.85) : 0.6) * k).toFixed(2)}"/>`;
          if (r() < 0.5)
            s += `<rect x="${(x + w + 6).toFixed(1)}" y="${y}" width="${R(4, 14).toFixed(1)}" height="8" fill="${barCol || F.tube}" opacity="${(0.5 * k).toFixed(2)}"/>`;
        }
        for (let i = 0; i < 56; i++) {
          const band = r() < 0.5,
            x = band ? 70 + 12 * Math.floor(R(0, 14)) : 776 + 12 * Math.floor(R(0, 17)),
            y = 36 + 12 * Math.floor(R(0, 52));
          s += `<rect x="${x}" y="${y}" width="6" height="6" fill="${barCol || F.tube}" opacity="${(R(0.08, 0.35) * k).toFixed(2)}"/>`;
        }
        return s;
      }

      function baseLayer(p, F, tierKey, id) {
        return `<path d="${OUTLINE}" fill="${F.plate}"/>
    <path d="${WINDOW}" fill="url(#${id}-window)"/>
    <g class="mc-field" clip-path="url(#${id}-win)">${fieldShapes(F, p.serial || p.name + "|" + p.season, tierKey, id)}
      ${F.holo ? `<rect x="62" y="22" width="920" height="1088" fill="url(#${id}-spectrum)" mask="url(#${id}-grid)" opacity="${F.holo.grid}"/>` : ""}
      <rect x="62" y="22" width="920" height="1088" fill="url(#${id}-grain)"/>
    </g>
    <path d="${WINDOW}" fill="url(#${id}-vignette)"/>`;
      }

      function shirtLayer(club, F, id) {
        const sec = club ? club.secondary || "#ffffff" : F.edgeD;
        const fill = club ? club.primary : mix(F.plate, "#ffffff", 0.07);
        const stitch = `stroke="${club ? sec : "#ffffff"}" stroke-opacity="${club ? 0.5 : 0.25}" stroke-width="1.6" stroke-dasharray="6 5" fill="none"`;
        return `<g clip-path="url(#${id}-win)">
    <path d="${SHIRT}" fill="${fill}"/>
    <path d="${SHIRT}" fill="url(#${id}-mesh)"/>
    <path d="${SHIRT}" fill="url(#${id}-cloth)"/>
    ${club ? "" : `<path d="${SHIRT}" fill="none" stroke="${F.glow}" stroke-opacity=".55" stroke-width="2.5"/>`}
    <path d="M196 350L214 462L232 455L214 346Z" fill="${sec}" opacity="${club ? 0.95 : 0.6}"/>
    <path d="M804 350L786 462L768 455L786 346Z" fill="${sec}" opacity="${club ? 0.95 : 0.6}"/>
    <path d="M226 352L242 450M774 352L758 450" ${stitch}/>
    <path d="M440 264L284 434M560 264L716 434M286 452V1070M714 452V1070" ${stitch}/>
    <path d="M432 250Q500 234 568 250" stroke="${sec}" stroke-width="10" fill="none"/>
    <path d="M432 250L500 322L568 250" stroke="${sec}" stroke-width="18" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M446 266L500 316L554 266" stroke="#ffffff" stroke-opacity=".22" stroke-width="2" fill="none"/>
    ${club ? `<circle cx="628" cy="398" r="30" fill="${mix(club.primary, "#000000", 0.25)}" stroke="${sec}" stroke-width="4"/><circle cx="628" cy="398" r="23" fill="none" stroke="${sec}" stroke-opacity=".45" stroke-width="1.2"/>` : ""}
    <path d="${SHIRT}" fill="url(#${id}-fade)"/>
  </g>`;
      }

      function card(p, { lang = "fr", theme = "light", beat = false, flat = false } = {}) {
        const id = "mc" + ++uid,
          ar = lang === "ar";
        const tierKey = p.ovr == null ? "base" : p.tier || "base";
        const F = FOIL[tierKey];
        const X = (x) => (ar ? 1000 - x : x);
        const start = ar ? "end" : "start";
        const edge = theme === "dark" ? F.edgeD : F.edgeL;
        const mirror = (s) => (ar ? `<g transform="matrix(-1 0 0 1 1000 0)">${s}</g>` : s);
        const t = (x, y, cls, size, txt, attrs = "") => {
          const rtlRun = /direction="rtl"/.test(attrs);
          const a = rtlRun ? (ar ? "start" : "end") : start;
          return `<text x="${X(x)}" y="${y}" class="${cls}" font-size="${size}" text-anchor="${a}" ${attrs}>${esc(txt)}</text>`;
        };
        const r = mulberry(fnv("spark" + (p.serial || p.name)));
        const R = (a, b) => a + (b - a) * r();

        const defs = `<defs>
    <clipPath id="${id}-win"><path d="${WINDOW}"/></clipPath>

      /* fit: names to 744 units, the number to the shirt's chest box (388 wide incl. its outline), labels, microprint */
      function fit(root) {
        root.querySelectorAll("svg text[data-fit]").forEach((el) => {
          const max = +el.getAttribute("font-size"),
            min = el.classList.contains("mc-f-d") ? 60 : 84,
            w = el.getComputedTextLength();
          if (w > 744) el.setAttribute("font-size", Math.max((max * 744) / w, min).toFixed(1));
          if (el.getComputedTextLength() > 744) {
            el.setAttribute("textLength", 744);
            el.setAttribute("lengthAdjust", "spacingAndGlyphs");
          }
        });
        root.querySelectorAll("svg text[data-fit-label]").forEach((el) => {
          const w = el.getComputedTextLength();
          if (w > 128) el.setAttribute("font-size", Math.max((30 * 128) / w, 24).toFixed(1));
        });
        root.querySelectorAll("svg text[data-fit-w]").forEach((el) => {
          const m = +el.dataset.fitW,
            w = el.getComputedTextLength();
          if (w > m) el.setAttribute("font-size", ((16 * m) / w).toFixed(1));
        });
        root.querySelectorAll("svg text[data-clip-w]").forEach((el) => {
          const m = +el.dataset.clipW;
          let s = el.textContent;
          while (el.getComputedTextLength() > m && s.length) {
            s = s.slice(0, -1);
            el.textContent = s;
          }
        });
        root.querySelectorAll("svg.mc-l--num, .mc-flat svg").forEach((svg) => {
          const texts = [...svg.querySelectorAll("text.mc-numtxt")];
          if (!texts.length) return;
          const size = +texts[0].getAttribute("font-size"),
            w = texts[texts.length - 1].getComputedTextLength() + 22;
          const box = 388 - 2 * 18;
          const s = Math.min(size, (size * box) / w);
          texts.forEach((el) => el.setAttribute("font-size", s.toFixed(1)));
        });
      }

      /* tilt: mouse and pen write the light axes; touch idles (hover: none) */
      function mountTilt(stage) {
        const el = stage.querySelector(".mc-eclat");
        if (!el || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const rest = [el.getAttribute("dir") === "rtl" ? -0.24 : 0.24, 0.64];
        let raf = 0;
        const set = (ax, ay) => {
          el.style.setProperty("--mc-ax", ax.toFixed(3));
          el.style.setProperty("--mc-ay", ay.toFixed(3));
        };
        el.addEventListener("pointermove", (e) => {
          if (e.pointerType !== "mouse" && e.pointerType !== "pen") return;
          const b = el.getBoundingClientRect();
          const ax = Math.max(-1, Math.min(1, (2 * (e.clientX - b.left)) / b.width - 1)),
            ay = Math.max(-1, Math.min(1, 1 - (2 * (e.clientY - b.top)) / b.height));
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(() => {
            el.classList.remove("mc-eclat--settle");
            el.classList.add("mc-eclat--active");
            set(ax, ay);
          });
        });
        el.addEventListener("pointerleave", () => {
          el.classList.add("mc-eclat--settle");
          el.classList.remove("mc-eclat--active");
          set(...rest);
        });
        if (matchMedia("(hover: none)").matches)
          new IntersectionObserver(([e]) =>
            el.classList.toggle("mc-eclat--idle", e.isIntersecting),
          ).observe(el);
      }
