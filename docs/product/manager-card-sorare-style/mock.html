<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manager Card mock</title>
<!-- Direction mock for MANAGER_CARD_SORARE_STYLE_PLAN.md. Static, not app code. Fonts from Google Fonts for the mock only; the app self-hosts them. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@300;800&family=Noto+Sans+Arabic:wght@700&family=Instrument+Serif&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --page:#f4f6f9; --ink:#111827; --muted:#5a667d; }
  :root[data-theme="dark"] { --page:#0b1020; --ink:#e7ecf3; --muted:#9aa6b8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page:#0b1020; --ink:#e7ecf3; --muted:#9aa6b8; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--page); color:var(--ink); font:15px/1.5 Manrope, system-ui, sans-serif; }
  header { padding:24px 16px 8px; max-width:1200px; margin:0 auto; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { font:800 22px/1.2 Changa, sans-serif; margin:0; flex:1 1 auto; }
  button { font:700 14px Manrope, sans-serif; min-height:44px; padding:0 16px; border-radius:999px; border:1px solid var(--muted); background:transparent; color:var(--ink); cursor:pointer; }
  p.note { max-width:1200px; margin:0 auto; padding:0 16px; color:var(--muted); }
  .row { max-width:1200px; margin:0 auto; padding:24px 16px; display:flex; flex-wrap:wrap; gap:28px; justify-content:center; align-items:flex-end; }
  figure { margin:0; display:flex; flex-direction:column; align-items:center; gap:10px; }
  figcaption { font-size:13px; color:var(--muted); text-align:center; }
  .stage { width:240px; padding-bottom:12px; position:relative; }
  .stage::after { content:""; position:absolute; inset-inline:7%; bottom:0; height:18px; background:radial-gradient(closest-side, rgb(0 0 0 / .28), transparent); pointer-events:none; }
  :root[data-theme="dark"] .stage::after { background:radial-gradient(closest-side, rgb(0 0 0 / .5), transparent); }
  .tokens { display:flex; gap:14px; align-items:flex-end; }

  /* the card (eclat.css, abridged) */
  .mc-eclat { position:relative; aspect-ratio:1000/1618; perspective:900px; --mc-px:62; --mc-py:18; --mc-rx:0deg; --mc-ry:0deg; }
  .mc-eclat--light { filter:drop-shadow(0 10px 18px rgb(12 18 32 / .26)) drop-shadow(0 2px 3px rgb(12 18 32 / .22)); }
  .mc-eclat--dark { filter:drop-shadow(0 14px 26px rgb(0 0 0 / .55)); }
  .mc-eclat__tilt { position:absolute; inset:0; transform:rotateX(var(--mc-rx)) rotateY(var(--mc-ry)); transform-style:preserve-3d; }
  .mc-eclat--settle .mc-eclat__tilt { transition:transform 450ms cubic-bezier(.2,.8,.2,1); }
  .mc-eclat svg { display:block; width:100%; height:100%; }
  .mc-eclat__foil { position:absolute; inset:0; pointer-events:none; --mc-sheen-angle:115deg;
    clip-path:polygon(0 2.5%, 4% 0, 20.6% 0, 21.6% .6%, 100% .6%, 100% 87.6%, 80% 100%, 0 100%); }
  [dir="rtl"] .mc-eclat__foil { --mc-sheen-angle:245deg; clip-path:polygon(100% 2.5%, 96% 0, 79.4% 0, 78.4% .6%, 0 .6%, 0 87.6%, 20% 100%, 100% 100%); }
  .mc-eclat__foil::before { content:""; position:absolute; inset:0; mix-blend-mode:soft-light;
    background:linear-gradient(var(--mc-sheen-angle), transparent calc(var(--mc-px) * 1% - 22%), rgb(255 255 255 / var(--mc-sheen)) calc(var(--mc-px) * 1%), transparent calc(var(--mc-px) * 1% + 22%)); }
  .mc-eclat__foil::after { content:""; position:absolute; inset:0; mix-blend-mode:color-dodge; opacity:var(--mc-holo);
    background:repeating-linear-gradient(var(--mc-sheen-angle), var(--mc-holo-stops)); background-size:300% 300%;
    background-position:calc(var(--mc-px) * 1%) calc(var(--mc-py) * 1%); }
  .mc-f-d { font-family:Changa, sans-serif; font-weight:800; }
  .mc-f-dl { font-family:Changa, sans-serif; font-weight:300; }
  .mc-f-s { font-family:"Instrument Serif", serif; font-weight:400; }
  .mc-f-b { font-family:Manrope, sans-serif; }
  .mc-f-a { font-family:"Noto Sans Arabic", sans-serif; }
  @media (prefers-reduced-motion: no-preference) {
    .mc-beat .mc-tube { animation:mc-ignite 180ms steps(3) both; }
    .mc-beat .mc-field { animation:mc-reveal 420ms cubic-bezier(.16,1,.3,1) 60ms both; }
    [dir="rtl"] .mc-beat .mc-field { animation-name:mc-reveal-rtl; }
    @keyframes mc-ignite { from { opacity:.15 } to { opacity:1 } }
    @keyframes mc-reveal { from { clip-path:inset(0 100% 0 0) } to { clip-path:inset(0) } }
    @keyframes mc-reveal-rtl { from { clip-path:inset(0 0 0 100%) } to { clip-path:inset(0) } }
  }
</style>
</head>
<body>
<header>
  <h1>Manager Card · direction mock</h1>
  <button id="theme" type="button">Thème clair / sombre</button>
  <button id="replay" type="button">Rejouer « make »</button>
</header>
<p class="note">Follows MANAGER_CARD_SORARE_STYLE_PLAN.md §3–§9. Move a mouse over a card to tilt it. Sample data; club colours from the app's kit table.</p>
<div class="row" id="full"></div>
<div class="row" id="arabic" dir="rtl" lang="ar"></div>
<div class="row" id="tokens"></div>

<script>
const FOIL = {
  base:     { plate:"#12151B", deep:"#262B35", glow:"#6B7484", tube:"#3A414D", label:"#8C95A3", edgeL:"#3A414D", edgeD:"#59616E", sheen:.10, holo:0, stops:["#ffffff","#ffffff"] },
  homa:     { plate:"#111418", deep:"#3B4450", glow:"#C7D0DC", tube:"#EEF3F9", label:"#9BA5B2", edgeL:"#5C6672", edgeD:"#AEB8C5", sheen:.22, holo:.10, stops:["#FFFFFF","#C7D0DC","#8E99A8","#FFFFFF"], word:"LASTREET", wordFill:"#E6ECF3" },
  stade:    { plate:"#1C1403", deep:"#7A4E12", glow:"#F2B544", tube:"#FFF2DA", label:"#AA9C7E", edgeL:"#9A6B16", edgeD:"#E9B055", sheen:.26, holo:.14, stops:["#FFE7A8","#F2B544","#C97F1E","#FFF2DA"], word:"STADE" },
  pro:      { plate:"#1D0507", deep:"#8E1F27", glow:"#F0545A", tube:"#FFE1E2", label:"#B6A3A2", edgeL:"#B1262E", edgeD:"#EA6263", sheen:.26, holo:.14, stops:["#FFB3B6","#F0545A","#B1262E","#FFE1E2"], word:"PRO" },
  champion: { plate:"#03111C", deep:"#155C80", glow:"#5FD0EE", tube:"#E0F5FC", label:"#86A0AE", edgeL:"#1F6F96", edgeD:"#6FCFE5", sheen:.28, holo:.20, stops:["#B8F0FF","#5FD0EE","#2B7FB8","#E0F5FC"], word:"CHAMPION" },
  legend:   { plate:"#13041C", deep:"#6A2380", glow:"#E061E8", tube:"#F9E1FD", label:"#9C93A6", edgeL:"#8E3A9A", edgeD:"#DE5EE4", sheen:.30, holo:.32, stops:["#FF6AD5","#C774E8","#AD8CFF","#8795E8","#94D0FF","#5EE7DF","#FFE29A"], word:"LEGEND", prism:true },
};
const AR_TIER = { stade:"ملعب", pro:"محترف", champion:"بطل", legend:"أسطورة", homa:"LASTREET" };
const OUTLINE = "M0 40Q0 0 40 0L206 0L216 10L972 10Q1000 10 1000 38L1000 1418L800 1618L28 1618Q0 1618 0 1590Z";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let uid = 0;

function fnv(str){ let h=0x811c9dc5; for (const ch of str){ h^=ch.codePointAt(0); h=Math.imul(h,0x01000193)>>>0; } return h; }
function mulberry(a){ return () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function lum(hex){ const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4); return .2126*c[0]+.7152*c[1]+.0722*c[2]; }
const contrast = (a,b) => { const [x,y]=[lum(a),lum(b)].sort((p,q)=>q-p); return (x+.05)/(y+.05); };
function mix(a,b,t){ const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); const A=p(a),B=p(b); return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join(""); }

function field(F, seed, tierKey, id){
  const r = mulberry(fnv(seed)); const R=(a,b)=>a+(b-a)*r();
  let s = "";
  if (tierKey !== "base") {
    for (let i=0;i<5;i++){
      const y0=120+170*i+R(-60,60), c1=y0+(r()<.5?-1:1)*R(80,260), c2=y0+(r()<.5?-1:1)*R(80,260), y1=y0+R(-120,120);
      const d=`M-80 ${y0.toFixed(0)}C330 ${c1.toFixed(0)} 670 ${c2.toFixed(0)} 1080 ${y1.toFixed(0)}`;
      const w=R(4,26), o=R(.25,.7), stroke=F.prism?`url(#${id}-prism)`:F.glow;
      if (i===1||i===3) s+=`<path d="${d}" stroke="${stroke}" stroke-width="${(w*1.6).toFixed(1)}" opacity="${(o*.8).toFixed(2)}" fill="none" filter="url(#${id}-blur10)"/>`;
      s+=`<path d="${d}" stroke="${stroke}" stroke-width="${w.toFixed(1)}" opacity="${o.toFixed(2)}" fill="none" stroke-linecap="round"/>`;
    }
  }
  const k = tierKey==="base" ? .5 : 1, barCol = tierKey==="base" ? "#8C95A3" : null;
  for (let i=0;i<18;i++){
    const w=R(24,140), y=Math.round(R(40,560)/12)*12, x=R(70,960-w);
    s+=`<rect x="${x.toFixed(0)}" y="${y}" width="${w.toFixed(0)}" height="${r()<.5?9:14}" fill="${barCol || (i<12?F.tube:F.glow)}" opacity="${((i<12?R(.35,.85):.6)*k).toFixed(2)}"/>`;
  }
  for (let i=0;i<40;i++){
    const band=r()<.5, x=band?70+16*Math.floor(R(0,10.6)):760+16*Math.floor(R(0,13.8)), y=40+16*Math.floor(R(0,36));
    s+=`<rect x="${x}" y="${y}" width="8" height="8" fill="${barCol||F.tube}" opacity="${(R(.1,.35)*k).toFixed(2)}"/>`;
  }
  return `<g class="mc-field" clip-path="url(#${id}-win)">${s}</g>`;
}

function shirt(club, F, id){
  const P = "M262 1110L262 300Q262 250 312 250L420 250L500 330L580 250L688 250Q738 250 738 300L738 1110Z";
  if (!club) {
    return `<g clip-path="url(#${id}-win)"><path d="${P}" fill="${mix(F.plate,"#ffffff",.06)}" stroke="${F.glow}" stroke-opacity=".55" stroke-width="2"/>
      <path d="M420 250L500 330L580 250" stroke="${F.edgeD}" stroke-width="16" fill="none" stroke-linejoin="round"/>
      <path d="M300 330V1050M700 330V1050" stroke="${F.edgeD}" stroke-opacity=".5" stroke-width="3"/>
      <path d="${P}" fill="url(#${id}-fade)"/></g>`;
  }
  const sec = club.secondary || "#ffffff";
  return `<g clip-path="url(#${id}-win)"><path d="${P}" fill="${club.primary}"/>
    <path d="${P}" fill="url(#${id}-cloth)"/>
    <path d="M300 330V1050M700 330V1050" stroke="${sec}" stroke-opacity="${club.secondary?.35:.12}" stroke-width="3"/>
    <path d="M420 250L500 330L580 250" stroke="${sec}" stroke-opacity="${club.secondary?1:.85}" stroke-width="16" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M436 262L500 318L564 262" stroke="#fff" stroke-opacity=".18" stroke-width="2" fill="none"/>
    <path d="${P}" fill="url(#${id}-fade)"/></g>`;
}

function card(p, { lang="fr", theme="light", beat=false } = {}){
  const id = "mc" + (++uid), ar = lang === "ar";
  const tierKey = p.ovr == null ? "base" : (p.tier || "base");
  const F = FOIL[tierKey];
  const X = x => ar ? 1000 - x : x;
  const start = ar ? "end" : "start";
  const ink = p.club ? (contrast("#ffffff", p.club.primary) >= 3 ? "#FFFFFF" : "#0E1116") : "#FFFFFF";
  const edge = theme === "dark" ? F.edgeD : F.edgeL;
  const stats = [["CAP",p.stats[0]],["SEL",p.stats[1]],["TRF",p.stats[2]],["CON",p.stats[3]]];
  const arStats = ["القائد","التشكيلة","الانتقالات","الثبات"];
  // shapes, drawn LTR and mirrored as a whole in Arabic
  let shapes = `
    <path d="${OUTLINE}" fill="${F.plate}"/>
    <path d="${OUTLINE}" fill="url(#${id}-plate)"/>
    <rect x="62" y="22" width="920" height="1088" rx="18" fill="url(#${id}-window)"/>
    ${field(F, p.serial || (p.name + "|" + p.season), tierKey, id)}
    ${shirt(p.club, F, id)}`;
  let over = `
    <rect x="62" y="22" width="920" height="1088" rx="18" fill="url(#${id}-vignette)"/>
    <path d="M0 1110H1000V1418L800 1618H28Q0 1618 0 1590Z" fill="${F.plate}" fill-opacity=".94"/>
    <path d="M0 1110H1000V1418L800 1618H28Q0 1618 0 1590Z" fill="url(#${id}-plategl)"/>
    <rect x="0" y="1109" width="1000" height="2" fill="#fff" fill-opacity=".16"/>
    <rect x="0" y="330" width="62" height="780" fill="${F.plate}" fill-opacity=".9"/>
    <rect x="61" y="330" width="1.5" height="780" fill="#fff" fill-opacity=".1"/>
    <g class="mc-tube"><rect x="25" y="360" width="10" height="280" rx="5" fill="${F.glow}" opacity=".9" filter="url(#${id}-blur6)"/><rect x="25" y="360" width="10" height="280" rx="5" fill="${F.tube}"/></g>
    <path d="M0 40Q0 0 40 0L206 0L206 370Q206 392 184 392L0 392Z" fill="${F.plate}" fill-opacity=".82" stroke="#fff" stroke-opacity=".14" stroke-width="1.5"/>
    <rect x="836" y="1150" width="72" height="252" rx="36" fill="${p.founder ? `url(#${id}-capsule)` : "#000"}" fill-opacity="${p.founder?1:.35}" stroke="${p.founder?F.tube:"#fff"}" stroke-opacity="${p.founder?1:.12}" stroke-width="${p.founder?2:1.5}"/>
    <g class="mc-tube"><rect x="965" y="1150" width="10" height="240" rx="5" fill="${F.glow}" opacity=".9" filter="url(#${id}-blur6)"/><rect x="965" y="1150" width="10" height="240" rx="5" fill="${F.tube}"/></g>
    ${[[24,1592],[974,34],[974,1124],[24,1124]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="6" fill="#fff" fill-opacity=".22"/>`).join("")}
    ${p.club ? `<circle cx="103" cy="230" r="50" fill="${p.club.primary}" stroke="${p.club.secondary||"#ffffff"}" stroke-opacity="${p.club.secondary?1:.5}" stroke-width="7"/>` : ""}
    <path d="${OUTLINE}" fill="none" stroke="${edge}" stroke-width="3"/>
    ${theme==="dark" ? `<path d="${OUTLINE}" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="1.5" transform="translate(-1.5 -1.5) scale(1.003)"/>` : ""}`;
  // text, never mirrored by transform
  // text-anchor resolves against the run's own direction: an RTL run's "start" is its right edge
  const t = (x, y, cls, size, txt, attrs="") => { const rtlRun = /direction="rtl"/.test(attrs); const a = rtlRun ? (ar ? "start" : "end") : start;
    return `<text x="${X(x)}" y="${y}" class="${cls}" font-size="${size}" text-anchor="${a}" ${attrs}>${esc(txt)}</text>`; };
  let text = "";
  text += `<text x="${X(103)}" y="${p.club?112:200}" class="mc-f-b" font-weight="800" font-size="30" text-anchor="middle" fill="#fff" fill-opacity=".88" style="font-variant-numeric:tabular-nums" direction="ltr">${esc(p.season)}</text>`;
  if (p.club) text += `<text x="${X(103)}" y="242" class="mc-f-d" font-size="34" text-anchor="middle" fill="${contrast("#ffffff",p.club.primary)>=4.5?"#fff":"#0E1116"}" letter-spacing="${ar?0:".02em"}">${esc(p.club.initials)}</text>`;
  if (p.sample) text += `<rect x="${ar?48:744}" y="44" width="208" height="48" rx="24" fill="#000" fill-opacity=".5"/><text x="${ar?152:848}" y="78" class="mc-f-b" font-weight="800" font-size="26" text-anchor="middle" fill="#fff" letter-spacing="${ar?0:".1em"}">${ar?"مثال":"EXEMPLE"}</text>`;
  // the number: a shadow copy, then the group
  const num = p.ovr == null ? "—" : String(p.ovr), ny = p.ovr == null ? 660 : 760, nsize = p.ovr == null ? 360 : 520;
  text += `<text x="500" y="${ny+14}" class="mc-f-d" font-size="${nsize}" text-anchor="middle" direction="ltr" fill="#000" opacity=".45" filter="url(#${id}-blur12)">${num}</text>`;
  text += `<g data-mc="ovr"><rect x="220" y="360" width="560" height="420" fill="transparent"/><text x="500" y="${ny}" class="mc-f-d" font-size="${nsize}" text-anchor="middle" direction="ltr" fill="${ink}" stroke="${F.plate}" stroke-opacity=".55" stroke-width="8" paint-order="stroke">${num}</text></g>`;
  if (p.ovr != null) text += `<text x="500" y="818" class="mc-f-b" font-weight="800" font-size="34" text-anchor="middle" fill="#fff" fill-opacity=".82" letter-spacing=".16em">OVR</text>`;
  if (p.ovr == null && p.counted != null && p.counted < p.min) {
    const n=p.min, w=74, g=22, x0=500-(n*w+(n-1)*g)/2;
    for (let i=0;i<n;i++) { const on = ar ? (n-1-i) < p.counted : i < p.counted;
      text += on ? `<rect x="${x0+i*(w+g)}" y="800" width="${w}" height="18" rx="9" fill="${F.glow}" filter="url(#${id}-blur6)"/><rect x="${x0+i*(w+g)}" y="800" width="${w}" height="18" rx="9" fill="${FOIL.stade.tube}"/>`
                 : `<rect x="${x0+i*(w+g)+1}" y="801" width="${w-2}" height="16" rx="8" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>`; }
  }
  // stats
  const xs = [56,196,336,476];
  stats.forEach(([lab,val],i) => {
    text += ar ? t(xs[i],1180,"mc-f-a",30, arStats[i], `font-weight="700" fill="${F.label}" direction="rtl" data-fit-label="1"`)
               : t(xs[i],1178,"mc-f-b",34, lab, `font-weight="700" fill="${F.label}" letter-spacing=".08em"`);
    text += t(xs[i],1240,"mc-f-b",56, val==null?"—":val, `font-weight="800" fill="#fff" direction="ltr" style="font-variant-numeric:tabular-nums"`);
  });
  [172,312,452].forEach(x => text += `<rect x="${X(x)-.75}" y="1146" width="1.5" height="104" fill="#fff" fill-opacity=".22"/>`);
  if (p.ovr != null && p.tier) {
    const word = ar ? AR_TIER[p.tier] : F.word, latin = /^[A-Z]+$/.test(word);
    const ta = latin ? start : (ar ? "start" : "end");
    text += `<text x="${X(600)}" y="1179.5" class="mc-f-d" font-size="36" text-anchor="${ta}" fill="#000" fill-opacity=".5" letter-spacing="${latin?".12em":0}" direction="${latin?"ltr":"rtl"}">${esc(word)}</text>`;
    text += `<text x="${X(600)}" y="1178" class="mc-f-d" font-size="36" text-anchor="${ta}" fill="${F.wordFill||F.glow}" letter-spacing="${latin?".12em":0}" direction="${latin?"ltr":"rtl"}">${esc(word)}</text>`;
  }
  // name
  const isAr = /\p{Script=Arabic}/u.test(p.name);
  const words = (isAr ? p.name : p.name.toLocaleUpperCase("fr")).trim().split(/\s+/).filter(Boolean);
  const dirN = isAr ? "rtl" : "ltr";
  if (words.length === 0) text += `<rect x="${ar?580:56}" y="1477" width="364" height="2" fill="#fff" fill-opacity=".22"/>`;
  else if (words.length === 1) text += t(56,1452, isAr?"mc-f-dl":"mc-f-s", 156, words[0], `fill="#fff" direction="${dirN}"`);
  else {
    text += t(56,1352,"mc-f-d",92, words[0], `fill="#fff" direction="${dirN}"`);
    text += t(56,1478, isAr?"mc-f-dl":"mc-f-s", isAr?112:132, words.slice(1).join(" "), `fill="#fff" direction="${dirN}" data-fit="1"`);
  }
  text += t(56,1572,"mc-f-b",38, p.serial ? `BOT #${p.serial}` : "BOT —", `font-weight="600" fill="#fff" fill-opacity=".74" direction="ltr" style="font-variant-numeric:tabular-nums" letter-spacing=".02em"`);
  if (p.founder) text += `<text transform="translate(${X(872)} 1276) rotate(-90)" class="mc-f-d" font-size="34" text-anchor="middle" dominant-baseline="central" fill="#fff" direction="ltr">·${String(p.founder).slice(-2)}</text>`;
  // wordmark stand-in (the app inlines the BotolaGO SVG; this mock writes the name)
  text += `<text transform="translate(${X(31)} 880) rotate(-90)" class="mc-f-d" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#fff" fill-opacity=".78" letter-spacing=".04em" direction="ltr">BotolaGO</text>`;

  const defs = `<defs>
    <clipPath id="${id}-win"><rect x="62" y="22" width="920" height="1088" rx="18"/></clipPath>
    <linearGradient id="${id}-plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${F.deep}" stop-opacity=".55"/><stop offset=".3" stop-color="${F.plate}"/><stop offset="1" stop-color="${F.plate}"/></linearGradient>
    <radialGradient id="${id}-window" cx="780" cy="90" r="1150" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${F.glow}" stop-opacity=".85"/><stop offset=".38" stop-color="${F.deep}" stop-opacity=".9"/><stop offset="1" stop-color="${F.plate}"/></radialGradient>
    <linearGradient id="${id}-vignette" x1="0" y1="0" x2="0" y2="1"><stop offset=".78" stop-color="${F.plate}" stop-opacity="0"/><stop offset="1" stop-color="${F.plate}"/></linearGradient>
    <linearGradient id="${id}-fade" x1="0" y1="250" x2="0" y2="1110" gradientUnits="userSpaceOnUse"><stop offset=".77" stop-color="${F.plate}" stop-opacity="0"/><stop offset="1" stop-color="${F.plate}"/></linearGradient>
    <linearGradient id="${id}-cloth" x1="262" y1="0" x2="738" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient>
    <linearGradient id="${id}-plategl" x1="0" y1="1110" x2="0" y2="1618" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${F.deep}" stop-opacity=".22"/><stop offset=".35" stop-color="${F.deep}" stop-opacity="0"/></linearGradient>
    <linearGradient id="${id}-capsule" x1="0" y1="1150" x2="0" y2="1402" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${F.glow}" stop-opacity=".9"/><stop offset="1" stop-color="${F.deep}"/></linearGradient>
    <linearGradient id="${id}-prism" x1="0" y1="0" x2="1000" y2="600" gradientUnits="userSpaceOnUse">${FOIL.legend.stops.map((c,i,a)=>`<stop offset="${(i/(a.length-1)).toFixed(2)}" stop-color="${c}"/>`).join("")}</linearGradient>
    <filter id="${id}-blur6" x="-200%" y="-20%" width="500%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="${id}-blur10" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="${id}-blur12" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>`;
  const mirrored = ar ? `<g transform="matrix(-1 0 0 1 1000 0)">${shapes}${over}</g>` : shapes + over;
  const label = ["Carte de manager", p.name, p.ovr==null?"pas encore de note":`${p.ovr} OVR`, p.tier?F.word:null, p.club?.name, p.serial?`BOT #${p.serial}`:null].filter(Boolean).join(", ");
  const stops = F.stops.map((c,i,a)=>`${c} ${(i/(a.length-1)*24).toFixed(1)}%`).join(",");
  return `<div class="mc-eclat mc-eclat--${tierKey} mc-eclat--${theme}${beat?" mc-beat":""}" role="img" aria-label="${esc(label)}" dir="${ar?"rtl":"ltr"}" style="--mc-sheen:${F.sheen};--mc-holo:${F.holo};--mc-holo-stops:${stops}">
    <div class="mc-eclat__tilt"><svg viewBox="0 0 1000 1618" aria-hidden="true" focusable="false" style="direction:ltr">${defs}${mirrored}${text}</svg><div class="mc-eclat__foil" aria-hidden="true"></div></div></div>`;
}

// fit the name lines to 744 units by measuring the laid-out SVG text (the app does this without the DOM, §4)
function fitNames(root){
  root.querySelectorAll("svg text[data-fit-label]").forEach(el => { const w = el.getComputedTextLength(); if (w > 128) el.setAttribute("font-size", Math.max(30*128/w, 24).toFixed(1)); });
  root.querySelectorAll("svg text.mc-f-s, svg text.mc-f-d[font-size='92'], svg text.mc-f-dl").forEach(el => {
    const max = +el.getAttribute("font-size"); const w = el.getComputedTextLength();
    if (w > 744) el.setAttribute("font-size", Math.max(max * 744 / w, el.classList.contains("mc-f-d") ? 60 : 84).toFixed(1));
    if (el.getComputedTextLength() > 744) { el.setAttribute("textLength", 744); el.setAttribute("lengthAdjust", "spacingAndGlyphs"); }
  });
}

function mountTilt(el){
  const tilt = el.querySelector(".mc-eclat"); let raf = 0;
  const move = e => { if (e.pointerType !== "mouse" && e.pointerType !== "pen") return;
    const b = tilt.getBoundingClientRect(); const px = 100*(e.clientX-b.left)/b.width, py = 100*(e.clientY-b.top)/b.height;
    cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { tilt.classList.remove("mc-eclat--settle");
      tilt.style.setProperty("--mc-px", px.toFixed(1)); tilt.style.setProperty("--mc-py", py.toFixed(1));
      tilt.style.setProperty("--mc-ry", ((px-50)/50*9).toFixed(2)+"deg"); tilt.style.setProperty("--mc-rx", ((50-py)/50*7).toFixed(2)+"deg"); }); };
  const leave = () => { tilt.classList.add("mc-eclat--settle"); for (const [k,v] of [["--mc-px",62],["--mc-py",18],["--mc-rx","0deg"],["--mc-ry","0deg"]]) tilt.style.setProperty(k,v); };
  tilt.addEventListener("pointermove", move); tilt.addEventListener("pointerleave", leave);
}
